  <!-- 3 Hard Review Invariants -->
  <rect x="55" y="294" width="194" height="122" rx="10" fill="#091D26" stroke="#059669"/>
  <text x="152" y="318" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">Invariant 1: Reset Pending</text>
