  <text x="152" y="382" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11.5" text-anchor="middle">status = "pending"</text>
  <text x="152" y="402" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">No silent post-edit drift</text>

