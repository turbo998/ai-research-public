  <!-- Path B Bar -->
  <text x="58" y="734" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Path B: Draco Meshes + Unbaked Shadow Maps</text>
  <rect x="395" y="716" width="350" height="26" rx="5" fill="#78350F" stroke="#F59E0B"/>
  <text x="760" y="734" fill="#FEF3C7" font-family="Consolas, monospace" font-size="13.5" font-weight="700">$2,850.00/mo ($950.00 CDN + 19.0h / $1,900.00)</text>

  <!-- Path C Bar -->
  <text x="58" y="776" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Path C: Abyssal-Garden 96KB + Room-at-Dawn</text>
  <rect x="395" y="758" width="56" height="26" rx="5" fill="#065F46" stroke="#10B981"/>
  <text x="466" y="776" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13.5" font-weight="700">$460.00/mo ($110.00 compute + 3.5h / $350.00) · -92.38%</text>

