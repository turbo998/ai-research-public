    <text x="20" y="32" fill="#34D399" font-family="system-ui, sans-serif" font-size="15" font-weight="800">1. KKKKhazix/agent-autoloop (4,255★ · 709★/d)</text>
    <text x="20" y="52" fill="#A7F3D0" font-family="system-ui, sans-serif" font-size="12">Zero-Dep Event-Driven CLI Agent Microkernel (Node 24+)</text>

    <rect x="18" y="68" width="329" height="92" rx="8" fill="#0F172A" stroke="#059669" stroke-width="1"/>
    <text x="30" y="88" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Exit-While-Waiting Protocol (ask/notice/resolve/later)</text>
    <text x="30" y="108" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Agent emits trailing ```agent-autoloop JSON &amp; exits</text>
