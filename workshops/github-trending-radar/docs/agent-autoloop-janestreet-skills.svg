    <text x="30" y="144" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">• Resumes exact session on Feishu/Slack/WeCom card click</text>

    <rect x="18" y="172" width="329" height="96" rx="8" fill="#0F172A" stroke="#059669" stroke-width="1"/>
    <text x="30" y="192" fill="#6EE7B7" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Surgical Last-Reply Rewrite &amp; Last-Good Rules</text>
    <text x="30" y="212" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• If JSON block is malformed, rewrites ONLY final reply</text>
    <text x="30" y="230" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Coalesces burst events queued for the same work item</text>
    <text x="30" y="248" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">• Falls back to last valid rules.json on syntax error</text>

    <rect x="18" y="280" width="329" height="94" rx="8" fill="#0F172A" stroke="#059669" stroke-width="1"/>
