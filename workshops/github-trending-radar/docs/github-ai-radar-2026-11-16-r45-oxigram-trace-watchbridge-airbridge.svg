  <text x="68" y="766" fill="#38BDF8" font-family="Consolas, monospace" font-size="13.5" font-weight="bold">🎯 ARCHITECTURAL TAKEAWAYS FOR 5MB TRAY CLIENTS, READ-TIME ACTIVITY TAGGING &amp; XCODE-FREE WATCH SIDELOADING:</text>
  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 桌面客户端挂托盘时直接销毁 WebView、仅留纯 Rust 协议线程，可将后台内存从数百 MB 压至 5 MB (Oxigram)。</text>
  <text x="68" y="814" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 本地工时追踪应采用“读取时套用标签规则 + 音频/通话活跃感知”，改一条规则即重算全部历史记录 (Trace)。</text>
  <text x="68" y="838" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• WatchBridge 让 Windows/Linux 无需 Xcode 即可部署 Apple Watch 伴侣应用並通过 Wi-Fi 自动完成 7 天证书续签。</text>
