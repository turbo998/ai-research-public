  <text x="68" y="682" fill="#F8FAFC" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path B (手动启停计时器漏记 + 公网网盘中转局域网大文件)</text>
  <rect x="430" y="666" width="254" height="22" rx="5" fill="#F59E0B"/>
  <text x="696" y="682" fill="#FDE68A" font-family="Consolas, monospace" font-size="13" font-weight="bold">$2,540.00/mo ($840.00 spend + 17.0h × $100 = $1,700.00)</text>

  <text x="68" y="718" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path C (Oxigram 5MB + Trace + WatchBridge + AirBridge)</text>
  <rect x="430" y="702" width="36.5" height="22" rx="5" fill="#10B981"/>
