  <text x="68" y="76" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">PROACTIVE DURABLE NEWS AGENT · 2026-11-16 NIGHT SHIFT ROUND 45 (CUMULATIVE R402) · CLAIM-20261116-R45-OXIGRAM-TRACE-WATCHBRIDGE-AIRBRIDGE</text>
  <text x="68" y="108" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21.5" font-weight="bold">托盘仅 5MB 的 Rust 电报 (Oxigram) + 开源 Timing 平替 (Trace) + 免 Xcode 装表应用</text>
  <text x="68" y="128" fill="#94A3B8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">关窗销毁 WebView 压至 5MB 内存 + macOS 读取时动态打标时间追踪 + 三端 Apple Watch 侧载与千兆局域网 AirBridge · 净省 $5,175.00/月 (-93.41%)</text>

  <!-- Left Column: Timon2306/oxigram + lxyeternal/Trace -->
  <rect x="44" y="152" width="642" height="390" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="182" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">🪶 1. Timon2306/oxigram (★29) + lxyeternal/Trace (★38)</text>
  <text x="66" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">关窗即销毁 WebView 仅占 5MB 的 Telegram 客户端 + 零手动计时的 macOS 时间黑匣子</text>

  <rect x="66" y="220" width="598" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="82" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">Timon2306/oxigram：开窗 71MB、最小化 55MB、最小化到托盘仅 5MB！</text>
  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 为什么聊天软件挂后台能吃掉 1GB 内存？因为 Electron/Qt 把整个浏览器和历史媒体缓存全常驻在内存里</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 极致架构减法：无 TDLib、无 Electron、无 Qt！~7MB Rust 进程 (grammers) 直连 MTProto，UI 用系统 WebView</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 关窗销毁 WebView 绝技：当你关闭窗口退到托盘时，直接销毁整个 WebView，仅留 5MB Rust 进程收消息弹通知！</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 窗口标题栏实时公开当前内存占用，自带 500MB 媒体缓存上限与自带 api_id 零中心化设计</text>

  <rect x="66" y="380" width="598" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="82" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">lxyeternal/Trace：商业软件 Timing 的免费开源 macOS 原生平替</text>
  <text x="82" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 精确到单个文件与网页：自动记录前台应用、窗口、文件路径与 URL，顺着 Git 仓库/Swift 包/Obsidian 库自动归属项目</text>
  <text x="82" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 声音/通话感知防误判离开：只记录哪个应用在发声或用麦克风（绝不录音），开会不敲键盘也照常计入工作时长</text>
  <text x="82" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 读取时动态套用规则 (Read-Time Tagging)：修改一条标签规则即可瞬间重算全部历史记录，数据 100% 留在本机</text>
  <text x="82" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 短暂瞥一眼别的应用不会切断当前专注 Session，完美还原一天真实心流</text>

