  <text x="728" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">Windows/Linux 免 Xcode 开启 Apple Watch 开发者模式装表应用 + 五端千兆局域网互通</text>

  <rect x="728" y="220" width="606" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="744" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">AdminZachary/WatchBridge (v0.1.4)：没有 Mac 和 Xcode 也能给 Apple Watch 侧载应用</text>
  <text x="744" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 打破 Xcode 独占高墙：在 Windows 10/11、Linux 与免 Xcode 的 macOS 上完成 Watch 开发者模式准备与伴侣安装</text>
  <text x="744" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 严守物理确认安全边界：仅发送 `action 0` 请求开关，真正的开启、重启与信任确认 100% 由本人在手表屏幕上操作</text>
  <text x="744" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 双包校验 + Wi-Fi 7天自动续签：自动校验 IPA 内含 `Watch/*.app` 并重签装入手表，支持无线 RSD 续期与 28 语种界面</text>
  <text x="744" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 已在真机完整跑通“开发者模式 → 签名 → 装手机 → 装手表 → 启动”全链路</text>

  <rect x="728" y="380" width="606" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="744" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">ursishant/airbridge：免装客户端的五端千兆局域网 AirDrop 与实时剪贴板桥</text>
  <text x="744" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 跨生态零摩擦互传：打通 Windows、macOS、Android、iOS 与 Linux，接收端打开浏览器即可跑满千兆局域网直传</text>
  <text x="744" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 办公室公共 Wi-Fi 防护盾 (PIN Shield)：针对多人共享办公网内置 PIN 码鉴权、设备网格与点对点局域网聊天</text>
  <text x="744" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 跨设备实时剪贴板同步：在电脑复制一段命令或验证码，手机/平板端即刻同步可用</text>
  <text x="744" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 彻底告别为了传个文件而登录微信文件传输助手或上传第三方公网网盘</text>

