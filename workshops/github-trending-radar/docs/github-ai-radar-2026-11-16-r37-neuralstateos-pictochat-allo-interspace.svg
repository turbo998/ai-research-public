  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 告别脆弱的 System Prompt 角色扮演：用户输入的句子完全不变，在特定层残差流直接注入差分向量 (Differential Vectors)</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 生成前/后双重内部探针 (read)：在吐字之前直接读取模型当前的内部状态向量，而非仅靠输出字面猜测</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 受控对照实验 (compare)：支持同一输入在调制关闭 vs 调制开启下并排对比，精确量化每次激活干预的增量效应</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ embody 通道支持将外部传感器、硬件设备或机器人本体遥测直接映射至模型内部状态</text>

