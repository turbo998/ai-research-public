  <!-- Winc Mechanics -->
  <rect x="46" y="258" width="522" height="192" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="60" y="280" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">Why `Winc` Excels at Inspecting Massive Agent Logs &amp; Multi-Format Artifacts:</text>
  <text x="60" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Gigabyte-Scale Log &amp; JSONL Editing: Opens &amp; highlights a 1 GB trace/dataset file in</text>
  <text x="60" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   `220 ms` with lightweight LSP-free go-to-definition, multi-cursor &amp; hunk-level Git staging.</text>
  <text x="60" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Native Multi-Document Preview: Renders Markdown (math + Mermaid), SVG, PDF, Word (`.docx`),</text>
  <text x="60" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   and Spreadsheets (`.xlsx`, `.csv`) in-place with source code one click away.</text>
  <text x="60" y="385" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Modular SSH &amp; WSL Remote: Edit, search, format (`rustfmt`/`Ruff`/`Prettier`), use Git &amp; run</text>
  <text x="60" y="404" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   terminals on Linux SSH hosts or Windows WSL distros; toggle Git/Terminal/SSH modules on/off.</text>
  <text x="60" y="427" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Apache-2.0 licensed (`macOS / Linux / Windows`), bilingual UI &amp; signed in-app updates.</text>

