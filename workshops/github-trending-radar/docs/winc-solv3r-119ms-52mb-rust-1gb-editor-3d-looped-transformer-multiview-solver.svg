  <text x="1027" y="190" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">Iterative Latent Refinement</text>
  <text x="1027" y="210" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">`ctx = model.encode(images)`</text>
  <text x="1027" y="228" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" text-anchor="middle">`z = model.solve(ctx)` (`solv3r.safetensors`)</text>

  <!-- Solv3R Architecture -->
  <rect x="632" y="258" width="522" height="192" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="646" y="280" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">How `Solv3R` Unifies Offline Bundle Adjustment &amp; Streaming SLAM (`UBC / Wayve / Sony`):</text>
  <text x="646" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. 3D Looped Transformer Architecture: Instead of separate feedforward networks for pairwise,</text>
  <text x="646" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   sequential, or global multiview reconstruction, one looped transformer iteratively refines</text>
  <text x="646" y="341" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   3D pointmaps and camera poses (`cameras_from_pose_enc`) in latent space.</text>
  <text x="646" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Encode Once, Solve Any Order: `model.encode(images)` extracts view tokens (long side 504,</text>
  <text x="646" y="382" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   multiples of 14, no crop); `model.solve(ctx)` handles batch, streaming &amp; relocalization.</text>
  <text x="646" y="405" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">$ git clone https://github.com/ubc-vision/solv3r.git &amp;&amp; pip install -e .</text>
  <text x="646" y="426" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Pretrained weights on Hugging Face (`jgkwak/solv3r`) with Tables 1, 2, 3 &amp; 8 eval suites.</text>

