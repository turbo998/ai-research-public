    4. 闭式 FinOps 算例：100 人桌面端 Agent 分发 + 50 人移动端随时随地运行 DSH (synthetic, 手机硬件费: not_measured)
  </text>
  <rect x="60" y="690" width="1320" height="170" rx="10" fill="#1E293B"/>
  <text x="80" y="720" fill="#FCA5A5" font-family="Consolas, PingFang SC, monospace" font-size="12.5" font-weight="700">
    • Path A (重型 Electron 桌面包 + 50 台 24/7 云端伴随 VM 供手机远控): $2,100.00 云VM + $3,300.00 (44h @$75/h) = $5,400.00/月
