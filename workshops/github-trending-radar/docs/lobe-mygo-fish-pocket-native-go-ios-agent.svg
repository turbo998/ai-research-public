    2026-11-11 ROUND 10 · LOBEHUB/LOBE-MYGO (PURE-GO GPU UI) + IMSAI-SH/FISH-POCKET (ON-DEVICE IOS DSH)
  </text>
  <text x="64" y="103" fill="#94A3B8" font-family="Consolas, PingFang SC, monospace" font-size="13">
    lobehub/lobe-mygo (★233 · Go 1.27+ · 0 CGO · 70+ Components) × imsai-sh/fish-pocket (★205 · SwiftUI + libgit2 + Python 3.15)
  </text>
  <rect x="1140" y="54" width="238" height="52" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
  <text x="1259" y="76" text-anchor="middle" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="700">0 CGO &amp; 0 SUBPROCESS</text>
  <text x="1259" y="96" text-anchor="middle" fill="#38BDF8" font-family="Consolas, monospace" font-size="12" font-weight="700">-88.89% DESKTOP/MOBILE TCO</text>

  <!-- Row 1: Dual Breakdown -->
  <rect x="40" y="142" width="668" height="270" rx="14" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="60" y="172" fill="#38BDF8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15.5" font-weight="800">
    1. 纯 Go GPU 桌面 UI 套件：lobehub/lobe-mygo (★233 · 零 WebView · 零 CGO)
  </text>
  <text x="60" y="200" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 核心痛点：Go 语言写后端 CLI/Agent 极快，但配桌面 GUI 要么套百 MB Electron，要么掉进 CGO 交叉编译地狱</text>
  <text x="60" y="224" fill="#34D399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 纯 Go GPU 直接绘制 (egoist/mygo)：无 HTML、无 JS、无 WebView、无 CGO，任意机器一键交叉编译单文件</text>
  <text x="60" y="248" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 12 大包 70+ 组件对齐 @lobehub/ui：含 AgentAvatar、流式 Markdown (pkg/markdown)、弹簧动画 (pkg/motion)</text>
  <text x="60" y="272" fill="#FBBF24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 2,300+ Lucide 图标函数化 + 内置中英双语 (zh-Hans/en) 与系统级深浅色自适应 (theme.Apply)</text>
  <rect x="60" y="292" width="628" height="102" rx="8" fill="#1E293B"/>
  <text x="76" y="316" fill="#F8FAFC" font-family="Consolas, PingFang SC, monospace" font-size="11.8" font-weight="700">为什么 Lobe MyGo 是 Go 语言本地 AI 桌面助手的“最后一块拼图”？</text>
  <text x="76" y="338" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">直接复用 Web 端 @lobehub/ui 的色彩、圆角与字号设计 Token (theme.TokensOf(c).BgContainer)，</text>
  <text x="76" y="358" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">内置 examples/desktop 完整工作台骨架（标题栏、历史标签页、可拖拽侧栏、流式代码高亮），</text>
  <text x="76" y="380" fill="#6EE7B7" font-family="Consolas, PingFang SC, monospace" font-size="11.3">让 Go 编写的 MCP 网关与本地 Agent 无需打包 Chromium 即可拥有旗舰级 AI 桌面界面！</text>

  <rect x="732" y="142" width="668" height="270" rx="14" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="752" y="172" fill="#FBBF24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15.5" font-weight="800">
    2. iPhone/iPad 本机运行 DSH 引擎：imsai-sh/fish-pocket (★205 · SwiftUI)
  </text>
  <text x="752" y="200" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 核心痛点：iOS 严禁 App 调 fork()/exec() 创建子进程；用 iSH/UTM 跑 Linux 模拟器逐条解释指令又慢如蜗牛</text>
  <text x="752" y="224" fill="#34D399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 零改引擎源码「四路执行接缝替换」：just-bash + Node Worker 线程 + 静态链接 libgit2 + 纯 JS 替身</text>
  <text x="752" y="248" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 内嵌 Python 3.15 + nodejs-mobile：支持 pip install 纯 Python 包与 venv，48/50 (96%) 热门插件可用</text>
  <text x="752" y="272" fill="#38BDF8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 原生 SwiftUI + iOS 系统能力直通：日历/提醒/健康/地图/照片逐项授权 + 灵动岛后台保活 + iPad 多窗口</text>
  <rect x="752" y="292" width="628" height="102" rx="8" fill="#1E293B"/>
  <text x="768" y="316" fill="#F8FAFC" font-family="Consolas, PingFang SC, monospace" font-size="11.8" font-weight="700">架构精髓：如何在不越狱、不改上游一行代码的前提下绕过 iOS 子进程禁令？</text>
  <text x="768" y="338" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">Fish Pocket 利用 DSH 引擎自身的服务接缝 (Service Seams)：当 Agent 调 git 时直接路由给进程内</text>
  <text x="768" y="358" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">静态链接的 libgit2 并伪造 100% 相同的终端输出；调 bash/rg/jq 时走 just-bash；调 node 走 Worker 线程！</text>
  <text x="768" y="380" fill="#6EE7B7" font-family="Consolas, PingFang SC, monospace" font-size="11.3">抽样前 50 第三方 DSH 插件实测 (#18): 42 个直接可用 (84%) + 6 个跳过安装脚本可用 (合计 96%)</text>

  <!-- Row 2: Pipeline -->
  <rect x="40" y="428" width="1360" height="196" rx="14" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="60" y="458" fill="#34D399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="800">
