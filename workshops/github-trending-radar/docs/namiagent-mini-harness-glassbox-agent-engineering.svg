  <text x="645" y="334" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• Preserves DeepSeek reasoning_content across tool turns; zero web framework</text>

  <rect x="631" y="364" width="513" height="78" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="645" y="384" fill="#FBBF24" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">3. 49 Zero-Cost Mock-Model Tests &amp; Code-Enforced Read-Only /plan</text>
  <text x="645" y="404" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">• pytest -q runs 49 deterministic tests against scripted mock models ($0 API key)</text>
  <text x="645" y="422" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• NAMI_STATE_DIR (~/.nami-agent) isolated outside NAMI_WORKSPACE</text>

