  <text x="40" y="115" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="14">Append-Only Cache-Warm Compaction + /goal Fresh-Context Reviewer + 0.3s Jev Judge + 49 Mock-LLM Tests (-85.99% Cost)</text>

