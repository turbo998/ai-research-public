  <rect x="56" y="188" width="513" height="78" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="208" fill="#FACC15" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">1. Append-Only History &amp; Server-Side Compaction (Cache-Warm)</text>
  <text x="70" y="228" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">• Never mutates prior turns: keeps extended thinking valid &amp; KV cache hot</text>
  <text x="70" y="246" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• Terminal-Bench 2.1 (89 tasks): 72.0 ($3.28 Haiku 5.5) &amp; 75.0 ($2.25 DeepSeek V4.1)</text>

  <rect x="56" y="276" width="513" height="78" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="296" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">2. The Worker Never Grades Itself (/goal + Fresh Reviewer)</text>
  <text x="70" y="316" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">• "Done" requires deterministic verify command pass + fresh-context reviewer</text>
  <text x="70" y="334" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• /dream command deduplicates and prunes stale markdown memories in memory/</text>

  <rect x="56" y="364" width="513" height="78" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="384" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">3. 0.3-Second Sub-Cent AI Permission Judge (Jev) &amp; UV Isolation</text>
  <text x="70" y="404" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">• Jev (via OpenRouter) auto-approves safe risky calls in ~0.3s; asks if unsure</text>
  <text x="70" y="422" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• UV_PYTHON_INSTALL_DIR=/opt/mini-python prevents container Python collisions</text>

