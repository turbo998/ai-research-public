  <text x="645" y="246" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• Lessons 12–18 teardown Claude Code, Codex, Pi, Grok Bot, DeepSeek, Hermes</text>

  <rect x="631" y="276" width="513" height="78" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="645" y="296" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">2. Split-Screen Context &amp; reasoning_content Web Inspector (:8765)</text>
