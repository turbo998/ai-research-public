  <text x="68" y="682" fill="#F8FAFC" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path B (单一编辑器锁定 + 手工翻聊天记录做事故复盘)</text>
  <rect x="430" y="666" width="269" height="22" rx="5" fill="#F59E0B"/>
  <text x="711" y="682" fill="#FDE68A" font-family="Consolas, monospace" font-size="13" font-weight="bold">$2,690.00/mo ($890.00 spend + 18.0h × $100 = $1,800.00)</text>

  <text x="68" y="718" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path C (Liftgate + SteerTrace + agency + agy-dashboard)</text>
  <rect x="430" y="702" width="38.5" height="22" rx="5" fill="#10B981"/>
  <text x="480" y="718" fill="#6EE7B7" font-family="Consolas, monospace" font-size="13" font-weight="bold">$385.00/mo ($75.00 spend + 3.1h × $100 = $310.00) → 净省 $5,395.00/月 (-93.34% / 年省 $64,740.00)</text>

  <line x1="68" y1="740" x2="1332" y2="740" stroke="#334155"/>
  <text x="68" y="766" fill="#38BDF8" font-family="Consolas, monospace" font-size="13.5" font-weight="bold">🎯 ARCHITECTURAL TAKEAWAYS FOR ACP GATEWAYS, AI JUDGMENT AUDITING &amp; DEDICATED AGENT APPLIANCES:</text>
  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 跨客户端复用订阅必须坚持走官方编辑器协议 (`agy acp`) 且以空目录仅推理模式运行，把工具执行权留在宿主 CLI (Liftgate)。</text>
  <text x="68" y="814" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 复盘人机协作质量不能只看最终代码能否跑通，必须用 SteerTrace 定位人类在哪个对话回合盲目放行了未经证实的假设。</text>
  <text x="68" y="838" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 闲置笔记本刷入 NixOS + TPM 2.0 + 每小时自动备份与 Tailscale 私网看板 (agency)，即可零月租获得满血物理 Agent 专机。</text>
