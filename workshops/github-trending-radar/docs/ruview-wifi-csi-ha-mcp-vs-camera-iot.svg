  </text>
  <rect x="750" y="188" width="630" height="296" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="766" y="214" fill="#60A5FA" font-family="Consolas, PingFang SC, monospace" font-size="12.2" font-weight="700">
    • Runs In-Process on Home Assistant 2026.8+ / 2026.11+ Marketplace (FastMCP)
  </text>
  <text x="766" y="244" fill="#F8FAFC" font-family="Consolas, PingFang SC, monospace" font-size="11.8">
    • Quarantines Raw YAML Mutation: ha_config_set_yaml moved to opt-in Beta
  </text>
  <text x="766" y="274" fill="#F8FAFC" font-family="Consolas, PingFang SC, monospace" font-size="11.8">
    • Dedicated Service Account: Settings → People → Add person (Local access only)
  </text>
  <text x="766" y="304" fill="#F8FAFC" font-family="Consolas, PingFang SC, monospace" font-size="11.8">
    • Prevents leaked tokens from enabling internet login &amp; isolates audit logs
  </text>
  <rect x="766" y="334" width="598" height="132" rx="8" fill="#0F172A" stroke="#38BDF8"/>
  <text x="782" y="358" fill="#38BDF8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5" font-weight="700">
    Why Edge Semantic Distillation + MCP Event Triggering Wins:
  </text>
  <text x="782" y="382" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.8">
    • Continuous sensing runs at $0 cloud token cost on ESP32/Rust edge nodes.
  </text>
  <text x="782" y="406" fill="#CBD5E1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.8">
    • LLM is invoked only on 1,500 semantic state transitions/mo (~4k tokens vs 25k VLM).
  </text>
  <text x="782" y="430" fill="#94A3B8" font-family="Consolas, PingFang SC, monospace" font-size="11.2">
    MCP ID: io.github.homeassistant-ai/ha-mcp | 3 Starter HA Blueprints included
  </text>

  <!-- Bottom Panel: Closed-Form FinOps Worked Example -->
  <rect x="40" y="520" width="1360" height="360" rx="14" fill="#111827" stroke="#34D399" stroke-width="1.5"/>
  <text x="60" y="552" fill="#34D399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="800">
