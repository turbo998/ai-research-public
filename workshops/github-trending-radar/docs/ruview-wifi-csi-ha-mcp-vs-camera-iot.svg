  </text>
  <text x="80" y="646" fill="#FDE68A" font-family="Consolas, PingFang SC, monospace" font-size="12.8" font-weight="700">
    Path B (Raw IoT Dump + Unscoped YAML)     : 9,000 rounds/mo  (6,000×1.5) × ($0.0450 in + $0.0150 out) = $540.00/mo   ($405.00 in + $135.00 out) | 36.0h/mo
  </text>
  <text x="80" y="668" fill="#6EE7B7" font-family="Consolas, PingFang SC, monospace" font-size="12.8" font-weight="700">
    Path C (RuView 21 Entities + ha-mcp v9.1) : 1,500 rounds/mo  (events)    × ($0.0120 in + $0.0090 out) = $31.50/mo    ($18.00 in + $13.50 out)   | 9.0h/mo
  </text>

