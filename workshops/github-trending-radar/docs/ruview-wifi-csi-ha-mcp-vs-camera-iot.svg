  </text>

  <rect x="60" y="594" width="1320" height="82" rx="10" fill="#1E293B"/>
  <text x="80" y="620" fill="#FCA5A5" font-family="Consolas, PingFang SC, monospace" font-size="12.8" font-weight="700">
