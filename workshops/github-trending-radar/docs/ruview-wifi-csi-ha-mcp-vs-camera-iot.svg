  </text>

  <!-- Right Panel: homeassistant-ai/ha-mcp v9.1.2 Security Boundaries -->
  <rect x="730" y="142" width="670" height="360" rx="14" fill="#111827" stroke="#1E293B" stroke-width="1.5"/>
  <text x="750" y="172" fill="#34D399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="700">
