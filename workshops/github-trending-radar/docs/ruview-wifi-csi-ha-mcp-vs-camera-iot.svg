  </text>
  <text x="76" y="242" fill="#F8FAFC" font-family="Consolas, PingFang SC, monospace" font-size="11.8">
    • Ships 21 Entities per Node via --mqtt (HA-DISCO) or Matter Bridge (ADR-115/122):
  </text>
  <text x="76" y="266" fill="#CBD5E1" font-family="Consolas, PingFang SC, monospace" font-size="11.4">
    11 Raw Signals + 10 Semantic States: someone-sleeping, possible-distress,
  </text>
  <text x="76" y="288" fill="#CBD5E1" font-family="Consolas, PingFang SC, monospace" font-size="11.4">
    room-active, elderly-inactivity-anomaly, meeting-in-progress, bathroom-occupied,
  </text>
  <text x="76" y="310" fill="#CBD5E1" font-family="Consolas, PingFang SC, monospace" font-size="11.4">
