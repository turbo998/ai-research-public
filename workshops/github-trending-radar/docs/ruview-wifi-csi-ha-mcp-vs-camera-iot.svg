  </text>
  <rect x="76" y="334" width="598" height="132" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="92" y="358" fill="#FBBF24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5" font-weight="700">
