  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 全栈动量与关键位：EMA 20/50/200 排列与斜率、RSI/MACD/ADX/DI±、相对成交量、ATR 分位、前日高低点与 VWAP</text>
