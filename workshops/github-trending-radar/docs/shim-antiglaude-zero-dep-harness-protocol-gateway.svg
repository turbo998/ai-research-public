  <text x="40" y="58" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">2026-11-11 NIGHT SHIFT · ROUND 20 (CUMULATIVE R65) · ZERO-DEP GO CLI HARNESS &amp; AST PROTOCOL BRIDGE</text>
  <text x="40" y="90" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800">Balanov/shim (7.29 MiB Go Stdlib Harness) + sksarvesh007/antiglaude (AST Bridge)</text>
  <text x="40" y="115" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="14">9.96ms Startup + Allowlisted Local Router + Lazy load_skill + Bidirectional Protobuf AST Normalization (-84.06% Cost)</text>

