  <text x="282" y="169" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">Balanov/shim (191★ · MIT · v0.1.0)</text>

  <rect x="56" y="188" width="513" height="78" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="208" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">1. Zero-Dependency Static Binary (7.29 MiB, 9.96 ms Startup)</text>
  <text x="70" y="228" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">• Pure Go standard library: no Node, Python, Docker, database, daemon, or TUI</text>
  <text x="70" y="246" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• Plain JSON config (${ENV_VAR} expansion) + append-only JSONL sessions</text>

  <rect x="56" y="276" width="513" height="78" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="296" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">2. Allowlisted Local Mini-Model Router (Data, Not Authority)</text>
  <text x="70" y="316" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">• shim router use ollama/qwen3:4b maps natural language to allowlisted commands</text>
  <text x="70" y="334" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• Separate permission gate (read-only / ask / auto) + symlink/traversal blocks</text>

  <rect x="56" y="364" width="513" height="78" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="384" fill="#FBBF24" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">3. Lazy SKILL.md Loading (load_skill) &amp; Stdio/HTTP MCP</text>
  <text x="70" y="404" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">• Only skill names/descriptions enter system prompt; full body loads on demand</text>
  <text x="70" y="422" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• Namespaced mcp_&lt;server&gt;_&lt;tool&gt; over stdio and Streamable HTTP</text>

  <!-- Right Panel: sksarvesh007/antiglaude -->
  <rect x="615" y="136" width="545" height="320" rx="12" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
