  <text x="645" y="208" fill="#FBBF24" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">1. Bidirectional JSON Schema AST Normalization for Protobuf</text>
  <text x="645" y="228" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">• Rewrites propertyNames, anyOf, and const to eliminate HTTP 400 tool errors</text>
  <text x="645" y="246" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• Bridges /v1/messages &amp; Chat Completions to Claude 4.6 &amp; Gemini 3/2.5 backends</text>

  <rect x="631" y="276" width="513" height="78" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="645" y="296" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">2. Claude Code 2.1+ Auto-Mode Classifier &amp; /model Picker</text>
  <text x="645" y="316" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">• Returns structured safeguard_results (dangerous_tool_use: not_flagged)</text>
  <text x="645" y="334" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• Injects modelPicker manifest + CLAUDE_CODE_AUTO_MODE_SERVER="0"</text>

  <rect x="631" y="364" width="513" height="78" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="645" y="384" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">3. 60-Min Token Auto-Renewal, SSE Heartbeats &amp; Burner Guardrail</text>
  <text x="645" y="404" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">• Transparent OAuth refresh + periodic SSE keep-alives during long thinking turns</text>
  <text x="645" y="422" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• Live TUI quota meter (1,500 reqs/day) + strict non-primary account warning</text>

