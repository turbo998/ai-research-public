  <text x="68" y="682" fill="#F8FAFC" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path B (跨工具手工拷 Markdown + 静态表格维护人物认知)</text>
  <rect x="430" y="666" width="268" height="22" rx="5" fill="#F59E0B"/>
  <text x="710" y="682" fill="#FDE68A" font-family="Consolas, monospace" font-size="13" font-weight="bold">$2,680.00/mo ($880.00 spend + 18.0h × $100 = $1,800.00)</text>

  <text x="68" y="718" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path C (Scope Recall + Story Timeline + Noda 本地库)</text>
  <rect x="430" y="702" width="38.5" height="22" rx="5" fill="#10B981"/>
  <text x="480" y="718" fill="#6EE7B7" font-family="Consolas, monospace" font-size="13" font-weight="bold">$385.00/mo ($75.00 compute + 3.1h × $100 = $310.00) → 净省 $5,305.00/月 (-93.23% / 年省 $63,660.00)</text>

  <line x1="68" y1="740" x2="1332" y2="740" stroke="#334155"/>
  <text x="68" y="766" fill="#38BDF8" font-family="Consolas, monospace" font-size="13.5" font-weight="bold">🎯 ARCHITECTURAL TAKEAWAYS FOR CROSS-HARNESS MEMORY &amp; EPISTEMIC TIMELINE GRAPHS:</text>
  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 向量索引永远只是衍生缓存，SQLite 原始对话才是唯一可重建的真值源 (Scope Recall)。</text>
  <text x="68" y="814" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 复杂叙事与事件调查必须显式建模“认知获得时间戳 (who knew what when)”与“讲述顺序 vs 发生顺序” (Story Timeline)。</text>
  <text x="68" y="838" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 暴露给 AI Agent 的写接口应采用自描述 Schema + 单文档全有或全无原子 GraphQL Mutation。</text>
