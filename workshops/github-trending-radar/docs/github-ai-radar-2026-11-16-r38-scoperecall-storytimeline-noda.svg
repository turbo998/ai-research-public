  <text x="68" y="76" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">PROACTIVE DURABLE NEWS AGENT · 2026-11-16 NIGHT SHIFT ROUND 38 (CUMULATIVE R395 MILESTONE) · CLAIM-20261116-R38-SCOPERECALL-STORYTIMELINE-NODA</text>
  <text x="68" y="108" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21.5" font-weight="bold">跨五端共享 SQLite 记忆 (Scope Recall) + 叙事认知时间线 (story-timeline) + 本地知识图谱笔记</text>
  <text x="68" y="128" fill="#94A3B8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">Claude/Codex/Hermes/WorkBuddy/DSH 共享可重建向量真值库 + “谁在何时知道什么秘密”事务级 GraphQL + Windows 本地溯源笔记 · 净省 $5,305.00/月 (-93.23%)</text>

  <!-- Left Column: c410979729-bit/scope-recall-hermes + Timaga/noda-local-ai-notes -->
  <rect x="44" y="152" width="642" height="390" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="182" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">🗄️ 1. scope-recall-hermes (v4.0.4 · ★14) + noda-local-ai-notes (★104)</text>
  <text x="66" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">SQLite 存原始对话真值、向量索引随时可删可重建的跨五大 Agent 共享记忆层</text>

  <rect x="66" y="220" width="598" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="82" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">c410979729-bit/scope-recall-hermes：打通五大宿主客户端的长期记忆总线</text>
  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 一库通吃五大 Agent：Claude Code、Codex、Hermes、WorkBuddy 与 DeepSeek Harness (dsh) 共享同一本地记忆</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• SQLite 真值主权 (SQLite Truth)：原始对话永远保存在 SQLite，模型提炼的事实与向量仅作为可溯源、可重建伴随物</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 零模型预算兜底：即使未配置任何 LLM 路由或 Token 预算为 0，依然提供 100% 可用的本地原文检索</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ scope-recall setup 先展示宿主、作用域、预算与 Worker 计划，经人工确认才启用</text>

  <rect x="66" y="380" width="598" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="82" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">Timaga/noda-local-ai-notes (v1.0.2)：Windows 本地优先 Markdown 知识图谱工作台</text>
  <text x="82" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 全局快捷键极速闪念捕获：Ctrl + Shift + Space 随时呼出速记框，回车即入队保存为本地标准 Markdown 文件</text>
  <text x="82" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 100% 本地模型推理：自动生成标题/标签、构建笔记关系知识图谱、执行语义检索并附带原文出处引用问答</text>
  <text x="82" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 数据永不锁死：所有笔记皆为磁盘上可直接编辑的纯文本 Markdown，仅首次安装下载模型需联网</text>
  <text x="82" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 为 Windows 架构师提供了免云端订阅、带精确笔记引用的本地第二大脑</text>

  <!-- Right Column: d6u/story-timeline -->
  <rect x="706" y="152" width="650" height="390" rx="14" fill="url(#cardGrad)" stroke="#34D399" stroke-width="1.5"/>
  <text x="728" y="182" fill="#34D399" font-family="Consolas, monospace" font-size="14" font-weight="bold">⏳ 2. d6u/story-timeline (Epistemic SQLite + GraphQL Timeline · ★13)</text>
  <text x="728" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">用 SQLite + 事务级 GraphQL 记录“每个角色在什么时间点知道什么秘密”</text>

  <rect x="728" y="220" width="606" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="744" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">角色认知状态追踪 (Who Knows What and When) + 叙事顺序与发生顺序解耦</text>
  <text x="744" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 专治长篇剧本/小说/案件推演穿帮：如果角色 A 在第 3 章就利用了第 7 章才被告知的秘密，数据层直接暴露逻辑漏洞</text>
  <text x="744" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 双轴时间分离：将“故事讲述顺序 (Act Order，如《奥德赛》倒叙)”与“事件真实发生顺序 (Time Order)”独立建模</text>
  <text x="744" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 时点快照回溯 (“View story as of here”)：点击任意事件即可冻结后续未来事件，只看截至该时刻的人物关系与已知情报</text>
  <text x="744" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 单故事单 SQLite 文件极易备份 · 内置《奥德赛》英文与《画皮》中文双示范库</text>

  <rect x="728" y="380" width="606" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="744" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">自描述 Schema + 全有或全无原子 GraphQL 变更 (All-or-Nothing Mutation)</text>
  <text x="744" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 免额外写工具文档：GraphQL API 的每一个 Type 与 Field 均自带完整说明，AI Agent 通过内省即可自主学会全部读写语法</text>
  <text x="744" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 事务级原子提交：Agent 将整批剧情/情报修改作为单个 Mutation 文档发送，API 保证要么全部生效、要么全部回滚</text>
  <text x="744" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 多维可视化视图：角色分泳道时间线、人物关系图、弦图 (Chord Diagram)、因果链视图与洞察面板</text>
  <text x="744" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 不仅适用于长篇创作与游戏叙事，同样是情报分析、合规调查时间线还原的绝佳底座</text>

