  <text x="68" y="612" fill="#94A3B8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">工作负载：每月运行 40 组跨 CLI 智能体记忆共享工作流 + 25 次长程时序/认知一致性核查与本地知识库构建（时薪 r = $100.00/hr；外部可选 LLM 路由账单：not_measured）</text>

