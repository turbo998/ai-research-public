  <text x="752" y="478" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Backend (defect): Add a new TaggedError to payments.charge -&gt; every caller</text>
  <text x="752" y="500" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">  using match() fails TypeScript compilation until the new error is handled!</text>
  <text x="752" y="522" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Frontend (winamp-ui-sdk): Every UI primitive exposes typed WebMCP tools</text>
  <text x="752" y="544" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Eliminates unhandled runtime promise rejections &amp; brittle DOM selectors</text>

