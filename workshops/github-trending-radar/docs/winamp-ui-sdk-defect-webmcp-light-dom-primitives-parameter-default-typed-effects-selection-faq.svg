  <text x="1064" y="340" fill="#F8FAFC" font-family="Consolas, monospace" font-size="11.5">durable | trace | acquire</text>
  <text x="1064" y="360" fill="#FBCFE8" font-family="Consolas, monospace" font-size="11.5">retry | exponential | timeout</text>
  <text x="1064" y="382" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11.5">fork | join | all | race | layer</text>
  <text x="1064" y="402" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">0 npm dependencies (ESM)</text>

  <rect x="735" y="430" width="610" height="136" rx="10" fill="#0F172A" stroke="#334155"/>
