  <text x="752" y="222" fill="#A5B4FC" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Breakthrough: A Function's Steps Are Its Parameter Defaults (No yield* Generators!)</text>
  <text x="752" y="245" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• TypeScript infers Eff&lt;Value, Errors, Provides&lt;Services&gt;&gt; with zero type annotations</text>
  <text x="752" y="266" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Zero dependencies on Node 24+ (AsyncLocalStorage, AbortSignal.any, SuppressedError)</text>

