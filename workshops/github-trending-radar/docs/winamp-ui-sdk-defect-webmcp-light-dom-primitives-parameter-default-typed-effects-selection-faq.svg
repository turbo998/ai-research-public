  <rect x="735" y="294" width="298" height="122" rx="10" fill="#171631" stroke="#6366F1"/>
  <text x="752" y="317" fill="#A5B4FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">A. Parameter-Default Steps</text>
  <text x="752" y="340" fill="#F8FAFC" font-family="Consolas, monospace" font-size="11.5">[cart] = shop.findCart(id),</text>
