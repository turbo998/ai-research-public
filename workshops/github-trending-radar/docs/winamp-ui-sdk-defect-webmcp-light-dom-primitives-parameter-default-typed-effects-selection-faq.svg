  <text x="58" y="166" fill="#042F2E" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">1. rauchg/winamp-ui-sdk (★31 · Agent-Native Light-DOM Web Components)</text>

  <rect x="55" y="198" width="610" height="82" rx="10" fill="#111C33" stroke="#1E293B"/>
  <text x="72" y="222" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Core Paradigm: @ui-sdk/web + @ui-sdk/core Auto-Registers Every UI Part for Agents</text>
  <text x="72" y="245" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Pure Light-DOM Web Components (0 framework runtime) + 10-band Web Audio BiquadFilter EQ</text>
  <text x="72" y="266" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Exposes 22+ components to window.winampAgent + WebMCP snapshot(), query() &amp; act()</text>

  <!-- 3 Architectural Pillars -->
  <rect x="55" y="294" width="194" height="122" rx="10" fill="#091D26" stroke="#10B981"/>
  <text x="152" y="318" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">1. WebMCP Zero-Scrape</text>
  <text x="152" y="342" fill="#F8FAFC" font-family="Consolas, monospace" font-size="11" text-anchor="middle">createAgent + registerTools</text>
  <text x="152" y="362" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11" text-anchor="middle">snapshot() | query() | act()</text>
  <text x="152" y="382" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">reveals: true on &lt;ui-tabs&gt;</text>
  <text x="152" y="402" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Discovers hidden panels</text>

  <rect x="263" y="294" width="194" height="122" rx="10" fill="#0A222E" stroke="#06B6D4"/>
  <text x="360" y="318" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">2. Change vs Commit</text>
  <text x="360" y="342" fill="#F8FAFC" font-family="Consolas, monospace" font-size="11" text-anchor="middle">createChange (live DSP)</text>
  <text x="360" y="362" fill="#A5F3FC" font-family="Consolas, monospace" font-size="11" text-anchor="middle">createCommit (drag end)</text>
  <text x="360" y="382" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">10 EQ faders + Seek bar</text>
  <text x="360" y="402" fill="#22D3EE" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Tracks input source</text>

  <rect x="471" y="294" width="194" height="122" rx="10" fill="#1F160B" stroke="#F59E0B"/>
  <text x="568" y="318" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">3. 120Hz Elastic Primitives</text>
  <text x="568" y="342" fill="#F8FAFC" font-family="Consolas, monospace" font-size="11" text-anchor="middle">createResize + live()</text>
  <text x="568" y="362" fill="#FEF3C7" font-family="Consolas, monospace" font-size="11" text-anchor="middle">:popover-open top-layer</text>
  <text x="568" y="382" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11" text-anchor="middle">createRovingFocus</text>
  <text x="568" y="402" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Zero VDOM runtime tax</text>

  <!-- Winamp Strip -->
  <rect x="55" y="430" width="610" height="136" rx="10" fill="#0F172A" stroke="#334155"/>
  <text x="72" y="454" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Why @ui-sdk Light-DOM + WebMCP Beats DOM Scraping for Browser Agents</text>
  <text x="72" y="478" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">• definePrimitive + createParts auto-wires ARIA roles &amp; agent tool descriptors</text>
  <text x="72" y="500" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">• window.winampAgent.snapshot() returns compact semantic state (not 50k HTML tokens)</text>
  <text x="72" y="522" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">• window.winampAgent.act(...) drives EQ, transport &amp; hidden tabs deterministically</text>
  <text x="72" y="544" fill="#94A3B8" font-family="Consolas, monospace" font-size="12">• Scoped registerShortcut hotkeys auto-disable inside text &lt;input&gt; fields</text>

