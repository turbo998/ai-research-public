  <text x="52" y="96" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Zero-Framework @ui-sdk/web + Zero-DOM-Scraping createAgent() + Generator-Free TypeScript Eff&lt;A, E, R&gt; &amp; Durable Execution</text>

