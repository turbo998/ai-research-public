  <!-- Header -->
  <rect x="40" y="38" width="1360" height="86" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="64" y="73" fill="url(#accentR8)" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="21.5" font-weight="800">
    2026-11-11 ROUND 8 · SHANSELMAN/SANDBOX-MCP (v1.2.0) + STENCIL-HQ/OVNFS (v0.2.3 COW CHECKOUTS)
  </text>
  <text x="64" y="103" fill="#94A3B8" font-family="Consolas, PingFang SC, monospace" font-size="13">
    shanselman/sandbox-mcp (★410 · Disposable Win11 Guest · 29.8s DLL Proof) × stencil-hq/ovnfs (★235 · NFSv3/FUSE/WinFsp CoW)
  </text>
  <rect x="1140" y="54" width="238" height="52" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
  <text x="1259" y="76" text-anchor="middle" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="700">0-BYTE COPY CHECKOUT</text>
  <text x="1259" y="96" text-anchor="middle" fill="#38BDF8" font-family="Consolas, monospace" font-size="12" font-weight="700">-83.68% SANDBOX &amp; IO TCO</text>

  <!-- Row 1: Dual Breakdown -->
  <rect x="40" y="142" width="668" height="270" rx="14" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="60" y="172" fill="#38BDF8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15.5" font-weight="800">
    1. 一次性真机 Windows 11 沙盒：shanselman/sandbox-mcp (v1.2.0 · ★410)
  </text>
  <text x="60" y="200" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 核心痛点：在开发机宿主机直接跑 Agent 测试不仅危险，还会因本机已装 VC++ 运行库掩盖客户缺失依赖</text>
  <text x="60" y="224" fill="#34D399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 真 Windows 11 隔离客机：基于系统原生 Windows Sandbox，非容器模拟，支持完全断网 (Network-Off)</text>
  <text x="60" y="248" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 双接口同一引擎：便携式 sbx CLI (自带 Node.js，零 npm 依赖) + 可选 MCP 适配器返回内联截图</text>
  <text x="60" y="272" fill="#FBBF24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• UI Automation (UIA) 原生操控：驱动 WPF / WinForms 桌面控件、切换主题、捕获崩溃退出码并销毁客机</text>
  <rect x="60" y="292" width="628" height="102" rx="8" fill="#1E293B"/>
  <text x="76" y="316" fill="#F8FAFC" font-family="Consolas, PingFang SC, monospace" font-size="11.8" font-weight="700">实测 29.8 秒揪出「我电脑上明明能跑 (Works on my machine)」陷阱：</text>
  <text x="76" y="338" fill="#94A3B8" font-family="Consolas, PingFang SC, monospace" font-size="11.5">• 断网全新沙盒裸跑 NativeProof.exe → 29.8s 精准捕获 Exit Code -1073741515 (缺失 VC++ 运行库)</text>
  <text x="76" y="358" fill="#94A3B8" font-family="Consolas, PingFang SC, monospace" font-size="11.5">• 显式注入微软签名 VC++ 14.51.36247.0 后重跑 → 30.9s PASS (标注 PROVISIONED，区分裸机通过)</text>
  <text x="76" y="380" fill="#6EE7B7" font-family="Consolas, PingFang SC, monospace" font-size="11.3">• 完整端到端 GUI 自动化采样 (启动→部署→UIA点击→截图取证→销毁) 仅耗时 ~40–50 秒！</text>

  <rect x="732" y="142" width="668" height="270" rx="14" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="752" y="172" fill="#FBBF24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15.5" font-weight="800">
    2. 零拷贝写时复制工作区：stencil-hq/ovnfs (v0.2.3 · ★235 · Go)
  </text>
  <text x="752" y="200" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 核心痛点：git worktree 只管源码不管 10GB+ 的 node_modules/target，每个并发 Agent 都要重跑依赖安装</text>
  <text x="752" y="224" fill="#34D399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 任意目录写时复制 (CoW)：无论是不是 Git 仓，0 字节复制秒开完整隔离视图 (含编译缓存与依赖目录)</text>
  <text x="752" y="248" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 三端单守护进程挂载：macOS (NFSv3) · Linux (FUSE) · Windows (SMB / WinFsp)，免 root、免内核扩展</text>
  <text x="752" y="272" fill="#38BDF8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 跨机按需懒加载 (ovnfs attach --to devbox)：将本地 Checkout 瞬间挂载到远端开发机，首次读取时才拉取块</text>
  <rect x="752" y="292" width="628" height="102" rx="8" fill="#1E293B"/>
  <text x="768" y="316" fill="#F8FAFC" font-family="Consolas, PingFang SC, monospace" font-size="11.8" font-weight="700">核心工作流对比：git worktree vs stencil-hq/ovnfs (v0.2.3)</text>
  <text x="768" y="338" fill="#94A3B8" font-family="Consolas, PingFang SC, monospace" font-size="11.5">• cd "$(ovnfs new)"      → 毫秒级生成带完整依赖与未提交改动的 CoW 隔离目录，原目录 0 污染</text>
  <text x="768" y="358" fill="#94A3B8" font-family="Consolas, PingFang SC, monospace" font-size="11.5">• ovnfs run -- make test → 一次性隔离运行测试并自动销毁；ovnfs diff app -p 审查全部变更</text>
  <text x="768" y="380" fill="#6EE7B7" font-family="Consolas, PingFang SC, monospace" font-size="11.3">• ovnfs apply app        → 三路合并 (Three-Way Apply) 安全写回主目录，支持快照与跨机 push 脱机固化</text>

  <!-- Row 2: Pipeline -->
  <rect x="40" y="428" width="1360" height="196" rx="14" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="60" y="458" fill="#34D399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="800">
    3. 多智能体并发编码与桌面端零污染验收闭环：ovnfs 秒级 CoW 分叉 → Agent 并发改码 → sbx 断网真机沙盒验毒
  </text>

  <rect x="60" y="476" width="315" height="128" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="76" y="500" fill="#38BDF8" font-family="Consolas, PingFang SC, monospace" font-size="12.2" font-weight="700">STEP 1: 毫秒级零拷贝分叉</text>
  <text x="76" y="522" fill="#E2E8F0" font-family="Consolas, PingFang SC, monospace" font-size="11.2">cd "$(ovnfs new)" (NFSv3/FUSE/WinFsp)</text>
  <text x="76" y="544" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">直接复用主目录 15GB node_modules 与</text>
  <text x="76" y="564" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">Rust target 缓存，仅对写入块做 CoW</text>

  <rect x="401" y="476" width="315" height="128" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="417" y="500" fill="#34D399" font-family="Consolas, PingFang SC, monospace" font-size="12.2" font-weight="700">STEP 2: 跨机懒加载协同构建</text>
  <text x="417" y="522" fill="#E2E8F0" font-family="Consolas, PingFang SC, monospace" font-size="11.2">ovnfs attach app --to devbox</text>
  <text x="417" y="544" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">无需 git commit/push 即可把工作区挂给</text>
  <text x="417" y="564" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">远端编译机，按首次读取按需传输数据块</text>

  <rect x="742" y="476" width="315" height="128" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="758" y="500" fill="#FBBF24" font-family="Consolas, PingFang SC, monospace" font-size="12.2" font-weight="700">STEP 3: 断网全新 Win11 沙盒验收</text>
  <text x="758" y="522" fill="#E2E8F0" font-family="Consolas, PingFang SC, monospace" font-size="11.2">sbx run NativeApp.exe (Network-Off)</text>
  <text x="758" y="544" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">在全新一次性 Windows 11 客机内通过 UIA</text>
  <text x="758" y="564" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">验证安装器、DLL 依赖与深浅色 UI 交互</text>

  <rect x="1083" y="476" width="297" height="128" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="1099" y="500" fill="#A78BFA" font-family="Consolas, PingFang SC, monospace" font-size="12.2" font-weight="700">STEP 4: 三路合并与即用即毁</text>
  <text x="1099" y="522" fill="#E2E8F0" font-family="Consolas, PingFang SC, monospace" font-size="11.2">ovnfs diff -p &amp;&amp; ovnfs apply app</text>
  <text x="1099" y="544" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">销毁 Windows 沙盒客机，审查 CoW 差异后</text>
  <text x="1099" y="564" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">三路合并回主目录并执行 ovnfs rm app</text>

  <!-- Row 3: FinOps Worked Example -->
  <rect x="40" y="642" width="1360" height="238" rx="14" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="60" y="672" fill="#38BDF8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="800">
    4. 闭式 FinOps 算例：月开 1,200 个并发 Agent 工作区 + 400 次 Windows 桌面端验收 (synthetic, 宿主机折旧: not_measured)
  </text>
  <rect x="60" y="690" width="1320" height="170" rx="10" fill="#1E293B"/>
  <text x="80" y="720" fill="#FCA5A5" font-family="Consolas, PingFang SC, monospace" font-size="12.5" font-weight="700">
    • Path A (全量复制 worktree 装依赖 + 云端常驻 Win VM + 客户现场缺 DLL 救火): $640.00 VM/IO + $2,400.00 (32h) + $1,800.00 (24h) = $4,840.00/月
  </text>
  <text x="80" y="754" fill="#FDE68A" font-family="Consolas, PingFang SC, monospace" font-size="12.5" font-weight="700">
    • Path B (仅 Linux 容器隔离 + 手工恢复 Windows 虚拟机快照): $420.00 VM/IO + $1,500.00 (20h) + $1,200.00 (16h @$75/h) = $3,120.00/月 (36.0h)
  </text>
  <text x="80" y="788" fill="#6EE7B7" font-family="Consolas, PingFang SC, monospace" font-size="12.5" font-weight="700">
    • Path C (ovnfs 零拷贝 CoW 工作区 + sandbox-mcp 断网一次性 Win11 沙盒): $40.00 IO + $450.00 (6h) + $300.00 (4h) = $790.00/月 (10.0h)
  </text>
  <text x="80" y="818" fill="#A7F3D0" font-family="Consolas, PingFang SC, monospace" font-size="13" font-weight="800">
    → Path C 净省: $4,050.00/月 (-83.68%, 年省 $48,600.00) | 环境等待与缺 DLL 救火工时从 56.0h 降至 10.0h (-46.0h/月, -82.14%)
  </text>
  <text x="80" y="846" fill="#94A3B8" font-family="Consolas, PingFang SC, monospace" font-size="11.5">
