  <text x="74" y="202" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600">8 Experiments Proving LLMs Can Read, Diagnose &amp; Write Neural Weights</text>

  <rect x="74" y="216" width="491" height="66" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="88" y="238" fill="#C084FC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Zero-Forward-Pass Weight Reading (Exp 1–3) &amp; Sycophancy Audit (Exp 7)</text>
  <text x="88" y="257" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Identifies Atari game (Breakout/Pong/Pac-Man/Freeway), diffusion shape &amp; learned language</text>
  <text x="88" y="274" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">(Python/romaji/English from middle blocks) &amp; sycophantic checkpoints without forward passes</text>

  <rect x="74" y="292" width="491" height="72" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="88" y="314" fill="#38BDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Direct Weight Surgery &amp; From-Scratch Network Synthesis (Exp 4–6, 8)</text>
  <text x="88" y="333" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">One-shot weight repair (Exp 4), from-scratch MinAtar &amp; 1.5M-weight Go networks (Exp 5–6),</text>
  <text x="88" y="350" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">and direct weight edits boosting math accuracy on `Qwen3.5-0.8B` &amp; `Gemma 3 270M` (Exp 8)</text>

  <rect x="74" y="374" width="491" height="78" rx="8" fill="#0F172A" stroke="#334155"/>
