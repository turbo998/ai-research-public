  <text x="635" y="202" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600">"An LLM Running on an NPU Inside an LLM": Zero Learned Weights</text>

  <rect x="635" y="216" width="491" height="66" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="649" y="238" fill="#F59E0B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">64-Lane Vector Unit Compiled into Gated DeltaNet Heads</text>
  <text x="649" y="257" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">16x64-word vector regs, 384 int8 activation lanes, 4,152x64 int4 weight chunks &amp; 32-pos KV</text>
  <text x="649" y="274" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Implements `VMAT`, `VQ`, `VEW` (SiLU/RoPE), `VMATR`, `VEXP`, `VRED`, `VGET` &amp; `VPUT`</text>

  <rect x="635" y="292" width="491" height="72" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="649" y="314" fill="#38BDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">45.85x Trace-Token Reduction Running `stories260K` (`llama2.c`)</text>
  <text x="649" y="333" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Cuts trace tokens per story token from `2,430,000` (Plain C) &amp; `225,000` (Scalar NPU)</text>
  <text x="649" y="350" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">down to `53,000` trace tokens (~3,300 trace tok/s on L4 GPU = ~16s per story token)</text>

  <rect x="635" y="374" width="491" height="78" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="649" y="396" fill="#10B981" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">3,184,920-Step Bit-Exact Verification (`vxcheck` &amp; `test_rv_vx.py`)</text>
  <text x="649" y="415" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Zero gradient descent: every circuit weight is analytically emitted by the compiler</text>
  <text x="649" y="434" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Verified token-for-token identical against CPU reference across all 3,184,920 story steps</text>

