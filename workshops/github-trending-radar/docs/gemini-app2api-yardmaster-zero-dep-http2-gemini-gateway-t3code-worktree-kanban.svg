  <!-- Gateway Architecture -->
  <rect x="46" y="274" width="522" height="176" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="60" y="296" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">Engineering-Grade Harness Features (`0` Production npm Dependencies):</text>
  <text x="60" y="319" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Schema-Validated Function Tools: Validates JSON Schema args &amp; Responses `type: "namespace"`</text>
  <text x="60" y="338" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   groups before emission; caller executes tools locally in Cursor, Cline, Roo Code, or Codex CLI.</text>
  <text x="60" y="360" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">2. Multi-Account Rolling Window Pool: Soft session affinity + official usage bars + failover.</text>
  <text x="60" y="382" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">3. Stream-Reset Completion Contract: Prevents agents from discarding 3,000+ streamed bytes</text>
  <text x="60" y="401" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   or looping infinitely when upstream HTTP/2 streams reset mid-turn.</text>
  <text x="60" y="424" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">• `0700`/`0600` state files, `scrypt` admin auth, SHA-256 API keys &amp; SSRF-guarded image upload.</text>

