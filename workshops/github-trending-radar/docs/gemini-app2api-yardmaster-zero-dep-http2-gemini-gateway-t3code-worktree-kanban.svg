  <text x="646" y="278" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">7-Stage Autonomous T3 Code Orchestration (`http://127.0.0.1:4417`):</text>
  <text x="646" y="301" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Thread Context Import: Reads top 25 relevant T3 threads + root repo into shared Board Brief.</text>
  <text x="646" y="321" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">2. Plan Decomposition: Planner proposes 3–40 tasks w/ milestones, dependencies &amp; touched paths.</text>
  <text x="646" y="341" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Conflict-Free Auto-Run: Launches Ready tasks in isolated git worktrees only if paths don't collide.</text>
  <text x="646" y="361" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">4. Separate AI Reviewer &amp; Risk Gate: Runs up to `maxFixRounds` fix loops, scores review need</text>
