  <text x="646" y="403" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">$ pnpm dev:fake   # Zero-token FakeT3Client w/ real worktrees &amp; commits for testing</text>
  <text x="646" y="425" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">• One-click "Run project" per task worktree to preview any branch before merging.</text>

