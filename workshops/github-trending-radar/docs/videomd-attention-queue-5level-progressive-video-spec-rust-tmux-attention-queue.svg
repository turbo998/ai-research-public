  <text x="54" y="66" fill="#38BDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-13 NIGHT SHIFT · ROUND 38 (CUMULATIVE R166) · L0-L4 LAYERED VIDEO.MD SPEC &amp; RUST TMUX ATTENTION QUEUE FAQ</text>
  <text x="54" y="98" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">videomd/videomd (L0–L4 `VIDEO.md` Spec v1) + nodo-labs-uk/attention-queue (Rust `aq` CLI)</text>
  <text x="54" y="124" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5">5-Level Progressive Video Breakdown (`seen` vs `~` Inferred + Token Budgets) · Non-Preemptive 1-Card-at-a-Time `tmux` Hook Queue · -90.52% TCO</text>

  <!-- Left Card: videomd/videomd -->
  <rect x="52" y="146" width="535" height="324" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="74" y="178" fill="#38BDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800">1. videomd/videomd (10★ · Python · Apache-2.0 / CC BY 4.0)</text>
  <text x="74" y="202" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600">"Every Skill Has a `SKILL.md`. Every Video Gets a `VIDEO.md`."</text>

  <rect x="74" y="216" width="491" height="66" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="88" y="238" fill="#38BDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">5-Level Progressive Disclosure (`L0` Card → `L4` Raw Frames)</text>
  <text x="88" y="257" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">`VIDEO.md` (L0/L1) → `timeline.md` &amp; `sound.md` (L2) → `shots/01.md` (L3) → `frames/` (L4)</text>
  <text x="88" y="274" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Every file declares its exact token count so agents open only what they need</text>

  <rect x="74" y="292" width="491" height="72" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="88" y="314" fill="#10B981" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Strict `seen` vs Inferred (`~`) Provenance &amp; SHA-256 Binding</text>
  <text x="88" y="333" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Directly observed facts (`seen`) are strictly separated from inferred keys (`key~`)</text>
  <text x="88" y="350" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Frontmatter pins source video `sha256`, duration, shot count &amp; filmed-vs-code ratio</text>

  <rect x="74" y="374" width="491" height="78" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="88" y="396" fill="#A855F7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Shot-by-Shot Production &amp; Remake Recipes (`pip install videomd`)</text>
  <text x="88" y="415" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Records how each shot was filmed or code-rendered and how to remake it</text>
  <text x="88" y="434" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Eliminates repeated expensive VLM full-video frame decoding across turns</text>

  <!-- Right Card: nodo-labs-uk/attention-queue -->
  <rect x="613" y="146" width="535" height="324" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <text x="635" y="178" fill="#10B981" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800">2. nodo-labs-uk/attention-queue (10★ · Rust · MIT · `aq` CLI)</text>
  <text x="635" y="202" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600">"Every Claude Code Session That Needs You, One Card at a Time"</text>

  <rect x="635" y="216" width="491" height="66" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="649" y="238" fill="#10B981" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Non-Preemptive FIFO Card Queue (`review / step / quiz / vibe`)</text>
  <text x="649" y="257" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Queues diffs to review, edits to allow, permission prompts &amp; questions in `tmux`</text>
  <text x="649" y="274" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">New arrivals wait their turn and never hijack the screen mid-review</text>

  <rect x="635" y="292" width="491" height="72" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="649" y="314" fill="#38BDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Hook-Driven Push (`PreToolUse`, `PostToolUse`, `PermissionRequest`)</text>
  <text x="649" y="333" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Merges cleanly into `~/.claude/settings.json` after backing up existing hooks</text>
  <text x="649" y="350" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">"Let the work come to you" instead of polling scattered `tmux` windows</text>

  <rect x="635" y="374" width="491" height="78" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="649" y="396" fill="#F59E0B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Cross-Window Sync (`"answered elsewhere"`) Without Race Conditions</text>
  <text x="649" y="415" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">If you answer a prompt directly in its own `tmux` pane, `aq` marks it `"answered elsewhere"`</text>
  <text x="649" y="434" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Card stays visible until you press a key so you never lose track of state transitions</text>

