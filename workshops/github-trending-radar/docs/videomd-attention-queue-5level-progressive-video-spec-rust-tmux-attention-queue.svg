  <text x="440" y="596" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">$730.00 VLM/token + $1,900.00 labor (20.0h @ $95/h)</text>

  <rect x="774" y="530" width="352" height="82" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="790" y="552" fill="#6EE7B7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Path C: VIDEO.md (L0–L4) + `aq` Rust Queue</text>
  <text x="790" y="574" fill="#ECFDF5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800">$497.50 / mo (-90.52% · Save $4,752.50/mo)</text>
  <text x="790" y="596" fill="#A7F3D0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">$165.00 progressive read + $332.50 labor (3.5h) · Storage: not_measured</text>
