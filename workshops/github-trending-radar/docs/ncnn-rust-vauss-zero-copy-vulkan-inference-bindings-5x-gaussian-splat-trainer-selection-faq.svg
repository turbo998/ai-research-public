<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <linearGradient id="bgR22" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070A12"/>
      <stop offset="55%" stop-color="#101828"/>
      <stop offset="100%" stop-color="#05070C"/>
    </linearGradient>
    <linearGradient id="accentNcnn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="accentVauss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="900" fill="url(#bgR22)"/>

  <!-- Header Banner -->
  <rect x="35" y="24" width="1330" height="98" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="52" y="40" width="295" height="28" rx="6" fill="#431407" stroke="#F97316" stroke-width="1"/>
  <text x="199" y="59" fill="#FFEDD5" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2026-11-15 NIGHT R22 · CUMULATIVE R324</text>
  <text x="365" y="60" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">ncnn.rust Zero-Copy Vulkan Inference + Vauss 5.4x Faster Rust Gaussian Splat Engine</text>
  <text x="52" y="96" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Resource-Safe Rust Bindings for Tencent ncnn (10.9µs Request Path &amp; KV Cache) + 3-6 Min 3D Splat Trainer Exporting Voxels/Blender/Unity</text>

  <!-- Left Panel: Edwardssss/ncnn.rust -->
  <rect x="35" y="138" width="650" height="445" rx="14" fill="#0B1324" stroke="#F97316" stroke-width="1.5"/>
  <rect x="35" y="138" width="650" height="44" rx="14" fill="url(#accentNcnn)"/>
  <text x="58" y="166" fill="#431407" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">1. Edwardssss/ncnn.rust (★41 · Resource-Safe Rust ncnn + Vulkan)</text>

  <rect x="55" y="198" width="610" height="82" rx="10" fill="#111C33" stroke="#1E293B"/>
  <text x="72" y="222" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Systems Insight: Per-Request 256KB Vector Copy Costs 226µs vs 10.9µs Zero-Copy</text>
  <text x="72" y="245" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Consumes input Mat handle early so ncnn light-mode buffer recycling works unblocked</text>
  <text x="72" y="266" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• NanoDet-m CPU +1.6% (23.37ms), PP-OCRv5 CPU +2.2% (58.84ms), Vulkan 10.21ms</text>

  <!-- 3 Rust Ownership Pillars -->
  <rect x="55" y="294" width="194" height="122" rx="10" fill="#23150B" stroke="#F97316"/>
  <text x="152" y="318" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">1. Zero-Copy &amp; Pools</text>
  <text x="152" y="342" fill="#F8FAFC" font-family="Consolas, monospace" font-size="11" text-anchor="middle">extract_into(&amp;mut buf)</text>
  <text x="152" y="362" fill="#FFEDD5" font-family="Consolas, monospace" font-size="11" text-anchor="middle">infer_view_into (0-copy)</text>
  <text x="152" y="382" fill="#94A3B8" font-family="Consolas, monospace" font-size="11" text-anchor="middle">heap::retain_pages()</text>
  <text x="152" y="402" fill="#FB923C" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">10.93µs vs 226µs alloc</text>

  <rect x="263" y="294" width="194" height="122" rx="10" fill="#1F160B" stroke="#EAB308"/>
  <text x="360" y="318" fill="#FEF08A" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">2. Graph Safety Guards</text>
  <text x="360" y="342" fill="#F8FAFC" font-family="Consolas, monospace" font-size="11" text-anchor="middle">resolve_blob(&quot;input&quot;)</text>
  <text x="360" y="362" fill="#FEF9C3" font-family="Consolas, monospace" font-size="11" text-anchor="middle">shared_blobs() check</text>
  <text x="360" y="382" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle">Refuses unsafe light_mode</text>
  <text x="360" y="402" fill="#FACC15" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">Rejects foreign graphs</text>

  <rect x="471" y="294" width="194" height="122" rx="10" fill="#091D26" stroke="#10B981"/>
  <text x="568" y="318" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">3. KV Cache &amp; Vulkan</text>
  <text x="568" y="342" fill="#F8FAFC" font-family="Consolas, monospace" font-size="11" text-anchor="middle">ex.continue_session()</text>
  <text x="568" y="362" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11" text-anchor="middle">infer_stored (i8/bf16)</text>
  <text x="568" y="382" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle">Vulkan resident tensors</text>
  <text x="568" y="402" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">+ persistent pipeline cache</text>

  <!-- ncnn.rust Strip -->
  <rect x="55" y="430" width="610" height="136" rx="10" fill="#0F172A" stroke="#334155"/>
  <text x="72" y="454" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Zero-Allocation Production Inference Pattern (Rust 1.85.1+ / ncnn 20261020)</text>
  <text x="72" y="478" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">• Resolve once: let in_id = net.resolve_blob(&quot;in&quot;)?; let out_id = net.resolve_blob(&quot;out&quot;)?;</text>
  <text x="72" y="500" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">• Guard light-mode: if net.shared_blobs()?.is_empty() { ex.set_light_mode(true)?; }</text>
  <text x="72" y="522" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">• Stateful LLM/ASR decode: ex.set_kvcache_max_seqlen_hint(2048)?; ex.continue_session()?;</text>
  <text x="72" y="544" fill="#94A3B8" font-family="Consolas, monospace" font-size="12">• Reuse output buffer: ex.extract_into(&amp;out_id, &amp;mut buffer)?; (0 heap allocs after warmup)</text>

  <!-- Right Panel: voyager-so/vauss -->
  <rect x="715" y="138" width="650" height="445" rx="14" fill="#0B1324" stroke="#06B6D4" stroke-width="1.5"/>
  <rect x="715" y="138" width="650" height="44" rx="14" fill="url(#accentVauss)"/>
  <text x="738" y="166" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">2. voyager-so/vauss (★26 · 5.4x Faster Rust 3D Gaussian Splat Trainer)</text>

  <rect x="735" y="198" width="610" height="82" rx="10" fill="#111C33" stroke="#1E293B"/>
  <text x="752" y="222" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Breakthrough: 5.4x Faster than gsplat-MCMC · ~50% Less VRAM · 28.5 PSNR</text>
  <text x="752" y="245" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 3-6 minutes per scene on 1 GPU (8 GB+ VRAM); image-to-Blender set in ~35 minutes</text>
  <text x="752" y="266" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Native circular fisheye (opencv-fisheye) &amp; 2:1 stitched 360° equirectangular support</text>

  <!-- 2 Feature Cards -->
  <rect x="735" y="294" width="298" height="122" rx="10" fill="#0A222E" stroke="#06B6D4"/>
  <text x="752" y="317" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">A. End-to-End Rust Pipeline</text>
  <text x="752" y="340" fill="#F8FAFC" font-family="Consolas, monospace" font-size="11.5">vauss check room.mp4 --room</text>
  <text x="752" y="360" fill="#A5F3FC" font-family="Consolas, monospace" font-size="11.5">vauss run room.mp4 --driver fixed</text>
  <text x="752" y="382" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">Auto frame pick, camera solve,</text>
  <text x="752" y="402" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">splat train &amp; held-out PSNR eval</text>

  <rect x="1047" y="294" width="298" height="122" rx="10" fill="#171631" stroke="#6366F1"/>
  <text x="1064" y="317" fill="#A5B4FC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">B. 5 Multi-Engine Exports</text>
  <text x="1064" y="340" fill="#F8FAFC" font-family="Consolas, monospace" font-size="11.5">export-viewer | export-game</text>
  <text x="1064" y="360" fill="#C7D2FE" font-family="Consolas, monospace" font-size="11.5">export-blender | export-web</text>
  <text x="1064" y="382" fill="#E2E8F0" font-family="Consolas, monospace" font-size="11.5">export-collision --unity</text>
  <text x="1064" y="402" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">Playable voxels + convex meshes</text>

  <rect x="735" y="430" width="610" height="136" rx="10" fill="#0F172A" stroke="#334155"/>
  <text x="752" y="454" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">From Phone Video or AI Video to Playable Voxel &amp; Blender 5.3 Worlds</text>
  <text x="752" y="478" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Browser Viewer: Serverless local index.html walkthrough via export-viewer</text>
  <text x="752" y="500" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Playable Voxel World: WASD/gamepad first-person level (press V: splats &lt;-&gt; voxels)</text>
  <text x="752" y="522" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Blender 5.3 &amp; Web: Portable scene.spz + PLY + textured mesh + surface voxels</text>
  <text x="752" y="544" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Game Engine Physics: Convex collision decomposition + floor plane for Unity</text>

  <!-- Bottom Panel: Closed-Form FinOps Ledger -->
  <rect x="35" y="600" width="1330" height="274" rx="14" fill="#090F1D" stroke="#334155" stroke-width="1.5"/>
  <text x="58" y="632" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">Closed-Form FinOps Benchmark (CLAIM-20261115-R22-NCNNRUST-VAUSS · 60M Inferences + 90 3D Splat Worlds/mo)</text>
  <text x="58" y="654" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">Synthetic Model · Engineer Rate = $100.00/hr · Base Host Compute = not_measured · Zero Fabricated Coordinates</text>

  <!-- Path A Bar -->
  <text x="58" y="692" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Path A: Unpooled FFI + Python gsplat-MCMC</text>
  <rect x="395" y="674" width="740" height="26" rx="5" fill="#7F1D1D" stroke="#EF4444"/>
  <text x="1150" y="692" fill="#FECACA" font-family="Consolas, monospace" font-size="13.5" font-weight="700">$5,950.00/mo ($1,950.00 compute + 40.0h / $4,000.00)</text>

  <!-- Path B Bar -->
  <text x="58" y="734" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Path B: Python ONNX + Manual COLMAP Glue</text>
  <rect x="395" y="716" width="353" height="26" rx="5" fill="#78350F" stroke="#F59E0B"/>
  <text x="763" y="734" fill="#FEF3C7" font-family="Consolas, monospace" font-size="13.5" font-weight="700">$2,840.00/mo ($940.00 compute + 19.0h / $1,900.00)</text>

  <!-- Path C Bar -->
  <text x="58" y="776" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Path C: ncnn.rust Zero-Copy + Vauss 5.4x Splat</text>
  <rect x="395" y="758" width="57" height="26" rx="5" fill="#065F46" stroke="#10B981"/>
  <text x="467" y="776" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13.5" font-weight="700">$460.00/mo ($110.00 compute + 3.5h / $350.00) · -92.27%</text>

  <!-- Bottom KPI Pills -->
  <rect x="58" y="802" width="405" height="52" rx="8" fill="#111C33" stroke="#10B981"/>
  <text x="260" y="824" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Monthly Savings vs Path A: -$5,490.00/mo (-92.27%)</text>
  <text x="260" y="844" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Annualized Savings: $65,880.00/yr · 36.5h/mo Saved (-91.25%)</text>

  <rect x="480" y="802" width="420" height="52" rx="8" fill="#111C33" stroke="#F97316"/>
  <text x="690" y="824" fill="#FDBA74" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ncnn.rust: 10.9µs Request Path (20x Faster vs Alloc)</text>
  <text x="690" y="844" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Graph-Bound Tokens · continue_session() KV · Vulkan</text>

  <rect x="918" y="802" width="424" height="52" rx="8" fill="#111C33" stroke="#06B6D4"/>
  <text x="1130" y="824" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Vauss 3DGS: 5.4x Faster · ~50% VRAM · 28.5 PSNR</text>
  <text x="1130" y="844" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">3-6 Min/Scene · Exports Viewer, Voxels, Blender &amp; Unity</text>
