    2026-11-11 ROUND 5 · SUPERMIMIC (1-DAY ★985 WORLD MODEL) + LOT-MAP &amp; MAXAGENT (AGENT OBSERVABILITY)
  </text>
  <text x="64" y="103" fill="#94A3B8" font-family="Consolas, PingFang SC, monospace" font-size="13">
    HybridRobotics/supermimic (arXiv:2610.28480 · mjlab · GenCoord/MaxCoord) × alexeyw/lot-map (10-Station Radar) &amp; maxagent
  </text>
  <rect x="1140" y="54" width="238" height="52" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
