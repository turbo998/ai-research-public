  <text x="76" y="544" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">采集真实物理交互与 SimContext DR 参数</text>
  <text x="76" y="564" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">(1e-3 门限防 Float32 ULP 噪声放大)，</text>
  <text x="76" y="584" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">按环境分层采样训练 Dynamics MLP</text>

  <rect x="401" y="476" width="315" height="128" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="417" y="500" fill="#34D399" font-family="Consolas, PingFang SC, monospace" font-size="12.2" font-weight="700">2. 可微展开与 CUDA Graph 反传</text>
  <text x="417" y="522" fill="#E2E8F0" font-family="Consolas, PingFang SC, monospace" font-size="11.2">GenCoord / MaxCoord + Rot6D/Rodrigues</text>
  <text x="417" y="544" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">策略在可微世界模型中向前展开 H 步，</text>
  <text x="417" y="564" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">tracking_reward 误差直接沿动力学雅可比</text>
  <text x="417" y="584" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">反传更新 Policy (_CudaGraphNormalization)</text>

  <rect x="742" y="476" width="315" height="128" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="758" y="500" fill="#FBBF24" font-family="Consolas, PingFang SC, monospace" font-size="12.2" font-weight="700">3. MaxAgent 跨智能体经验注入</text>
  <text x="758" y="522" fill="#E2E8F0" font-family="Consolas, PingFang SC, monospace" font-size="11.2">npx maxagent init → ~/maxagent/experience</text>
  <text x="758" y="544" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">当某个 Agent 解决依赖/CUDA 编译报错后</text>
  <text x="758" y="564" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">沉淀为 Atom，其余 Agent 遇同类错误由</text>
  <text x="758" y="584" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">Hook 自动毫秒级召回，告别重复试错</text>

  <rect x="1083" y="476" width="297" height="128" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="1099" y="500" fill="#A78BFA" font-family="Consolas, PingFang SC, monospace" font-size="12.2" font-weight="700">4. Lot-Map 10 站点实时空间监控</text>
  <text x="1099" y="522" fill="#E2E8F0" font-family="Consolas, PingFang SC, monospace" font-size="11.2">/plugin install lot-map</text>
  <text x="1099" y="544" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">一眼看清子智能体卡在 Network、Shell</text>
  <text x="1099" y="564" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">还是权限 Hook 拦截，双表针实时指示</text>
  <text x="1099" y="584" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">长耗时命令，排障定位速度提升 5 倍</text>

