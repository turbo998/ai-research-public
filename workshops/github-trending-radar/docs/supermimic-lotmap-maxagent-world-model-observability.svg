  <text x="1259" y="96" text-anchor="middle" fill="#38BDF8" font-family="Consolas, monospace" font-size="12" font-weight="700">-81.57% LAB &amp; AGENT TCO</text>

  <!-- Row 1: Dual Technical Breakdown -->
  <rect x="40" y="142" width="668" height="270" rx="14" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="60" y="172" fill="#38BDF8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15.5" font-weight="800">
    1. 具身智能突破：HybridRobotics/supermimic (建仓 1 天狂揽 ★985 · arXiv:2610.28480)
  </text>
  <text x="60" y="200" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 核心痛点：传统无模型 PPO 训练人形全身追踪需上亿次盲采样，梯度方差大且跨任务难泛化</text>
  <text x="60" y="224" fill="#34D399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 单一可微世界模型 (Dynamics MLP)：(rep_state, action, aux_state) → (next_aux, next_rep)</text>
  <text x="60" y="248" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 双坐标表征：SuperMimic-GenCoord-G1 (关节广义坐标+解析IK) &amp; MaxCoord-G1 (全身刚体世界坐标)</text>
  <text x="60" y="272" fill="#FBBF24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• SimContext 域随机化条件注入：足底摩擦 ±0.45 / 质心偏移 ±0.05 / 编码器偏置 ±0.01 (1e-3 精度门限)</text>
  <rect x="60" y="292" width="628" height="102" rx="8" fill="#1E293B"/>
  <text x="76" y="316" fill="#F8FAFC" font-family="Consolas, PingFang SC, monospace" font-size="11.8" font-weight="700">底层工程神来之笔：_CudaGraphNormalization 原地指针保活</text>
  <text x="76" y="338" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">上游 rsl_rl 的 EmpiricalNormalization 执行 self._std = torch.sqrt(self._var) 会分配新张量，</text>
  <text x="76" y="358" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">直接击穿 CUDA Graph 捕获的内存地址！SuperMimic 改用 std_buf.copy_(self._std) 原地更新，</text>
  <text x="76" y="380" fill="#6EE7B7" font-family="Consolas, PingFang SC, monospace" font-size="11.3">让『世界模型前向想象 + 解析策略梯度反向传播』全程锁在单个 CUDA Graph 内极速跑通！</text>

  <rect x="732" y="142" width="668" height="270" rx="14" fill="#111827" stroke="#A78BFA" stroke-width="1.5"/>
  <text x="752" y="172" fill="#C4B5FD" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15.5" font-weight="800">
    2. 智能体可观测与经验共享：alexeyw/lot-map (★255) + vzroslieigry/maxagent (★265)
  </text>
  <text x="752" y="200" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• lot-map 实时空间雷达：在 Claude Code 聊天侧边栏绘制 10 大站点脉冲图，告别滚屏读日志</text>
  <text x="752" y="224" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 10 大站点：You · Model · Memory · Files · Shell · Network · Browser · Agents · Skills · Hooks</text>
  <text x="752" y="248" fill="#34D399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 视觉语义：40s 驻留 + 20s 渐隐轨迹线、高频辐条加粗、1m/10m 双表针计时、报错/拒止秒变红</text>
  <text x="752" y="272" fill="#38BDF8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• maxagent 跨工具经验原子库：打通 Claude Code / Codex / Antigravity / OpenClaw 共享 ~/maxagent</text>
  <rect x="752" y="292" width="628" height="102" rx="8" fill="#1E293B"/>
  <text x="768" y="316" fill="#F8FAFC" font-family="Consolas, PingFang SC, monospace" font-size="11.8" font-weight="700">为什么多 Agent 总是重复踩同一个坑？因为缺乏自动触发的「经验原子 (Atoms)」！</text>
  <text x="768" y="338" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">maxagent 通过收到消息时、执行命令前、报错发生后三道 Hook，用本地 SHA256 锁定的</text>
  <text x="768" y="358" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">multilingual-e5-small (~270MB) 检索已验证配方，并附带免开端口的 Chrome 扩展 MCP 桥！</text>
  <text x="768" y="380" fill="#6EE7B7" font-family="Consolas, PingFang SC, monospace" font-size="11.3">Windows 原生适配：Get-Content/Select-String 自动点亮 Files 站，Invoke-WebRequest 点亮 Network 站</text>

