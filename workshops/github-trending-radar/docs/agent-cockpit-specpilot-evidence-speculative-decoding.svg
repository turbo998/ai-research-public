  <!-- Header -->
  <rect x="40" y="38" width="1360" height="86" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="64" y="73" fill="url(#accentR14)" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="21.5" font-weight="800">
    2026-11-11 ROUND 14 · AGENT-COCKPIT (EVIDENCE CHAIN MCP) + SPECPILOT (10.87× LOSSLESS SPEC DECODING)
  </text>
  <text x="64" y="103" fill="#94A3B8" font-family="Consolas, PingFang SC, monospace" font-size="13">
    chutingyean/Agent-Cockpit (★476 · Function-Hash Call Graph) × StargazerX0/SpecPilot (★187 · arXiv:2611.02501 · TLV τ=13.08)
  </text>
  <rect x="1140" y="54" width="238" height="52" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
  <text x="1259" y="76" text-anchor="middle" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="700">10.87× OVER AR</text>
  <text x="1259" y="96" text-anchor="middle" fill="#38BDF8" font-family="Consolas, monospace" font-size="12" font-weight="700">-80.94% SERVING &amp; QA TCO</text>

  <!-- Row 1: Dual Breakdown -->
  <rect x="40" y="142" width="668" height="270" rx="14" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="60" y="172" fill="#38BDF8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15.5" font-weight="800">
    1. 确定性证据链白板：chutingyean/Agent-Cockpit (★476 · 零 Token 核验)
  </text>
  <text x="60" y="200" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 科研最大死穴：Agent 偷偷放宽评分器 (Grader) 或改了统计辅助函数，以前验证过的结论静默失效却无人察觉</text>
  <text x="60" y="224" fill="#34D399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 字段级证据绑定 + 函数调用闭包 Hash：每条结论必须绑定真实实验写出的 JSON 字段与调用链所有函数 Hash</text>
  <text x="60" y="248" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 瞒报改动双拦截：文件变动未向看板登记直接阻断 git commit，且通过 Stop Hook 阻止 Claude Code 结束回合</text>
  <text x="60" y="272" fill="#FBBF24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 断链自动标红与决策简报：任一底层函数改动即标红下游结论卡，自动弹出 cockpit_decide 单页 HTML 简报</text>
  <rect x="60" y="292" width="628" height="102" rx="8" fill="#1E293B"/>
  <text x="76" y="316" fill="#F8FAFC" font-family="Consolas, PingFang SC, monospace" font-size="11.8" font-weight="700">为什么 Agent-Cockpit 能做到 $0 Token 成本检验整条证据链？</text>
  <text x="76" y="338" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">它基于 Node.js 22.13+ 内置 node:sqlite 与轻量级 graphify 静态调用图，每次文件变更由确定性规则</text>
  <text x="76" y="358" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">计算依赖闭包 (Dependency Closure)；一旦回滚恶意改动 (demo --restore)，Hash 重新匹配，结论卡自动恢复绿灯！</text>
  <text x="76" y="380" fill="#6EE7B7" font-family="Consolas, PingFang SC, monospace" font-size="11.3">一键初始化: npx -y @tingyen/agent-cockpit init (同时适配 Claude Code, Codex, Cursor, Gemini CLI)</text>

  <rect x="732" y="142" width="668" height="270" rx="14" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="752" y="172" fill="#FBBF24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15.5" font-weight="800">
    2. 无损投机解码自治寻优：StargazerX0/SpecPilot (★187 · arXiv:2611.02501)
  </text>
  <text x="752" y="200" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 核心痛点：开源投机解码 (DFlash2 / DSpark) 出厂配置远未跑满硬件上限，不同显卡/批次的最优参数截然不同</text>
  <text x="752" y="224" fill="#34D399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 多智能体自治进化闭环：成本模型定位最大性能缺口 → 并行算法探索 (双层验证 TLV) + 内核子智能体压榨显存带宽</text>
  <text x="752" y="248" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• Token Forcing 100% 无损保证：逐 Token 对齐原版贪婪解码输出，无需重新训练权重即可实现零精度损失加速</text>
  <text x="752" y="272" fill="#38BDF8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 实测吞吐较原版投机解码再翻倍：单并发达 AR 的 8.86×–10.87× (τ 跃升至 13.08)，高并发 Batch 16-24 达 3.93×</text>
  <rect x="752" y="292" width="628" height="102" rx="8" fill="#1E293B"/>
  <text x="768" y="316" fill="#F8FAFC" font-family="Consolas, PingFang SC, monospace" font-size="11.8" font-weight="700">6 大生产级配置一手基准 (gsm8k/humaneval/math500/mbpp/mt-bench · 2048 tokens):</text>
  <text x="768" y="338" fill="#94A3B8" font-family="Consolas, PingFang SC, monospace" font-size="11.5">• H100 (Qwen3.8-27B + DSpark, c=1): Stock 3.74× → SpecPilot 9.41× over AR (2.52× over stock, τ: 4.42→12.85)</text>
  <text x="768" y="358" fill="#94A3B8" font-family="Consolas, PingFang SC, monospace" font-size="11.5">• RTX PRO 6000 Blackwell (Qwen3.8-27B + DFlash2, c=1): Stock 4.46× → SpecPilot 10.87× over AR (τ: 5.23→12.80)</text>
  <text x="768" y="380" fill="#6EE7B7" font-family="Consolas, PingFang SC, monospace" font-size="11.3">• H100 Batch 16/20/24 (Qwen3.8-27B FP8 + DSpark): Stock 1.94× → SpecPilot 3.93× over AR (2.03× over stock)</text>

