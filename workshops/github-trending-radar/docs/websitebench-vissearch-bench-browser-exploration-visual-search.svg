  <text x="649" y="257" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Set-wise (68), Sequential (34), Hybrid Wide-Deep (34), Disambiguation (34), Structure-Guided (34)</text>
