  <text x="649" y="333" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Integrates web search, webpage read, text-to-image search, reverse image search &amp; image crop</text>
  <text x="649" y="350" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Dual rubrics: strict full-answer Accuracy (`accuracy_prompt`) + step-level `Process Score`</text>

  <rect x="635" y="374" width="491" height="78" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="649" y="396" fill="#10B981" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">26-Configuration Leaderboard: Kimi-K3 (26.47% Acc) &amp; GPT-5.5 (49.52% PS)</text>
  <text x="649" y="415" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Direct Answer tops out at 6.37% (GPT-5.5 / Gemini 3.5 Flash); ReAct boosts Acc by 4.15x</text>
  <text x="649" y="434" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Exposes critical gap between intermediate evidence gathering (49.52% PS) and final synthesis</text>

