  <text x="60" y="385" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">$ python llamacpp/macaq.py refine --model q4.gguf --teacher f16.gguf --output macaq-r.gguf</text>
  <text x="60" y="407" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">• Supports `llama.cpp`, `vLLM`, `Diffusers`, `PyTorch` &amp; Ascend CANN W4A4 PTO-ISA/TileLang kernels.</text>
