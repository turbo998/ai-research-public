  <text x="60" y="342" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">2. Beyond Text (W4A4): Quantizes `FLUX.2-klein-4B` (image), `Wan2.2-TI2V-5B` (image-to-video),</text>
