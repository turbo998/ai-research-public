<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg53" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="55%" stop-color="#131E35"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accent53" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg53)"/>
  <rect x="28" y="24" width="1144" height="627" rx="18" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <rect x="28" y="24" width="1144" height="6" rx="3" fill="url(#accent53)"/>

  <text x="54" y="66" fill="#38BDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-11 NIGHT SHIFT · ROUND 53 (CUMULATIVE R98) · MULTI-PHONE AGENT FLEET &amp; PER-REQUEST ALIGNMENT FAQ</text>
  <text x="54" y="98" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="800">mylea1/phongent (357★ Multi-Phone Fleet) + Aevonix/FlashAlign (126★ Per-Request Align)</text>
  <text x="54" y="124" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5">iOS/Android Master Group Dispatch, PiP Virtual Screen &amp; Notification Hub · Per-Request Verified-Contact Alignment on vLLM/SGLang · -87.82% TCO</text>

  <!-- Left Card: mylea1/phongent -->
  <rect x="52" y="146" width="535" height="324" rx="14" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="74" y="178" fill="#38BDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800">1. mylea1/phongent (357★ · Kotlin / Swift · Apache-2.0)</text>
  <text x="74" y="202" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600">iOS &amp; Android Multi-Device Mobile Agent Fleet Controller (Built on Mika)</text>

  <rect x="74" y="216" width="491" height="66" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="88" y="238" fill="#38BDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Group-Scoped Natural Language Dispatch &amp; Differentiated Content</text>
  <text x="88" y="257" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">iOS (`MikaRemote`) or Android master controls multiple Android worker phones over LAN</text>
  <text x="88" y="274" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Generates distinct copy/image cards per device in a group and saves as un-published drafts</text>

  <rect x="74" y="292" width="491" height="72" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="88" y="314" fill="#10B981" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Live Virtual-Screen Mini-Window (PiP) &amp; Instant Touch Takeover</text>
  <text x="88" y="333" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Streams each worker phone's Android virtual display into a floating mini-window</text>
  <text x="88" y="350" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Tap, swipe, or type inside the mini-window on the master phone to take over at any moment</text>

  <rect x="74" y="374" width="491" height="78" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="88" y="396" fill="#A855F7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Centralized Notification Hub &amp; Agent-Delegated Replies</text>
  <text x="88" y="415" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Aggregates toast/push notifications across all connected phones by device, app &amp; sender</text>
  <text x="88" y="434" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Reply from the master controller and delegate the actual in-app reply to that phone's agent</text>

  <!-- Right Card: Aevonix/FlashAlign -->
  <rect x="613" y="146" width="535" height="324" rx="14" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="635" y="178" fill="#F59E0B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800">2. Aevonix/FlashAlign (126★ · Python · vLLM / SGLang / TensorFold)</text>
  <text x="635" y="202" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600">Instant Per-Request Alignment &amp; Refusal Control Without Weight Mutation</text>

  <rect x="635" y="216" width="491" height="66" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="649" y="238" fill="#F59E0B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Per-Request `Verified contacts` Gate vs. Permanent Weight Abliteration</text>
  <text x="649" y="257" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Applies alignment profiles per request without permanently modifying base/quantized weights</text>
  <text x="649" y="274" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Restricts refusal-reduction to verified users/channels &amp; controls tool-inheritance risk</text>

  <rect x="635" y="292" width="491" height="72" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="649" y="314" fill="#38BDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">5 Pinned Starter Profiles Across 4 Inference Engines</text>
  <text x="649" y="333" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Supports `DeepSeek V4.1 Flash 1017` (vLLM/TensorFold), `GLM 5.3 Full/Flash` (SGLang),</text>
  <text x="649" y="350" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">`Qwen3.8-27B` &amp; `Gemma 4 26B A4B` (vLLM, SGLang, TensorFold, llama.cpp) + Hermes/OpenClaw</text>

  <rect x="635" y="374" width="491" height="78" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="649" y="396" fill="#10B981" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Profile Inspector, Hot Loading &amp; `flashalign.sh doctor --probe`</text>
  <text x="649" y="415" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Audits model pins, operators, sites, ranks &amp; SHA checksums before activation</text>
  <text x="649" y="434" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Hot-loads compatible profiles without engine restarts and confirms effective-profile header</text>

  <!-- Bottom FinOps Comparison Strip -->
  <rect x="52" y="488" width="1096" height="140" rx="14" fill="#0B1220" stroke="#334155" stroke-width="1.5"/>
  <text x="74" y="516" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="800">Closed-Form FinOps Benchmark (CLAIM-20261111-R53-PHONGENT-FLASHALIGN · 30 Mobile Agents + 150k Multi-Channel Requests/Mo)</text>

  <rect x="74" y="530" width="330" height="82" rx="10" fill="#1E293B" stroke="#EF4444"/>
  <text x="90" y="552" fill="#FCA5A5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Path A: 1-by-1 Phone Ops + Dual GPU Models</text>
  <text x="90" y="574" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800">$5,830.00 / mo</text>
  <text x="90" y="596" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">$1,780.00 dual-GPU/tokens + $4,050.00 labor (45.0h @ $90/h)</text>

  <rect x="424" y="530" width="330" height="82" rx="10" fill="#1E293B" stroke="#F59E0B"/>
  <text x="440" y="552" fill="#FCD34D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Path B: Raw ADB Scripts + Restarting LoRAs</text>
  <text x="440" y="574" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800">$2,930.00 / mo (-49.74%)</text>
  <text x="440" y="596" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">$860.00 compute + $2,070.00 labor (23.0h @ $90/h)</text>

  <rect x="774" y="530" width="352" height="82" rx="10" fill="#064E3B" stroke="#10B981" stroke-width="1.5"/>
  <text x="790" y="552" fill="#6EE7B7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Path C: phongent Fleet + FlashAlign v1.2</text>
  <text x="790" y="574" fill="#ECFDF5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800">$710.00 / mo (-87.82% · Save $5,120.00/mo)</text>
  <text x="790" y="596" fill="#A7F3D0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">$260.00 compute + $450.00 labor (5.0h) · Phone/GPU hardware: not_measured</text>
