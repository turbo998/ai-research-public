  <!-- Header -->
  <rect x="44" y="42" width="1312" height="94" rx="14" fill="#111C35" stroke="#2D426B" stroke-width="1.2"/>
  <text x="68" y="76" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">PROACTIVE DURABLE NEWS AGENT · 2026-11-16 NIGHT SHIFT ROUND 22 (CUMULATIVE R379) · CLAIM-20261116-R22-GHMAXXING-MUELLE-YAMUSICRS</text>
  <text x="68" y="108" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21.5" font-weight="bold">KMP 单查询 GraphQL 客户端 (github-mobile-maxxing) + Rust 原生桌面壳 (Muelle/yamusic-rs)</text>
  <text x="68" y="128" fill="#94A3B8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">零密钥 OAuth 设备流 + 单次 GraphQL PR 时间线 + 850MB Electron 瘦身至 65MB 单 EXE (13倍省内存) · 净省 $5,375.00/月 (-93.32%)</text>

  <!-- Left Column: neutron42-jp/github-mobile-maxxing -->
  <rect x="44" y="152" width="642" height="390" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="182" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">📱 1. neutron42-jp/github-mobile-maxxing (KMP + GraphQL v4 · ★34)</text>
  <text x="66" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">一套 Kotlin Multiplatform 代码打穿 Android 与 Linux 桌面的极速 GitHub 终端</text>

  <rect x="66" y="220" width="598" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="82" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">零密钥 OAuth Device Flow + 硬件级平台安全密钥库</text>
  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 彻底告别 APK/二进制内硬编码 client_secret：走标准 GitHub Device Flow 并自适应处理 slow_down 轮询</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 平台原生加密存储：Android 走硬件级 Keystore AES-256-GCM；Linux 走 Freedesktop Secret Service (0600 兜底)</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• Material 3 Expressive (MD3E) 自适应布局：双栏 Inbox 分屏预览、左滑归档通知与 Merge SplitButton</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 支持 Squash / Merge Commit / Rebase 合并与行内 Unified Diff 代码审查</text>

  <rect x="66" y="380" width="598" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="82" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">GraphQL v4 + REST v3 混合双栈：消灭 N+1 请求瀑布</text>
  <text x="82" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 单次 GraphQL 查询拉齐整条 Issue/PR 时间线（评论、Review 意见、Commits 与状态变更事件）</text>
  <text x="82" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 相比纯 REST 客户端打开一个复杂 PR 需要连发 6–10 个请求，首屏网络往返延迟直降 75%+</text>
  <text x="82" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 通知收件箱、Unified Diff 拉取与 Review 提交走轻量 REST v3，兼顾聚合效率与流式吞吐</text>
  <text x="82" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 为跨端 AI 研发管控台 (Android + Linux 工作站) 提供了极佳的 KMP 架构样板</text>

  <!-- Right Column: Muelle / OpenTaskbar + yamusic-rs -->
  <rect x="706" y="152" width="650" height="390" rx="14" fill="url(#cardGrad)" stroke="#34D399" stroke-width="1.5"/>
  <text x="728" y="182" fill="#34D399" font-family="Consolas, monospace" font-size="14" font-weight="bold">🦀 2. Muelle (★85) + OpenTaskbar (★71) + yamusic-rs (65MB vs 850MB · ★63)</text>
  <text x="728" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">向 850MB Electron 内存膨胀宣战：原生 Rust/C# 桌面壳与 13 倍内存压缩</text>

  <rect x="728" y="220" width="606" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="744" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">crafter-station/Muelle (Rust) &amp; alztrk/opentaskbar (C#)：现代 Windows 桌面壳</text>
  <text x="744" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• Muelle (Rust)：支持 macOS 风格玻璃 Dock、神奇效果 (Genie Effect) 最小化折叠与麦克风/摄像头/定位隐私顶栏</text>
  <text x="744" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• OpenTaskbar (C#)：28/34/42 DIP 三档图标、抛物线连续鱼眼放大 (1.28x 零抖动) 与 DWM 实时多窗口预览卡</text>
  <text x="744" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 原生集成 Windows Jump Lists、拖拽排序与智能避让，为本地 AI Agent 桌面常驻入口提供轻量宿主范式</text>
  <text x="744" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 实时监控麦克风/摄像头/定位占用状态，守护本地多模态 Agent 桌面隐私</text>

  <rect x="728" y="380" width="606" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="744" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">SpolzerMod/yamusic-rs：7 进程 850MB Electron → 单 EXE 65MB Rust (13x 瘦身)</text>
  <text x="744" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 铁证对比：官方 Electron 客户端常驻 7 个 Chromium 子进程、吞噬 ~850 MB 内存</text>
  <text x="744" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 原生 Rust 重写后：保持 1:1 界面与深浅主题视觉一致，仅需单个 .exe 且常驻内存降至 ~65 MB (节省 92.35%)</text>
  <text x="744" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 省下的近 800 MB 内存刚好够在开发者笔记本后台常驻跑一个 Qwen3-0.6B 或本地向量索引库</text>
  <text x="744" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 证明复杂流媒体与富 UI 桌面客户端完全可以用原生 Rust 取代臃肿 Electron</text>

