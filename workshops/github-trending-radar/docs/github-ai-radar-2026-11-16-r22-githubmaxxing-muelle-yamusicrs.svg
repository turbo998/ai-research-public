  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 研发工具鉴权首选 OAuth Device Flow + Keystore/Secret Service 硬件存储，并用单次 GraphQL 查询替代 N+1 REST。</text>
  <text x="68" y="814" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 常驻桌面的辅助工具绝不该用 850MB 的 Electron：Rust 单 EXE (65MB) 可立省 13 倍内存留给本地大模型。</text>
  <text x="68" y="838" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• Muelle 与 OpenTaskbar 展示了如何在 Windows 11 上结合 DWM 实时缩略图与硬件隐私状态栏构建现代桌面入口。</text>
