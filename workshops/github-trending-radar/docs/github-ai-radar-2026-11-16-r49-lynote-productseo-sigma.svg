  <rect x="66" y="220" width="598" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="82" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">为什么普通 AI 生成的培训课程不敢给员工用？因为模型会私自脑补文件中没有的结论</text>
  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 连续原句门禁 (Quote Gate)：每个知识点与考题必须绑定源片段（页码/幻灯片/字幕秒数）里的**连续原句**</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 读写裁判分离：Azure 负责解析文档，DeepSeek 负责提取知识点与写课，**独立的 Jev 模型只负责裁决“该原句是否真能支撑该结论”**！</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 闯关锁章与防剧透反馈：下一章在通过当前测验前连服务端都不下发；原句引用只在交卷后的解析里揭晓</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 内置防 SSRF 私网地址拦截与内存级二进制解析（不保留原始上传文件）</text>

