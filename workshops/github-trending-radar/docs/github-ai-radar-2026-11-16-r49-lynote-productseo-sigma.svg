  <text x="82" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 零密钥先体验：`docker compose up --build` 后无需配置任何 Key 即可完整体验内置 3 章样板课程</text>
