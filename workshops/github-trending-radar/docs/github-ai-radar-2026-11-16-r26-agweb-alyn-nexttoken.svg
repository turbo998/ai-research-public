  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 根治多 Agent 并发操控浏览器时的最大痛点：弹窗、切标签、文件选择器与下载全部在代码层静默应答，绝不抢前台焦点</text>
