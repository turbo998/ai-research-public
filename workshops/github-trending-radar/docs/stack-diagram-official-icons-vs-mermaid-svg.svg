  <text x="274" y="406" class="t-card-h">How stack-diagram Separates Official Brand Assets from LLM Coordinate Layout</text>

  <!-- Step boxes -->
  <rect x="52" y="424" width="262" height="145" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="66" y="446" class="t-card-h" fill="#38BDF8">1. fetch_icons.py</text>
  <text x="66" y="468" class="t-body">• svgl → devicon → gilbarbara</text>
  <text x="66" y="487" class="t-body">• Official azure/*, aws/*, gcp/*</text>
  <text x="66" y="506" class="t-body">• Lucide glyphs for generic nodes</text>
  <text x="66" y="525" class="t-mono">• Emits manifest.json + white_fill</text>
  <text x="66" y="544" class="t-body">• Never recolors brand logos</text>

  <rect x="330" y="424" width="262" height="145" rx="10" fill="#0F172A" stroke="#818CF8" stroke-width="1.2"/>
  <text x="344" y="446" class="t-card-h" fill="#818CF8">2. references/geometry.md</text>
  <text x="344" y="468" class="t-body">• 1000px fixed coordinate canvas</text>
  <text x="344" y="487" class="t-body">• Node box = 132w × 100h</text>
  <text x="344" y="506" class="t-body">• Row spacing ≥140px</text>
  <text x="344" y="525" class="t-mono">• Group pad: cx±90, bottom ≥ top+150</text>
  <text x="344" y="544" class="t-body">• Paint-order stroke halo on labels</text>

  <rect x="608" y="424" width="262" height="145" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="622" y="446" class="t-card-h" fill="#FCD34D">3. scripts/build.py</text>
  <text x="622" y="468" class="t-body">• Inlines %%ICON_&lt;name&gt;%% as Base64</text>
  <text x="622" y="487" class="t-body">• Inlines Geist &amp; JetBrains Mono</text>
  <text x="622" y="506" class="t-body">• Zero external network requests</text>
  <text x="622" y="525" class="t-mono">• Fails loudly on unresolved tokens</text>
  <text x="622" y="544" class="t-body">• Single HTML source of truth</text>

  <rect x="886" y="424" width="262" height="145" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="900" y="446" class="t-card-h" fill="#6EE7B7">4. scripts/render_png.py</text>
  <text x="900" y="468" class="t-body">• Headless Chromium --scale 2</text>
  <text x="900" y="487" class="t-body">• Emits out.png + out-dark.png</text>
  <text x="900" y="506" class="t-body">• Mandatory visual QA loop</text>
  <text x="900" y="525" class="t-mono">• Optional React TSX export</text>
  <text x="900" y="544" class="t-body">• Double-confirm before share.py</text>

