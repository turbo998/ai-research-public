  <text x="36" y="78" class="t-sub">Provenance: Track B 7-Day Breakout in search-new-repos-2026-11-08-raw.json (sha256: b63e1547...) · 2,114 / 2,121 Total Stars (~302★/day lifecycle avg, measured; stars_today: not_measured) · MIT</text>

  <!-- Card 1: Why Raw LLM SVG Fails vs 132x100 Bounding Box -->
  <rect x="36" y="96" width="550" height="260" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="52" y="112" width="176" height="22" rx="6" fill="#38BDF8"/>
