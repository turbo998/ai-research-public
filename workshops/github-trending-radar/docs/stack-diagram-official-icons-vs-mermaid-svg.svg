  <rect x="52" y="144" width="518" height="62" rx="8" fill="#0F172A" stroke="#EF4444" stroke-width="1.2"/>
  <text x="66" y="164" class="t-card-h" fill="#FCA5A5">❌ Raw LLM Freehand SVG (60×60 Tile-Only Blindness)</text>
  <text x="66" y="183" class="t-body">• Hallucinates deformed &lt;path&gt; logos burning ~8k output tokens/turn</text>
  <text x="66" y="200" class="t-body">• Anchors vertical arrows at y = topY+60, striking straight through node text!</text>

  <rect x="52" y="216" width="518" height="126" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="66" y="236" class="t-card-h" fill="#6EE7B7">✅ caru-ini/stack-diagram (skills/stack-diagram/SKILL.md)</text>
  <text x="66" y="256" class="t-mono">• Official Icons: fetch_icons.py (svgl → devicon → gilbarbara + azure/* aws/* gcp/*)</text>
  <text x="66" y="275" class="t-mono">• Node Box (132×100): Tile topY..topY+60 | Name +68 | Role +86 | Box bottom +100</text>
  <text x="66" y="294" class="t-body">• Vertical Edge Law: Connect y1 = topY_upper + 100 + 6 down to y2 = topY_lower - 6</text>
  <text x="66" y="313" class="t-body">• Cloud Rules: Azure VNet inside Region; GCP Region inside global VPC; AWS Public/Private</text>
  <text x="66" y="331" class="t-body">• Build &amp; QA: build.py Data URI HTML + render_png.py --scale 2 light/dark self-check</text>

