  <text x="645" y="316" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">• Ports C/C++/Py/Go/JS tests first; preserves dict order (avoids HashMap traps)</text>
  <text x="645" y="334" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• references/bevy.md protects Res&lt;T&gt; idioms &amp; catches B0001 / .single() panics</text>

  <rect x="631" y="364" width="513" height="78" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="645" y="384" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">3. Violation-Verified Clippy Suite (lints/check &amp; check-lints.sh)</text>
  <text x="645" y="404" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">• Blocks unwrap(), undocumented unsafe, bool args, lossy as casts &amp; bare allow</text>
  <text x="645" y="422" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• lints/check crate proves every configured lint fires on current stable clippy</text>

