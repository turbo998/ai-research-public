  <rect x="56" y="188" width="513" height="78" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="208" fill="#C084FC" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">1. Composable End-to-End PR Pipelines: full-send &amp; full-stop</text>
  <text x="70" y="228" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">• Chains sol-loop -&gt; file-pr (problem-first) -&gt; babysit-pr (pr-wait CI/bots)</text>
  <text x="70" y="246" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• full-send merges autonomously; full-stop halts when green for human merge</text>

