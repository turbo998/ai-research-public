  <text x="790" y="552" fill="#6EE7B7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Path C: devvm (Lima) + tobi/wrapvm (XFCE)</text>
  <text x="790" y="574" fill="#ECFDF5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="800">$700.00 / mo (-87.78% · Save $5,030.00/mo)</text>
