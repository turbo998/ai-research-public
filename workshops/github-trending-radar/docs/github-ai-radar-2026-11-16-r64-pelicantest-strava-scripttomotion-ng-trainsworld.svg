  <text x="82" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• `strava-home-runs`：免 API Key 读取 GPX/TCX/FIT 轨迹，结合 OpenStreetMap 与 AWS 地形瓦片在 Blender 5.0+ 中渲染数百次跑步同时出发的 3D 发光热力图与完赛直方图</text>
  <text x="82" y="468" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• `script-to-motion`：输入剧本与 Fish Audio 音色，自动对齐字词发音与破碎/流体/霓虹动态排版，一键 `render.py` 导出 4K `.mp4`</text>
