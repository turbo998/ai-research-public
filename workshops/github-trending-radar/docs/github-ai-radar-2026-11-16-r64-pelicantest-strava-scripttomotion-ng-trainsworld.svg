  <rect x="66" y="220" width="598" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="82" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">orbitoo/pelican-test：《鹈鹕测试》2:17 (137.0s @ 60fps) 确定性纯函数动画短片</text>
  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 零外部位图、零录音采样：双骨骼解析逆运动学 (2-Bone Analytical IK) 骑车鹈鹕穿越 **20 道艺术史画框**</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 确定性纯函数 `renderAt(t)` (`p5.js + p5.brush`)：从撒哈拉岩画、汉画像石、宋代斧劈皴、清明上河图到 36 阶复数傅立叶本轮</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• `OfflineAudioContext` 原生合成 20 种时代调式（含 `#18 蒸汽波` 升调合成再 `0.7937×` 磁带降速抖晃链路）</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 完美示范如何用无状态 `renderAt(t)` 实现任意时间点跳转与逐帧无损离线导出</text>

