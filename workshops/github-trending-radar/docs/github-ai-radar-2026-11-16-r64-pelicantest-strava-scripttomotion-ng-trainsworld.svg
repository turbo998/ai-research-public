  <text x="744" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">Shougo/ng (Neovim in Go)：传奇插件作者打造的“比终端更快、绝不碎字”的 Neovim 窗口</text>
  <text x="744" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 为什么终端跑 Neovim 常有 CJK 双宽字符残影？终端需要把网格编码成 ANSI 转义序列再解析重绘</text>
  <text x="744" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 零转义开销、每帧仅 1 次 Draw Call：严格在单元格内绘制双宽/输入法候选字，无花哨动画，僅在画面完整时提交</text>
  <text x="744" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 进程解耦崩溃不丢稿：Neovim 独立进程运行，哪怕 GUI 意外退出，一行 `ng --server` 即刻原样重连！</text>
  <text x="744" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 砍掉一切冗余私有 GUI 控件，100% 忠实呈现 Neovim 原生网格</text>

