  <rect x="44" y="152" width="642" height="390" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="182" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">🎬 1. orbitoo/pelican-test (★41) + strava-home-runs (★43) &amp; script-to-motion (★45)</text>
