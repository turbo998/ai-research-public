  <text x="744" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• `BatteryDock`：用原生 Rust 在 Windows 10/11 任务栏嵌入无线耳机/鼠标/键盘/手柄电量胶囊，彻底卸载臃肿厂商驱动全家桶</text>
  <text x="744" y="458" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• `trainsworld`：在浏览器 MapLibre 全球地图上铺设铁路，底层用 **Rust 编译为 WebAssembly** 实时计算全球城市客流需求与公铁分流</text>
