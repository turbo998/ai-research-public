  <text x="68" y="838" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 浏览器端大规模交通/网络仿真应参考 `trainsworld`，用 MapLibre 负责矢量瓦片渲染、用 Rust-to-Wasm 负责高密度客流计算。</text>
