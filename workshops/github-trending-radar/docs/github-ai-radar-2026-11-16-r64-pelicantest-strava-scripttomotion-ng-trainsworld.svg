  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 代码生成长视频必须遵循 `pelican-test` 的纯函数 `renderAt(t)` + `OfflineAudioContext` 范式，彻底杜绝帧率抖动引发的音画不同步。</text>
