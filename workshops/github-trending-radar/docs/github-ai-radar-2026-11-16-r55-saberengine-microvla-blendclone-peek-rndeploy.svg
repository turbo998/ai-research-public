  <text x="68" y="76" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">PROACTIVE DURABLE NEWS AGENT · 2026-11-16 NIGHT SHIFT ROUND 55 (CUMULATIVE R412) · CLAIM-20261116-R55-SABERENGINE-MICROVLA-BLENDCLONE-PEEK</text>
  <text x="68" y="108" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21.5" font-weight="bold">AMD R9700 618 tok/s 引擎 (Saber) + 4GB 显卡跑 pi0.5 (microVLA) + 免 Mac 开发 iOS</text>
  <text x="68" y="128" fill="#94A3B8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">RDNA4 MXFP4 + DFlash2 投机解码 262K 上下文 + 4GB RTX 3050 训/跑 VLA + 视频转 .blend 与 Linux 直刷 iPhone · 净省 $5,780.00/月 (-93.68%)</text>

  <!-- Left Column: GGZ14/saber-engine + KhushiJ2911/microVLA -->
  <rect x="44" y="152" width="642" height="390" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="182" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">🚀 1. GGZ14/saber-engine (★69) + KhushiJ2911/microVLA (★19)</text>
  <text x="66" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">AMD RDNA4 跑 Qwen3.8-27B 飙至 618 tok/s + 4GB 笔记本显卡跑 3B pi0.5</text>

  <rect x="66" y="220" width="598" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="82" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">GGZ14/saber-engine：专为 AMD Radeon AI PRO R9700 (gfx1201) 打造的 Rust 引擎</text>
  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 告别 ROCm 环境变量迷宫：算子以预编译 HIP Code Objects + 清单分发，由单一确定性执行计划接管全部调度</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• MACaQ MXFP4 + DFlash2 投机草稿：双卡 TP=2 跑 Qwen3.8-27B 单流 **215 tok/s**、8 并发 **618 tok/s**！</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 210W 功耗墙极致能效：TTFT p50 仅 **47 ms**、预填充 **~5,000 tok/s**、支持 **262,144** 上下文与单卡 TP=1 模式</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 兼容 rootless Podman 与 Docker，同二进制支持 Qwen3.8 Flash-Next (MoE)</text>

  <rect x="66" y="380" width="598" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="82" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">KhushiJ2911/microVLA：在 4GB 显存 RTX 3050 笔记本上从零训 VLA 并跑通真 3B pi0.5</text>
  <text x="82" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 核显渲染分离妙招：通过 `MUJOCO_EGL_DEVICE_ID` 把 LIBERO 仿真渲染卸载到核显 (Mesa)，把 4GB 独显 100% 留给模型</text>
  <text x="82" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 25 分钟从零训 10M 小模型：在笔记本上跑 8,000 步约 25 分钟即可训出 LIBERO-Spatial 操作策略</text>
  <text x="82" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 4GB 显存跑真 3B `pi0.5`：完整公开每一步显存优化与 4-bit 量化后每 50 步动作块的真实中位耗时对比</text>
  <text x="82" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 彻底打破“具身智能 VLA 模型没有 A100 就不能动手实验”的算力门槛</text>

