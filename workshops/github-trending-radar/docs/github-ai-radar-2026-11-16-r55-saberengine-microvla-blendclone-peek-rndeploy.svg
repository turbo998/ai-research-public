  <text x="744" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 为什么视频生成模型导出的 MP4 没法进工业管线？因为你改不掉里面某一个骨牌的颜色或摄像机角度</text>
  <text x="744" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 声明式编译器闭环：导入参考片段 → AI Planner 解析场景 JSON → 编译为原生 Blender 物体并用 Cycles 渲染</text>
  <text x="744" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 并排保真度对比 + 英文微调：原视频与 Cycles 渲染图同屏比对，口头微调后直接导出标准 `.blend` 源文件</text>
  <text x="744" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 已验证展台转盘、骨牌连锁、霓虹片头与低多边形海岛四大经典场景</text>

  <rect x="728" y="380" width="606" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="744" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">kimikr/peek + react-native-deploy：彻底摆脱 Mac 硬件绑定开发与发布 iOS 应用</text>
  <text x="744" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• `kimikr/peek` (Linux 直刷真机 SwiftUI 预览)：保存文件 **1–2 秒** 后真 iPhone 界面即刻热替换，且原位补丁保留 `@State` 状态！</text>
  <text x="744" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 单文件零依赖 Python 服务 + `xtool` Swift 工具链：免费 Apple ID 即可跑通完整 App/UIKit/SwiftUI 与 `peek shot` 截屏</text>
  <text x="744" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• `react-native-deploy` (`rnd`)：完全兼容 `eas.json`，在你自己的 GitHub Actions (`macos-26`) 上免费打包并直推 TestFlight</text>
  <text x="744" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 从日常 1.3s 增量真机预览 (peek) 到生产级 CI 签名发版 (rnd) 全程免买 Mac</text>

