  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 双张 AMD R9700 通过 Saber 的 MACaQ MXFP4 与 DFlash2 投机解码，可在 210W/卡下跑出 618 tok/s 与 47ms TTFT。</text>
  <text x="68" y="814" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 将 MuJoCo EGL 渲染卸载至核显并对 3B pi0.5 施以 4-bit 量化，4GB 入门笔记本也能玩转具身 VLA (microVLA)。</text>
