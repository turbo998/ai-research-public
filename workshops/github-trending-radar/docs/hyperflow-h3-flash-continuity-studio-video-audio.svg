  <text x="70" y="208" fill="#FB7185" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">1. Two-Time (t, r) Embedder &amp; CFG-Free 4–8 Step Schedule (CFG = 1)</text>
