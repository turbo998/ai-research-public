  <text x="68" y="584" fill="#94A3B8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">工作负载：每月提供 2,500 小时浏览器/CPU 端侧语音朗读与视频同传配音 + 蒸馏定制 4 套多语种轻量音色包（时薪 r = $95.00/hr；终端用户设备：not_measured）</text>

  <text x="68" y="620" fill="#F8FAFC" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path A (按字符计费云端 TTS API + 326MB 未蒸馏模型卡死浏览器)</text>
  <rect x="440" y="604" width="523.5" height="22" rx="5" fill="#EF4444"/>
