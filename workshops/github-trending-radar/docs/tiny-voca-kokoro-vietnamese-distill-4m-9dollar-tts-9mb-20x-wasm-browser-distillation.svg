  <text x="68" y="658" fill="#F8FAFC" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path B (自建后端 GPU 语音服务 + 无 parity/qc 门禁手工蒸馏)</text>
  <rect x="440" y="642" width="255" height="22" rx="5" fill="#F59E0B"/>
  <text x="708" y="658" fill="#FDE68A" font-family="Consolas, monospace" font-size="13" font-weight="bold">$2,550.00/mo ($840.00 GPU/compute + 18.0h × $95 = $1,710.00)</text>

  <text x="68" y="696" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path C (tiny-voca 18MB + Kokoro-Lite 9.2MB 浏览器 WASM 方案)</text>
  <rect x="440" y="680" width="41.25" height="22" rx="5" fill="#10B981"/>
  <text x="494" y="696" fill="#6EE7B7" font-family="Consolas, monospace" font-size="13" font-weight="bold">$412.50/mo ($80.00 GPU training + 3.5h × $95 = $332.50) → 净省 $4,822.50/月 (-92.12% / 年省 $57,870.00)</text>

  <line x1="68" y1="720" x2="1332" y2="720" stroke="#334155"/>
  <text x="68" y="748" fill="#38BDF8" font-family="Consolas, monospace" font-size="13" font-weight="bold">🎯 ARCHITECT ROLLOUT DIRECTIVE:</text>
  <text x="68" y="772" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">1. 英文端侧/浏览器 Agent 语音播报直接嵌入 tiny-voca (18MB, 70x CPU 实时)，彻底归零云端按字符计费账单。</text>
  <text x="68" y="796" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">2. 小语种/垂直领域浏览器插件配音直接复用 kokoro-vietnamese-distill 的 parity→gen→qc→stage1/2/3→export 七步配方，压出 &lt;10MB RTF 0.075 模型。</text>
