<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" width="1440" height="920">
  <defs>
    <linearGradient id="bgGradR2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    <linearGradient id="accentR2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="920" fill="url(#bgGradR2)"/>
  <rect x="20" y="20" width="1400" height="880" rx="18" fill="#0F172A" stroke="#1E293B" stroke-width="2"/>

  <!-- Header -->
  <rect x="40" y="38" width="1360" height="86" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <text x="64" y="73" fill="url(#accentR2)" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="800">
    2026-11-11 ROUND 2 · OPENAI/CODEX-SECURITY (v0.9.1) VS AUDIT SKILL VS LEGACY SAST/SCA
  </text>
  <text x="64" y="103" fill="#94A3B8" font-family="Consolas, PingFang SC, monospace" font-size="13">
    Daily Trending DOM #9 (★11,489 · Apache-2.0) | Model: gpt-5.6-sol (xhigh) | AppArmor Container | SARIF + 3rd-Party Scanner Triage
  </text>
  <rect x="1140" y="54" width="238" height="52" rx="10" fill="#0F172A" stroke="#34D399" stroke-width="1.5"/>
  <text x="1259" y="76" text-anchor="middle" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="700">8 SKILLS + CLI / TS SDK</text>
  <text x="1259" y="96" text-anchor="middle" fill="#38BDF8" font-family="Consolas, monospace" font-size="12" font-weight="700">-85.96% APPSEC COST</text>

  <!-- Row 1: 3-Way Paradigm Comparison -->
  <rect x="40" y="142" width="440" height="260" rx="14" fill="#111827" stroke="#EF4444" stroke-width="1.5"/>
  <text x="60" y="172" fill="#F87171" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15.5" font-weight="800">
    1. 传统静态 SAST / SCA (Semgrep / Snyk / CxSAST)
  </text>
  <text x="60" y="202" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 优势：毫秒级正则/AST 语法树匹配，确定性高、0 Token 费</text>
  <text x="60" y="228" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 痛点 1：误报泛滥（测试桩/不可达死代码全告警，80%+ 假阳性）</text>
  <text x="60" y="254" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 痛点 2：看不懂跨文件业务逻辑越权（IDOR / 多步状态机绕过）</text>
  <text x="60" y="280" fill="#FCA5A5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 痛点 3：只管报警不管修，安全工程师每月耗费 90h+ 人工甄别</text>
  <rect x="60" y="302" width="400" height="80" rx="8" fill="#1E293B"/>
  <text x="74" y="328" fill="#F8FAFC" font-family="Consolas, PingFang SC, monospace" font-size="11.8" font-weight="700">定位：必须保留为第 1 层低成本初筛漏斗，</text>
  <text x="74" y="350" fill="#94A3B8" font-family="Consolas, PingFang SC, monospace" font-size="11.5">输出报告交由 codex-security cs validate 自动去伪存真！</text>

  <rect x="500" y="142" width="440" height="260" rx="14" fill="#111827" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="520" y="172" fill="#FBBF24" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15.5" font-weight="800">
    2. 纯交互式审计 Skill (cloudflare/security-audit-skill)
  </text>
  <text x="520" y="202" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 优势：零外部 CLI 依赖，6 阶段覆盖账本 + 独立反证子智能体</text>
  <text x="520" y="228" fill="#FDE68A" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 优势：在本地 Claude Code / Cursor 聊天框内即装即用</text>
  <text x="520" y="254" fill="#FCD34D" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 局限 1：缺乏标准化 CI GitHub Action、SARIF 导出与费用硬顶</text>
  <text x="520" y="280" fill="#FCD34D" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 局限 2：无法直接解析 Snyk/Checkmarx/BlackDuck 外部扫描报告</text>
  <rect x="520" y="302" width="400" height="80" rx="8" fill="#1E293B"/>
  <text x="534" y="328" fill="#F8FAFC" font-family="Consolas, PingFang SC, monospace" font-size="11.8" font-weight="700">定位：适合架构师本地交互式代码深潜，</text>
  <text x="534" y="350" fill="#94A3B8" font-family="Consolas, PingFang SC, monospace" font-size="11.5">不适合跨 20+ 仓库的无人值守 CI 门禁与第三方扫描器汇聚。</text>

  <rect x="960" y="142" width="440" height="260" rx="14" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="980" y="172" fill="#34D399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="15.5" font-weight="800">
    3. OpenAI 官方闭环平台 (openai/codex-security v0.9.1)
  </text>
  <text x="980" y="202" fill="#A7F3D0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 全栈形态：Codex 内置 8 大 Skill + cs CLI + TS SDK + Action</text>
  <text x="980" y="228" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 扫描深度：--diff PR 增量 / Standard / Deep (长达96h多轮去重)</text>
  <text x="980" y="254" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 外部导入：原生支持 Semgrep/Snyk/Sonar/Checkmarx/Inspector</text>
  <text x="980" y="280" fill="#E2E8F0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12.5">• 闭环验证：cs validate 判真伪 → cs patch 打补丁 → cs verify-fix</text>
  <rect x="980" y="302" width="400" height="80" rx="8" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="994" y="328" fill="#F8FAFC" font-family="Consolas, PingFang SC, monospace" font-size="11.8" font-weight="700">安全沙盒与成本硬顶：AppArmor 容器隔离 + --max-cost</text>
  <text x="994" y="350" fill="#6EE7B7" font-family="Consolas, PingFang SC, monospace" font-size="11.5">支持 OpenAI (gpt-5.6-sol) / OpenRouter / Fireworks / Bedrock</text>

  <!-- Row 2: End-to-End 8-Skill & CLI Closed Loop -->
  <rect x="40" y="420" width="1360" height="210" rx="14" fill="#111827" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="60" y="450" fill="#38BDF8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="800">
    4. @openai/codex-security (npm-v0.9.1) 端到端「扫描 → 复核 → 修补 → 验证 → 策略」闭环流水线
  </text>

  <rect x="60" y="470" width="248" height="138" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="76" y="495" fill="#38BDF8" font-family="Consolas, PingFang SC, monospace" font-size="12.5" font-weight="700">STEP 1: 威胁建模与安全策略</text>
  <text x="76" y="518" fill="#E2E8F0" font-family="Consolas, PingFang SC, monospace" font-size="11.5">cs policy . --path services/api</text>
  <text x="76" y="540" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">结合 architecture.md 在仓外生成</text>
  <text x="76" y="560" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">SECURITY.md 草稿，作为后续扫描</text>
  <text x="76" y="580" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">的业务边界与信任假设基准</text>

  <rect x="328" y="470" width="248" height="138" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="344" y="495" fill="#34D399" font-family="Consolas, PingFang SC, monospace" font-size="12.5" font-weight="700">STEP 2: 分层扫描与外部导入</text>
  <text x="344" y="518" fill="#E2E8F0" font-family="Consolas, PingFang SC, monospace" font-size="11.5">• PR: cs scan . --diff origin/main</text>
  <text x="344" y="540" fill="#E2E8F0" font-family="Consolas, PingFang SC, monospace" font-size="11.5">• 全仓: cs scan . --mode deep</text>
  <text x="344" y="562" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">• 外部导入: publish findings 接入</text>
  <text x="344" y="582" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">  Semgrep/Snyk/Sonar/Checkmarx</text>

  <rect x="596" y="470" width="248" height="138" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="612" y="495" fill="#FBBF24" font-family="Consolas, PingFang SC, monospace" font-size="12.5" font-weight="700">STEP 3: 源码实证去伪存真</text>
  <text x="612" y="518" fill="#E2E8F0" font-family="Consolas, PingFang SC, monospace" font-size="11.5">cs validate findings.json</text>
  <text x="612" y="540" fill="#E2E8F0" font-family="Consolas, PingFang SC, monospace" font-size="11.5">($triage-finding / $resolve-dep)</text>
  <text x="612" y="562" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">对照真实调用链核验外部告警可达性</text>
  <text x="612" y="582" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">输出明确裁决与缺失证据清单</text>

  <rect x="864" y="470" width="248" height="138" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="880" y="495" fill="#A78BFA" font-family="Consolas, PingFang SC, monospace" font-size="12.5" font-weight="700">STEP 4: 自动修补与独立验证</text>
  <text x="880" y="518" fill="#E2E8F0" font-family="Consolas, PingFang SC, monospace" font-size="11.5">• cs patch --scan SCAN_ID</text>
  <text x="880" y="540" fill="#E2E8F0" font-family="Consolas, PingFang SC, monospace" font-size="11.5">• cs verify-fix --scan SCAN_ID</text>
  <text x="880" y="562" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">针对已确认漏洞自动生成补丁，并</text>
  <text x="880" y="582" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">独立验证修复是否彻底且未引入回归</text>

  <rect x="1132" y="470" width="248" height="138" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="1148" y="495" fill="#F472B6" font-family="Consolas, PingFang SC, monospace" font-size="12.5" font-weight="700">STEP 5: SARIF 门禁与工单流转</text>
  <text x="1148" y="518" fill="#E2E8F0" font-family="Consolas, PingFang SC, monospace" font-size="11.5">fail-on-severity: high</text>
  <text x="1148" y="540" fill="#E2E8F0" font-family="Consolas, PingFang SC, monospace" font-size="11.5">($track-findings → Linear/Jira)</text>
  <text x="1148" y="562" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">基于 Git 历史自动推荐责任人</text>
  <text x="1148" y="582" fill="#94A3B8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">导出标准 SARIF/JSON/CSV 报告</text>

  <!-- Row 3: FinOps Worked Example -->
  <rect x="40" y="648" width="1360" height="232" rx="14" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="60" y="678" fill="#34D399" font-family="Segoe UI, PingFang SC, sans-serif" font-size="16" font-weight="800">
    5. 闭式 FinOps 算例：20 微服务团队 (400 PR/月 + 300 条 SAST 告警/月, synthetic, 商业 SAST 许可与 CI 机器费: not_measured)
  </text>
  <rect x="60" y="694" width="1320" height="166" rx="10" fill="#1E293B"/>
  <text x="80" y="724" fill="#FCA5A5" font-family="Consolas, PingFang SC, monospace" font-size="12.5" font-weight="700">
    • Path A (纯传统 SAST/SCA + 人工甄别修补): $0.00 API + 60.0h 告警甄别 ($4,500.00) + 30.0h 手工打补丁 ($2,250.00) = $6,750.00/月 (90.0h)
  </text>
  <text x="80" y="758" fill="#FDE68A" font-family="Consolas, PingFang SC, monospace" font-size="12.5" font-weight="700">
    • Path B (纯聊天框单次安全 Skill 交互审仓): $180.00 API + 44.0h 人工核对与手工修补 ($3,300.00 @ $75/h) = $3,480.00/月 (44.0h)
  </text>
  <text x="80" y="792" fill="#6EE7B7" font-family="Consolas, PingFang SC, monospace" font-size="12.5" font-weight="700">
    • Path C (openai/codex-security 混合流水线): $72.00 (400 PR diff) + $90.00 (20 Deep) + $36.00 (300 validate/patch) = $198.00 API
  </text>
  <text x="80" y="822" fill="#A7F3D0" font-family="Consolas, PingFang SC, monospace" font-size="13" font-weight="800">
    → Path C 总成本: $198.00 API + $750.00 (10.0h 终审) = $948.00/月 | 净省 $5,802.00/月 (-85.96%, 年省 $69,624.00) &amp; 省 80.0h/月 (-88.89%)
  </text>
  <text x="80" y="848" fill="#94A3B8" font-family="Consolas, PingFang SC, monospace" font-size="11.5">
    容器隔离硬护栏: docker compose -f compose.yaml -f compose.apparmor.yaml (apparmor=codex-security-container) + --max-cost 预算熔断
  </text>
</svg>
