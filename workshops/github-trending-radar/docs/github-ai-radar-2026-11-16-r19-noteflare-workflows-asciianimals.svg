  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 逐行智能合并：两台设备同时改同一篇笔记按行自动合并 (git merge 风格)，仅同行冲突才分叉副本</text>
