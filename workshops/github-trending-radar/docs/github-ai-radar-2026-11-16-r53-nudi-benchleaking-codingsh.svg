  <text x="68" y="108" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="bold">【第 410 轮里程碑】RL 判分器漏洞红队蜂群 (nudi) + 基座模型刷榜泄题审计 + coding.sh</text>
  <text x="68" y="128" fill="#94A3B8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">三级披露度验证 Harbor 奖励黑客 + 20 基准 Anti-Hack 戳破 96.3% HumanEval 原题背诵 + 本地会话一键转评测 · 净省 $5,925.00/月 (-93.60%)</text>

  <!-- Left Column: standardnormal-ai/nudi + GAIR-NLP/Benchleaking -->
  <rect x="44" y="152" width="642" height="390" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="182" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">🕵️ 1. standardnormal-ai/nudi (★67) + GAIR-NLP/Benchleaking (★20)</text>
  <text x="66" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">开训前用 Agent 蜂群揪出 RL 判分器漏洞 + 20 基准实锤基座模型背诵测试集</text>

  <rect x="66" y="220" width="598" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="82" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">standardnormal-ai/nudi (v0.5.0)：Pre-Hacking 三级披露红队 + 自然提交仿真</text>
  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 为什么 RL 训练跑了三天发现模型学会了作弊？因为判分脚本 (Grader) 只抽查 3 张截图或把答案留在了 Git 历史里</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 管理员视角找洞 + 三级攻击者复现：`hack_inspector` 读 Dockerfile/Grader 找漏洞，`attacker` 按全知/微提示/零提示三级验证可利用性</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 自然仿真测误判率 (Simulations)：让普通 Agent 正常做题，统计判分器在实际提交上的假阳性与漏判率</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 原生支持 Harbor 格式环境与 Modal 云端并发沙盒</text>

  <rect x="66" y="380" width="598" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="82" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">GAIR-NLP/Benchleaking：严格区分 Benchmaxxing 与 Benchleaking (测试集泄题)</text>
  <text x="82" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 触目惊心的实锤证据：给定 HumanEval/66，某基座模型竟顺着默写出未输入的 67–70 题及源码拼写错误 `examble`！</text>
  <text x="82" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 20 大基准 × 4 大公开基座审计：检出某模型复现 **96.3% HumanEval** 与 **85.4% OpenBookQA**；改题后后训练模型暴跌 13.3–15.8 分</text>
  <text x="82" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• Anti-Hack 净分重排座次：将检出泄题样本记 0 分且分母不变，榜首模型狂掉 **16.6 分** 跌至垫底，DeepSeek-V4 仅掉 1.5 分</text>
  <text x="82" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 架构师选型开源基座模型前必跑的“去水份真金白银检验器”</text>

