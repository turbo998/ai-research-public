  <text x="68" y="766" fill="#38BDF8" font-family="Consolas, monospace" font-size="13.5" font-weight="bold">🎯 ARCHITECTURAL TAKEAWAYS FOR MILESTONE R410 (RL GRADER RED-TEAMING, ANTI-HACK SCORES &amp; LOCAL EVALS):</text>
  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 启动大规模强化学习前，必须用 nudi 按“全知/微提示/零提示”三级攻击者沙盒测试判分器是否存在捷径漏洞。</text>
  <text x="68" y="814" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 选型开源基座必须跑 Benchleaking 连续题号/拼写错误续写探针，用扣除泄题分的 Anti-Hack 净分替代原始榜单分。</text>
  <text x="68" y="838" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 用 npx coding.sh 在本机自动录制 Claude/Codex 会话与缓存成本，将真实失败案例直接转化为回归评测集。</text>
