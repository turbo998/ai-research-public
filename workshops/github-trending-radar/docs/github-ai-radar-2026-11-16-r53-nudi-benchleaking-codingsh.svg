  <text x="728" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">一行 npx coding.sh 追踪本机所有 Agent 动作并把翻车会话一键变成评测集</text>

  <rect x="728" y="220" width="606" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="744" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">0.2 秒导入历史会话 + 全链路记录 Prompt / 工具 / 改文件 / 缓存率与账单</text>
  <text x="744" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 为什么 Agent 写坏了代码很难复现？因为子智能体调用、网关耗时、缓存命中率和文件修改散落在不同日志里</text>
  <text x="744" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 一键自动挂载（先备份配置）：自动发现 Claude Code、Codex CLI、Cursor 与 T3 Code，0.2s 导入过往会话</text>
  <text x="744" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 精细成本与缓存看板：`npx coding.sh usage --by model` 直接按模型汇总会话数、轮次、缓存读取率与预估花费</text>
  <text x="744" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 100% 本地运行（MIT 免费、零账号、数据绝不出本机）</text>

  <rect x="728" y="380" width="606" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="744" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">从“线上翻车现场”直接点击生成可回归的 Eval 测试用例</text>
  <text x="744" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 告别人工手写评测集：在本地 Web 查看器中复盘每一次会话的测试通过徽章（如 `31 passed`）与延迟分位数</text>
  <text x="744" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• Pass / Fail 一键打标转 Eval：对翻车的 Agent 运行直接点 Fail 并转化为本地评测用例，验证新 Prompt 或新模型是否修复</text>
  <text x="744" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 与 `nudi`（训练前查环境漏洞）和 `Benchleaking`（选型前查模型泄题）共同组成完整 AI 评测铁三角！</text>
  <text x="744" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 真正实现 Observability → Failure Attribution → Regression Eval 工程闭环</text>

