  <text x="649" y="396" fill="#F59E0B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Unified Portable EXE for NVIDIA CUDA 12.8 (RTX 50) &amp; AMD ROCm 7.14 (`gfx1201`)</text>
  <text x="649" y="415" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">100% offline execution after on-demand model download (SAM 3D Body &amp; VGGT-Omega via ModelScope)</text>
