  <text x="649" y="333" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Exports skinned FBX with optional frame `-1` T-Pose / A-Pose, MMD VMD (with foot IK), and NPZ</text>
  <text x="649" y="350" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Supports custom PMX &amp; Mixamo/MetaHuman rigs with saved per-character bone offsets</text>

