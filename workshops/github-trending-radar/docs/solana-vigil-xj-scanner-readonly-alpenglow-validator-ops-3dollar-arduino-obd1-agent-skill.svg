  <!-- Vigil Mechanics -->
  <rect x="46" y="258" width="522" height="192" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="60" y="280" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">Why Read-Only By Construction Matters on High-Value Validator Nodes:</text>
  <text x="60" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Zero Supply-Chain or Key-Exfil Risk: Built strictly with Go's standard library (`0` third-party</text>
  <text x="60" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   dependencies); `vigil keys` uses `stat` only to check permissions/age without opening keyfiles.</text>
  <text x="60" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Advisory Leader-Free Restart Planner (`vigil plan-restart`): Finds safe slot windows between</text>
  <text x="60" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   leader duties so kernel/validator upgrades never drop block production or rewards.</text>
  <text x="60" y="385" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Full-Stack Audit: Checks VAT runway, BLS registration, sysctl/NIC/time drift &amp; disk growth slope.</text>
  <text x="60" y="407" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">$ vigil check &amp;&amp; vigil score &amp;&amp; vigil plan-restart &amp;&amp; vigil audit</text>
  <text x="60" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Built-in alert storm suppression (sustained-failure thresholds, deduplication &amp; escalation).</text>

