  <!-- XJ-Scanner Mechanics -->
  <rect x="632" y="258" width="522" height="192" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="646" y="280" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">Bridging Legacy Pre-1996 Embedded ECUs into Modern Coding Agents:</text>
  <text x="60" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" transform="translate(586,0)">1. Pre-OBD-II Hardware Bridge: 1991–95 Chrysler/Jeep SBEC computers use a proprietary 6-pin</text>
  <text x="646" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   serial protocol that modern OBD-II dongles cannot read; a `$3` ATmega328 Arduino Nano bridges it.</text>
  <text x="646" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. ROM-Verified Scaling &amp; Electrical Safety: Settles fuel-trim formulas directly from disassembled</text>
  <text x="646" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   SBEC firmware (`AR1972/jeep_2.5L`) and enforces cavity multimeter checks before wiring.</text>
  <text x="646" y="387" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">$ .venv/bin/python pc/xj_scan.py --cli DEMO   # or --cli auto with key ON</text>
  <text x="646" y="409" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. `.claude/skills/` Playbooks: Step-by-step agent skills for fault codes, live logs &amp; actuator tests.</text>
  <text x="646" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Includes `tools/` to summarize logs, sweep every parameter, and verify ECU part numbers.</text>

