  <text x="68" y="612" fill="#94A3B8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">工作负载：每月处理 400 小时开发者语音听写与播客高光切片 + 训练 15 个端侧轻量语音 Adapter（时薪 r = $100.00/hr；Google Drive 空间订阅：not_measured）</text>

  <!-- Bars -->
  <text x="68" y="646" fill="#F8FAFC" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path A (按人头买云听写/Opus Clip 会员 + 重型 TTS 驻留)</text>
  <rect x="430" y="630" width="562" height="22" rx="5" fill="#EF4444"/>
  <text x="1004" y="646" fill="#FCA5A5" font-family="Consolas, monospace" font-size="13" font-weight="bold">$5,620.00/mo ($1,820.00 SaaS/API spend + 38.0h × $100 = $3,800.00)</text>

  <text x="68" y="682" fill="#F8FAFC" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path B (抢焦点脚本弄丢剪贴板 + 按固定秒数硬切半截单词)</text>
  <rect x="430" y="666" width="261" height="22" rx="5" fill="#F59E0B"/>
  <text x="703" y="682" fill="#FDE68A" font-family="Consolas, monospace" font-size="13" font-weight="bold">$2,610.00/mo ($860.00 spend + 17.5h × $100 = $1,750.00)</text>

  <text x="68" y="718" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path C (Likhari + Hima 62M + Clipper + KimBiseo)</text>
  <rect x="430" y="702" width="37" height="22" rx="5" fill="#10B981"/>
  <text x="479" y="718" fill="#6EE7B7" font-family="Consolas, monospace" font-size="13" font-weight="bold">$370.00/mo ($70.00 compute + 3.0h × $100 = $300.00) → 净省 $5,250.00/月 (-93.42% / 年省 $63,000.00)</text>

  <line x1="68" y1="740" x2="1332" y2="740" stroke="#334155"/>
  <text x="68" y="766" fill="#38BDF8" font-family="Consolas, monospace" font-size="13.5" font-weight="bold">🎯 ARCHITECTURAL TAKEAWAYS FOR LOCAL VOICE DICTATION, 62M ADAPTER TTS &amp; PODCAST CLIPPING:</text>
  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 全局语音输入工具必须在 OS 窗口层开启非激活标志 (WS_EX_NOACTIVATE / PyObjC) 并原样保存恢复用户剪贴板 (Likhari)。</text>
  <text x="68" y="814" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 端侧小语种 TTS 无需全量微调：在 62M 基座上用单张免费 T4 训练 5M 参数 Adapter 即可跑在手机与笔记本 CPU 上。</text>
  <text x="68" y="838" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 自动播客切片必须以 MLX/faster-whisper 词级边界驱动 FFmpeg 切割并直出团队可发帖的 Google Doc (clipper-skill)。</text>
