  <text x="646" y="301" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. `patty_start`: Maps repository &amp; builds `EVIDENCE.md` with exact `file:line` citations.</text>
  <text x="646" y="321" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">2. `patty_prior_art`: Searches/fetches full text from USPTO, EPO, Google Patents, arXiv &amp; GitHub.</text>
  <text x="646" y="341" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. `PRIOR_ART_CHART.md` / `CLAIM_CHART.md`: Maps every claim element (`yes`/`partly`/`no`) w/ quotes.</text>
  <text x="646" y="361" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">4. `patty_check` → `patty_build`: Blocks PDF/cover-sheet build until every cited line of code,</text>
  <text x="646" y="380" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   stored quote, reference numeral &amp; non-limiting language check passes 100%.</text>
  <text x="646" y="403" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">$ claude mcp add patty -- bunx github:ckaico/patty#v0.6.0</text>
  <text x="646" y="425" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Zero third-party accounts owned by Patty; all keys stay in local `~/.patty/`.</text>

