  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 零裂缝局部自适应：同一模型近端精细、远端粗糙且边界严丝合缝 (内置 three-nanite verify 验缝)</text>
