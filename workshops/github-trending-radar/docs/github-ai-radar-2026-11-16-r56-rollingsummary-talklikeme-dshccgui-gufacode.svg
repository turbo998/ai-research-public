  <text x="68" y="128" fill="#94A3B8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">20–40 条滞回窗口与 BP1–BP4 缓存断点重合 + 5400 条聊天 MLX 受控实验 + DSH 挂载 6 大 CLI 与三栏 Monaco IDE · 净省 $5,445.00/月 (-93.40%)</text>

  <!-- Left Column: Lentlily22/rolling-summary-tutorial + Fedeparg/talk-like-me -->
  <rect x="44" y="152" width="642" height="390" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="182" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">🧠 1. Lentlily22/rolling-summary-tutorial (★46) + Fedeparg/talk-like-me (★47)</text>
  <text x="66" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">每 20 条才失效一次 Prompt Cache 的滚动摘要法 + 严谨对照组检验 0.5B 微调</text>

  <rect x="66" y="220" width="598" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="82" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">Lentlily22/rolling-summary-tutorial：滞回裁剪 + 2条缝份 + BP1–BP4 缓存重合</text>
  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 为什么固定 30 条滑动窗口会破产？满 30 条后每发一句，第 1 条消息就滑走，导致每轮 Prompt Cache 全部失效！</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 20–40 条滞回裁剪 (Hysteresis)：攒满 40 条一次性裁掉前 20 条，让首条锚点在整整 20 条内纹丝不动吃满缓存</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 裁缝式“2 条缝份”摘要：将上一批最后 2 条 + 新裁下的 20 条喂给模型更新滚动摘要，BP3(摘要)与 BP4(历史)同步刷新</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 附带 MIT 可直接运行的参考实现与前端摘要可见/重 Roll/编辑最佳实践</text>

  <rect x="66" y="380" width="598" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="82" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">Fedeparg/talk-like-me：0.5B 模型真能学会“像我一样发微信/WhatsApp”吗？</text>
  <text x="82" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 拒绝自嗨式主观体感：在 MacBook MLX 上用 5,400 条个人回复微调 Qwen2.5-0.5B，每次运行前先写下预测并设对照组</text>
  <text x="82" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 实测学到了个人风格而非仅口语：在本人回复上困惑度比同群朋友回复多降 **19.8 个百分点** (CI 8.9–26.0)，分类器识别率达 78%</text>
  <text x="82" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 诚实揭露评估陷阱与框架 Bug：证明语义相似度指标偏爱“万金油套话”，并顺手抓出和量化了 `mlx-lm` 的一处 Loss Bug</text>
  <text x="82" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 个人数字分身微调与小模型实验设计的教科书级范本</text>

