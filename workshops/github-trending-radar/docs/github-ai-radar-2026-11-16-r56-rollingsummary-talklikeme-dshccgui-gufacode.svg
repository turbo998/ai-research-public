  <text x="744" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 右栏原样停靠官方 DSH 会话：点击对话里的文件引用 Chip 直接跳到中栏编辑器对应行，所改所跑尽在眼前</text>
  <text x="744" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 同时支持 DSH 桌面端与浏览器 `dsh web`，随时一键切换工作区或返回经典对话模式</text>
  <text x="744" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 一行 `dsh plugin add dsh-gufa-code` 补齐纯聊天界面缺乏代码精修视图的短板</text>

