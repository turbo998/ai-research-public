  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 自建聊天前端切忌逐条滑窗：采用“满 40 裁 20”滞回窗口 + 2 条缝份，可让摘要更新与 Prompt Cache 重建完美同步。</text>
