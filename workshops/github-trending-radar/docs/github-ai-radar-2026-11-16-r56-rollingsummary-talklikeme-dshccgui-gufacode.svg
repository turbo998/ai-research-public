  <text x="744" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 告别六个终端窗口来回切：在 DSH 输入框旁直接点选 Claude Code、Kimi CLI、Codex CLI、PI CLI、OMP 或 OpenCode</text>
  <text x="744" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 复用 DSH 原生交互壳：所有外部 CLI 的工具调用、人工审批弹窗与文件改动摘要全部走 DSH 原生可视化界面</text>
  <text x="744" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 清晰说明进程加载边界：提醒安装后执行完整重启 (`Cmd+Q`) 防止新旧代码混入同一进程</text>
