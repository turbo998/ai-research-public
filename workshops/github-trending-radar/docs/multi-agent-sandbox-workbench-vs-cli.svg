  <text x="139" y="56" fill="#67E8F9" font-family="Segoe UI, Inter, sans-serif" font-size="11" font-weight="700" text-anchor="middle">ROUND 4 · SELECTION FAQ</text>
  <text x="242" y="57" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="20" font-weight="800">Multi-Agent VM Workbench vs. Headless Event Autoloop vs. Raw CLI</text>
  <text x="52" y="88" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="13">milind-soni/OpenMausBot (+1,437★ today [measured])  ×  KKKKhazix/agent-autoloop (4,072★/5d · ~814★/d lifecycle avg [measured] · stars_today: not_measured)</text>

  <!-- Column 1: Raw Foreground CLI -->
  <rect x="36" y="126" width="356" height="370" rx="14" fill="#1E293B" fill-opacity="0.65" stroke="#475569" stroke-width="1.5"/>
  <rect x="54" y="144" width="320" height="34" rx="8" fill="#334155"/>
  <text x="214" y="166" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="700" text-anchor="middle">PATH A · Raw Foreground CLI (claude / codex)</text>

  <text x="56" y="204" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="700">1. Human-Babysat Terminal Loop</text>
  <text x="56" y="225" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• Best for 1-on-1 single-repo interactive coding</text>
  <text x="56" y="245" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• Blocks stdin on every confirmation prompt</text>
  <text x="56" y="265" fill="#CBD5E1" font-family="Segoe UI, Inter, sans-serif" font-size="12">• Closing window or SSH drop loses execution state</text>

  <rect x="56" y="286" width="316" height="92" rx="10" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <text x="70" y="308" fill="#F87171" font-family="Consolas, monospace" font-size="12" font-weight="700">⚠ Scaling Bottlenecks at 5+ Tasks:</text>
  <text x="70" y="328" fill="#94A3B8" font-family="Consolas, monospace" font-size="11">• ~150-350 MB RAM per hanging terminal</text>
  <text x="70" y="346" fill="#94A3B8" font-family="Consolas, monospace" font-size="11">• No isolated VM desktop for GUI/Browser</text>
  <text x="70" y="364" fill="#94A3B8" font-family="Consolas, monospace" font-size="11">• Vulnerable to webhook prompt injection</text>

  <rect x="56" y="394" width="316" height="84" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="70" y="416" fill="#38BDF8" font-family="Segoe UI, Inter, sans-serif" font-size="12" font-weight="700">When to Choose Path A:</text>
  <text x="70" y="436" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="12">Single developer at keyboard fixing bugs or</text>
  <text x="70" y="454" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="12">iterating on a local branch in real time.</text>

  <!-- Column 2: OpenMausBot VM Workbench -->
  <rect x="422" y="126" width="356" height="370" rx="14" fill="#0F172A" stroke="#06B6D4" stroke-width="2"/>
  <rect x="440" y="144" width="320" height="34" rx="8" fill="url(#accCyan)"/>
  <text x="600" y="166" fill="#082F49" font-family="Segoe UI, Inter, sans-serif" font-size="14" font-weight="800" text-anchor="middle">PATH B · OpenMausBot (Multi-Agent VM App)</text>

