  <text x="635" y="192" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• DOM-Native Trading &amp; SSR SVG Dashboard Charts: &lt;FnChart /&gt; runs in page DOM</text>
  <text x="635" y="212" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  (not an iframe), inheriting design tokens, drag-to-modify orders &amp; Datafeed</text>
  <text x="635" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Market-Aware Localization (KRX vs Global): Automatic KST/KRX sessions, tick</text>
  <text x="635" y="256" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  sizes, and red-up/blue-down vs green-up/red-down polarity</text>
  <text x="635" y="280" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• First-Class CLI &amp; MCP (@funnest/charts-cli &amp; @funnest/charts-mcp): Validate</text>
  <text x="635" y="300" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  JSON specs and deterministically emit SVG, PNG, HTML, or React code</text>
