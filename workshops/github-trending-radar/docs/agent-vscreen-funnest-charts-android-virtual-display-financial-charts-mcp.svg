  <text x="76" y="366" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">-&gt; Merge A11y Tree + Per-Char OCR into #N Targets + [Meanwhile]</text>
  <text x="76" y="388" fill="#93C5FD" font-family="Consolas, monospace" font-size="12">-&gt; until / --watch / --keep notify|wake + Turn-Based Game Pause</text>
  <text x="76" y="410" fill="#FDE68A" font-family="Consolas, monospace" font-size="12">-&gt; CONFIRM_REQUIRED on payment/delete + 1s long-press takeover</text>

