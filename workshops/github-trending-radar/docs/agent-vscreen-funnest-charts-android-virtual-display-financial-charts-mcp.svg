  <text x="60" y="168" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">1. kilolonion/agent-vscreen (61★ · MIT · Android 11+ Shizuku)</text>
  <text x="60" y="192" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Invisible Virtual Display + Floating Takeover PiP: Drives apps in background</text>
  <text x="60" y="212" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  via vscreen CLI / MCP / HTTP (Minis, Eta, RikkaHub, Muse); 1s press takeover</text>
  <text x="60" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Time-Aware [Meanwhile] Ledger: Samples screen 5x/sec + offline PP-OCRv6 1x/sec</text>
  <text x="60" y="256" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  so transient pop-ups/countdowns during LLM thinking are never missed</text>
  <text x="60" y="280" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Zero ADB Conflict &amp; CONFIRM_REQUIRED Gate: Uses Shizuku only (leaves adbd</text>
