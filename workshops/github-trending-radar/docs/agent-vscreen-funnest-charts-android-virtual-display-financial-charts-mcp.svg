  <text x="651" y="344" fill="#C4B5FD" font-family="Consolas, monospace" font-size="12">claude mcp add funnest-charts -- npx -y @funnest/charts-mcp</text>
  <text x="651" y="366" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">-&gt; npx @funnest/charts-cli render spec.json --out chart.png</text>
  <text x="651" y="388" fill="#7DD3FC" font-family="Consolas, monospace" font-size="12">-&gt; &lt;FnChart datafeed={myDatafeed} symbol="005930" resolution="1D"/&gt;</text>
  <text x="651" y="410" fill="#A7F3D0" font-family="Consolas, monospace" font-size="12">-&gt; SSR-safe SVG Line/Candlestick/Donut/Treemap/CartesianChart</text>

