  <rect x="635" y="292" width="491" height="72" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="649" y="314" fill="#38BDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Named "Dot" Identities, Governed Group Chats &amp; Idempotent Reconnect</text>
  <text x="649" y="333" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Configure each Dot's prompt, model, thinking level, Skills, MCPs &amp; Host/non-root Docker Runner</text>
  <text x="649" y="350" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Reconnecting/refreshing reads state without re-submitting tasks; explicit `SKYDOT_BOT_HANDOFFS`</text>

  <rect x="635" y="374" width="491" height="78" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="649" y="396" fill="#A855F7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Evidence-Linked Goals, Versioned Plugin Snapshots &amp; Feishu/Telegram</text>
  <text x="649" y="415" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Goals bind formal sessions, approvals &amp; execution evidence rather than passive todo cards</text>
  <text x="649" y="434" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Unified Web/PWA/Electron UI with Langfuse + OpenTelemetry observability &amp; Feishu connectors</text>

