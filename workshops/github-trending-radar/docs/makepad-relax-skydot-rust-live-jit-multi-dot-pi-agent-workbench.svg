  <text x="88" y="434" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">`relax inspect &lt;pid&gt; memory/code` monitors JIT cache growth across Linux x86-64 &amp; macOS arm64</text>

