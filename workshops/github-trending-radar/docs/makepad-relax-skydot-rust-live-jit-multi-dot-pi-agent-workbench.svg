  <text x="88" y="257" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Compiles each function on first call with no `rustc`, LLVM, or linker in the loop</text>
  <text x="88" y="274" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Small app starts in 3.7s cold / 0.41s warm on M4 MacBook; 92 tests re-run in 2.2s on save</text>

