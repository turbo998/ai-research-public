  <text x="74" y="202" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600">Live Rust Compiler &amp; JIT Runtime (Runs Cargo Packages While Building)</text>

