  <!-- Smolmaxxing Mechanics -->
  <rect x="46" y="262" width="522" height="188" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="60" y="284" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">4 Low-Level `llama.cpp` Patches (`EXPERIMENT.md` · 165 On-Device Runs):</text>
  <text x="60" y="307" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Chip-Specific SIMD Kernels: 1-bit LUT NEON kernel + repacked 2-bit/ternary formats for</text>
  <text x="60" y="326" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   in-order Cortex-A55 and dot-product-free Apple A7 cores.</text>
  <text x="60" y="348" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Flash Expert Pager w/ Next-Layer Prefetch: Pins hot MoE experts in RAM, pages cold experts</text>
  <text x="60" y="367" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   from flash storage on demand, and prefetches the next layer's experts asynchronously.</text>
  <text x="60" y="389" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Vocab Output-Row Pruning &amp; Headless Mode: Drops rare vocab output rows &amp; stops Android</text>
  <text x="60" y="408" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   launcher/GMS services during inference to reclaim ~300 MB of precious RAM.</text>
  <text x="60" y="429" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Includes `zigcc/` static aarch64 cross-compilers &amp; Hugging Face GGUFs (`27.6 GB` 80B-A3B).</text>

