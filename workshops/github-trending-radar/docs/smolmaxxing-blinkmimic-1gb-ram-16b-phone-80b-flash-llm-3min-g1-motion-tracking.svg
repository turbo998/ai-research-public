  <text x="1027" y="242" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">9.5×–25× faster than SuperMimic</text>

  <!-- BlinkMimic Architecture -->
  <rect x="632" y="262" width="522" height="188" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="646" y="284" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">How `BlinkMimic` Cuts 40-Clip LAFAN1 Training from 86 Min to `3.38 Min`:</text>
  <text x="646" y="307" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Semi-Implicit Differentiable World Model (`--wm_structured` &amp; `--wm_mirror 0.5`): Predicts</text>
  <text x="646" y="326" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   velocity increments, integrates positions, skips the 500-iter warm-up &amp; mirrors 50% of batches.</text>
  <text x="646" y="348" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Async Evaluation-Guided Resets (`--eprobe_async`): Every 125 iters from iter 1000, sweeps</text>
  <text x="646" y="367" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   all 40 clips on a side CUDA stream and sends 15% of resets to the 10s before failure points.</text>
  <text x="646" y="389" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Muon Optimizer (`--pi_opt muon --wm_opt muon`) + Halved 2048 Rollout Batch w/ 4×→1× LR</text>
  <text x="646" y="408" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   decay + full CUDA graphs for collection, masked resets &amp; background thread checkpointing.</text>
  <text x="646" y="429" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Tracks `fallAndGetUp1_subject1` cleanly at 3.1 min where SuperMimic &amp; InstantTrack v1.2 fall.</text>

