  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 三位一体品牌动效栈：① 零依赖引擎 `@usefluid/motion`（闭式弹簧 + **Metamorph 任意双形状/Logo 轮廓变形**）</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• ② CLI 源码级拷贝组件 (`Pieces`)：开场动画、流动胶囊控件、吉祥物角色、模糊浮现文字与卡片生长弹窗</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• ③ 配套 Agent Skills：教会 Coding Agent 自动注入你的品牌 Logo/色板/字体，并将交互录制成高清视频</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 无需沉重的 Lottie JSON 即可在 React 中实现丝滑的轮廓物理形变</text>

