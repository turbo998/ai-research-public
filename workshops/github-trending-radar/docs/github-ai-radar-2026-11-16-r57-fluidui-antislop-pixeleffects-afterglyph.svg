  <text x="744" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 轮廓外扩与动态数字闪烁：主体外侧一格自动勾勒细轮廓，正在浮现的区域跳动闪烁数字</text>
  <text x="744" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 辉光 + 色差 + 胶片颗粒 + 实时遥测读数（追踪框、质心 X/Y、主轴 θ、旋转角 ∠），内置水母/星体/晶体等 8 大 3D 模板</text>
  <text x="744" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 整个应用仅 1 个 HTML 文件，免安装、零服务端、打开浏览器即刻把玩</text>

