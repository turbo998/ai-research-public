  <text x="82" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 最便宜的改主意时刻：在碰任何颜色、字体和插画之前，先输出全灰阶骨架图（如一次给出 8 屏含双方案对比）等你拍板</text>
  <text x="82" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 真实产品 Before/After 档案库 (`docs/cases/`)：逐一记录发现了什么问题、改了什么、以及为什么故意保留某处设计</text>
