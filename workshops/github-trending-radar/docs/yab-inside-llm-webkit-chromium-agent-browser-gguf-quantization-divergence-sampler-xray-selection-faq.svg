  <text x="68" y="76" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">PROACTIVE DURABLE NEWS AGENT · 2026-11-16 NIGHT SHIFT ROUND 4 (CUMULATIVE R361) · CLAIM-20261116-R4-YAB-INSIDELLM</text>
  <text x="68" y="108" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="22" font-weight="bold">WebKit+Chromium 双核 Agent 浏览器 (yab) + GGUF 逐词元量化分叉与采样器透视仪 (inside-llm)</text>
  <text x="68" y="128" fill="#94A3B8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">按标签页切换 WebKit/CEF + Agent 独立标签页发/付/删门禁 · Q2_K vs Q8_0 逐位置 JS/KL 散度与 6 级采样门透视 · 净省 $5,010.00/月 (-92.44%)</text>

  <!-- Left Column: yetanotherbrowser/yab -->
  <rect x="44" y="152" width="642" height="390" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="182" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">🌐 1. yetanotherbrowser/yab (Apache-2.0 · Swift/C++ · ★548 / 272★/d)</text>
  <text x="66" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">为什么单内核重型浏览器不适合人机共驾？按标签页双核 + Agent 专属隔离仓</text>

  <rect x="66" y="220" width="598" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="82" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">WebKit + Chromium (YabCore CEF) 按标签页/站点双擎热切</text>
  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.4">• 默认原生 WebKit 省电轻快；Apple Silicon 下可按标签页/站点切 Chromium 跑扩展与 DevTools</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.4">• 历史标签瞬时零内存冷恢复（点击前零开销）+ 请求前引擎内原生广告拦截 + ⇧⌘H 永久隐藏元素</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.4">• 端到端加密 SyncKit：Cloudflare Worker (sync-server/) 仅存密文，跨 Mac / iPhone / Android 校验 SharedContracts</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 除 Fast 窗口层外全模块无窗口极速 swift test · ./build.sh 免开发者账号签名并行运行 Yab Dev</text>

  <rect x="66" y="380" width="598" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="82" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">Agent 专属隔离标签页 + 内置站点级 Skills (1Password/Asana/Amazon)</text>
  <text x="82" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.4">• 复用用户已付费 AI 供应商与已登录会话，但 Agent 运行在独立标签页且绝对看不见隐私标签页</text>
  <text x="82" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.4">• 高危动作强制门禁：在执行发送 (send)、付款 (pay) 或删除 (delete) 前强制暂停请求人工确认</text>
  <text x="82" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.4">• 随包内置 Skills/：预置 1Password、Asana、Amazon 等复杂 Web 应用的最佳操控路径指南</text>
  <text x="82" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 彻底解决“无头浏览器没登录态、复用主浏览器又怕 Agent 偷看隐私或误点付款”的两难</text>

  <!-- Right Column: manuelgscom/inside-llm -->
  <rect x="706" y="152" width="650" height="390" rx="14" fill="url(#cardGrad)" stroke="#34D399" stroke-width="1.5"/>
  <text x="728" y="182" fill="#34D399" font-family="Consolas, monospace" font-size="14" font-weight="bold">🔬 2. manuelgscom/inside-llm (MIT · C++/TS · llama.cpp CUDA/Vulkan · ★73)</text>
  <text x="728" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">别只看平均困惑度！逐 Token 看清两个 GGUF 量化版在哪一刻分道扬镳</text>

  <rect x="728" y="220" width="606" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="744" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">双 GGUF 模型同屏对决 (Q2_K vs Q8_0 / Base vs Fine-Tune)</text>
  <text x="744" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.4">• 两种步进模式：Same text (锁步投喂同一前缀看各位置分歧) vs Each its own (自由生成抓首次分叉点)</text>
  <text x="744" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.4">• 实证案例：Qwen3.5-4B Q2_K 与 Q8_0 在第 31 个 Token 处分别选 "six" 与 "eight" 导致后续逻辑彻底分叉</text>
  <text x="744" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.4">• 定量分布对比：逐词计算信息熵、有效候选数、Jensen-Shannon 散度与双向 KL 散度镜像柱状图</text>
  <text x="744" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 自动校验 Model A/B 分词器一致性并预警显存溢出 · 支持无 GPU 纯静态网页会话录制回放</text>

  <rect x="728" y="380" width="606" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="744" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">6 级采样门 (Gates) 淘汰透视 + 3D 概率地形 + --lens 层间 Logit Lens</text>
  <text x="744" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.4">• 采样链逐级解剖：直观显示 penalties → top-k → top-p → min-p → temperature → GBNF 各砍掉多少候选</text>
  <text x="744" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.4">• 3D Relief 与 Logit Lens (--lens)：把整段生成的概率地形与每一层 Transformer 的提前预测画成 3D/2D 图</text>
  <text x="744" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.4">• 无损任意分叉树 (Branching)：点击任意落选候选词立即从该节点续写，完整保留多分支决策树随时回跳</text>
  <text x="744" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 单一原生二进制内嵌 Web 服务 · 100% 本地 CUDA/Vulkan 推理，零云端上传与零遥测</text>

