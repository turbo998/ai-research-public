  <text x="68" y="682" fill="#F8FAFC" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path B (无头容器反复掉登录 + 手写 Logit 转储脚本)</text>
  <rect x="430" y="666" width="254" height="22" rx="5" fill="#F59E0B"/>
  <text x="696" y="682" fill="#FDE68A" font-family="Consolas, monospace" font-size="13" font-weight="bold">$2,540.00/mo ($840.00 compute/scripts + 17.0h × $100 = $1,700.00)</text>

  <text x="68" y="718" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path C (yab 双核隔离 Agent 标签页 + inside-llm)</text>
  <rect x="430" y="702" width="41" height="22" rx="5" fill="#10B981"/>
  <text x="483" y="718" fill="#6EE7B7" font-family="Consolas, monospace" font-size="13" font-weight="bold">$410.00/mo ($90.00 compute + 3.2h × $100 = $320.00) → 净省 $5,010.00/月 (-92.44% / 年省 $60,120.00)</text>

  <line x1="68" y1="740" x2="1332" y2="740" stroke="#334155"/>
  <text x="68" y="766" fill="#38BDF8" font-family="Consolas, monospace" font-size="13.5" font-weight="bold">🎯 ARCHITECTURAL TAKEAWAYS FOR EDGE AI &amp; BROWSER AGENTS:</text>
  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 按标签页选引擎与最小权限：yab 用 WebKit 处理 90% 轻量页面、按需切 CEF 跑重型扩展，并将 Agent 关进看不见隐私标签且发/付/删必审的专属沙盒。</text>
  <text x="68" y="814" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 量化选型必须看关键 Token 分叉：平均 PPL 仅差 0.1 的 Q2_K 与 Q8_0 常在数字/JSON 键名 Token 上发生翻转，inside-llm 让分叉点与 GBNF 裁剪一目了然。</text>
  <text x="68" y="838" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 免 GPU 静态回放交付：架构师在本地工作站用 inside-llm 录制好 Q4_K_M vs Q8_0 对比会话后，可直接导出纯静态 HTML 发给客户在普通浏览器上交互复盘。</text>
