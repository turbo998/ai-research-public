  <text x="82" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• Claude Code 按项目聚合对话：支持将某账号跑到一半的会话一键复制迁移到满额度的备用账号继续 Resume</text>
  <text x="82" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 资产跨号克隆：在 Account 页面一键把配好的 MCP Servers、Skills、Plugins 与 Hooks 发送给其他账号</text>
  <text x="82" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 彻底消灭多席位重度开发者“主号限流后去副号重新配一遍 MCP 和上下文”的重复劳动</text>

