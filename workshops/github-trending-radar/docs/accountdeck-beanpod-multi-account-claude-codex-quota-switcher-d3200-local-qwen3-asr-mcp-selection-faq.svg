  <text x="744" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 按住说话语音输入：松手即打进当前软件，独立保存在“语音输入”侧栏（记录目标 App，不污染正式会议库）</text>
  <text x="744" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 原生 MCP Server 与 CLI：Claude Code / Codex / OpenClaw 一键查询会议纪要、待办或向豆仓写入笔记</text>
  <text x="744" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 诚实披露：得到 AI 录音卡 (GSC10) 协议支持尚未在实机测试，D3200 仅在固件 04.92 实测</text>

