  <text x="68" y="108" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21.5" font-weight="bold">多账号额度秒切与会话漫游吧台 (AccountDeck) + 录音豆本地 Qwen3-ASR 知识库 MCP (BeanPod)</text>
  <text x="68" y="128" fill="#94A3B8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">CLAUDE_CONFIG_DIR / CODEX_HOME 秒切与跨号同步对话 · Anker D3200 + 飞书妙记 lark-cli 拉回 + 本机 Qwen3-ASR/4B · 净省 $5,175.00/月 (-93.08%)</text>

  <!-- Left Column: nadim-sheikh/AccountDeck -->
  <rect x="44" y="152" width="642" height="390" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="182" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">🎛️ 1. nadim-sheikh/AccountDeck (MIT · Swift macOS 14+ &amp; Win Beta · ★41)</text>
  <text x="66" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">专治“Claude/Codex 5小时额度撞墙后切号丢对话、丢 MCP 配置”的菜单栏中枢</text>

  <rect x="66" y="220" width="598" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="82" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">四大 AI 客户端隔离切换 + 1 秒级实时 5h / 周额度监控</text>
  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 零冲突目录分流：Claude Code 走独立 CLAUDE_CONFIG_DIR，Codex 走独立 CODEX_HOME，ChatGPT 走独立 Profile</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 1 秒内刷新剩余额度：通过静默 status-line hook 与会话日志实时监控 5 小时与周限额百分比及重置倒计时</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 可选 Exact Usage：经用户显式授权后每分钟调用 api.anthropic.com 同步与 /usage 完全一致的精确配额</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 100% 本地运行 (~/.accountdeck) · 绝不外传任何密码或 Token · 诚实标注 Windows 版尚未在真机测试</text>

  <rect x="66" y="380" width="598" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
