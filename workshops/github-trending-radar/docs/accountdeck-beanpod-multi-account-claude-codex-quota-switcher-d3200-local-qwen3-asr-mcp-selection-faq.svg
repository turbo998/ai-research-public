  <text x="744" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 穿戴硬件直连：蓝牙控制/同步 Anker 录音豆 D3200 并自动解密为通用 .ogg，长录音支持 ~500 KB/s Wi-Fi 快传</text>
  <text x="744" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 破解“被手机飞书抢先同步吞掉录音”痛点：借官方 lark-cli (minutes:minutes.media:export) 每 30 分钟自动拉回</text>
  <text x="744" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 本机双模型零上传：llama.cpp 跑 Qwen3-ASR-0.6B 实时转写 + Qwen3-4B (~2.5GB) 场景纪要（SHA-256 断点续传）</text>
  <text x="744" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 支持云端优先/断网自动降级本机 + 纠错词库自动替换 + 7 天回收站完整保留文字稿与标签</text>

  <rect x="728" y="380" width="606" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
