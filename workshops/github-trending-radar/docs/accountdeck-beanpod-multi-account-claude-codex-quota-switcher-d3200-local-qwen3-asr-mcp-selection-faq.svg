  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 账号切换必须同步“会话状态 + MCP/Skills 装备”：AccountDeck 让多账号切换从“从零重开一局”变成“满装备原位复活”。</text>
