  <rect width="1400" height="900" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="1352" height="852" rx="18" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <rect x="44" y="42" width="1312" height="94" rx="14" fill="#111C35" stroke="#2D426B" stroke-width="1.2"/>
  <text x="68" y="76" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">PROACTIVE DURABLE NEWS AGENT · 2026-11-16 NIGHT SHIFT ROUND 32 (CUMULATIVE R389) · CLAIM-20261116-R32-QWENLIVEDELIVERY-HARNESSLANG</text>
  <text x="68" y="108" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21.5" font-weight="bold">Qwen 边做边交付长程插件 (Qwen-Live-Delivery-Plugin) + 可证明持久化 Harness 语言 (harnesslang)</text>
  <text x="68" y="128" fill="#94A3B8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">$ld:go 渐进版本快照与中途纠偏 Hooks + 编译期强制处理崩溃后 unknown 外部副作用并证明最坏情况上界 · 净省 $5,615.00/月 (-93.27%)</text>

  <!-- Left Column: QwenLM/Qwen-Live-Delivery-Plugin -->
  <rect x="44" y="152" width="642" height="390" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="182" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">🚀 1. QwenLM/Qwen-Live-Delivery-Plugin (Codex Live Delivery · ★31)</text>
  <text x="66" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">边做边交付、方向全掌控！终结长程 Agent“黑盒闷头跑 2 小时交出废品”顽疾</text>

  <rect x="66" y="220" width="598" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="82" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">三大核心模块：$ld:go 技能 + Live Delivery MCP + Lifecycle Hooks</text>
  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 最小可用首版先行 ($ld:go)：先交付一个能跑通的 v1，再根据实际运行结果动态规划 v2/v3，每轮必含验证与可预览交付物</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 四原语状态机 MCP (ld_begin / ld_publish / ld_status / ld_done)：保存完整版本快照、预览入口与剩余预算</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 生命周期钩子 (Lifecycle Hooks)：在剩余预算充足时阻止 Agent 偷懒早退；人类随时插话追加需求自动注入下一轮上下文</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 本地浏览器工作台支持随时试用历史版本、下载快照、动态调增预算或安全收尾</text>

  <rect x="66" y="380" width="598" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="82" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">同线程无损中断恢复 + 默认 workspace-write 最小权限沙盒</text>
  <text x="82" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 无需推倒重开新会话：当用户在看板发送新指令时，原位中断并唤醒同一个 Codex 线程，保留全部既有架构上下文</text>
  <text x="82" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 即使中途点击停止或预算耗尽，此前已发布的每一个版本快照依然完整保留、随时可用</text>
  <text x="82" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 默认开启 workspace-write 沙盒保护，安装脚本绝不擅自开启 danger-full-access 越权开关</text>
  <text x="82" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ Qwen 官方 Apache-2.0 开源，首批发售即原生适配 Codex CLI (Linux &amp; macOS)</text>

  <!-- Right Column: nanocodexyz/harnesslang -->
  <rect x="706" y="152" width="650" height="390" rx="14" fill="url(#cardGrad)" stroke="#34D399" stroke-width="1.5"/>
  <text x="728" y="182" fill="#34D399" font-family="Consolas, monospace" font-size="14" font-weight="bold">🛡️ 2. nanocodexyz/harnesslang (Provably Durable Harness DSL · ★22)</text>
  <text x="728" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">一次定义 Agent 主循环，按目标平台崩溃契约编译并形式化证明永不重发外部动作</text>

  <rect x="728" y="220" width="606" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="744" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">Durable Before External：把崩溃后“未知是否已执行 (unknown)”变成编译期类型</text>
  <text x="744" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 根治崩溃重放灾难：发评论、扣款、跑 Shell 是不可撤回的 effect external；恢复时绝不盲目重跑，而是返回 unknown</text>
  <text x="744" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 漏处理即编译报错：dispatch 返回类型强制包含 ok / failed / unknown 三分支，少写 unknown 分支直接拒绝编译</text>
  <text x="744" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 五大宿主原语精准降级：Native Rust (group commit+fsync)、SQLite (事务)、Postgres (Fenced 租约)、CF DO、Vercel</text>
  <text x="744" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ requires 前置不变式在编译期静态保证 history 列表绝不在循环中途溢出</text>

  <rect x="728" y="380" width="606" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="744" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">hl check 静态最坏上界证明 + hl sim 百种子断电/脑裂混沌仿真</text>
  <text x="744" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 精确到条数的平台配额证明：hl check 自动算出最坏路径（如 75 条日志、40 次外部请求 ≤ Cloudflare 10,000 上限）</text>
  <text x="744" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• TigerBeetle 风格确定性故障注入 (hl sim --seeds 0..100)：自动注入 375 次崩溃、55 次租约接管与 36 次 Fenced 拦截</text>
  <text x="744" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 遵循 TIGER_STYLE.md 工程规范，零未界定循环、零静默撕裂写 (0 torn_writes)</text>
  <text x="744" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 为金融/运维高可靠 Agent Harness 提供了首个带编译器级安全证明的领域语言</text>

  <!-- Bottom Row: Closed-Form FinOps Ledger -->
  <rect x="44" y="558" width="1312" height="300" rx="14" fill="url(#cardGrad)" stroke="#475569" stroke-width="1.2"/>
  <text x="68" y="590" fill="#A78BFA" font-family="Consolas, monospace" font-size="14" font-weight="bold">💰 CLOSED-FORM FINOPS AUDIT (CLAIM-20261116-R32-QWENLIVEDELIVERY-HARNESSLANG · synthetic, independently_reproduced=false)</text>
  <text x="68" y="612" fill="#94A3B8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">工作负载：每月执行 40 次长程多版本 Agent 渐进交付 + 维护 25 套跨平台高可靠持久化 Agent Harness（时薪 r = $100.00/hr；底层云数据库月租：not_measured）</text>

  <!-- Bars -->
  <text x="68" y="646" fill="#F8FAFC" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path A (黑盒长跑偏航报废重来 + 崩溃恢复重复执行外部扣款/命令)</text>
  <rect x="430" y="630" width="602" height="22" rx="5" fill="#EF4444"/>
  <text x="1044" y="646" fill="#FCA5A5" font-family="Consolas, monospace" font-size="13" font-weight="bold">$6,020.00/mo ($2,020.00 token/incident waste + 40.0h × $100 = $4,000.00)</text>

  <text x="68" y="682" fill="#F8FAFC" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path B (人工每轮打 Tag 盯屏 + 按宿主手写五套防重胶水代码)</text>
  <rect x="430" y="666" width="278" height="22" rx="5" fill="#F59E0B"/>
  <text x="720" y="682" fill="#FDE68A" font-family="Consolas, monospace" font-size="13" font-weight="bold">$2,780.00/mo ($930.00 spend + 18.5h × $100 = $1,850.00)</text>

  <text x="68" y="718" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path C (Qwen-Live-Delivery $ld:go + harnesslang 证明)</text>
  <rect x="430" y="702" width="40.5" height="22" rx="5" fill="#10B981"/>
  <text x="482" y="718" fill="#6EE7B7" font-family="Consolas, monospace" font-size="13" font-weight="bold">$405.00/mo ($85.00 compute + 3.2h × $100 = $320.00) → 净省 $5,615.00/月 (-93.27% / 年省 $67,380.00)</text>

  <line x1="68" y1="740" x2="1332" y2="740" stroke="#334155"/>
  <text x="68" y="766" fill="#38BDF8" font-family="Consolas, monospace" font-size="13.5" font-weight="bold">🎯 ARCHITECTURAL TAKEAWAYS FOR LIVE-STEERABLE &amp; PROVABLY DURABLE AGENT HARNESSES:</text>
  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 长程编码任务必须把“一次性终局交付”改为“$ld:go 渐进版本快照 + Lifecycle Hooks 实时纠偏” (Qwen-Live-Delivery)。</text>
  <text x="68" y="814" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 不可撤回的外部工具调用 (effect external) 必须在持久化落盘后才触发，且崩溃恢复后必须显式建模为 unknown。</text>
  <text x="68" y="838" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 用 harnesslang 的 hl check 与 hl sim 在上线前静态证明平台配额上界并跑通百种子崩溃与租约抢占仿真。</text>
