  <text x="88" y="257" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">No summarization, no sliding windows, no file read caps &amp; no command output truncation</text>
  <text x="88" y="274" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Proven on 6 transport checks: 442,400B prompt/file &amp; 213,018B command output unchanged</text>

