  <text x="88" y="314" fill="#EF4444" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Fail-Closed `exit 3` on Provider Output Truncation (`finish_reason=length`)</text>
  <text x="88" y="333" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">If the LLM provider cuts a response at its token limit, UNCUT exits with code 3 and</text>
  <text x="88" y="350" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">emits zero partial stdout instead of silently passing a half-written patch downstream</text>

