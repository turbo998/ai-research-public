  <text x="88" y="415" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">One ~7 MB static binary; `git diff | uncut "Review..."` appends valid UTF-8 verbatim</text>
  <text x="88" y="434" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">4 core tools, append-only JSONL session resume, OpenAI/OpenRouter/Ollama compatible</text>

