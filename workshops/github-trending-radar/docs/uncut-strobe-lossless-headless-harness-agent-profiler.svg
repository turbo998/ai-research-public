  <text x="649" y="333" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Traces web, Electron, Bun/Node &amp; native apps down to code line, thread wake-up, allocs,</text>
  <text x="649" y="350" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">frames, GPU &amp; VRAM bytes; `strobe query A..B hotspots` + `strobe open` in Perfetto</text>

