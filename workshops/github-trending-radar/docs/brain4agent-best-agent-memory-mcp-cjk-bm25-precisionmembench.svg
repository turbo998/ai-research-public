  <text x="649" y="350" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">vs. `Mem0`, `Zep`, `Cognee` &amp; `Brain4Agent` explicit tool-call/batch ingestion</text>

