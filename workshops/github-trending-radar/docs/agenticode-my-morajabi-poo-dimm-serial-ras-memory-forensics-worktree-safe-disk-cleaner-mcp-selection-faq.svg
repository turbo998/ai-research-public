  <text x="82" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 便携式证据盒：sudo my bundle -o case.mycase 打包全量原始记录，任意 Mac/Linux 用 my open 原样复现</text>
