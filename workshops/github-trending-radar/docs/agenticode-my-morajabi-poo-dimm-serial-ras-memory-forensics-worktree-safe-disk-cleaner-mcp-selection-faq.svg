  <text x="744" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 绝不穿透软链接、绝不碰 .ssh/.gnupg/Keychain/iCloud、绝不删含 .git 的构建目录</text>

  <rect x="728" y="380" width="606" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
