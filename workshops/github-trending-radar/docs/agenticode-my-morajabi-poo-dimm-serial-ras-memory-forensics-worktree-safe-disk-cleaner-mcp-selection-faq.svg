  <text x="744" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 磁盘水位哨兵：poo schedule add guard 当剩余空间 &lt;20GB 时自动清理非活跃缓存直至恢复 50GB</text>
