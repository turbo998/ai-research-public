  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 验证硬修复是否失效 ([R-REP-02])：精准检测 2026-10-28 Hard PPR 后同一行再次爆发 764 次 CE 并升级为 UE</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 100% 只读安全 (绝不乱下线内存页或清零计数器) · 排除主板插槽故障避免盲目换主板</text>

