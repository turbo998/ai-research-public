  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 跨重启与跨插槽记忆：即使重启清零计数器或把内存条换到别的插槽，历史账本依然跟着序列号走</text>
