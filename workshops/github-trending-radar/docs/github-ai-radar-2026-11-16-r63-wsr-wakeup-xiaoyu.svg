  <text x="744" y="454" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 本地采用 `Drift + SQLite` 持久化角色、草稿与通话核对状态，API Key 存入系统安全存储，切后台自动断联防偷跑计费</text>
