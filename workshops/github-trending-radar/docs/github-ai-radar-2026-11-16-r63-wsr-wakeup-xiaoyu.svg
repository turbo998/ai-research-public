  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• `wsr` 将权重空间阅读 (`wsr read`) 严格限制在无前向推理的纯 CPU 沙箱中，防止 Agent 靠偷跑模型作弊。</text>
