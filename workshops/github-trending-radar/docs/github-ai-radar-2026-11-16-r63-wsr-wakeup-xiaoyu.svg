  <text x="744" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 为什么定时 Cron 唤醒很呆板？不懂你刚说了“我出门一会儿”或“接下来忙工作”，只会机械刷屏</text>
  <text x="744" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• SLM 实时维护 **10 种并发情境 (Scenes)**：`outing` (30m/8h)、`work` (60m/10h)、`bedtime` (45m/10h)、`morning` (20m/3h)、`silence_escalation` (15m/4h) 等，到期自动合并为单份唤醒报告</text>
