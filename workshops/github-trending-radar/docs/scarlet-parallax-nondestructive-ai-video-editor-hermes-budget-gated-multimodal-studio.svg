  <text x="68" y="208" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold">复用 Claude Code / Codex 订阅的桌面原生非破坏性对话视频精剪工作台</text>
  <text x="68" y="236" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">• 局部上下文极速预渲染：按住 V 键语音指令或 /dialogue-pass，仅重渲染受影响切口片段</text>
  <text x="68" y="262" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">• \ 键正反盲听核验：按一次 \ 听被删掉的废话，再按一次 \ 听拼接后的过渡气口，满意再合入</text>
