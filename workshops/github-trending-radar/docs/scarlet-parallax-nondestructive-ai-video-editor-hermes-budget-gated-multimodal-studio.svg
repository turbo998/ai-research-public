  <text x="732" y="236" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">• 零 Key 完整体验 (PARALLAX_DEMO_SEED=1)：无 API Key 时自动返回内置样本，覆盖 15+ 创作页面</text>
  <text x="732" y="262" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">• 39 款图/影/音/乐模型 + 事前精确报价：按 Generate 前显式展示单价，TREG_DAILY_BUDGET_USD 硬熔断</text>
  <text x="732" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">• /supercomputer 挂载自有 Hermes Agent：通过 MCP 暴露工坊工具，每次生成弹价格审批卡且不泄主 Key</text>
