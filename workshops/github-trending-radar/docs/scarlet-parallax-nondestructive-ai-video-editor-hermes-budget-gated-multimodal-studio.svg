  <text x="68" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">• 达芬奇工业级移交：既可直出 .mp4，也能导出 OpenTimelineIO (.otio) 无缝进 DaVinci Resolve</text>
