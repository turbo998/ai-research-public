  <text x="68" y="772" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">1. 访谈与技术播客粗剪统一采用 Scarlet：复用现有 Claude Code/Codex 订阅跑 /dialogue-pass，用 \ 键盲听切口后导出 .otio 交由达芬奇精调。</text>
  <text x="68" y="796" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">2. 团队共享多模态创作部署 Parallax：开启 TREG_DAILY_BUDGET_USD 每日熔断，并通过 MCP 审批卡让 Hermes Agent 在人工确认单价后才扣费生成。</text>
