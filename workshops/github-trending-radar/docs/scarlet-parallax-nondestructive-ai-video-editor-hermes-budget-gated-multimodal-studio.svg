  <text x="750" y="408" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">• Engine 2 [Built-in]: SUPER_MODE=live + TREG_DAILY_BUDGET_USD 24h cap</text>
  <text x="750" y="434" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">• Engine 3 [Hermes on Orgo]: MCP studio tools + Per-Call Price Approval Card</text>
