  <!-- Header -->
  <rect x="44" y="38" width="210" height="28" rx="14" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="149" y="57" fill="#6EE7B7" font-size="12" font-weight="700" text-anchor="middle">ROUND 5 · BROWSER &amp; DESKTOP CUA</text>
  <text x="270" y="57" fill="#94A3B8" font-size="12">2026-11-08 Radar · Track A #3 agent-browser (+812★ today) + Track A #4 anthropics/skills (+793★ today) + agent-desktop (v1.2.0)</text>

  <text x="44" y="96" fill="#F8FAFC" font-size="23" font-weight="800">Browser &amp; Desktop CUA Selection: Accessibility-Tree @ref CLI vs. Raw DOM / Vision Screenshot Loop</text>
  <text x="44" y="120" fill="#CBD5E1" font-size="13">浏览器与操作系统桌面无障碍树（@e1 短句柄 + Web Wrapper 折叠）+ SKILL.md 三层渐进式技能披露 vs. 传统全量 MCP Schema 与视觉截图</text>
  <rect x="44" y="132" width="1112" height="3" fill="url(#accent5)"/>

  <!-- 3 Architecture Columns -->
  <!-- Column 1: Path A Raw DOM + Heavy MCP -->
  <rect x="44" y="150" width="356" height="290" rx="12" fill="#1E1B2E" stroke="#EF4444" stroke-width="1.5"/>
  <text x="62" y="178" fill="#FCA5A5" font-size="15" font-weight="700">❌ Path A: 40 Preloaded MCPs + Raw DOM</text>
  <text x="62" y="198" fill="#94A3B8" font-size="12">全量预加载 MCP 工具 Schema + 原始 HTML/UI 树注入</text>
  <line x1="62" y1="208" x2="382" y2="208" stroke="#334155"/>
  <text x="62" y="232" fill="#E2E8F0" font-size="12">• 首轮空载工具税: 18,000 Tokens/步 常驻请求头</text>
  <text x="62" y="256" fill="#E2E8F0" font-size="12">• 单步页面观测: ~32,000 Tokens 冗余 div/CSS</text>
  <text x="62" y="280" fill="#E2E8F0" font-size="12">• 15 步累计输入: (18k+32k)×15 = 750,000 Tokens</text>
  <text x="62" y="304" fill="#FCA5A5" font-size="12">• 遮挡盲区: 按钮被弹窗遮挡时 .click() 常假装成功</text>
  <text x="62" y="328" fill="#FCA5A5" font-size="12">• Electron 桌面: 15 层匿名容器直接耗尽树深预算</text>
  <rect x="62" y="352" width="320" height="70" rx="8" fill="#0F172A" stroke="#7F1D1D"/>
  <text x="76" y="376" fill="#FCA5A5" font-size="12" font-weight="700">闭式算例 (11,000 次/月, synthetic):</text>
  <text x="76" y="396" fill="#F8FAFC" font-size="13" font-weight="700">0.7500M × $1.65 = $1.2375/次 → $13,612.50/月</text>
  <text x="76" y="413" fill="#94A3B8" font-size="11">单次平均耗时: 63.0s (4.2s/步)</text>

