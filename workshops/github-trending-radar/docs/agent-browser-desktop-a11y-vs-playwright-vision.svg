  <text x="454" y="396" fill="#F8FAFC" font-size="13" font-weight="700">0.2142M × $1.65 = $0.35343/次 → $3,887.73/月</text>
  <text x="454" y="413" fill="#94A3B8" font-size="11">单次平均耗时: 100.8s (21 有效步 × 4.8s)</text>

