  <text x="818" y="280" fill="#6EE7B7" font-size="12" font-weight="700">• 15 步累计输入: (600+950)×15 = 23,250 Tokens (-96.9%)</text>
  <text x="818" y="304" fill="#6EE7B7" font-size="12">• 遮挡硬门禁: 目标被弹窗覆盖/不可见时显式报错拒绝</text>
  <text x="818" y="328" fill="#6EE7B7" font-size="12">• Web Wrapper 跳过: Chrome_WidgetWin_1 零逻辑深度消耗</text>
  <rect x="818" y="352" width="320" height="70" rx="8" fill="#064E3B" stroke="#10B981"/>
  <text x="832" y="376" fill="#A7F3D0" font-size="12" font-weight="700">闭式算例 (11,000 次/月, synthetic):</text>
  <text x="832" y="396" fill="#FFFFFF" font-size="13" font-weight="800">0.02325M × $1.65 = $0.0383625/次 → $421.99/月</text>
  <text x="832" y="413" fill="#6EE7B7" font-size="11" font-weight="700">单次耗时: 16.5s (1.1s/步) · 月省 $13,190.51 (-96.90%)</text>

