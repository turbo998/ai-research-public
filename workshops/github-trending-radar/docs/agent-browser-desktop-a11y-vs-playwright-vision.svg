  <text x="440" y="280" fill="#E2E8F0" font-size="12">• 单次累计输入: 10,200 × 21 = 214,200 Tokens</text>
  <text x="440" y="304" fill="#FCD34D" font-size="12">• 视觉推理慢: 截图编码 + 坐标预测 ~4.8s/步</text>
  <text x="440" y="328" fill="#6EE7B7" font-size="12">• 适用边界: 仅纯 WebGL/Canvas 或 Citrix 视频流必选</text>
  <rect x="440" y="352" width="320" height="70" rx="8" fill="#0F172A" stroke="#78350F"/>
