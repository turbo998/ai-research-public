  <rect x="395" y="716" width="350" height="26" rx="5" fill="#78350F" stroke="#F59E0B"/>
  <text x="760" y="734" fill="#FEF3C7" font-family="Consolas, monospace" font-size="13.5" font-weight="700">$2,780.00/mo ($930.00 GPU + 18.5h / $1,850.00)</text>

  <!-- Path C Bar -->
  <text x="58" y="776" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Path C: Qwen-TTS 417-Neurons + ComfyUI-ReCaVSR</text>
  <rect x="395" y="758" width="58" height="26" rx="5" fill="#065F46" stroke="#10B981"/>
  <text x="468" y="776" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13.5" font-weight="700">$465.00/mo ($115.00 compute + 3.5h / $350.00) · -92.09%</text>

  <!-- Bottom KPI Pills -->
  <rect x="58" y="802" width="405" height="52" rx="8" fill="#111C33" stroke="#10B981"/>
  <text x="260" y="824" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Monthly Savings vs Path A: -$5,415.00/mo (-92.09%)</text>
  <text x="260" y="844" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Annualized Savings: $64,980.00/yr · 35.5h/mo Saved (-91.03%)</text>

  <rect x="480" y="802" width="420" height="52" rx="8" fill="#111C33" stroke="#06B6D4"/>
  <text x="690" y="824" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Neuron Steering: 400 Core (×8-12) + 4 Trait Groups</text>
  <text x="690" y="844" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">W_down[:,k] += (α-1)g_k d_L &amp; a_k' = a_k + β·s_k·sd_k</text>

  <rect x="918" y="802" width="424" height="52" rx="8" fill="#111C33" stroke="#3B82F6"/>
  <text x="1130" y="824" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Streaming Video SR: 21f + 8f Blocks (1 Step/Block)</text>
  <text x="1130" y="844" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">8 GB VRAM @ 1440p · 24 GB VRAM @ 4K · FlashDecoder</text>
