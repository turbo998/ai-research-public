  <text x="86" y="382" fill="#34D399" font-family="Consolas, monospace" font-size="12">1. Direct Mode:    Plan -&gt; Deterministic Tool (0 LLM tokens)</text>
  <text x="86" y="408" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">2. Localized Mode: Plan -&gt; 1-Shot Model Script -&gt; Tool I/O &amp; Compute</text>
