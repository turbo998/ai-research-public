  <text x="750" y="434" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">• Batched Escalation -&gt; &lt;=5 irreversible questions w/ options &amp; recommendation</text>
  <text x="750" y="460" fill="#F8FAFC" font-family="Consolas, monospace" font-size="12">• fleet-sweep -&gt; Prunes finished worktrees/tabs (refuses unmerged data loss)</text>

