  <text x="68" y="236" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">• 模式 1 [Direct 直执模式]：计划锁定操作与入参，工具直接执行，零中间 LLM 调用开销</text>
  <text x="68" y="262" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">• 模式 2 [Localized 局部生成]：模型只写短处理脚本，读写与重计算全部交由确定性工具</text>
