  <text x="732" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">• 最多 5 题批量请示 + fleet-sweep 防丢代码清理：自动清理已完结分支/标签，未合入变更绝不强删</text>
