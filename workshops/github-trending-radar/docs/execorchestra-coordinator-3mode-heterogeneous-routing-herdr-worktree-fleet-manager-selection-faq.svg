  <text x="68" y="772" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">1. 复杂任务编排引入 ExecOrchestra：将确定性步骤锁进 Direct 模式（零 LLM 调用）、代码生成锁进 Localized 模式，仅对模糊探索开启 Extended 模式。</text>
  <text x="68" y="796" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">2. 多任务并行开发采用 petekp/coordinator + Herdr：通过 3 并发上限、fleet_watch.py 自动跟进 PR 状态，并用 fleet-sweep 安全回收已合并 Worktree。</text>
