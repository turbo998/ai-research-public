  <text x="282" y="169" fill="#E2E8F0" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700">muaaz9329/cheap-ag (328★ · Claude/Codex)</text>

  <rect x="56" y="188" width="513" height="78" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="208" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">1. Principal-Worker Split: Frontier Plans, $0.005 Worker Types</text>
  <text x="70" y="228" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">• /cheapag:hook on ($cheapag:hook on) forces Opus/Codex to delegate edits</text>
  <text x="70" y="246" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• Supports OpenRouter, DeepSeek, OpenCode Go/Zen, Command Code &amp; local Ollama/vLLM</text>

  <rect x="56" y="276" width="513" height="78" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="296" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">2. Isolated Worktree Execution &amp; SWE-bench Verified Proof</text>
  <text x="70" y="316" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">• Feature: 154k -&gt; 57k Opus tokens (-63%); 7 bugs: 1.6M -&gt; 655k (-59%, 7/7 solved)</text>
  <text x="70" y="334" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• Worker runs in isolated copy (root worktree support) &amp; must pass tests to land</text>

