  <rect x="631" y="188" width="513" height="78" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="645" y="208" fill="#C084FC" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">1. Composable /work-mode (auto | out | wrap | off) State Machine</text>
  <text x="645" y="228" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">• auto: zero stops on reversible local steps; queues hard stops back-to-back at end</text>
  <text x="645" y="246" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• Injects mode prompt once (and post-compaction) to eliminate per-turn token bloat</text>

  <rect x="631" y="276" width="513" height="78" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="645" y="296" fill="#38BDF8" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">2. 20k-Char Delegation Nudge &amp; Quota-Aware Pool Routing (out)</text>
  <text x="645" y="316" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">• Nudges main thread after &gt;20,000 raw chars read without delegating (codex/gemini)</text>
  <text x="645" y="334" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• Reads dispatch.quotaFile (5h_used / 7d_used / floor_5h) &amp; subagentsDelegate=false</text>

  <rect x="631" y="364" width="513" height="78" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="645" y="384" fill="#FBBF24" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">3. Three Deterministic Hook Gates (work-mode-gates)</text>
  <text x="645" y="404" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">• scratch-doc-guard.sh (blocks SUMMARY/REPORT.md sprawl) + git-safe-commit-gate.sh</text>
  <text x="645" y="422" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• decision-label-guard.py enforces outbound/payment/delete/permission/tradeoff tags</text>

