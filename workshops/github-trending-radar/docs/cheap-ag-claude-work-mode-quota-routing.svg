  <text x="70" y="384" fill="#FBBF24" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700">3. Deterministic Takeover &amp; Early-Termination Caps (cheapag.json)</text>
  <text x="70" y="404" fill="#CBD5E1" font-family="Inter, system-ui, sans-serif" font-size="12">• takeover: "ask" | "sonnet" | "self" (capped at limits.takeover_calls = 15)</text>
  <text x="70" y="422" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="12">• limits.max_turns: 25 &amp; repro_by_turns: 30 stop unproductive bug-fix loops early</text>

  <!-- Right Panel: claude-work-mode -->
  <rect x="615" y="136" width="545" height="320" rx="12" fill="#111827" stroke="#A855F7" stroke-width="1.5"/>
