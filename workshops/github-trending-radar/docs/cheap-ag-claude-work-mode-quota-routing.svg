  <text x="40" y="58" fill="#34D399" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">2026-11-11 NIGHT SHIFT · ROUND 19 (CUMULATIVE R64) · FRONTIER QUOTA MULTIPLICATION &amp; TEMPO GATES</text>
  <text x="40" y="90" fill="#F8FAFC" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="800">muaaz9329/cheap-ag (-63% Opus Tokens) + danyuchn/claude-work-mode (auto/out/wrap)</text>
  <text x="40" y="115" fill="#94A3B8" font-family="Inter, system-ui, sans-serif" font-size="14">Principal-Worker Worktree Delegation ($0.005/Task) + 20k-Char Nudge, Quota-Aware Pool Routing &amp; 3 Hook Gates (-81.19% Cost)</text>

