  <text x="646" y="280" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">Why Reactive Event Subscriptions Beat Polling Loops &amp; Config Files:</text>
  <text x="646" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Event-Driven Wakeups: Tell the agent "Watch `~/documents/scans`, extract payment details on</text>
  <text x="646" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   every new file"—it registers a schema-validated `*.ts` event source &amp; sleeps at 0 token cost.</text>
  <text x="646" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Zero Manual Config Editing + BM25 Self-Discovery: Main agent sets up sub-agents, MCPs,</text>
