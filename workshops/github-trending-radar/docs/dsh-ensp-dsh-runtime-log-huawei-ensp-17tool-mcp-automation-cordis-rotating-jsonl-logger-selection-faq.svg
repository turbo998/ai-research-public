  <text x="1064" y="360" fill="#FDE68A" font-family="Consolas, monospace" font-size="11.5">16 KiB max entry + secret redact</text>
  <text x="1064" y="382" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">Skips lazy getter Error.stack</text>
  <text x="1064" y="402" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">Protects timed-out OS writes</text>

