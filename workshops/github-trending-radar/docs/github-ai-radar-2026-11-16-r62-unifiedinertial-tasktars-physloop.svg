  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 用人类动作 + 运动学重定向 G1 数据联合训练统一惯性编码器，无需物理仿真或真机微调即可在 G1 真机达到 0.099 m/s 误差。</text>
  <text x="68" y="814" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• TASK-TARS 将嘉立创 `.epro2` PCB、Excel 逐项 BOM (¥152.40) 与 Companion 语音上位机完整闭环，大幅拉低具身原型门槛。</text>
