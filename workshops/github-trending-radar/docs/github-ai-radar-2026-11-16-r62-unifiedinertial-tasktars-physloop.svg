  <text x="68" y="108" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21.5" font-weight="bold">人形与人类统一惯性编码器 (0.099 m/s G1 零样本) + ¥152.40 开源 TARS 具身机器人</text>
  <text x="68" y="128" fill="#94A3B8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">Amazon FAR 免物理仿真直迁 Unitree G1 真机 + 全开源 PCB/BOM/四舵机双屏语音 TARS (v0.18.3) + PhysLoop 物理感知视频生成 · 净省 $5,765.00/月 (-93.74%)</text>

  <!-- Left Column: amazon-far/Unified-Inertial-Encoder + DAGroup-PKU/PhysLoop -->
  <rect x="44" y="152" width="642" height="390" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="182" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">🤖 1. amazon-far/Unified-Inertial-Encoder (★37) + DAGroup-PKU/PhysLoop (★39)</text>
  <text x="66" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">人类与人形机器人共享惯性编码器 (真机 G1 速度误差 0.099 m/s) + 物理自进化视频生成</text>

  <rect x="66" y="220" width="598" height="162" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="82" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">amazon-far/Unified-Inertial-Encoder (Apache-2.0)：免仿真、免真机微调直迁 Unitree G1</text>
  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 为什么人形机器人惯性里程计 (IMU Odometry) 难做？真机步态冲击大，采集真机标注轨迹极其昂贵</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 共享惯性接口：在人类动作数据与运动学重定向 (Kinematically Retargeted) G1 动作上联合训练单一编码器</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 零样本跨形态真机迁移：无需物理仿真器、无需真机训练轨迹、无需微调，直接部署到物理 Unitree G1！</text>
  <text x="82" y="332" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 5 大数据集全面领先：在所有被测基准中取得最低速度误差，**物理 Unitree G1 真机实测仅 `0.099 m/s`**</text>
  <text x="82" y="358" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 完整开源训练、基线对比、数据预处理与论文评测全链路代码</text>

