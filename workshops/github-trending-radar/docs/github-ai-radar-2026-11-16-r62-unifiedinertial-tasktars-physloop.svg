  <text x="744" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 四路舵机铰接行走 + 双屏状态交互：复刻《星际穿越》TARS 经典步态与双屏表情/系统状态显示</text>
  <text x="744" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 透明到每一颗螺钉的 BOM 账本：随仓附带 `Project_TARS_V1_BOM_2026-11-13.xlsx`，包含 PCB 阻容芯片、裸板、打印件、舵机、双屏、电池与音频模块，**整机物料成本仅 ¥152.40 (约 $21)**！</text>
