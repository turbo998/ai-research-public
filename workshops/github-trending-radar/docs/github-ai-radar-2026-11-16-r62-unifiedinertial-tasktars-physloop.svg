  <text x="744" y="432" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 打通“硬件固件 + USB 调试 + 电脑端语音 Companion + 云端大模型与音色克隆”端到端闭环</text>
  <text x="744" y="454" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 告别过去零散固件包的拼凑踩坑，提供统一 `TARS-0.18.3-public.zip` 与详尽 `AI_SETUP.zh-CN.md` 指南</text>
