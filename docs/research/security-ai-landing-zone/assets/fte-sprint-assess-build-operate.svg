<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgSprint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="gateGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#EA580C"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="760" rx="16" fill="url(#bgSprint)"/>
  <rect x="16" y="16" width="1168" height="728" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="48" fill="#F59E0B" font-size="12" font-weight="700" letter-spacing="1.5">PARTNER EXECUTION MODEL · FTE SPRINT &amp; ASSESS-BUILD-OPERATE (SLIDES 5, 7, 34–36, 38–41)</text>
  <text x="36" y="74" fill="#F8FAFC" font-size="22" font-weight="800">4–6 Week FTE Offer Sprint, Week 3 Landing Zone Gate &amp; Partner Service Flywheel</text>
  <text x="36" y="96" fill="#94A3B8" font-size="12.5">Security is on the Critical Path of Frontier Transformation — Without Week 3 Landing Zone Readiness, Week 4–5 Agents Cannot Launch</text>

  <!-- Section 1: 4-6 Week FTE Transformation Sprint Timeline (Slide 5) -->
  <rect x="36" y="112" width="1128" height="196" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
  <text x="54" y="136" fill="#F8FAFC" font-size="13" font-weight="800" letter-spacing="0.8">FTE OFFER: 4–6 WEEK PARTNER-LED, CUSTOMER-PAID TRANSFORMATION SPRINT (SLIDE 5)</text>

  <!-- Step 1: WK 1-2 -->
  <rect x="54" y="150" width="225" height="106" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="54" y="150" width="225" height="26" rx="8" fill="#0284C7"/>
  <text x="166" y="168" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="800">WEEK 1–2 · DISCOVERY</text>
  <text x="66" y="192" fill="#E2E8F0" font-size="11.5" font-weight="700">① AI Discovery to Commitment</text>
  <text x="66" y="210" fill="#94A3B8" font-size="10.5">• Distill 5–10 quantifiable outcomes</text>
  <text x="66" y="226" fill="#94A3B8" font-size="10.5">• Secure Executive Sponsorship</text>
  <text x="66" y="244" fill="#38BDF8" font-size="10.5" font-weight="700">Gate 1 (End WK2): 5–10 Outcomes</text>

  <!-- Step 2 & 3: WK 3 Critical Gate -->
  <rect x="295" y="146" width="350" height="114" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
  <rect x="295" y="146" width="350" height="28" rx="8" fill="url(#gateGrad)"/>
  <text x="470" y="165" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="800">WEEK 3 · CRITICAL PATH SECURITY GATE</text>
  <text x="309" y="190" fill="#FDE68A" font-size="11.5" font-weight="700">② Secure AI Landing Zone + ③ Copilot as UI</text>
  <text x="309" y="208" fill="#E2E8F0" font-size="10.5">• Identity, Data, Threat &amp; Governance AI foundation</text>
  <text x="309" y="224" fill="#E2E8F0" font-size="10.5">• Unified employee entry point via M365 Copilot</text>
  <text x="309" y="244" fill="#FCA5A5" font-size="10.5" font-weight="700">HARD RULE: Unbuilt Landing Zone = Block WK4–5 Launch</text>

  <!-- Step 4: WK 4-5 -->
  <rect x="661" y="150" width="235" height="106" rx="8" fill="#0F172A" stroke="#818CF8" stroke-width="1.5"/>
  <rect x="661" y="150" width="235" height="26" rx="8" fill="#4F46E5"/>
  <text x="778" y="168" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="800">WEEK 4–5 · AGENT BUILD</text>
  <text x="673" y="192" fill="#E2E8F0" font-size="11.5" font-weight="700">④ Build &amp; Launch 3 Agents</text>
  <text x="673" y="210" fill="#94A3B8" font-size="10.5">• Hands-on build on governed</text>
  <text x="681" y="226" fill="#94A3B8" font-size="10.5">Landing Zone baseline</text>
  <text x="673" y="244" fill="#A5B4FC" font-size="10.5" font-weight="700">Target: Live before Week 6</text>

  <!-- Step 5: WK 6 -->
  <rect x="912" y="150" width="234" height="106" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="912" y="150" width="234" height="26" rx="8" fill="#059669"/>
  <text x="1029" y="168" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="800">WEEK 6 · SCALE ROADMAP</text>
  <text x="924" y="192" fill="#E2E8F0" font-size="11.5" font-weight="700">⑤ Frontier Transformation Roadmap</text>
  <text x="924" y="210" fill="#94A3B8" font-size="10.5">• Next-wave Agent backlog &amp; scale</text>
  <text x="924" y="226" fill="#94A3B8" font-size="10.5">• Handoff to ongoing Delivery / SOC</text>
  <text x="924" y="244" fill="#6EE7B7" font-size="10.5" font-weight="700">Gate 2 (End WK6): 3 Agents Live</text>

  <!-- Bottom callout inside Section 1 -->
  <rect x="54" y="268" width="1092" height="28" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
  <text x="600" y="287" text-anchor="middle" fill="#FDE68A" font-size="11.5" font-weight="700">Slide 5 Core Axiom: "Landing Zone 没建好，第 4–5 周的 Agent 就上不了生产——安全是 Frontier 的前置条件，不是附加项"</text>

  <!-- Section 2: 5 Discovery Questions (Slide 34) + 6 Pre-Scale Mandatory Questions (Slide 7) -->
  <rect x="36" y="322" width="554" height="196" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="54" y="346" fill="#38BDF8" font-size="12" font-weight="800" letter-spacing="0.8">5 CUSTOMER DISCOVERY OPENER QUESTIONS (SLIDE 34)</text>
  <text x="54" y="364" fill="#94A3B8" font-size="10.5">Any "Unsure" answer immediately triggers a Secure AI Landing Zone Assessment:</text>
  <text x="54" y="386" fill="#E2E8F0" font-size="11">1. How many Agents exist today, who built them &amp; who owns them? <tspan fill="#38BDF8" font-weight="700">[Agent 365]</tspan></text>
  <text x="54" y="408" fill="#E2E8F0" font-size="11">2. Is all data visible to Copilot classified and sensitivity-labeled? <tspan fill="#C084FC" font-weight="700">[Purview]</tspan></text>
  <text x="54" y="430" fill="#E2E8F0" font-size="11">3. Whose identity do Agents use, and do permissions expire? <tspan fill="#818CF8" font-weight="700">[Entra Agent ID]</tspan></text>
  <text x="54" y="452" fill="#E2E8F0" font-size="11">4. If an Agent hits prompt injection, can SOC see &amp; block it? <tspan fill="#F43F5E" font-weight="700">[Defender + ISOC]</tspan></text>
  <text x="54" y="474" fill="#E2E8F0" font-size="11">5. Are local AI tools &amp; Shadow Agents on endpoints controlled? <tspan fill="#10B981" font-weight="700">[Defender + Intune]</tspan></text>
  <rect x="54" y="484" width="518" height="24" rx="5" fill="#1E293B"/>
  <text x="313" y="500" text-anchor="middle" fill="#7DD3FC" font-size="10.5" font-weight="700">Lead with Gap Discovery — Not Product SKU Pitching</text>

  <rect x="610" y="322" width="554" height="196" rx="10" fill="#0F172A" stroke="#A855F7" stroke-width="1.5"/>
  <text x="628" y="346" fill="#D8B4FE" font-size="12" font-weight="800" letter-spacing="0.8">6 MANDATORY QUESTIONS BEFORE SCALING AI (SLIDE 7)</text>
  <text x="628" y="364" fill="#94A3B8" font-size="10.5">Mapped across Observe · Govern · Secure control domains:</text>
  <text x="628" y="386" fill="#E2E8F0" font-size="11">• <tspan fill="#38BDF8" font-weight="700">Q1 (Observe)</tspan>: How many Agents are in the org &amp; where are the risks?</text>
  <text x="628" y="408" fill="#E2E8F0" font-size="11">• <tspan fill="#818CF8" font-weight="700">Q2 (Govern)</tspan>: Who is accountable for each Agent &amp; when is it retired?</text>
  <text x="628" y="430" fill="#E2E8F0" font-size="11">• <tspan fill="#10B981" font-weight="700">Q3 (Govern)</tspan>: Are Agent actions auditable and end-to-end traceable?</text>
  <text x="628" y="452" fill="#E2E8F0" font-size="11">• <tspan fill="#818CF8" font-weight="700">Q4 (Secure)</tspan>: What can each Agent access &amp; is it over-privileged?</text>
  <text x="628" y="474" fill="#E2E8F0" font-size="11">• <tspan fill="#C084FC" font-weight="700">Q5 (Secure)</tspan>: Will Copilot and Agents leak sensitive corporate data?</text>
  <text x="628" y="496" fill="#E2E8F0" font-size="11">• <tspan fill="#F43F5E" font-weight="700">Q6 (Secure)</tspan>: Can prompt injection attacks be detected &amp; blocked at runtime?</text>

  <!-- Section 3: 3-Phase Partner Service Model (Slide 35) + Toolkit Integration (Slides 39-41) -->
  <rect x="36" y="532" width="1128" height="196" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1.2"/>
  <text x="54" y="556" fill="#F8FAFC" font-size="13" font-weight="800" letter-spacing="0.8">STANDARDIZED PARTNER SERVICE FLYWHEEL: ASSESS → BUILD → OPERATE (SLIDES 35, 39–41)</text>

  <!-- Phase 1: Assess -->
  <rect x="54" y="568" width="352" height="146" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="68" y="590" fill="#38BDF8" font-size="13" font-weight="800">Phase 1 · ASSESS (Discovery &amp; Scoping)</text>
  <text x="68" y="610" fill="#CBD5E1" font-size="11">• Agent &amp; AI app inventory (including Shadow AI)</text>
  <text x="68" y="628" fill="#CBD5E1" font-size="11">• Copilot data oversharing &amp; label gap assessment</text>
  <text x="68" y="646" fill="#CBD5E1" font-size="11">• Identity &amp; over-permission blast-radius audit</text>
  <text x="68" y="666" fill="#7DD3FC" font-size="10.5" font-weight="700">Toolkit: MIP One-Pagers + Data Security Assistant + SOW Gen</text>
  <text x="68" y="684" fill="#FDE68A" font-size="10.5" font-weight="700">Deliverable: Risk Register &amp; Landing Zone Gap Report</text>

  <!-- Phase 2: Build -->
  <rect x="424" y="568" width="352" height="146" rx="8" fill="#0F172A" stroke="#818CF8" stroke-width="1.5"/>
  <text x="438" y="590" fill="#A5B4FC" font-size="13" font-weight="800">Phase 2 · BUILD (FTE Offer Week 3)</text>
  <text x="438" y="610" fill="#CBD5E1" font-size="11">• Entra Agent ID + Conditional Access + Access Packages</text>
  <text x="438" y="628" fill="#CBD5E1" font-size="11">• Purview Labels, DLP for Copilot &amp; DSPM for AI</text>
  <text x="438" y="646" fill="#CBD5E1" font-size="11">• Agent 365 Registry &amp; Defender runtime guardrails → SOC</text>
  <text x="438" y="666" fill="#A5B4FC" font-size="10.5" font-weight="700">Toolkit: 6 Deployment Guides (360p) + PowerShell Scripts</text>
  <text x="438" y="684" fill="#FDE68A" font-size="10.5" font-weight="700">Deliverable: Production-Ready Secure AI Baseline</text>

  <!-- Phase 3: Operate -->
  <rect x="794" y="568" width="352" height="146" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <text x="808" y="590" fill="#6EE7B7" font-size="13" font-weight="800">Phase 3 · OPERATE (Managed Frontier SOC)</text>
  <text x="808" y="610" fill="#CBD5E1" font-size="11">• New Agent admission gating &amp; periodic access review</text>
  <text x="808" y="628" fill="#CBD5E1" font-size="11">• Continuous AI threat monitoring &amp; IR via Defender ISOC</text>
  <text x="808" y="646" fill="#CBD5E1" font-size="11">• Compliance audit, unethical behavior &amp; eDiscovery ops</text>
  <text x="808" y="666" fill="#6EE7B7" font-size="10.5" font-weight="700">Commercial Levers: E5→E7 Upsell · Agent 365 · ISOC MSSP</text>
  <text x="808" y="684" fill="#FDE68A" font-size="10.5" font-weight="700">Deliverable: Managed Services &amp; Recurring ARR</text>
</svg>
