  <text x="624" y="662" fill="#E2E8F0" font-size="11">• <tspan font-weight="700" fill="#FDE68A">90-Day Data Retention</tspan> · Content Hub + CI/CD · Threat Intelligence Platform · SOC Optimization</text>
  <text x="624" y="680" fill="#E2E8F0" font-size="11">• <tspan font-weight="700" fill="#34D399">Project Perception General Availability (GA)</tspan></text>
