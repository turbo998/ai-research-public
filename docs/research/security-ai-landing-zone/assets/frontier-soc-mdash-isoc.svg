  <text x="70" y="680" fill="#E2E8F0" font-size="11">• <tspan font-weight="700">SOAR Playbook Builder</tspan>, Workbooks &amp; Built-in <tspan font-weight="700">UEBA / SIEM Analytics</tspan></text>
  <text x="70" y="698" fill="#E2E8F0" font-size="11">• <tspan font-weight="700">Autonomous Defense</tspan>: Disrupt multi-stage ransomware attacks within minutes</text>

