  <text x="54" y="446" fill="#E2E8F0" font-size="11.5" font-weight="600">Graphs: Attack Graph · Lateral Movement · Process Tree · Identity Graph · Exposure Graph · Agent Exposure</text>
  <text x="54" y="468" fill="#94A3B8" font-size="11">• <tspan fill="#7DD3FC" font-weight="600">Endpoint &amp; Process Tables</tspan>: DeviceInfo, DeviceProcessEvents, DeviceLogonEvents, DeviceNetworkEvents, DeviceRegistryEvents</text>
  <text x="54" y="486" fill="#94A3B8" font-size="11">• <tspan fill="#A5B4FC" font-weight="600">Identity &amp; Principal Tables</tspan>: SignInLogs, IdentityLogonEvents, IdentityDirectoryEvents, IdentityInfo, AADServicePrincipalSignIn</text>
  <text x="54" y="504" fill="#94A3B8" font-size="11">• <tspan fill="#D8B4FE" font-weight="600">XDR, Cloud &amp; Email Tables</tspan>: AlertInfo, AlertEvidence, SecurityIncident, EmailEvents, ARGResources, BehaviorAnalytics</text>
  <text x="54" y="522" fill="#94A3B8" font-size="11">• <tspan fill="#6EE7B7" font-weight="600">Exposure &amp; Red Team Tables</tspan>: ExposureGraphNodes, ExposureGraphEdges, RedTeamOperations</text>
  <text x="54" y="540" fill="#CBD5E1" font-size="10.5">Sources: Defender for Endpoint · Entra ID · Microsoft Sentinel · Azure Resource Manager · UEBA · Exposure Mgmt · Threat Intel</text>

