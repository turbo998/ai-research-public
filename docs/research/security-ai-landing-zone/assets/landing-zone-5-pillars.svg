  <rect x="54" y="233" width="255" height="32" rx="6" fill="#0F172A" stroke="#3B82F6" stroke-width="1"/>
  <text x="181" y="253" text-anchor="middle" fill="#E2E8F0" font-size="11.5" font-weight="600">Microsoft Agents (OOTB Native)</text>
