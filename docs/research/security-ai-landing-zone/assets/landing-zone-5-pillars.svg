  <rect width="1200" height="760" rx="16" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="1168" height="728" rx="12" fill="none" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="36" y="50" fill="#38BDF8" font-size="12" font-weight="700" letter-spacing="1.5">SECURITY FOR AI · FRONTIER ARCHITECTURE (SLIDES 6–23)</text>
  <text x="36" y="76" fill="#F8FAFC" font-size="22" font-weight="800">Secure AI Landing Zone: Copilot as UI × Microsoft Agent 365 &amp; 5 Security Pillars</text>
  <text x="36" y="98" fill="#94A3B8" font-size="12.5">Every AI Agent is "Born Governed" — Unified Entry Point, 5-Pillar Control Plane, E5/E7 Frontier Suite Foundation, and ISOC in Defender</text>

