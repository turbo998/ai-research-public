  <text x="744" y="253" text-anchor="middle" fill="#E2E8F0" font-size="11.5" font-weight="600">LangChain · CrewAI · Vertex · Bedrock</text>
  <rect x="891" y="233" width="254" height="32" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="1"/>
  <text x="1018" y="253" text-anchor="middle" fill="#FDE68A" font-size="11.5" font-weight="600">Local CLI / IDE / Claw / Shadow Agents</text>

  <!-- Layer 3: Control Plane Header (Microsoft Agent 365) -->
  <rect x="36" y="288" width="1128" height="44" rx="8" fill="url(#agent365Grad)" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="54" y="315" fill="#FFFFFF" font-size="14" font-weight="800">CONTROL PLANE · MICROSOFT AGENT 365 (SLIDES 8–9, 23)</text>
  <text x="520" y="315" fill="#E0F2FE" font-size="12.5" font-weight="600">Observe (Real-time Telemetry)  ·  Govern (Lifecycle &amp; Guardrails)  ·  Secure (Runtime Protection)</text>

  <!-- 5 Pillars Columns -->
  <!-- Pillar 1 -->
  <rect x="36" y="342" width="216" height="246" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="36" y="342" width="216" height="36" rx="10" fill="#0369A1"/>
  <text x="144" y="365" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="800">① Visibility &amp; Governance</text>
  <text x="48" y="396" fill="#7DD3FC" font-size="11" font-weight="700">Agent 365 · M365 Admin Center</text>
  <text x="48" y="418" fill="#CBD5E1" font-size="11">• Unified Agent 365 Registry</text>
  <text x="48" y="438" fill="#CBD5E1" font-size="11">• Owner assignment &amp; lifecycle</text>
  <text x="48" y="458" fill="#CBD5E1" font-size="11">• Native: Foundry / Copilot Studio</text>
  <text x="48" y="478" fill="#CBD5E1" font-size="11">• SDK: M365 / OpenAI / LangChain</text>
  <text x="48" y="498" fill="#CBD5E1" font-size="11">• Registry Sync: Vertex / Bedrock</text>
  <text x="48" y="518" fill="#FDE68A" font-size="11">• Endpoint/Network Shadow AI:</text>
  <text x="56" y="536" fill="#94A3B8" font-size="10.5">CLI, IDE, Claw-based, SaaS</text>
  <rect x="48" y="550" width="192" height="26" rx="5" fill="#1E293B" stroke="#0284C7" stroke-width="1"/>
  <text x="144" y="567" text-anchor="middle" fill="#38BDF8" font-size="10.5" font-weight="700">Answers Pre-Scale Q1 &amp; Q2</text>

  <!-- Pillar 2 -->
  <rect x="264" y="342" width="216" height="246" rx="10" fill="#0F172A" stroke="#6366F1" stroke-width="1.5"/>
  <rect x="264" y="342" width="216" height="36" rx="10" fill="#4338CA"/>
  <text x="372" y="365" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="800">② Identity &amp; Access</text>
  <text x="276" y="396" fill="#A5B4FC" font-size="11" font-weight="700">Microsoft Entra · Agent ID</text>
  <text x="276" y="418" fill="#CBD5E1" font-size="11">• Unique Entra Agent ID per agent</text>
  <text x="276" y="438" fill="#CBD5E1" font-size="11">• Access Packages define exact</text>
  <text x="284" y="454" fill="#94A3B8" font-size="10.5">allowed resources &amp; expiry</text>
  <text x="276" y="474" fill="#CBD5E1" font-size="11">• Eliminate over-privileged blast</text>
  <text x="284" y="490" fill="#94A3B8" font-size="10.5">radius &amp; permanent tokens</text>
  <text x="276" y="510" fill="#CBD5E1" font-size="11">• Continuous Risk Evaluation:</text>
  <text x="284" y="526" fill="#94A3B8" font-size="10.5">anomalous activity → CA Block</text>
  <rect x="276" y="550" width="192" height="26" rx="5" fill="#1E293B" stroke="#6366F1" stroke-width="1"/>
  <text x="372" y="567" text-anchor="middle" fill="#A5B4FC" font-size="10.5" font-weight="700">Answers Pre-Scale Q4</text>

  <!-- Pillar 3 -->
  <rect x="492" y="342" width="216" height="246" rx="10" fill="#0F172A" stroke="#A855F7" stroke-width="1.5"/>
  <rect x="492" y="342" width="216" height="36" rx="10" fill="#7E22CE"/>
  <text x="600" y="365" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="800">③ Data Security</text>
  <text x="504" y="396" fill="#D8B4FE" font-size="11" font-weight="700">Microsoft Purview · DSPM for AI</text>
  <text x="504" y="418" fill="#CBD5E1" font-size="11">• Sensitivity Labels inherited &amp;</text>
  <text x="512" y="434" fill="#94A3B8" font-size="10.5">respected by Copilot &amp; Agents</text>
  <text x="504" y="454" fill="#CBD5E1" font-size="11">• Purview DLP auto-masks/blocks</text>
  <text x="512" y="470" fill="#94A3B8" font-size="10.5">sensitive data from leaving</text>
  <text x="504" y="490" fill="#CBD5E1" font-size="11">• DSPM for AI central visibility</text>
  <text x="504" y="510" fill="#CBD5E1" font-size="11">• Insider Risk Management scores</text>
  <text x="512" y="526" fill="#94A3B8" font-size="10.5">risky agents → XDR correlation</text>
  <rect x="504" y="550" width="192" height="26" rx="5" fill="#1E293B" stroke="#A855F7" stroke-width="1"/>
  <text x="600" y="567" text-anchor="middle" fill="#D8B4FE" font-size="10.5" font-weight="700">Answers Pre-Scale Q5</text>

  <!-- Pillar 4 -->
  <rect x="720" y="342" width="216" height="246" rx="10" fill="#0F172A" stroke="#F43F5E" stroke-width="1.5"/>
  <rect x="720" y="342" width="216" height="36" rx="10" fill="#BE123C"/>
  <text x="828" y="365" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="800">④ Threat Protection</text>
  <text x="732" y="396" fill="#FDA4AF" font-size="11" font-weight="700">Defender XDR · Defender for Cloud</text>
  <text x="732" y="418" fill="#CBD5E1" font-size="11">• Runtime inspection of prompts,</text>
  <text x="740" y="434" fill="#94A3B8" font-size="10.5">outputs, tool calls, MCP &amp; APIs</text>
  <text x="732" y="454" fill="#CBD5E1" font-size="11">• Real-time blocking of prompt</text>
  <text x="740" y="470" fill="#94A3B8" font-size="10.5">injection &amp; malicious tool calls</text>
  <text x="732" y="490" fill="#CBD5E1" font-size="11">• Agent Posture &amp; Attack Path</text>
  <text x="740" y="506" fill="#94A3B8" font-size="10.5">Graph across tools/dependencies</text>
  <text x="732" y="526" fill="#CBD5E1" font-size="11">• Local endpoint agent guardrails</text>
  <rect x="732" y="550" width="192" height="26" rx="5" fill="#1E293B" stroke="#F43F5E" stroke-width="1"/>
  <text x="828" y="567" text-anchor="middle" fill="#FDA4AF" font-size="10.5" font-weight="700">Answers Pre-Scale Q6</text>

  <!-- Pillar 5 -->
  <rect x="948" y="342" width="216" height="246" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="948" y="342" width="216" height="36" rx="10" fill="#047857"/>
  <text x="1056" y="365" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="800">⑤ Compliance &amp; Audit</text>
  <text x="960" y="396" fill="#6EE7B7" font-size="11" font-weight="700">Purview Audit · Comm Compliance</text>
  <text x="960" y="418" fill="#CBD5E1" font-size="11">• Default Audit for all Agent</text>
  <text x="968" y="434" fill="#94A3B8" font-size="10.5">interactions (said, did, accessed)</text>
  <text x="960" y="454" fill="#CBD5E1" font-size="11">• OOTB classifiers detect unethical</text>
  <text x="968" y="470" fill="#94A3B8" font-size="10.5">behavior (e.g., kickback/gift offers)</text>
  <text x="960" y="490" fill="#CBD5E1" font-size="11">• Harmful content &amp; IP infringement</text>
  <text x="960" y="510" fill="#CBD5E1" font-size="11">• Retention, deletion &amp; defensible</text>
  <text x="968" y="526" fill="#94A3B8" font-size="10.5">eDiscovery for legal investigations</text>
  <rect x="960" y="550" width="192" height="26" rx="5" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="1056" y="567" text-anchor="middle" fill="#6EE7B7" font-size="10.5" font-weight="700">Answers Pre-Scale Q3</text>

  <!-- Layer 4: Licensing Foundation (M365 E7 Frontier Suite & Agent 365 Prerequisites) -->
  <rect x="36" y="600" width="1128" height="64" rx="10" fill="#1E1B4B" stroke="#6366F1" stroke-width="1.5"/>
  <text x="54" y="622" fill="#C7D2FE" font-size="11.5" font-weight="800" letter-spacing="1">FOUNDATION · MICROSOFT 365 E7 FRONTIER SUITE &amp; AGENT 365 PREREQUISITES (SLIDES 8, 22–23)</text>
  <text x="54" y="644" fill="#E2E8F0" font-size="11.5">• <tspan font-weight="700" fill="#38BDF8">M365 E7 Frontier Suite</tspan>: M365 E5 (Defender + Purview + Intune) + Microsoft Agent 365 + Entra Suite + M365 Copilot &amp; Work IQ</text>
  <text x="54" y="659" fill="#94A3B8" font-size="11">• <tspan font-weight="700" fill="#FDE68A">Agent 365 Prerequisite</tspan> (any 1): M365 E5 / A5 / Business Premium  |  Defender Suite + Purview Suite (Commercial / Edu / FLW)</text>

  <!-- Layer 5: Security Operations (ISOC in Microsoft Defender) -->
  <rect x="36" y="674" width="1128" height="54" rx="10" fill="url(#isocGrad)" stroke="#2DD4BF" stroke-width="1.5"/>
  <text x="54" y="696" fill="#CCFBF1" font-size="12" font-weight="800" letter-spacing="1">SECURITY OPERATIONS · ISOC IN MICROSOFT DEFENDER (DEFENDER XDR + SENTINEL · SLIDES 8, 16, 28–32)</text>
  <text x="54" y="716" fill="#FFFFFF" font-size="11.5">Unified AgentSOC: Converges telemetry across all 5 Pillars · Built-in SIEM / SOAR / UEBA / Case Mgmt · Autonomous Attack Disruption · Project Perception &amp; MDASH</text>
</svg>
