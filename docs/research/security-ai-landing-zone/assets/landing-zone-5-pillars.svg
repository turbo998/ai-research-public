  <rect x="36" y="114" width="1128" height="78" rx="10" fill="url(#uiGrad)" stroke="#818CF8" stroke-width="1.5"/>
  <text x="54" y="136" fill="#E0E7FF" font-size="11" font-weight="700" letter-spacing="1.2">EXPERIENCE LAYER · COPILOT AS THE UI FOR AI (SLIDE 6) — ONE ENTRY POINT = ONE CONTROL POINT</text>
  <rect x="54" y="146" width="190" height="34" rx="6" fill="#0F172A" fill-opacity="0.55" stroke="#A5B4FC" stroke-width="1"/>
  <text x="149" y="167" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="700">Copilot Chat &amp; Work IQ</text>
  <rect x="256" y="146" width="190" height="34" rx="6" fill="#0F172A" fill-opacity="0.55" stroke="#A5B4FC" stroke-width="1"/>
  <text x="351" y="167" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="700">Researcher &amp; Cowork</text>
  <rect x="458" y="146" width="225" height="34" rx="6" fill="#0F172A" fill-opacity="0.55" stroke="#A5B4FC" stroke-width="1"/>
  <text x="570" y="167" text-anchor="middle" fill="#F8FAFC" font-size="12" font-weight="700">Agents in Copilot &amp; Teams</text>
  <rect x="695" y="146" width="450" height="34" rx="6" fill="#450A0A" fill-opacity="0.78" stroke="#F87171" stroke-width="1"/>
  <text x="920" y="167" text-anchor="middle" fill="#FECACA" font-size="11.5" font-weight="700">Anti-Pattern: Fragmented Entry = Shadow AI (Isolated Logins, No Audit)</text>

