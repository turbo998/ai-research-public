schema_version: 1
initiative:
  id: pelican-bicycle-sim
  name: Pelican Riding a Bicycle Procedural Kinematics Engine
  customer: Visual Benchmark Lab
  description: Interactive 2D SVG/Canvas inverse-kinematics simulation of a brown pelican pedaling a road
    bicycle with telemetry HUD.
evaluated_at: '2026-10-23'
framework:
  framework_version: 1
  bands:
    high: 65
    medium: 40
  confidence_floor: 40
  dimensions:
    value:
      label: Value
      question: Is it worth doing?
      areas:
        business_value:
          label: Business value
          weight: 60
          metrics:
            financial_impact:
              label: Financial impact (savings / revenue)
              weight: 35
              probe: What annual cost saving or revenue uplift is expected, and how was it estimated?
            scale_of_impact:
              label: Scale of impact
              weight: 25
              probe: How many users, transactions, cases or processes per month would the initiative touch?
            experience_impact:
              label: Customer / employee experience impact
              weight: 20
              probe: Which customer or employee pain points does it remove, and how severe are they today?
            measurability:
              label: Measurability (KPIs and baseline)
              weight: 20
              probe: Which KPIs will prove success, and is a current baseline available?
        strategic_alignment:
          label: Strategic alignment
          weight: 40
          metrics:
            strategic_fit:
              label: Fit with strategic goals / OKRs
              weight: 35
              probe: Which corporate goals or OKRs does this initiative directly support?
            executive_sponsorship:
              label: Executive sponsorship
              weight: 30
              gate: no_executive_sponsor
              probe: Who is the executive sponsor, and have they committed to the initiative?
            urgency:
              label: Urgency / cost of delay
              weight: 20
              probe: Is there a deadline, regulatory date or measurable cost of waiting?
            differentiation_reuse:
              label: Differentiation / reuse potential
              weight: 15
              probe: Does it create competitive advantage or a reusable capability for other use cases?
    feasibility:
      label: Feasibility
      question: Can it be done with AI, safely?
      areas:
        ai_suitability:
          label: AI suitability
          weight: 35
          metrics:
            task_ai_fit:
              label: How well the task suits GenAI / agents
              weight: 40
              gate: ai_unsuitable
              probe: Is the task language-, reasoning- or unstructured-content heavy, or is it deterministic
                rule logic?
            error_tolerance:
              label: Tolerance for errors and varied outputs
              weight: 30
              probe: What is the business impact of an incorrect or inconsistent AI output?
            human_oversight:
              label: Feasibility of human review
              weight: 30
              probe: Can a human review, approve or correct AI outputs where needed?
        technical_feasibility:
          label: Technical feasibility
          weight: 40
          metrics:
            integration_complexity:
              label: Low integration complexity
              weight: 40
              probe: Which systems must the solution read from or write to, and do APIs exist?
            solution_complexity:
              label: Low solution complexity
              weight: 15
              probe: How many agents, tools, steps or novel techniques does the solution need?
            platform_maturity:
              label: Platform / stack maturity
              weight: 30
              probe: Is an Azure landing zone and AI platform (e.g., Foundry) already in place and approved?
            delivery_skills:
              label: Technical skills available to deliver
              weight: 15
              probe: Does the customer or partner team have the AI engineering skills to build and maintain
                it?
        risk_compliance:
          label: Risk and compliance
          weight: 25
          metrics:
            regulatory_exposure:
              label: Low regulatory exposure
              weight: 30
              gate: regulatory_prohibition
              probe: Which regulations apply (e.g., EU AI Act risk class, sector rules), and do any restrict
                this use?
            responsible_ai:
              label: Low Responsible AI / harm potential
              weight: 25
              probe: Could outputs cause harm, bias or unfair decisions about people?
            data_privacy:
              label: Manageable data privacy and sensitivity
              weight: 25
              probe: Does the solution process personal, confidential or regulated data, and how is it
                protected?
            security_reputation:
              label: Low security / reputational exposure
              weight: 20
              probe: Is the solution exposed externally, and what is the reputational impact of a failure?
    readiness:
      label: Readiness
      question: Can we start now?
      areas:
        data_readiness:
          label: Data readiness
          weight: 50
          metrics:
            data_availability:
              label: Data availability
              weight: 30
              gate: no_data_available
              probe: Does the required data exist today, in sufficient volume and coverage, and have sample
                data files, knowledge documents and agent Q&A examples been shared?
            data_quality:
              label: Data quality
              weight: 25
              probe: How accurate, complete, current and consistent is the data?
            data_access:
              label: Data access path and permissions
              weight: 25
              gate: no_data_access
              probe: Is there an approved technical path and permission for the solution to access the
                data?
            data_governance:
              label: Data governance and ownership
              weight: 20
              probe: Is there a data owner, classification and usage approval for AI processing?
        org_readiness:
          label: Organisational readiness
          weight: 50
          metrics:
            business_owner:
              label: Business / process owner named
              weight: 25
              gate: no_business_owner
              probe: Who owns the business process and will be accountable for the outcome?
            stakeholder_availability:
              label: Stakeholder and SME availability
              weight: 20
              gate: stakeholders_not_committed
              probe: Are subject-matter experts and key stakeholders available for the delivery timeline,
                and for each system to integrate, which business and IT teams are responsible and have
                they committed?
            user_readiness:
              label: End-user readiness and appetite for change
              weight: 20
              probe: Are target users aware, willing and prepared to adopt the new way of working?
            funding:
              label: Funding commitment
              weight: 20
              probe: Is budget approved for build and run, or is funding still to be secured?
            run_ownership:
              label: Ownership of running it after go-live
              weight: 15
              gate: no_run_owner
              probe: Who will operate, monitor and improve the solution after go-live?
  gates:
    ai_unsuitable:
      type: hard
      label: AI is clearly unsuitable for the task
    regulatory_prohibition:
      type: hard
      label: Regulation prohibits or materially restricts the use case
    no_executive_sponsor:
      type: readiness
      label: No executive sponsor
    no_data_available:
      type: readiness
      label: Required data does not exist or no samples have been shared
    no_data_access:
      type: readiness
      label: No approved data access path
    no_business_owner:
      type: readiness
      label: No business / process owner
    stakeholders_not_committed:
      type: readiness
      label: Key stakeholders or per-system business / IT integration teams not identified or not committed
    no_run_owner:
      type: readiness
      label: No owner for running the solution after go-live
    security_approval_missing:
      type: readiness
      label: Required security or compliance approval not yet granted
sources:
- id: S1
  title: Visual Benchmark Lab Charter — Procedural Pelican Bicycle Kinematics
  type: stakeholder-brief
  date: '2026-10-23'
  summary: Requires an interactive 60 FPS SVG/Canvas pelican riding a road bicycle with analytical 2-bone
    IK pedaling, variable gear ratio, wind physics, and live telemetry HUD.
scores:
  business_value.financial_impact:
    score: 4
    evidence:
    - source: S1
      basis: stated
      quote: Eliminates manual keyframe animation costs by synthesizing procedural SVG/IK kinematics directly
        in browser.
    rationale: Eliminates manual keyframe animation costs by synthesizing procedural SVG/IK kinematics
      directly in browser.
  business_value.scale_of_impact:
    score: 4
    evidence:
    - source: S1
      basis: stated
      quote: Used as the canonical cross-model and cross-harness visual benchmark published on GitHub
        Pages.
    rationale: Used as the canonical cross-model and cross-harness visual benchmark published on GitHub
      Pages.
  business_value.experience_impact:
    score: 4
    evidence:
    - source: S1
      basis: stated
      quote: Provides real-time interactive cadence, gear ratio, headwind, and skeletal X-ray inspection.
    rationale: Provides real-time interactive cadence, gear ratio, headwind, and skeletal X-ray inspection.
  business_value.measurability:
    score: 5
    evidence:
    - source: S1
      basis: stated
      quote: 'Strict quantitative KPIs: 60 FPS frame budget (<16.6ms), 0px pedal detachment error, and
        deterministic IK closure.'
    rationale: 'Strict quantitative KPIs: 60 FPS frame budget (<16.6ms), 0px pedal detachment error, and
      deterministic IK closure.'
  strategic_alignment.strategic_fit:
    score: 4
    evidence:
    - source: S1
      basis: stated
      quote: Directly validates composable SDLC agent practices vs. context engineering meta-generators.
    rationale: Directly validates composable SDLC agent practices vs. context engineering meta-generators.
