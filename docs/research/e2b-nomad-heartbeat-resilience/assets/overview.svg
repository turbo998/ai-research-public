<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="980" height="470" rx="16" fill="#0B1120"/>
  <rect x="24" y="20" width="932" height="78" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="52" fill="#F8FAFC" font-size="20" font-weight="700">E2B × Nomad Heartbeat Race Condition &amp; 3-Layer Resilience Architecture</text>
  <text x="44" y="78" fill="#94A3B8" font-size="12.5">Why a 39s network blackhole survives while a 21s jitter kills every active Firecracker MicroVM — and how to fix it</text>
  <rect x="780" y="34" width="156" height="46" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="858" y="62" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="700">0 FALSE KILLS &lt;=35s</text>
  
  <rect x="24" y="116" width="292" height="270" rx="12" fill="#0F172A" stroke="#0EA5E9" stroke-width="1.8"/>
  <rect x="24" y="116" width="292" height="40" rx="12" fill="#0EA5E9" fill-opacity="0.22"/>
  <text x="40" y="142" fill="#38BDF8" font-size="14" font-weight="700">1. Dual-Plane Timer Conflict</text>
  <text x="40" y="188" fill="#CBD5E1" font-size="12">• Control Plane: Nomad Leader HTTP heartbeat</text><text x="40" y="214" fill="#CBD5E1" font-size="12">  (heartbeat_grace = 10s + 10-20s window)</text><text x="40" y="240" fill="#CBD5E1" font-size="12">• Data Plane: Consul-Connect / Yamux stream</text><text x="40" y="266" fill="#CBD5E1" font-size="12">  (10s keepalive + 30s write timeout = 40s)</text><text x="40" y="292" fill="#CBD5E1" font-size="12">• Unsynchronized phase creates fatal race</text>
  <rect x="40" y="336" width="260" height="34" rx="6" fill="#1E293B" stroke="#0EA5E9" stroke-width="1"/>
  <text x="170" y="358" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700">Nomad 20-30s vs Yamux 10-40s</text>
  <rect x="344" y="116" width="292" height="270" rx="12" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.8"/>
  <rect x="344" y="116" width="292" height="40" rx="12" fill="#8B5CF6" fill-opacity="0.22"/>
  <text x="360" y="142" fill="#C4B5FD" font-size="14" font-weight="700">2. The 21s vs 39s Paradox</text>
  <text x="360" y="188" fill="#CBD5E1" font-size="12">• At t=21s: Nomad Leader marks node down</text><text x="360" y="214" fill="#CBD5E1" font-size="12">  and triggers stop_after_client_disconnect</text><text x="360" y="240" fill="#CBD5E1" font-size="12">• At t=39s: if heartbeat landed right before</text><text x="360" y="266" fill="#CBD5E1" font-size="12">  outage, Yamux survives up to 40s window</text><text x="360" y="292" fill="#CBD5E1" font-size="12">• Phase alignment dictates survival vs kill</text>
  <rect x="360" y="336" width="260" height="34" rx="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
  <text x="490" y="358" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700">Phase-Dependent Sandbox Kill</text>
  <rect x="664" y="116" width="292" height="270" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
  <rect x="664" y="116" width="292" height="40" rx="12" fill="#10B981" fill-opacity="0.22"/>
  <text x="680" y="142" fill="#6EE7B7" font-size="14" font-weight="700">3. Three-Layer Production Fix</text>
  <text x="680" y="188" fill="#CBD5E1" font-size="12">• L1: max_client_disconnect = 5m (preserve</text><text x="680" y="214" fill="#CBD5E1" font-size="12">  running Firecracker MicroVMs on transient blip)</text><text x="680" y="240" fill="#CBD5E1" font-size="12">• L2: heartbeat_grace = 50s (&gt; Yamux 40s max)</text><text x="680" y="266" fill="#CBD5E1" font-size="12">• L3: Orchestrator idempotent reconnect +</text><text x="680" y="292" fill="#CBD5E1" font-size="12">  UFFD/NBD snapshot fallback on real node loss</text>
  <rect x="680" y="336" width="260" height="34" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="810" y="358" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700">100% Sandbox Survival &lt;=35s Blip</text>
  <rect x="24" y="402" width="932" height="48" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="44" y="431" fill="#E2E8F0" font-size="12.5" font-weight="600">Production Rule: Always set Nomad heartbeat_grace (50s) &gt; Yamux max detection window (40s) and decouple control-plane blips from MicroVM destruction.</text>
</svg>
