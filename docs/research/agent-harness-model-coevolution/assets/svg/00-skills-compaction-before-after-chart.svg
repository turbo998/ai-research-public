    <!-- After: 8.4 -> y=531.6, h=8.4 -->
    <rect x="1082" y="531.6" width="68" height="8.4" rx="2" fill="url(#afterBar)" stroke="#d29922" stroke-width="0.8"/>
    <text x="1116" y="522" text-anchor="middle" fill="#e3b341" font-size="14" font-weight="800">8.4</text>

