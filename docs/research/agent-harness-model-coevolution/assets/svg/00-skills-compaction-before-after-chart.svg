  <rect x="252" y="394" width="136" height="22" rx="4" fill="#2d1215" stroke="#f85149" stroke-width="0.9"/>
  <text x="320" y="409" text-anchor="middle" fill="#ff7b72" font-size="11" font-weight="700">12 KB 截断红线 (120)</text>

