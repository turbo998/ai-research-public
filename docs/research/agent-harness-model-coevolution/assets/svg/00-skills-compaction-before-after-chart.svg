    <text x="800" y="593" text-anchor="middle" fill="#8b949e" font-size="12">1 / 81 可见 → 62 / 62 全量可见</text>
  </g>

  <!-- GROUP 4: OpenClaw 主文件行数 (十行) | 139.0 vs 8.4 -->
  <g>
