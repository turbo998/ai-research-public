  <text x="60" y="636" fill="#8b949e" font-size="12">Provenance: measured (2026-11-18 Production Harness Audit) · 100% 可逆归档快照: ~/.copilot/skills-archive/2026-11-18/ · 适配前沿模型: Gemini 4 Carbon · GPT-6.2 Sol · Grok 4.7</text>
