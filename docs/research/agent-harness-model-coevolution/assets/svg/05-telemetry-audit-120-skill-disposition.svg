  <text x="684" y="329" text-anchor="middle" fill="#38BDF8" font-size="13" font-weight="800">+3 补齐</text>
  <text x="684" y="526" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="700">新增 SA 刚需</text>
  <text x="684" y="544" text-anchor="middle" fill="#8B949E" font-size="11">azure-sa-skills</text>

  <!-- Connector 62 -->
  <line x1="722" y1="338.8" x2="746" y2="338.8" stroke="#10B981" stroke-dasharray="3,3"/>

