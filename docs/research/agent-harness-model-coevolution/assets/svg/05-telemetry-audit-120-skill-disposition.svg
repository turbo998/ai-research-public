  <rect x="398" y="263.4" width="92" height="18.2" rx="3" fill="url(#redPrune)"/>
  <text x="444" y="254" text-anchor="middle" fill="#FF7B72" font-size="13" font-weight="800">-7</text>
  <text x="444" y="526" text-anchor="middle" fill="#FFA198" font-size="12" font-weight="700">跨OS/闲置软链</text>
  <text x="444" y="544" text-anchor="middle" fill="#8B949E" font-size="11">macOS sso-watcher等</text>

  <!-- Connector 84 -->
  <line x1="490" y1="281.6" x2="528" y2="281.6" stroke="#64748B" stroke-dasharray="3,3"/>

