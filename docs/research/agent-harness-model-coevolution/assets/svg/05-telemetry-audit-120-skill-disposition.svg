  <text x="86" y="593" fill="#CBD5E1" font-size="12">🛡️ <tspan fill="#6EE7B7" font-weight="700">100% 可逆安全网</tspan>：所有归档项完整保留于 <tspan font-family="ui-monospace, Consolas, monospace" fill="#38BDF8">~/.copilot/skills-archive/2026-11-18/</tspan>，随时可按单目录秒级回滚。</text>

  <!-- RIGHT PANEL: Disk Footprint & Key Findings -->
  <rect x="888" y="112" width="508" height="518" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
  <text x="914" y="144" fill="#F0F6FC" font-size="16" font-weight="800">B. 磁盘体积拆解与三大典型清理标靶</text>

