  <text x="52" y="86" fill="#8B949E" font-size="13.5">session_store_sql (tool_requests) 真实调用遥测驱动裁剪 · 净减 -56.97 MB (-50.2%) · 100% 可逆快照备份</text>

  <!-- LEFT CHART: Skill Count Waterfall (Y-axis: 0..130, y=500 is 0, 1 skill = 2.6 px) -->
  <rect x="44" y="112" width="820" height="518" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
  <text x="68" y="144" fill="#F0F6FC" font-size="16" font-weight="800">A. Skill 目录数量演进瀑布图 (120 审计基线 → -61 归档去重 → +3 补齐 → 62 活跃)</text>

