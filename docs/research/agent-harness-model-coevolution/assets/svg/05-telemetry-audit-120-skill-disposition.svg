  <text x="914" y="178" fill="#93C5FD" font-size="12.5" font-weight="700">优化前总占用：113.5 MB</text>
  <rect x="914" y="188" width="272" height="28" rx="4" fill="#1D4ED8"/>
  <rect x="1186" y="188" width="148" height="28" rx="4" fill="#EF4444"/>
  <text x="1260" y="207" text-anchor="middle" fill="#FFFFFF" font-size="11.5" font-weight="800">anatomy 重复 40MB</text>

  <text x="914" y="244" fill="#6EE7B7" font-size="12.5" font-weight="700">优化后净占用：56.5 MB (-56.97 MB / -50.2%)</text>
  <rect x="914" y="254" width="209" height="28" rx="4" fill="#10B981"/>
  <text x="1018" y="273" text-anchor="middle" fill="#052E16" font-size="12" font-weight="800">56.5 MB 精锐资产</text>

