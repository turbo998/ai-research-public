  <text x="930" y="347" fill="#CBD5E1" font-size="11.5">• <tspan font-family="ui-monospace, Consolas, monospace">.agents/skills/anatomy</tspan> 白占 40.0 MB（与 .copilot 完全重复）</text>
  <text x="930" y="367" fill="#CBD5E1" font-size="11.5">• 旧版 <tspan font-family="ui-monospace, Consolas, monospace">powerpoint</tspan> 锁死 haiku-4.5，与 <tspan font-family="ui-monospace, Consolas, monospace">pptx</tspan> + <tspan font-family="ui-monospace, Consolas, monospace">azure-style-presentation</tspan> 抢词</text>
  <text x="930" y="385" fill="#94A3B8" font-size="11">• 同时清理重复 <tspan font-family="ui-monospace, Consolas, monospace">hve-builder</tspan>，确立单一权威入口</text>

  <rect x="914" y="406" width="456" height="92" rx="8" fill="#0D1117" stroke="#F59E0B" stroke-width="1"/>
  <text x="930" y="429" fill="#FDE68A" font-size="12.5" font-weight="800">2. 零调用“整包导入税”与跨平台僵尸软链</text>
  <text x="930" y="451" fill="#CBD5E1" font-size="11.5">• <tspan font-family="ui-monospace, Consolas, monospace">session_store_sql</tspan> 证实 29 个整包导入的 hve-core 技能历史 0 调用</text>
  <text x="930" y="471" fill="#CBD5E1" font-size="11.5">• Windows 工作站上挂载 macOS Hammerspoon 守护进程 <tspan font-family="ui-monospace, Consolas, monospace">sso-watcher</tspan></text>
  <text x="930" y="489" fill="#94A3B8" font-size="11">• 移除 62 KB 从未激活的 <tspan font-family="ui-monospace, Consolas, monospace">daily-activity-log</tspan> 等 7 个无效 Junction</text>

  <rect x="914" y="510" width="456" height="98" rx="8" fill="#0F241D" stroke="#10B981" stroke-width="1"/>
  <text x="930" y="533" fill="#6EE7B7" font-size="12.5" font-weight="800">3. 逆向补齐 3 个高频 AI SA 实战缺口 (turbo998/azure-sa-skills)</text>
  <text x="930" y="555" fill="#E2E8F0" font-size="11.5">• <tspan font-family="ui-monospace, Consolas, monospace" fill="#34D399">billing-assistant</tspan>：PyMuPDF 锚点账单重写（新增跨平台 CJK 字体链）</text>
  <text x="930" y="575" fill="#E2E8F0" font-size="11.5">• <tspan font-family="ui-monospace, Consolas, monospace" fill="#34D399">chorus-azure-deployment</tspan>：ACA 极低成本部署 Chorus (PGlite + Bicep)</text>
  <text x="930" y="595" fill="#E2E8F0" font-size="11.5">• <tspan font-family="ui-monospace, Consolas, monospace" fill="#34D399">one-sentence-video</tspan>：一句话驱动 HyperFrames 三幕程序化动画视频</text>
