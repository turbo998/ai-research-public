  <g stroke="#21262D" stroke-width="1" stroke-dasharray="4,4">
    <line x1="112" y1="188" x2="836" y2="188"/>
    <line x1="112" y1="266" x2="836" y2="266"/>
    <line x1="112" y1="344" x2="836" y2="344"/>
    <line x1="112" y1="422" x2="836" y2="422"/>
  </g>
  <line x1="112" y1="500" x2="836" y2="500" stroke="#484F58" stroke-width="1.5"/>

