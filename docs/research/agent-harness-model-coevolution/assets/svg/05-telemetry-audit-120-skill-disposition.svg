  <!-- Col 1: Baseline 120 (83 + 37) -> h = 312px (y=188..500) -->
  <!-- .copilot/skills 83 = 215.8px (y=284.2..500) -->
  <rect x="138" y="284.2" width="92" height="215.8" rx="3" fill="url(#blueBase)"/>
  <text x="184" y="396" text-anchor="middle" fill="#FFFFFF" font-size="12" font-weight="700">.copilot (83)</text>
