  <rect width="1440" height="760" fill="url(#bg01)"/>

  <!-- Header -->
  <rect x="28" y="22" width="1384" height="84" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="54" y="56" fill="#F8FAFC" font-size="22" font-weight="800">模型 × Harness 持续协同演进五步闭环与“反脚手架定律”（Inverse Scaffolding Law）</text>
  <text x="54" y="84" fill="#94A3B8" font-size="13.5">5-Stage Model × Harness Co-Evolution Flywheel &amp; Why Stronger Frontier Reasoning Models Require Less Procedural CoT Micromanagement</text>
  <rect x="1186" y="38" width="204" height="50" rx="10" fill="#161B22" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="1288" y="59" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="800">Engineering Axiom #1</text>
  <text x="1288" y="77" text-anchor="middle" fill="#CBD5E1" font-size="11">Sharper Invariants &gt; Rigid CoT</text>

  <!-- LEFT PANEL: 5-Stage Co-Evolution Flywheel -->
  <rect x="28" y="122" width="668" height="614" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <text x="54" y="158" fill="#F0F6FC" font-size="17" font-weight="800">A. 五阶段持续协同演进闭环 (5-Stage Co-Evolution SOP)</text>
  <text x="54" y="180" fill="#8B949E" font-size="12.5">每当前沿模型升级（如 GPT-6.2 Sol / Gemini 4 Carbon / Grok 4.7）触发一次标准审计迭代</text>

  <!-- Stage 1 -->
  <rect x="64" y="202" width="596" height="82" rx="10" fill="#161B22" stroke="#2563EB" stroke-width="1.4"/>
  <circle cx="104" cy="243" r="21" fill="#1D4ED8"/>
  <text x="104" y="249" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">01</text>
  <text x="140" y="232" fill="#60A5FA" font-size="14.5" font-weight="800">模型代际跃迁与能力基线重标定 (Frontier Model Upgrade)</text>
  <text x="140" y="254" fill="#E2E8F0" font-size="12.5">原生 1M 上下文、xhigh 深度推理、多模态视觉与 Desktop Canvas 原语就绪</text>
  <text x="140" y="272" fill="#8B949E" font-size="11.5">Legacy pins (gpt-4o / gpt-5.4 / haiku-4.5) 瞬间从“稳定锚点”退化为“能力封顶枷锁”</text>

  <line x1="362" y1="284" x2="362" y2="304" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Stage 2 -->
  <rect x="64" y="306" width="596" height="82" rx="10" fill="#161B22" stroke="#0EA5E9" stroke-width="1.4"/>
  <circle cx="104" cy="347" r="21" fill="#0284C7"/>
  <text x="104" y="353" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">02</text>
  <text x="140" y="336" fill="#38BDF8" font-size="14.5" font-weight="800">真实遥测与系统预算探针审计 (Telemetry &amp; Prompt Cap Probe)</text>
  <text x="140" y="358" fill="#E2E8F0" font-size="12.5">联合查询 session_store_sql (tool_requests) 调用频次 + &lt;available_skills&gt; 12 KB 截断线</text>
  <text x="140" y="376" fill="#8B949E" font-size="11.5">实测揭露：120 目录 / 113.5 MB 中 98.8% (80/81) 用户 Skill 描述因超长被静默截断！</text>

  <line x1="362" y1="388" x2="362" y2="408" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Stage 3 -->
  <rect x="64" y="410" width="596" height="82" rx="10" fill="#161B22" stroke="#D97706" stroke-width="1.4"/>
  <circle cx="104" cy="451" r="21" fill="#B45309"/>
  <text x="104" y="457" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">03</text>
  <text x="140" y="440" fill="#FBBF24" font-size="14.5" font-weight="800">可逆归档裁剪与正交路由契约压缩 (Pruning &amp; 110–165c Contract)</text>
  <text x="140" y="462" fill="#E2E8F0" font-size="12.5">剔除 40MB 重复包、29 个零调用导入包与跨 OS 失效软链；全量备份至 skills-archive/</text>
  <text x="140" y="480" fill="#8B949E" font-size="11.5">统一三段式契约 [核心能力 + USE FOR + DO NOT USE FOR]：38.6K → 8,019 字符 (100% 可见)</text>

  <line x1="362" y1="492" x2="362" y2="512" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Stage 4 -->
  <rect x="64" y="514" width="596" height="82" rx="10" fill="#161B22" stroke="#10B981" stroke-width="1.4"/>
  <circle cx="104" cy="555" r="21" fill="#059669"/>
  <text x="104" y="561" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="800">04</text>
  <text x="140" y="544" fill="#34D399" font-size="14.5" font-weight="800">去旧式 CoT 脚手架、渐进式披露与原生原语升级 (De-Scaffolding)</text>
  <text x="140" y="566" fill="#E2E8F0" font-size="12.5">1,390 行单体拆分为 84 行核心 + 按需 references/；清理虚构工具，切换至 MCP 与原生 Canvas</text>
  <text x="140" y="584" fill="#8B949E" font-size="11.5">剥离手把手步骤剧本，保留硬性验收不变量（CSP、零捏造坐标、跨平台 CJK 字体回退链）</text>

  <line x1="362" y1="596" x2="362" y2="616" stroke="#10B981" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Stage 5 -->
  <rect x="64" y="618" width="596" height="92" rx="10" fill="#12261E" stroke="#10B981" stroke-width="1.6"/>
  <circle cx="104" cy="664" r="21" fill="#10B981"/>
  <text x="104" y="670" text-anchor="middle" fill="#052E16" font-size="15" font-weight="900">05</text>
  <text x="140" y="646" fill="#6EE7B7" font-size="14.5" font-weight="800">多模型认知专精路由与零预算治理 (Zero-Prompt-Cost Governance)</text>
  <text x="140" y="668" fill="#E2E8F0" font-size="12.5">按认知长板路由至 Gemini 4 Carbon / GPT-6.2 Sol / Grok 4.7 / Gemini 3.8 Flash</text>
  <text x="140" y="688" fill="#A7F3D0" font-size="11.5">治理矩阵置于 ~/.copilot/MODEL-SKILL-MATRIX.md（目录外 0 Bytes Prompt 开销）→ 闭环回馈 Stage 01</text>

  <!-- Feedback Loop Curve on Left Margin -->
  <path d="M 64 664 C 34 664, 34 243, 60 243" fill="none" stroke="#10B981" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrowGreen)"/>

  <!-- RIGHT PANEL: Inverse Scaffolding Law Visual Chart -->
  <rect x="716" y="122" width="696" height="614" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>
  <text x="744" y="158" fill="#F0F6FC" font-size="17" font-weight="800">B. 反脚手架定律曲线 (The Inverse Scaffolding Law)</text>
  <text x="744" y="180" fill="#8B949E" font-size="12.5">模型原生推理越强，越要削减“过程级步骤微操”，强化“边界不变量 + 原生工具契约”</text>

  <!-- Chart Legend -->
  <rect x="744" y="196" width="640" height="44" rx="8" fill="#161B22" stroke="#21262D"/>
  <line x1="764" y1="218" x2="798" y2="218" stroke="#F85149" stroke-width="3.5"/>
  <circle cx="781" cy="218" r="4.5" fill="#F85149"/>
  <text x="808" y="223" fill="#FFA198" font-size="12.5" font-weight="700">旧式过程微操权重 (Procedural Step-by-Step CoT)</text>

  <line x1="1104" y1="218" x2="1138" y2="218" stroke="#10B981" stroke-width="3.5"/>
  <circle cx="1121" cy="218" r="4.5" fill="#10B981"/>
  <text x="1148" y="223" fill="#6EE7B7" font-size="12.5" font-weight="700">边界契约与原生原语 (Invariants &amp; Native Tools)</text>

