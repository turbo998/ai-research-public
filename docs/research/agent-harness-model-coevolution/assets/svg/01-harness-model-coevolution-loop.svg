  <rect x="822" y="300" width="198" height="44" rx="6" fill="#2D1215" stroke="#F85149" stroke-width="0.9"/>
  <text x="832" y="318" fill="#FFA198" font-size="11" font-weight="700">Gen 1 必需：1,000+ 行死板剧本</text>
  <text x="832" y="335" fill="#E2E8F0" font-size="10.5">弥补早期模型规划弱点，但锁死工具路径</text>

  <rect x="1132" y="438" width="214" height="48" rx="6" fill="#2D1215" stroke="#F85149" stroke-width="0.9"/>
  <text x="1142" y="456" fill="#FFA198" font-size="11" font-weight="700">Gen 3 负资产：旧剧本引发幻觉与稀释</text>
  <text x="1142" y="473" fill="#E2E8F0" font-size="10.5">诱发已废弃工具调用 &amp; 挤占活跃推理窗口</text>

  <rect x="1116" y="296" width="232" height="50" rx="6" fill="#12261E" stroke="#10B981" stroke-width="1"/>
  <text x="1126" y="314" fill="#6EE7B7" font-size="11" font-weight="700">Gen 3 杠杆：84 行核心 + 原生 MCP/Canvas</text>
  <text x="1126" y="332" fill="#E2E8F0" font-size="10.5">只锁死输入输出边界，释放模型自主规划力</text>

  <!-- X-Axis Generation Labels -->
  <text x="840" y="546" text-anchor="middle" fill="#E2E8F0" font-size="12.5" font-weight="700">Gen 1 · 早期工具模型</text>
  <text x="840" y="564" text-anchor="middle" fill="#8B949E" font-size="11">GPT-4o · Claude 3.7 Sonnet</text>

  <text x="1078" y="546" text-anchor="middle" fill="#E2E8F0" font-size="12.5" font-weight="700">Gen 2 · 过渡推理模型</text>
  <text x="1078" y="564" text-anchor="middle" fill="#8B949E" font-size="11">GPT-5.4 · Claude Haiku 4.5</text>

  <text x="1316" y="546" text-anchor="middle" fill="#38BDF8" font-size="12.5" font-weight="800">Gen 3 · 当前前沿智能体舰队</text>
  <text x="1316" y="564" text-anchor="middle" fill="#93C5FD" font-size="11">Gemini 4 Carbon · GPT-6.2 Sol · Grok 4.7</text>

  <!-- Bottom Takeaway Cards inside Right Panel -->
  <rect x="744" y="586" width="310" height="124" rx="10" fill="#1C1317" stroke="#F85149" stroke-width="1"/>
  <text x="762" y="612" fill="#FF7B72" font-size="13" font-weight="800">⛔ 必须随模型升级剥离的“反模式脚手架”</text>
  <text x="762" y="634" fill="#E2E8F0" font-size="11.5">• 硬编码淘汰模型 ID (claude-haiku-4.5 / gpt-4o)</text>
  <text x="762" y="654" fill="#E2E8F0" font-size="11.5">• 虚构或废弃工具名 (search-the-web / runSubagent)</text>
  <text x="762" y="674" fill="#E2E8F0" font-size="11.5">• 逐行规定“先想A再想B”的冗长八股文 CoT 模板</text>
  <text x="762" y="694" fill="#E2E8F0" font-size="11.5">• 动辄 700–1,012 字符的营销式 Frontmatter 描述</text>

  <rect x="1074" y="586" width="310" height="124" rx="10" fill="#0F241D" stroke="#10B981" stroke-width="1"/>
  <text x="1092" y="612" fill="#34D399" font-size="13" font-weight="800">✅ 随前沿模型强化的“高杠杆确定性边界”</text>
  <text x="1092" y="634" fill="#E2E8F0" font-size="11.5">• 110–165 字符正交契约 (USE FOR / DO NOT USE FOR)</text>
  <text x="1092" y="654" fill="#E2E8F0" font-size="11.5">• MCP 权威信源接地 (azure-pricing / microsoft-learn)</text>
  <text x="1092" y="674" fill="#E2E8F0" font-size="11.5">• 原生 Desktop Canvas 渲染闭环 + 确定性验证脚本</text>
  <text x="1092" y="694" fill="#E2E8F0" font-size="11.5">• 按需渐进加载 references/ (保护前缀 KV Cache)</text>
</svg>
