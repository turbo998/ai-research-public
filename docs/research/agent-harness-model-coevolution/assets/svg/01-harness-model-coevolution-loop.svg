  <path d="M 840 498 C 950 485, 1010 425, 1078 395 C 1146 365, 1220 292, 1316 282" fill="none" stroke="#10B981" stroke-width="4"/>
  <circle cx="840" cy="498" r="6" fill="#10B981"/>
  <circle cx="1078" cy="395" r="6" fill="#FBBF24" stroke="#0D1117" stroke-width="2"/>
  <circle cx="1316" cy="282" r="6" fill="#10B981"/>

