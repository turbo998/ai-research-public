  <g stroke="#21262D" stroke-width="1" stroke-dasharray="4,4">
    <line x1="800" y1="270" x2="1356" y2="270"/>
    <line x1="800" y1="332.5" x2="1356" y2="332.5"/>
    <line x1="800" y1="395" x2="1356" y2="395"/>
    <line x1="800" y1="457.5" x2="1356" y2="457.5"/>
  </g>
  <line x1="800" y1="520" x2="1356" y2="520" stroke="#484F58" stroke-width="1.5"/>
  <line x1="800" y1="270" x2="800" y2="520" stroke="#484F58" stroke-width="1.5"/>

