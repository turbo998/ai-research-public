  <text x="1078" y="290" text-anchor="middle" fill="#FBBF24" font-size="11" font-weight="700">能力拐点区</text>

  <!-- Descending Curve: Procedural CoT (840,285) -> (1078,395) -> (1316,502) -->
  <path d="M 840 285 C 950 295, 1010 365, 1078 395 C 1146 425, 1220 492, 1316 502" fill="none" stroke="#F85149" stroke-width="4"/>
  <circle cx="840" cy="285" r="6" fill="#F85149"/>
  <circle cx="1078" cy="395" r="6" fill="#F85149"/>
  <circle cx="1316" cy="502" r="6" fill="#F85149"/>

