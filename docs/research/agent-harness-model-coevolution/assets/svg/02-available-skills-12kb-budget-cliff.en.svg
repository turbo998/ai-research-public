<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 740" width="1440" height="740" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif">
  <defs>
    <pattern id="deadZoneHatchEn" width="12" height="12" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#2A1215"/>
      <line x1="0" y1="0" x2="0" y2="12" stroke="#7F1D1D" stroke-width="4"/>
    </pattern>
    <linearGradient id="safeGreenEn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
    <linearGradient id="warnAmberEn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="740" fill="#090D13"/>
  <rect x="20" y="20" width="1400" height="700" rx="14" fill="#0D1117" stroke="#30363D" stroke-width="1.5"/>

  <!-- Header -->
  <text x="54" y="62" fill="#F0F6FC" font-size="22" font-weight="800">Case Study 1: The &lt;available_skills&gt; 12 KB Prompt Budget Cliff (1.2% → 100% Visibility)</text>
  <text x="54" y="89" fill="#8B949E" font-size="13.5">Proportional 0–40,000 Char Axis (1,000 chars = 28 px): How 15 Verbose Descriptions Exhausted the 12 KB Cap &amp; Blinded 80/81 User Skills</text>

  <!-- Scale Ruler -->
  <line x1="250" y1="138" x2="1370" y2="138" stroke="#484F58" stroke-width="1.5"/>
  <g fill="#8B949E" font-size="12" text-anchor="middle" font-family="ui-monospace, Consolas, monospace">
    <line x1="250" y1="132" x2="250" y2="144" stroke="#484F58"/>
    <text x="250" y="125">0</text>
    <line x1="390" y1="132" x2="390" y2="144" stroke="#484F58"/>
    <text x="390" y="125">5,000</text>
    <line x1="530" y1="132" x2="530" y2="144" stroke="#484F58"/>
    <text x="530" y="125">10,000</text>
    <text x="586" y="118" fill="#FF7B72" font-weight="800">12,000 (~12 KB Cap)</text>
    <line x1="810" y1="132" x2="810" y2="144" stroke="#484F58"/>
    <text x="810" y="125">20,000</text>
    <line x1="1090" y1="132" x2="1090" y2="144" stroke="#484F58"/>
    <text x="1090" y="125">30,000</text>
    <line x1="1330.8" y1="132" x2="1330.8" y2="144" stroke="#58A6FF"/>
    <text x="1330.8" y="125" fill="#58A6FF" font-weight="700">38,600</text>
  </g>

  <!-- TRACK 1: BEFORE -->
  <text x="54" y="198" fill="#F85149" font-size="15.5" font-weight="800">Before Audit</text>
  <text x="54" y="220" fill="#E2E8F0" font-size="12.5">Demand ~38,600 chars</text>
  <text x="54" y="240" fill="#FF7B72" font-size="12" font-weight="700">Only 1 / 81 (1.2%) visible!</text>

  <rect x="250" y="172" width="33.5" height="78" rx="4" fill="#334155" stroke="#64748B"/>
  <rect x="283.5" y="172" width="302.5" height="78" fill="url(#warnAmberEn)" stroke="#F59E0B"/>
  <text x="435" y="205" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="800">15 Verbose .agents Skills (10,805 chars)</text>
  <text x="435" y="226" text-anchor="middle" fill="#FEF3C7" font-size="11">700–1,012 chars each + plugins hit 12 KB ceiling</text>

  <rect x="586.0" y="172" width="744.8" height="78" rx="4" fill="url(#deadZoneHatchEn)" stroke="#F85149" stroke-width="1.5" stroke-dasharray="6,3"/>
  <text x="958" y="205" text-anchor="middle" fill="#FFA198" font-size="14" font-weight="800">80 / 81 (98.8%) User Skills Silently Truncated (0% Trigger Rules Visible)</text>
  <text x="958" y="227" text-anchor="middle" fill="#E2E8F0" font-size="12">Collapsed into bare names: "Additional skills available: docx, pptx, xlsx..." (only accessibility survived)</text>

  <!-- TRACK 2: AFTER -->
  <text x="54" y="328" fill="#3FB950" font-size="15.5" font-weight="800">After Compaction</text>
  <text x="54" y="350" fill="#E2E8F0" font-size="12.5">Active: 8,019 chars</text>
  <text x="54" y="370" fill="#3FB950" font-size="12" font-weight="700">62 / 62 (100%) visible!</text>

  <rect x="250" y="302" width="224.5" height="78" rx="4" fill="url(#safeGreenEn)" stroke="#34D399" stroke-width="1.5"/>
  <text x="362" y="335" text-anchor="middle" fill="#FFFFFF" font-size="12.5" font-weight="800">62/62 Contracts (8,019c)</text>
  <text x="362" y="356" text-anchor="middle" fill="#D1FAE5" font-size="11">110–165 chars each · 100% fit</text>

  <rect x="474.5" y="302" width="111.5" height="78" rx="4" fill="#0F291E" stroke="#2EA043" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="530" y="335" text-anchor="middle" fill="#6EE7B7" font-size="11.5" font-weight="700">~4 KB Headroom</text>
  <text x="530" y="355" text-anchor="middle" fill="#A7F3D0" font-size="11">(~3,981 chars)</text>

  <rect x="606" y="312" width="724" height="58" rx="8" fill="#161B22" stroke="#238636" stroke-width="1"/>
  <text x="968" y="337" text-anchor="middle" fill="#3FB950" font-size="13.5" font-weight="800">▼ -30,581 Chars (-79.2%) Bloated Prose Eliminated · Zero Silent Truncation Across All 62 Skills</text>
  <text x="968" y="357" text-anchor="middle" fill="#8B949E" font-size="12">~4 KB safety buffer absorbs runtime plugin injections and future domain skill additions</text>

  <!-- Vertical 12 KB Cliff Line -->
  <line x1="586" y1="126" x2="586" y2="402" stroke="#FF7B72" stroke-width="2.5" stroke-dasharray="7,4"/>
  <rect x="498" y="398" width="176" height="24" rx="12" fill="#3D1318" stroke="#FF7B72" stroke-width="1.2"/>
  <text x="586" y="414" text-anchor="middle" fill="#FFA198" font-size="11.5" font-weight="800">⚡ 12 KB Truncation Cliff</text>

  <!-- BOTTOM CARDS -->
  <rect x="54" y="444" width="664" height="244" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
  <text x="78" y="476" fill="#F0F6FC" font-size="16" font-weight="800">Per-Skill Frontmatter Length &amp; Contract Structure</text>

  <text x="78" y="508" fill="#FFA198" font-size="12.5" font-weight="700">Before (Verbose .agents prose: 700 – 1,012 chars per skill)</text>
  <rect x="78" y="518" width="560" height="24" rx="4" fill="#B91C1C"/>
  <text x="646" y="535" fill="#FF7B72" font-size="12.5" font-weight="800">1,012c</text>

  <text x="78" y="568" fill="#6EE7B7" font-size="12.5" font-weight="700">After (Orthogonal 3-clause routing contract: 110 – 165 chars)</text>
  <rect x="78" y="578" width="91.3" height="24" rx="4" fill="#10B981"/>
  <text x="178" y="595" fill="#34D399" font-size="12.5" font-weight="800">110–165c (-84% per skill, higher precision)</text>

  <rect x="78" y="616" width="616" height="54" rx="8" fill="#0D1117" stroke="#38BDF8" stroke-width="1"/>
  <text x="94" y="638" fill="#38BDF8" font-size="12" font-weight="800" font-family="ui-monospace, Consolas, monospace">description: "[Core Capability]. USE FOR: [Triggers]. DO NOT USE FOR: [Exclusions]."</text>
  <text x="94" y="658" fill="#94A3B8" font-size="11.5">Positive triggers + explicit negative exclusions prevent cross-skill routing collisions</text>

  <rect x="742" y="444" width="644" height="244" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.2"/>
  <text x="766" y="476" fill="#F0F6FC" font-size="16" font-weight="800">First-Turn XML View Seen by the Frontier Router</text>

  <rect x="766" y="494" width="288" height="176" rx="8" fill="#1E1114" stroke="#F85149" stroke-width="1"/>
  <text x="782" y="518" fill="#FF7B72" font-size="13" font-weight="800">❌ Before: Blind Guess (1.2%)</text>
  <text x="782" y="542" fill="#CBD5E1" font-size="11.5" font-family="ui-monospace, Consolas, monospace">&lt;skill&gt;accessibility (980c)&lt;/skill&gt;</text>
  <text x="782" y="562" fill="#94A3B8" font-size="11.5" font-family="ui-monospace, Consolas, monospace">... [15 verbose skills exhaust cap]</text>
  <text x="782" y="586" fill="#FCA5A5" font-size="11.5" font-family="ui-monospace, Consolas, monospace">Additional skills available:</text>
  <text x="782" y="606" fill="#FCA5A5" font-size="11.5" font-family="ui-monospace, Consolas, monospace">azure-ai, docx, pptx, pmx-tp...</text>
  <text x="782" y="636" fill="#8B949E" font-size="11">Impact: 80 skills had zero trigger rules;</text>
  <text x="782" y="654" fill="#8B949E" font-size="11">models skipped or misrouted workflows</text>

  <rect x="1074" y="494" width="288" height="176" rx="8" fill="#0E221B" stroke="#10B981" stroke-width="1"/>
  <text x="1090" y="518" fill="#34D399" font-size="13" font-weight="800">✅ After: Deterministic (100%)</text>
  <text x="1090" y="542" fill="#A7F3D0" font-size="11.5" font-family="ui-monospace, Consolas, monospace">&lt;skill&gt;accessibility (138c)&lt;/skill&gt;</text>
  <text x="1090" y="562" fill="#A7F3D0" font-size="11.5" font-family="ui-monospace, Consolas, monospace">&lt;skill&gt;azure-answer (142c)&lt;/skill&gt;</text>
  <text x="1090" y="582" fill="#A7F3D0" font-size="11.5" font-family="ui-monospace, Consolas, monospace">&lt;skill&gt;billing-assistant (146c)&lt;/skill&gt;</text>
  <text x="1090" y="602" fill="#A7F3D0" font-size="11.5" font-family="ui-monospace, Consolas, monospace">... [All 62/62 orthogonal skills]</text>
  <text x="1090" y="636" fill="#D1FAE5" font-size="11">Gain: Every trigger &amp; exclusion boundary</text>
  <text x="1090" y="654" fill="#D1FAE5" font-size="11">is 100% visible on Turn 1</text>
</svg>
