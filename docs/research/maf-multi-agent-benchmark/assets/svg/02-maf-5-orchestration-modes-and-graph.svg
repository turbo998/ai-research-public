<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <marker id="arr2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#60A5FA"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
  </defs>

  <rect width="1200" height="720" fill="url(#bg2)" rx="16"/>

  <text x="40" y="42" fill="#38BDF8" font-size="13" font-weight="800" letter-spacing="1.5">ARCHITECTURE ATLAS · 02 / 04 · SLIDES 33, 39–44 &amp; 49–50</text>
  <text x="40" y="72" fill="#F8FAFC" font-size="24" font-weight="800">MAF 5 Built-in Multi-Agent Orchestration Modes &amp; Graph Workflow Engine</text>
  <text x="40" y="96" fill="#94A3B8" font-size="13.5">All 5 modes support token streaming, Superstep Checkpointing (14.2 ms resume), HITL approval gates, and pause/resume</text>

  <!-- Row 1: 3 Core Modes -->
  <!-- Mode 1: Sequential -->
  <rect x="40" y="118" width="360" height="210" rx="14" fill="#131D35" stroke="#3B82F6" stroke-width="1.5"/>
  <text x="58" y="146" fill="#60A5FA" font-size="12" font-weight="800">MODE 01 · SLIDE 40 &amp; 50</text>
  <text x="58" y="170" fill="#FFFFFF" font-size="18" font-weight="800">Sequential Pipeline</text>
  <rect x="58" y="188" width="90" height="44" rx="8" fill="#1E293B" stroke="#60A5FA"/>
  <text x="72" y="215" fill="#F8FAFC" font-size="12" font-weight="700">Agent 1</text>
  <path d="M 148 210 L 172 210" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr2)"/>
  <rect x="175" y="188" width="90" height="44" rx="8" fill="#1E293B" stroke="#60A5FA"/>
  <text x="189" y="215" fill="#F8FAFC" font-size="12" font-weight="700">Agent 2</text>
  <path d="M 265 210 L 289 210" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr2)"/>
  <rect x="292" y="188" width="90" height="44" rx="8" fill="#1E293B" stroke="#34D399"/>
  <text x="306" y="215" fill="#6EE7B7" font-size="12" font-weight="700">Agent 3</text>
  <text x="58" y="258" fill="#CBD5E1" font-size="12">• Linear dependency chain (`Output N → Input N+1`)</text>
  <text x="58" y="278" fill="#CBD5E1" font-size="12">• Shared `WorkflowContext` &amp; typed output contracts</text>
  <text x="58" y="298" fill="#93C5FD" font-size="11.5" font-weight="700">Best for: Multi-stage drafting, compliance review chains</text>

  <!-- Mode 2: Concurrent -->
  <rect x="420" y="118" width="360" height="210" rx="14" fill="#131D35" stroke="#10B981" stroke-width="1.5"/>
  <text x="438" y="146" fill="#34D399" font-size="12" font-weight="800">MODE 02 · SLIDE 24, 41 &amp; 50</text>
  <text x="438" y="170" fill="#FFFFFF" font-size="18" font-weight="800">Concurrent (Fan-Out / Fan-In)</text>
  <rect x="438" y="198" width="76" height="36" rx="6" fill="#1E293B" stroke="#34D399"/>
  <text x="448" y="220" fill="#F8FAFC" font-size="11" font-weight="700">Initiator</text>
  <rect x="542" y="180" width="110" height="24" rx="5" fill="#0F172A" stroke="#60A5FA"/>
  <text x="552" y="196" fill="#93C5FD" font-size="10.5">Doc Agent (Search)</text>
  <rect x="542" y="206" width="110" height="24" rx="5" fill="#0F172A" stroke="#60A5FA"/>
  <text x="552" y="222" fill="#93C5FD" font-size="10.5">Video Agent (CU)</text>
  <rect x="542" y="232" width="110" height="24" rx="5" fill="#0F172A" stroke="#60A5FA"/>
  <text x="552" y="248" fill="#93C5FD" font-size="10.5">Web Agent (Bing)</text>
  <rect x="678" y="198" width="84" height="36" rx="6" fill="#065F46" stroke="#34D399"/>
  <text x="688" y="220" fill="#FFFFFF" font-size="11" font-weight="700">Collector</text>
  <text x="438" y="276" fill="#CBD5E1" font-size="12">• Parallel multi-perspective analysis on identical input</text>
  <text x="438" y="298" fill="#6EE7B7" font-size="11.5" font-weight="700">Benchmark: 8-agent fan-out 186 ms vs 672 ms serial (3.61×)</text>

  <!-- Mode 3: Handoff -->
  <rect x="800" y="118" width="360" height="210" rx="14" fill="#131D35" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="818" y="146" fill="#FBBF24" font-size="12" font-weight="800">MODE 03 · SLIDE 43 &amp; 50</text>
  <text x="818" y="170" fill="#FFFFFF" font-size="18" font-weight="800">Dynamic Handoff Routing</text>
  <rect x="818" y="194" width="108" height="44" rx="8" fill="#1E293B" stroke="#F59E0B"/>
  <text x="830" y="214" fill="#FDE68A" font-size="11.5" font-weight="700">Triage Agent</text>
  <text x="830" y="230" fill="#94A3B8" font-size="10">Context Evaluation</text>
  <path d="M 926 216 L 970 196" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr2)"/>
  <path d="M 926 216 L 970 236" stroke="#F59E0B" stroke-width="2" marker-end="url(#arr2)"/>
  <rect x="975" y="178" width="165" height="28" rx="6" fill="#0F172A" stroke="#34D399"/>
  <text x="985" y="196" fill="#6EE7B7" font-size="11" font-weight="700">IoTHardwareAgent (E-22)</text>
  <rect x="975" y="218" width="165" height="28" rx="6" fill="#0F172A" stroke="#475569"/>
  <text x="985" y="236" fill="#CBD5E1" font-size="11">BillingRefundAgent</text>
  <text x="818" y="274" fill="#CBD5E1" font-size="12">• Decentralized peer-to-peer control transfer</text>
  <text x="818" y="298" fill="#FDE68A" font-size="11.5" font-weight="700">Best for: Customer support triage &amp; emergent routing</text>

  <!-- Row 2: Group Chat + Magentic-One + Graph Workflow Engine -->
  <!-- Mode 4: Group Chat -->
  <rect x="40" y="348" width="360" height="334" rx="14" fill="#131D35" stroke="#A855F7" stroke-width="1.5"/>
  <text x="58" y="376" fill="#D8B4FE" font-size="12" font-weight="800">MODE 04 · SLIDE 42 &amp; 50</text>
  <text x="58" y="400" fill="#FFFFFF" font-size="18" font-weight="800">Group Chat &amp; Maker-Checker</text>
  <rect x="58" y="418" width="324" height="52" rx="8" fill="#1E293B" stroke="#C084FC"/>
  <text x="74" y="440" fill="#F3E8FF" font-size="12.5" font-weight="700">Group Chat Manager + Shared AgentThread</text>
  <text x="74" y="458" fill="#94A3B8" font-size="11">Configurable turn selection · Accumulating conversation state</text>
  <rect x="58" y="484" width="100" height="44" rx="8" fill="#0F172A" stroke="#60A5FA"/>
  <text x="72" y="510" fill="#93C5FD" font-size="11.5" font-weight="700">Executor</text>
  <rect x="170" y="484" width="100" height="44" rx="8" fill="#0F172A" stroke="#34D399"/>
  <text x="184" y="510" fill="#6EE7B7" font-size="11.5" font-weight="700">Reviewer</text>
  <rect x="282" y="484" width="100" height="44" rx="8" fill="#0F172A" stroke="#F59E0B"/>
  <text x="292" y="510" fill="#FDE68A" font-size="11.5" font-weight="700">Human HITL</text>
  <text x="58" y="558" fill="#CBD5E1" font-size="12">• Multiple agents collaborate on one shared thread</text>
  <text x="58" y="580" fill="#CBD5E1" font-size="12">• Native Human Participant / Observer injection</text>
  <text x="58" y="602" fill="#CBD5E1" font-size="12">• Adversarial critique &amp; consensus verification</text>
  <text x="58" y="632" fill="#D8B4FE" font-size="11.5" font-weight="700">Best for: Architecture review, red-team debate, QA sign-off</text>

  <!-- Mode 5: Magentic-One -->
  <rect x="420" y="348" width="360" height="334" rx="14" fill="#131D35" stroke="#EC4899" stroke-width="1.5"/>
  <text x="438" y="376" fill="#F472B6" font-size="12" font-weight="800">MODE 05 · SLIDE 44 &amp; 50 (MSR MAGENTIC-ONE)</text>
  <text x="438" y="400" fill="#FFFFFF" font-size="18" font-weight="800">Magentic (Task &amp; Progress Ledger)</text>
  <rect x="438" y="418" width="324" height="64" rx="8" fill="#1E293B" stroke="#F472B6"/>
  <text x="454" y="440" fill="#FBCFE8" font-size="12.5" font-weight="800">Manager Agent + Task &amp; Progress Ledger</text>
  <text x="454" y="458" fill="#E2E8F0" font-size="11">1. Facts Gathered  2. Facts to Lookup  3. Sub-Goal Plan</text>
  <text x="454" y="474" fill="#34D399" font-size="11" font-weight="700">Outer Loop: Goal Satisfied? No → Re-plan / Delegate | Yes → Output</text>
  <rect x="438" y="496" width="154" height="40" rx="8" fill="#0F172A" stroke="#60A5FA"/>
  <text x="450" y="520" fill="#93C5FD" font-size="11.5" font-weight="700">Coder / File Surfer</text>
  <rect x="608" y="496" width="154" height="40" rx="8" fill="#0F172A" stroke="#34D399"/>
  <text x="620" y="520" fill="#6EE7B7" font-size="11.5" font-weight="700">Web Surfer / API</text>
  <text x="438" y="564" fill="#CBD5E1" font-size="12">• Solves open-ended problems with no predetermined path</text>
  <text x="438" y="586" fill="#CBD5E1" font-size="12">• Detects stalls/loops and dynamically updates ledger</text>
  <text x="438" y="608" fill="#CBD5E1" font-size="12">• Combines centralized planning with specialist execution</text>
  <text x="438" y="632" fill="#F472B6" font-size="11.5" font-weight="700">Best for: Incident root-cause investigation, Deep Research</text>

  <!-- Explicit Graph Workflow Engine (Slide 49) -->
  <rect x="800" y="348" width="360" height="334" rx="14" fill="#131D35" stroke="#38BDF8" stroke-width="2"/>
  <text x="818" y="376" fill="#38BDF8" font-size="12" font-weight="800">DETERMINISTIC BACKBONE · SLIDE 30 &amp; 49</text>
  <text x="818" y="400" fill="#FFFFFF" font-size="18" font-weight="800">Graph Workflow Engine</text>
  <rect x="818" y="418" width="324" height="52" rx="8" fill="#090E1A" stroke="#38BDF8"/>
  <text x="832" y="440" fill="#38BDF8" font-size="12" font-weight="800">Typed Executors + Conditional Edges</text>
  <text x="832" y="458" fill="#CBD5E1" font-size="11">Mixes LLM Agents, deterministic functions &amp; REST/MCP APIs</text>

  <rect x="818" y="482" width="324" height="52" rx="8" fill="#090E1A" stroke="#10B981"/>
  <text x="832" y="504" fill="#34D399" font-size="12" font-weight="800">Superstep Checkpointing (14.2 ms)</text>
  <text x="832" y="522" fill="#CBD5E1" font-size="11">Saves/restores exact state at any superstep after crash/HITL</text>

  <rect x="818" y="546" width="324" height="52" rx="8" fill="#090E1A" stroke="#F59E0B"/>
  <text x="832" y="568" fill="#FBBF24" font-size="12" font-weight="800">Lifecycle Events → AG-UI &amp; OpenTelemetry</text>
  <text x="832" y="586" fill="#CBD5E1" font-size="11">Streams executor start/complete &amp; custom events to frontend</text>

  <text x="818" y="628" fill="#E2E8F0" font-size="11.5" font-weight="700">Why MAF beats pure-graph or pure-chat frameworks:</text>
  <text x="818" y="648" fill="#94A3B8" font-size="11">Embeds all 5 multi-agent modes as typed Executors inside</text>
  <text x="818" y="664" fill="#94A3B8" font-size="11">checkpointed directed graphs with 3-layer middleware.</text>
</svg>
