<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="mafGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D4ED8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="skGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="agGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
  </defs>

  <rect width="1200" height="680" fill="url(#bgGrad)" rx="16"/>

  <!-- Header -->
  <text x="40" y="44" fill="#38BDF8" font-size="13" font-weight="800" letter-spacing="1.5">ARCHITECTURE ATLAS · 01 / 04 · SLIDES 29–31 &amp; 46–47</text>
  <text x="40" y="74" fill="#F8FAFC" font-size="24" font-weight="800">Semantic Kernel + AutoGen → Microsoft Agent Framework (MAF) &amp; 3-Layer Middleware</text>
  <text x="40" y="98" fill="#94A3B8" font-size="13.5">Unifying enterprise SDK readiness (Microsoft.Extensions.AI / IChatClient) with frontier multi-agent research patterns &amp; zero-prompt-mutation interception</text>

  <!-- Left Column: Two Foundations (Slide 29) -->
  <rect x="40" y="122" width="340" height="240" rx="14" fill="url(#skGrad)" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="60" y="152" fill="#93C5FD" font-size="12" font-weight="800" letter-spacing="1">ENTERPRISE FOUNDATION</text>
  <text x="60" y="178" fill="#FFFFFF" font-size="20" font-weight="800">Semantic Kernel (SK)</text>
  <text x="60" y="202" fill="#E2E8F0" font-size="12.5">• Production DI, Type-Safe Plugins &amp; Filters</text>
  <text x="60" y="224" fill="#E2E8F0" font-size="12.5">• Vector Memory Connectors (Redis, Cosmos, AI Search)</text>
  <text x="60" y="246" fill="#E2E8F0" font-size="12.5">• Enterprise Telemetry (OpenTelemetry) &amp; Governance</text>
  <text x="60" y="268" fill="#E2E8F0" font-size="12.5">• Process Framework &amp; Deterministic State Checkpoints</text>
  <rect x="60" y="286" width="300" height="58" rx="8" fill="#0F172A" opacity="0.75" stroke="#3B82F6"/>
  <text x="74" y="308" fill="#60A5FA" font-size="11.5" font-weight="700">Strengths Retained in MAF:</text>
  <text x="74" y="328" fill="#CBD5E1" font-size="11.5">3-Layer Filter DNA + Enterprise Auth (Entra ID OBO)</text>

  <rect x="40" y="382" width="340" height="256" rx="14" fill="url(#agGrad)" stroke="#C084FC" stroke-width="1.5"/>
  <text x="60" y="412" fill="#E9D5FF" font-size="12" font-weight="800" letter-spacing="1">MICROSOFT RESEARCH FRONTIER</text>
  <text x="60" y="438" fill="#FFFFFF" font-size="20" font-weight="800">AutoGen (MSR v0.2 / v0.4)</text>
  <text x="60" y="462" fill="#F3E8FF" font-size="12.5">• Pioneer of Multi-Agent Conversational Orchestration</text>
  <text x="60" y="484" fill="#F3E8FF" font-size="12.5">• Group Chat, Handoff / Swarm &amp; Executor-Reviewer</text>
  <text x="60" y="506" fill="#F3E8FF" font-size="12.5">• Magentic-One Dynamic Task &amp; Progress Ledger</text>
  <text x="60" y="528" fill="#F3E8FF" font-size="12.5">• Async Event-Driven Actor Messaging</text>
  <rect x="60" y="548" width="300" height="70" rx="8" fill="#0F172A" opacity="0.75" stroke="#A855F7"/>
  <text x="74" y="570" fill="#D8B4FE" font-size="11.5" font-weight="700">Strengths Retained in MAF:</text>
  <text x="74" y="590" fill="#E2E8F0" font-size="11.5">5 Built-in Multi-Agent Modes + Magentic Ledger</text>
  <text x="74" y="606" fill="#94A3B8" font-size="11">Bridges research prototypes directly to production</text>

  <!-- Convergence Arrows -->
  <path d="M 380 242 L 435 290" stroke="#38BDF8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 380 510 L 435 450" stroke="#38BDF8" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- Center + Right: Unified MAF Runtime & 3-Layer Middleware Pipeline -->
  <rect x="445" y="122" width="715" height="516" rx="16" fill="#131D35" stroke="#38BDF8" stroke-width="2"/>
  <rect x="445" y="122" width="715" height="56" rx="16" fill="url(#mafGrad)"/>
  <text x="470" y="148" fill="#E0F2FE" font-size="11.5" font-weight="800" letter-spacing="1.2">UNIFIED OPEN-SOURCE ENGINE (C# .NET &amp; PYTHON)</text>
  <text x="470" y="168" fill="#FFFFFF" font-size="18" font-weight="800">Microsoft Agent Framework (MAF) — Core Primitives &amp; 3-Layer Middleware</text>

  <!-- Core Primitives Strip (Slide 31 & 46) -->
  <rect x="468" y="194" width="160" height="82" rx="10" fill="#0F172A" stroke="#3B82F6"/>
  <text x="482" y="216" fill="#60A5FA" font-size="13" font-weight="800">AIAgent / Agent</text>
  <text x="482" y="236" fill="#CBD5E1" font-size="11">Base class for ChatClientAgent,</text>
  <text x="482" y="252" fill="#CBD5E1" font-size="11">A2AAgent &amp; Declarative YAML</text>
  <text x="482" y="268" fill="#34D399" font-size="10.5" font-weight="700">.AsAIFunction() / .as_tool()</text>

  <rect x="638" y="194" width="165" height="82" rx="10" fill="#0F172A" stroke="#3B82F6"/>
  <text x="652" y="216" fill="#60A5FA" font-size="13" font-weight="800">IChatClient</text>
  <text x="652" y="236" fill="#CBD5E1" font-size="11">Microsoft.Extensions.AI</text>
  <text x="652" y="252" fill="#CBD5E1" font-size="11">AOAI, OpenAI, Anthropic,</text>
  <text x="652" y="268" fill="#CBD5E1" font-size="11">Bedrock, Gemini, Ollama</text>

  <rect x="813" y="194" width="165" height="82" rx="10" fill="#0F172A" stroke="#3B82F6"/>
  <text x="827" y="216" fill="#60A5FA" font-size="13" font-weight="800">AgentSession / Thread</text>
  <text x="827" y="236" fill="#CBD5E1" font-size="11">CreateSession() → RunAsync()</text>
  <text x="827" y="252" fill="#CBD5E1" font-size="11">SerializeSession() → JSON</text>
  <text x="827" y="268" fill="#34D399" font-size="10.5" font-weight="700">Foundry Memory + Vector RAG</text>

  <rect x="988" y="194" width="150" height="82" rx="10" fill="#0F172A" stroke="#3B82F6"/>
  <text x="1002" y="216" fill="#60A5FA" font-size="13" font-weight="800">AgentTool (7×8+)</text>
  <text x="1002" y="236" fill="#CBD5E1" font-size="11">Hosted &amp; Local MCP</text>
  <text x="1002" y="252" fill="#CBD5E1" font-size="11">OpenAPI 3.0 · Logic Apps</text>
  <text x="1002" y="268" fill="#CBD5E1" font-size="11">Code Interp · SharePoint</text>

  <!-- 3-Layer Middleware Pipeline Box (Slide 47) -->
  <rect x="468" y="294" width="670" height="324" rx="12" fill="#090E1A" stroke="#475569" stroke-width="1.5"/>
  <text x="488" y="322" fill="#38BDF8" font-size="13.5" font-weight="800">3-LAYER MIDDLEWARE PIPELINE (SLIDE 47 — CHAIN-OF-RESPONSIBILITY WITHOUT PROMPT MUTATION)</text>

  <!-- Layer 1 -->
  <rect x="488" y="338" width="630" height="78" rx="10" fill="#1E293B" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="502" y="352" width="175" height="26" rx="6" fill="#2563EB"/>
  <text x="514" y="370" fill="#FFFFFF" font-size="12" font-weight="800">L1 · Agent Run Middleware</text>
  <text x="690" y="368" fill="#F8FAFC" font-size="12.5" font-weight="700">Intercepts RunAsync / RunStreamingAsync before &amp; after execution</text>
  <text x="502" y="398" fill="#CBD5E1" font-size="12">Inspects/mutates input messages, AgentSession &amp; AgentResponse · Use cases: input sanitization, compliance policy, audit</text>

  <!-- Layer 2 -->
  <rect x="488" y="428" width="630" height="82" rx="10" fill="#1E293B" stroke="#10B981" stroke-width="1.5"/>
  <rect x="502" y="442" width="220" height="26" rx="6" fill="#059669"/>
  <text x="514" y="460" fill="#FFFFFF" font-size="12" font-weight="800">L2 · Function Invocation Middleware</text>
  <text x="735" y="458" fill="#F8FAFC" font-size="12.5" font-weight="700">Intercepts every Tool / MCP / Sub-Agent call (FunctionInvocationContext)</text>
  <text x="502" y="486" fill="#CBD5E1" font-size="12">Inspects function name &amp; args · Redacts PII before model return · Halts loop via context.Terminate · Enforces HITL approval gates</text>
  <text x="502" y="502" fill="#6EE7B7" font-size="11.5" font-weight="700">Benchmark Verified: 100% SSN PII auto-redaction + 0% ungrounded tool execution (paused at confidence 0.52 &lt; 0.90)</text>

  <!-- Layer 3 -->
  <rect x="488" y="522" width="630" height="80" rx="10" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="502" y="536" width="195" height="26" rx="6" fill="#D97706"/>
  <text x="514" y="554" fill="#FFFFFF" font-size="12" font-weight="800">L3 · IChatClient Middleware</text>
  <text x="710" y="552" fill="#F8FAFC" font-size="12.5" font-weight="700">Intercepts raw model transport (ChatMessage[], ChatOptions) via AsBuilder().Use()</text>
  <text x="502" y="582" fill="#CBD5E1" font-size="12">Token accounting, TPM/RPM rate limiting, Azure AI Content Safety filtering, and semantic/prefix response caching</text>
</svg>
