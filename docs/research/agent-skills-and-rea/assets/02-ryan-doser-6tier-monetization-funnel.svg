  <text x="600" y="671" fill="#cbd5e1" font-size="12" font-weight="600" text-anchor="middle">商业公式：开源精简库建立公信力 ($0)  ×  极低决策门槛数字资产锁客 ($47–$199)  ×  高客单咨询与代运营收割 ($600/h – $100K+/yr)</text>
