  <text x="1136" y="232" fill="#34d399" font-size="12" font-weight="800" text-anchor="end">~15%</text>
  <rect x="794" y="240" width="342" height="14" rx="7" fill="#1e293b"/>
  <rect x="794" y="240" width="68" height="14" rx="7" fill="url(#t2)"/>

