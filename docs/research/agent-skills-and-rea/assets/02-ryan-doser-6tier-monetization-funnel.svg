  <circle cx="804" cy="586" r="6" fill="#f43f5e"/>
  <text x="820" y="590" fill="#f8fafc" font-size="12.5" font-weight="700">3. 交付边际成本暴降 80% (Dogfooding)</text>
  <text x="820" y="608" fill="#94a3b8" font-size="11.5">代运营团队内部正是用同一套 60+ Skills 交付，形成数据与利润飞轮。</text>

  <!-- Footer Banner -->
