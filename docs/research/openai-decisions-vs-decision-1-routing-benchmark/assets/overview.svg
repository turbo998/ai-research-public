<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="980" height="470" rx="16" fill="#0B1120"/>
  <rect x="24" y="20" width="932" height="78" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="52" fill="#F8FAFC" font-size="20" font-weight="700">8-Engine Model Routing Benchmark: Microsoft Decision-1 vs OpenAI Decisions</text>
  <text x="44" y="78" fill="#94A3B8" font-size="12.5">Switchyard v2.4.0 &amp; v2.4.1 (3,880 Routing Calls Across 40 Bilingual Tasks × 5 Candidate Models &amp; 4 Prompt Variants)</text>
  <rect x="780" y="34" width="156" height="46" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="858" y="62" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="700">40/40 NEUTRAL · $7.6/1M</text>
  
  <rect x="24" y="116" width="292" height="270" rx="12" fill="#0F172A" stroke="#0EA5E9" stroke-width="1.8"/>
  <rect x="24" y="116" width="292" height="40" rx="12" fill="#0EA5E9" fill-opacity="0.22"/>
  <text x="40" y="142" fill="#38BDF8" font-size="14" font-weight="700">1. System One Dedicated Engines</text>
  <text x="40" y="188" fill="#CBD5E1" font-size="12">• Microsoft Decision-1: 37.7/40 (cheap) →</text><text x="40" y="214" fill="#CBD5E1" font-size="12">  40/40 (100% neutral), P50 541ms, $7.6/1M</text><text x="40" y="240" fill="#CBD5E1" font-size="12">• TypeSafe Jev: 39.3/40 (cheap) → 40/40</text><text x="40" y="266" fill="#CBD5E1" font-size="12">  (100% neutral), P50 350ms, $21.7/1M</text><text x="40" y="292" fill="#CBD5E1" font-size="12">• 100% of misses caught by 0.60 threshold</text>
  <rect x="40" y="336" width="260" height="34" rx="6" fill="#1E293B" stroke="#0EA5E9" stroke-width="1"/>
  <text x="170" y="358" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700">Decision-1 &amp; Jev: 40/40 (100%)</text>
  <rect x="344" y="116" width="292" height="270" rx="12" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.8"/>
  <rect x="344" y="116" width="292" height="40" rx="12" fill="#8B5CF6" fill-opacity="0.22"/>
  <text x="360" y="142" fill="#C4B5FD" font-size="14" font-weight="700">2. OpenAI Decisions (/v1/decisions)</text>
  <text x="360" y="188" fill="#CBD5E1" font-size="12">• v2.4.0 ('prefer cheaper'): 32.0/40 (80.0%)</text><text x="360" y="214" fill="#CBD5E1" font-size="12">  with 9 high-confidence (&gt;=0.60) misses</text><text x="360" y="240" fill="#CBD5E1" font-size="12">• v2.4.1 (neutral prompt): jumps to 37.0/40</text><text x="360" y="266" fill="#CBD5E1" font-size="12">  (92.5%) and 38.0/40 (95.0%) on bare prompt</text><text x="360" y="292" fill="#CBD5E1" font-size="12">• Cost: $26.1–$28.4 / 1M (3.4x Decision-1)</text>
  <rect x="360" y="336" width="260" height="34" rx="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
  <text x="490" y="358" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700">32/40 → 38/40 After Prompt Fix</text>
  <rect x="664" y="116" width="292" height="270" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
  <rect x="664" y="116" width="292" height="40" rx="12" fill="#10B981" fill-opacity="0.22"/>
  <text x="680" y="142" fill="#6EE7B7" font-size="14" font-weight="700">3. General LLMs &amp; Bias Law</text>
  <text x="680" y="188" fill="#CBD5E1" font-size="12">• gpt-4.1-mini: 36.0/40 at $141.8/1M (16.5x)</text><text x="680" y="214" fill="#CBD5E1" font-size="12">• gpt-6-luna (no reasoning): 35.3/40 ($39.9)</text><text x="680" y="240" fill="#CBD5E1" font-size="12">• gpt-6-luna (default reasoning): drops to</text><text x="680" y="266" fill="#CBD5E1" font-size="12">  30.3/40 (75.8%) with 13/40 unstable flips</text><text x="680" y="292" fill="#CBD5E1" font-size="12">• 100% of dedicated-model misses bias cheap</text>
  <rect x="680" y="336" width="260" height="34" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="810" y="358" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700">Decision-1 Wins Cost × Accuracy</text>
  <rect x="24" y="402" width="932" height="48" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="44" y="431" fill="#E2E8F0" font-size="12.5" font-weight="600">Production Recommendation: Microsoft Decision-1 ($7.6/1M, 40/40 neutral) is the #1 overall router; strip 'prefer cheaper' from all routing prompts.</text>
</svg>
