<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" width="1440" height="920" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <linearGradient id="bgCc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090A10"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="1440" height="920" fill="url(#bgCc)"/>

  <!-- Header -->
  <rect x="36" y="22" width="1368" height="84" rx="14" fill="#18181B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="60" y="56" fill="#F8FAFC" font-size="22" font-weight="800">Claude Code &amp; Agent SDK 核心模块架构拆解：QueryEngine 循环、读写并发分级与三层渐进式压缩</text>
  <text x="60" y="84" fill="#A1A1AA" font-size="13">anthropics/claude-code @ 0ed94698aa · Native Binary + TS/Python Agent SDK · 5 Message Types · 6 Permission Modes · 5 Effort Levels</text>
  <rect x="1146" y="38" width="236" height="48" rx="10" fill="#27272A" stroke="#F59E0B"/>
  <text x="1264" y="59" text-anchor="middle" fill="#FBBF24" font-size="12" font-weight="800">Vertically Integrated Loop</text>
  <text x="1264" y="77" text-anchor="middle" fill="#E4E4E7" font-size="11">Prompt Cache + ToolSearch</text>

  <!-- Top Row: 5-Stage Agentic Loop & Message Stream -->
  <rect x="36" y="124" width="1368" height="224" rx="12" fill="#18181B" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="58" y="154" fill="#FBBF24" font-size="16" font-weight="800">1. QueryEngine 自主执行循环与五类标准流式消息契约 (SDKMessage Stream)</text>
  <text x="58" y="176" fill="#A1A1AA" font-size="11.5">Receive Prompt -&gt; Evaluate &amp; Respond -&gt; Execute Tools (Hooks &amp; Permissions) -&gt; Repeat Turns -&gt; Return ResultMessage</text>

  <g transform="translate(58, 194)">
    <rect x="0" y="0" width="232" height="128" rx="10" fill="#27272A" stroke="#38BDF8"/>
    <text x="116" y="26" text-anchor="middle" fill="#38BDF8" font-size="13" font-weight="800">1. SystemMessage</text>
    <text x="16" y="50" fill="#E4E4E7" font-size="11">• subtype: "init" (Session ID)</text>
    <text x="16" y="70" fill="#E4E4E7" font-size="11">• SessionStart / Setup Hooks</text>
    <text x="16" y="90" fill="#FBBF24" font-size="11">• subtype: "compact_boundary"</text>
    <text x="16" y="110" fill="#A1A1AA" font-size="10.5">• subtype: "worker_shutting_down"</text>

    <line x1="232" y1="64" x2="262" y2="64" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowOrange)"/>

    <rect x="268" y="0" width="246" height="128" rx="10" fill="#27272A" stroke="#F59E0B"/>
    <text x="391" y="26" text-anchor="middle" fill="#FBBF24" font-size="13" font-weight="800">2. AssistantMessage &amp; Stream</text>
    <text x="284" y="50" fill="#E4E4E7" font-size="11">• TextBlock / ThinkingBlock</text>
    <text x="284" y="70" fill="#E4E4E7" font-size="11">• ToolUseBlock (工具调用请求)</text>
    <text x="284" y="90" fill="#E4E4E7" font-size="11">• 5 档推理 Effort: low/med/high</text>
    <text x="284" y="110" fill="#FBBF24" font-size="10.5">  /xhigh/max (独立于 Thinking)</text>

    <line x1="514" y1="64" x2="544" y2="64" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowOrange)"/>

    <rect x="550" y="0" width="256" height="128" rx="10" fill="#27272A" stroke="#10B981"/>
    <text x="678" y="26" text-anchor="middle" fill="#10B981" font-size="13" font-weight="800">3. Tool Executor &amp; Hooks</text>
    <text x="566" y="50" fill="#E4E4E7" font-size="11">• PreToolUse 钩子拦截/改写参数</text>
    <text x="566" y="70" fill="#E4E4E7" font-size="11">• Permission 规则引擎 &amp; canUseTool</text>
    <text x="566" y="90" fill="#10B981" font-size="11">• 只读并发 vs 写/Bash 串行屏障</text>
    <text x="566" y="110" fill="#A1A1AA" font-size="10.5">• PostToolUse 钩子审计与追加上下文</text>

    <line x1="806" y1="64" x2="836" y2="64" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowOrange)"/>

    <rect x="842" y="0" width="218" height="128" rx="10" fill="#27272A" stroke="#38BDF8"/>
    <text x="951" y="26" text-anchor="middle" fill="#38BDF8" font-size="13" font-weight="800">4. UserMessage (Loop)</text>
    <text x="858" y="50" fill="#E4E4E7" font-size="11">• 封装 ToolResult 回传给模型</text>
    <text x="858" y="70" fill="#E4E4E7" font-size="11">• 支持流式追加用户中途指令</text>
    <text x="858" y="90" fill="#E4E4E7" font-size="11">• 自动进入下一 Turn 评估</text>
    <text x="858" y="110" fill="#A1A1AA" font-size="10.5">• 直到无 ToolUseBlock 产出</text>

    <line x1="1060" y1="64" x2="1090" y2="64" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrowOrange)"/>

    <rect x="1096" y="0" width="228" height="128" rx="10" fill="#27272A" stroke="#F43F5E"/>
    <text x="1210" y="26" text-anchor="middle" fill="#FB7185" font-size="13" font-weight="800">5. ResultMessage &amp; Caps</text>
    <text x="1112" y="50" fill="#E4E4E7" font-size="11">• subtype: "success"</text>
    <text x="1112" y="70" fill="#FB7185" font-size="11">• "error_max_turns" 步数上限</text>
    <text x="1112" y="90" fill="#FB7185" font-size="11">• "error_max_budget_usd" 成本上限</text>
    <text x="1112" y="110" fill="#A1A1AA" font-size="10.5">• 含父会话 + 全部子智能体总开销</text>
  </g>

  <!-- Bottom Left: Tool Execution Concurrency & 6 Permission Modes -->
  <rect x="36" y="366" width="670" height="530" rx="12" fill="#18181B" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="58" y="396" fill="#10B981" font-size="16" font-weight="800">2. 工具并发分级调度器与六档权限门禁体系</text>
  <text x="58" y="418" fill="#A1A1AA" font-size="11.5">Read-Only Concurrent Batching vs Stateful Serial Barrier &amp; 6 Permission Modes</text>

  <rect x="58" y="434" width="626" height="148" rx="10" fill="#090A10" stroke="#10B981"/>
  <text x="76" y="458" fill="#10B981" font-size="13" font-weight="800">读写分级并发调度 (Parallel vs Sequential Execution)</text>
  <text x="76" y="482" fill="#E4E4E7" font-size="11.5">• 并发只读批次 (`Parallel Read-Only`)：`Read`、`Glob`、`Grep`、`WebSearch` 以及标注了</text>
  <text x="76" y="502" fill="#38BDF8" font-size="11.5" font-weight="700">  `annotations.readOnlyHint = true` 的自定义/MCP 工具在同一 Turn 内并发执行。</text>
  <text x="76" y="526" fill="#E4E4E7" font-size="11.5">• 状态修改串行屏障 (`Sequential Mutating Barrier`)：`Edit`、`Write`、`Bash` 及默认自定义工具</text>
  <text x="76" y="546" fill="#E4E4E7" font-size="11.5">  强制串行执行，防止并发写同一文件或竞争 Git 索引锁。</text>
  <text x="76" y="568" fill="#A1A1AA" font-size="11">• 细粒度命令白名单：支持 `"Bash(npm test *)"`、`"Bash(git status)"` 语法级权限放行。</text>

  <rect x="58" y="598" width="626" height="278" rx="10" fill="#090A10" stroke="#F59E0B"/>
  <text x="76" y="622" fill="#FBBF24" font-size="13" font-weight="800">六档权限评估模式 (`permissionMode` 优先级高于默认提示，低于显式 Deny)</text>
  <text x="76" y="648" fill="#E4E4E7" font-size="11.5">1. `default`：未命中 `allowedTools` 的敏感操作触发宿主 `canUseTool` 回调审批（无回调则拒绝）。</text>
  <text x="76" y="672" fill="#E4E4E7" font-size="11.5">2. `acceptEdits`：自动放行工作区内的文件修改与 `mkdir/touch/mv/cp`，加速本地原型迭代。</text>
  <text x="76" y="696" fill="#E4E4E7" font-size="11.5">3. `plan`：只读探索与规划模式；即便命中 allow 规则，文件写操作仍强制拦截并送审。</text>
  <text x="76" y="720" fill="#E4E4E7" font-size="11.5">4. `dontAsk`：无头 (Headless) 静默模式；仅执行预授权与工作区只读操作，其余一律静默拒绝。</text>
  <text x="76" y="744" fill="#38BDF8" font-size="11.5" font-weight="700">5. `auto`：调用内置安全分类器模型 (Classifier) 实时审查 Shell 命令与网络请求风险。</text>
  <text x="76" y="768" fill="#FB7185" font-size="11.5">6. `bypassPermissions`：仅限隔离容器/CI 使用（禁止 Unix root 运行，需显式开启危险开关）。</text>
  <text x="76" y="800" fill="#10B981" font-size="11.5" font-weight="700">企业级合规底座 (`anthropics/claude-code/examples/`)：</text>
  <text x="76" y="822" fill="#A1A1AA" font-size="11">• 内置 `settings-hipaa.json`、`settings-bash-sandbox.json`、`egress-firewall.yaml`</text>
  <text x="76" y="842" fill="#A1A1AA" font-size="11">• 提供 macOS `.mobileconfig/.plist` 与 Windows `ClaudeCode.admx` 域控策略及 AWS/GCP LLM Gateway。</text>

  <!-- Bottom Right: 3-Tier Context Engineering, Compaction & Subagent Isolation -->
  <rect x="724" y="366" width="680" height="530" rx="12" fill="#18181B" stroke="#3F3F46" stroke-width="1.5"/>
  <text x="746" y="396" fill="#38BDF8" font-size="16" font-weight="800">3. 三层渐进式上下文工程、自动压缩与无状态容器双写</text>
  <text x="746" y="418" fill="#A1A1AA" font-size="11.5">3-Tier Context Engineering · Automatic Compaction · Subagent Context Isolation · Dual-Write Store</text>

  <rect x="746" y="434" width="636" height="148" rx="10" fill="#090A10" stroke="#38BDF8"/>
  <text x="764" y="458" fill="#38BDF8" font-size="13" font-weight="800">Tier 1 · 首轮前缀缓存与按需延迟加载 (Prompt Caching &amp; Lazy Discovery)</text>
  <text x="764" y="482" fill="#E4E4E7" font-size="11.5">• 固定前缀自动命中 Prompt Cache：`System Prompt` + 核心内建工具 Schema + `CLAUDE.md`。</text>
  <text x="764" y="506" fill="#FBBF24" font-size="11.5" font-weight="700">• `MCP ToolSearch` 默认开启：100+ 外部 MCP 工具不进入首轮 Schema，由模型按需检索加载。</text>
  <text x="764" y="530" fill="#E4E4E7" font-size="11.5">• `Skill` 渐进式披露：启动时仅加载短摘要 description，仅在调用该 Skill 时注入完整 `SKILL.md`。</text>
  <text x="764" y="554" fill="#A1A1AA" font-size="11">• 持久化规则必须写入 `CLAUDE.md`（每轮重注入），避免在早期对话中因后续 Compaction 被摘要吞没。</text>

  <rect x="746" y="598" width="636" height="142" rx="10" fill="#090A10" stroke="#10B981"/>
  <text x="764" y="622" fill="#10B981" font-size="13" font-weight="800">Tier 2 &amp; Tier 3 · 自动上下文压缩 (`compact_boundary`) 与子智能体上下文防火墙</text>
  <text x="764" y="646" fill="#E4E4E7" font-size="11.5">• 触发时点：上下文逼近窗口上限自动触发，或发送 `/compact` 手动触发；先执行 `PreCompact` 钩子归档。</text>
  <text x="764" y="670" fill="#E4E4E7" font-size="11.5">• 定向保留策略：Compactor 自动读取 `CLAUDE.md` 中的 `# Summary instructions` 章节定制保留字段。</text>
  <text x="764" y="694" fill="#38BDF8" font-size="11.5" font-weight="700">• 子智能体隔离 (`AgentDefinition`)：子任务在独立上下文窗口（可选独立 Git Worktree）中运行数十轮，</text>
  <text x="764" y="716" fill="#38BDF8" font-size="11.5" font-weight="700">  父 Agent 上下文仅增长一条最终总结文本，彻底隔离海量文件读取产生的中间 Token 噪音。</text>

  <rect x="746" y="756" width="636" height="120" rx="10" fill="#090A10" stroke="#A855F7"/>
  <text x="764" y="780" fill="#C084FC" font-size="13" font-weight="800">云原生扩展：Dual-Write SessionStore 双写架构与预算硬上限水位线</text>
  <text x="764" y="804" fill="#E4E4E7" font-size="11.5">• 本地进程优先写本地磁盘 JSONL，同时通过 `sessionStore` 异步镜像至外部存储，支持 Serverless 跨容器恢复。</text>
  <text x="764" y="828" fill="#E4E4E7" font-size="11.5">• 预算水位线设计 (`Budget Headroom`)：API 响应返回后结算 Token 成本，达到 `maxBudgetUsd` 时立即拦截</text>
  <text x="764" y="850" fill="#E4E4E7" font-size="11.5">  新子智能体创建并终止在途后台子智能体（v2.1.217+ 强约束）。</text>
</svg>
