  <text x="994" y="331" fill="#cbd5e1" font-size="10.5">✓ E06 SOC 覆盖时段与升级路径归档</text>
  <text x="994" y="347" fill="#cbd5e1" font-size="10.5">✓ E07 客户侧应急响应职责明确定义</text>
  <text x="994" y="363" fill="#38bdf8" font-size="10.5" font-weight="700">✓ E08 Security Copilot 场景已评审</text>
  <text x="994" y="379" fill="#cbd5e1" font-size="10.5">✓ E09 季度就绪度与调优评审已排期</text>

  <!-- Bottom Decision Gate Formula Box -->
  <rect x="36" y="550" width="1168" height="142" rx="12" fill="#0f172a" stroke="#60a5fa" stroke-width="1.5"/>
  <text x="56" y="578" fill="#60a5fa" font-size="13" font-weight="800">DETERMINISTIC TIER-EXIT VERIFIER CONTRACT (`simulator/defend_tier_readiness_verifier.py`)</text>
  <text x="56" y="604" fill="#f8fafc" font-size="13" font-family="Consolas, monospace">ItemSatisfied(i) = (control_implemented[i] == True) OR (risk_accepted[i] == True AND compensating_control[i] != "" AND accountable_owner[i] != "" AND review_expiry_days &lt;= 90)</text>
  <text x="56" y="630" fill="#34d399" font-size="13" font-family="Consolas, monospace">CanAdvance(tier) = ALL(ItemSatisfied(i) for i in TierCriteria[tier]) AND (tier != "DEFENDExtend" OR TierPassed["DEFENDComplete"] == True)</text>
  <text x="56" y="656" fill="#cbd5e1" font-size="12">• 动作路由门控 (Action Banding)：Act automatically (100% 实装控制且无高危风险豁免) · Confirm (存在合规签字的风险接受项，需季度复审) · Send to a human (存在未闭环缺口或越级激活 Extend)</text>
  <text x="56" y="677" fill="#94a3b8" font-size="11.5">• 统计汇总：5 大层级共 51 项表格核验条目（Base 11 + Security 12 + Compliance 11 + Complete 8 + Extend 9）；扣除 3 项跨层复合引用（M01, M02, E01）后为 48 项原子控制断言。</text>
</svg>
