  <text x="50" y="347" fill="#cbd5e1" font-size="10.5">✓ B07 MDO Plan 1 保护策略启用</text>
  <text x="50" y="363" fill="#cbd5e1" font-size="10.5">✓ B08 Safe Links &amp; Attachments 激活</text>
