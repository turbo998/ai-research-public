  <text x="50" y="435" fill="#fbbf24" font-size="10.5" font-weight="700">✓ B11 初始风险台账建立并签字确认</text>

  <!-- Column 2: DEFENDSecurity (12 items) -->
  <rect x="272" y="118" width="220" height="410" rx="12" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
  <text x="286" y="144" fill="#818cf8" font-size="13" font-weight="800">2. DEFENDSecurity (12 项)</text>
  <text x="286" y="162" fill="#c7d2fe" font-size="11">Slide 36 · 检测调查与响应</text>
