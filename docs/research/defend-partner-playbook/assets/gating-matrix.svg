  <text x="50" y="275" fill="#cbd5e1" font-size="10.5">✓ B04 全部受支持终端注册 Intune</text>
  <text x="50" y="291" fill="#cbd5e1" font-size="10.5">✓ B05 托管设备强制 OS 磁盘加密</text>
  <text x="50" y="307" fill="#cbd5e1" font-size="10.5">✓ B06 Defender for Business 健康</text>
