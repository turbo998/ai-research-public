  <text x="286" y="203" fill="#cbd5e1" font-size="10.5">✓ S01 基于风险的 CA 策略上线</text>
  <text x="286" y="219" fill="#cbd5e1" font-size="10.5">✓ S02 用户与登录风险检测运行中</text>
  <text x="286" y="235" fill="#cbd5e1" font-size="10.5">✓ S03 身份治理工作流已定义</text>
