  <text x="994" y="242" fill="#f8fafc" font-size="11" font-weight="700">[Detection &amp; Response · 3]</text>
  <text x="994" y="259" fill="#cbd5e1" font-size="10.5">✓ E03 Defender 事件接入 Sentinel</text>
  <text x="994" y="275" fill="#cbd5e1" font-size="10.5">✓ E04 分析规则 (Analytics) 启用并测试</text>
