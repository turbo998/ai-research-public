  <text x="286" y="395" fill="#cbd5e1" font-size="10.5">✓ S10 Defender for Identity 健康</text>
  <text x="286" y="418" fill="#f8fafc" font-size="11" font-weight="700">[Operations · 2]</text>
  <text x="286" y="435" fill="#fbbf24" font-size="10.5" font-weight="700">✓ S11 告警分诊与响应责任人确认</text>
