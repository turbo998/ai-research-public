  <text x="522" y="435" fill="#fbbf24" font-size="10.5" font-weight="700">✓ C11 风险接受机制扩展至合规决策</text>

  <!-- Column 4: DEFENDComplete (8 items) -->
  <rect x="744" y="118" width="220" height="410" rx="12" fill="#3b0764" stroke="#c084fc" stroke-width="1.5"/>
