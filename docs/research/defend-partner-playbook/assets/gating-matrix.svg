  <text x="36" y="44" fill="#fbbf24" font-size="13" font-weight="700" letter-spacing="1.4">CHAPTER 07 · DEFEND READINESS, 51 MANDATORY EXIT CRITERIA &amp; DETERMINISTIC GATING ENGINE</text>
  <text x="36" y="72" fill="#f8fafc" font-size="22" font-weight="800">DEFEND 51 项強制准出标准与确定性治理门控状态机 (Slides 35–40)</text>
  <text x="36" y="96" fill="#94a3b8" font-size="13">所有准出项必须为 True 或具备《正式残余风险接受书 + 补偿控制 + 责任人签字》；DEFENDComplete 未闭环时硬性阻断 DEFENDExtend 激活</text>

