  <text x="758" y="371" fill="#cbd5e1" font-size="10.5">✓ M07 安全与合规共同责任归属确认</text>
  <text x="758" y="387" fill="#cbd5e1" font-size="10.5">✓ M08 高管层汇报结构已商定</text>
  <rect x="758" y="422" width="192" height="86" rx="8" fill="#1e1b4b" stroke="#f87171" stroke-dasharray="4 3"/>
  <text x="854" y="444" fill="#f87171" font-size="11" font-weight="800" text-anchor="middle">HARD GOVERNANCE LOCK</text>
  <text x="854" y="464" fill="#fecaca" font-size="10.5" text-anchor="middle">若 M01–M08 未全部达成</text>
  <text x="854" y="481" fill="#fecaca" font-size="10.5" text-anchor="middle">严禁解锁 DEFENDExtend</text>
  <text x="854" y="498" fill="#fbbf24" font-size="10" text-anchor="middle">(防止把噪音灌入 Sentinel SIEM)</text>

  <!-- Column 5: DEFENDExtend (9 items) -->
  <rect x="980" y="118" width="224" height="410" rx="12" fill="#431407" stroke="#fb923c" stroke-width="1.5"/>
  <text x="994" y="144" fill="#fdba74" font-size="13" font-weight="800">5. DEFENDExtend (9 项)</text>
  <text x="994" y="162" fill="#fed7aa" font-size="11">Slide 39 · 规模化持续检测与 SOC</text>
  <text x="994" y="186" fill="#f8fafc" font-size="11" font-weight="700">[Foundations &amp; SIEM · 2]</text>
  <text x="994" y="203" fill="#fbbf24" font-size="10.5" font-weight="700">✓ E01 DEFENDComplete 准出全部满足</text>
