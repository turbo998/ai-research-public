  <!-- Bottom Left Panel: 8-Label DEFEND-Aligned Taxonomy -->
  <g filter="url(#shTk)">
    <rect x="40" y="432" width="600" height="320" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <rect x="40" y="432" width="600" height="34" rx="12" fill="#1E293B"/>
    <text x="58" y="454" fill="#38BDF8" font-size="13" font-weight="700">8-Label DEFEND-Aligned Sensitivity Taxonomy (With LOB Encryption Exception Gates)</text>

    <text x="58" y="484" fill="#E2E8F0" font-size="11" font-weight="700">1. PUBLIC</text>
    <text x="275" y="484" fill="#94A3B8" font-size="10.5">No encryption · External sharing allowed (Brochures, public releases)</text>

    <text x="58" y="510" fill="#E2E8F0" font-size="11" font-weight="700">2. GENERAL (Default Email)</text>
    <text x="275" y="510" fill="#94A3B8" font-size="10.5">No encryption · Internal marking only · Standard routine business ops</text>

    <text x="58" y="536" fill="#7DD3FC" font-size="11" font-weight="700">3. CONFIDENTIAL \ ALL EMPLOYEES</text>
    <text x="275" y="536" fill="#CBD5E1" font-size="10.5">Default File/Site · Encryption + marking · No external sharing</text>

    <text x="58" y="562" fill="#7DD3FC" font-size="11" font-weight="700">4. CONFIDENTIAL \ SPECIFIC PEOPLE</text>
    <text x="275" y="562" fill="#CBD5E1" font-size="10.5">Named-user encryption for governed external partners/vendors/clients</text>

    <rect x="52" y="574" width="576" height="28" rx="4" fill="#1E293B" stroke="#F59E0B" stroke-width="1"/>
    <text x="58" y="592" fill="#FCD34D" font-size="10.5" font-weight="700">5. CONFIDENTIAL \ INTERNAL EXCEPTION</text>
    <text x="285" y="592" fill="#FDE68A" font-size="10">Marking ONLY (No encryption) when encryption breaks ERP/EHR/SIS/MRP · Quarterly review</text>

    <text x="58" y="624" fill="#C084FC" font-size="11" font-weight="700">6. HIGHLY CONF \ ALL EMPLOYEES</text>
    <text x="275" y="624" fill="#CBD5E1" font-size="10.5">Strong encryption + watermark · Block external access (Payroll, PHI, IP)</text>

    <text x="58" y="650" fill="#C084FC" font-size="11" font-weight="700">7. HIGHLY CONF \ SPECIFIC PEOPLE</text>
    <text x="275" y="650" fill="#CBD5E1" font-size="10.5">Named-user only + SIT auto-labeling recommended (M&amp;A, legal, audits)</text>

    <rect x="52" y="662" width="576" height="28" rx="4" fill="#1E293B" stroke="#EF4444" stroke-width="1"/>
    <text x="58" y="680" fill="#FCA5A5" font-size="10.5" font-weight="700">8. HIGHLY CONF \ INTERNAL EXCEPTION</text>
    <text x="285" y="680" fill="#FECACA" font-size="10">Marking ONLY where encryption breaks QMS/clinical/regulatory tools · IT sign-off + 90d audit</text>

    <text x="58" y="718" fill="#94A3B8" font-size="10.5">Architectural Insight: Explicitly separating INTERNAL EXCEPTION sub-labels prevents shadow workarounds while</text>
    <text x="58" y="734" fill="#94A3B8" font-size="10.5">preserving DLP inspection and aligning directly with DEFEND Slide 35–40 formal risk-acceptance governance.</text>
  </g>

