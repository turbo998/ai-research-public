    <text x="684" y="580" fill="#CBD5E1" font-size="10">• Identity (90p), Device Security (51p), Email (52p) &amp; SaaS (35p) Advanced chapters -&gt; Slide 36 (12/12 Security Gates).</text>
    <text x="684" y="594" fill="#94A3B8" font-size="10">• Data Security Guide Priority 3 (pp. 42–90) + Day-30 DLP Simulation Exit Runbook -&gt; Slide 37 (11/11 Compliance Gates).</text>

    <!-- Row 3 -->
    <rect x="672" y="612" width="552" height="68" rx="6" fill="#1E293B" stroke="#C084FC" stroke-width="1"/>
    <text x="684" y="631" fill="#D8B4FE" font-size="11" font-weight="700">Purview Tier 3 (Data Control) · Dual AI Guardrail Pattern (Governed Copilot vs Shadow Web AI)</text>
    <text x="684" y="648" fill="#CBD5E1" font-size="10">• Internal Governed AI: DLP for M365 Copilot (2 rules: SITs + Sensitivity Labels with prompt/response simulation).</text>
    <text x="684" y="663" fill="#CBD5E1" font-size="10">• External Unmanaged AI: DLP for Edge / Inline Web Traffic (blocks sensitive paste/upload to ChatGPT &amp; Gemini)</text>
    <text x="684" y="676" fill="#94A3B8" font-size="9.5">  paired with Activate DSPM (oversharing discovery) and Defender for Cloud Apps Shadow IT governance.</text>

    <!-- Row 4 -->
    <rect x="672" y="688" width="552" height="52" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
    <text x="684" y="707" fill="#6EE7B7" font-size="11" font-weight="700">DEFENDComplete, Data Assure (Tier 4) &amp; DEFENDExtend · Ongoing Managed Services</text>
    <text x="684" y="724" fill="#CBD5E1" font-size="10">• SOW Generator 30-Day Hypercare + Ongoing Managed Services (Monthly Health Monitoring, Quarterly Policy</text>
    <text x="684" y="736" fill="#94A3B8" font-size="9.5">  Tuning, Incident Response) -&gt; Satisfies Slide 38 Complete (8/8) before unlocking Slide 39 Sentinel Extend (9/9).</text>
