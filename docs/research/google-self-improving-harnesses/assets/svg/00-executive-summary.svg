<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-labelledby="title desc">
  <title id="title">Google《Harnesses That Improve Themselves》核心战果与跨模型迁移一图流总结</title>
  <desc id="desc">展示 SWE-bench Lite (sympy + django) 上 Seed、Prompt 反思、无约束全重写与门控模块化演化在 Gemini 3.8 Flash 与 Gemini 4 Argon 上的准确率与 Token 成本对比。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="accentAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="accentRed" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="680" fill="url(#bg)" rx="18"/>
  <rect x="24" y="20" width="1152" height="86" rx="14" fill="#162036" stroke="#2d3f63"/>
  <text x="48" y="53" fill="#60a5fa" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">GOOGLE RESEARCH · ARXIV:2611.22299V1 (DEEP SHAH &amp; NEHAL KATHROTIA, 2026-11-17)</text>
  <text x="48" y="84" fill="#f8fafc" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="800">《Harnesses That Improve Themselves》：门控模块化自进化 8× 提效与 1/10 成本突破</text>

  <!-- Top 4 KPI Cards -->
  <g transform="translate(24,122)">
    <rect width="276" height="106" rx="12" fill="#131c31" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="30" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">Gemini 3.8 Flash 盲测解率</text>
    <text x="20" y="68" fill="#34d399" font-family="Consolas, monospace" font-size="31" font-weight="800">5.0% → 40.0%</text>
    <text x="20" y="91" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">提升 8.0× · 跨仓未验证早退降至 0.0%</text>
  </g>
  <g transform="translate(316,122)">
    <rect width="276" height="106" rx="12" fill="#131c31" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="30" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">单题平均运行时 Token 消耗</text>
    <text x="20" y="68" fill="#38bdf8" font-family="Consolas, monospace" font-size="31" font-weight="800">46.7k tok</text>
    <text x="20" y="91" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">较初始降 2.5× · 仅为无约束重写的 ~1/10</text>
  </g>
  <g transform="translate(608,122)">
    <rect width="276" height="106" rx="12" fill="#131c31" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="20" y="30" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">零样本迁移 Gemini 4 Argon</text>
    <text x="20" y="68" fill="#c4b5fd" font-family="Consolas, monospace" font-size="31" font-weight="800">37.5% (#1)</text>
    <text x="20" y="91" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">反超全量重写 (30.0%) · 成本不足其 1/4</text>
  </g>
  <g transform="translate(900,122)">
    <rect width="276" height="106" rx="12" fill="#131c31" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="20" y="30" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">外环搜索成本回本周期</text>
    <text x="20" y="68" fill="#fbbf24" font-family="Consolas, monospace" font-size="31" font-weight="800">&lt; 100 次任务</text>
    <text x="20" y="91" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">部署不足百题即赚回全部 100 轮演化开销</text>
  </g>

  <!-- Left Panel: Part A & B Held-out Accuracy Comparison -->
  <rect x="24" y="246" width="568" height="410" rx="14" fill="#131c31" stroke="#283552"/>
  <text x="46" y="280" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="17" font-weight="800">SWE-bench Lite 盲测准确率对比（sympy 域内 + django 跨仓 OOD）</text>
  <text x="46" y="302" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">蓝条：Part A 围绕冻结 Gemini 3.8 Flash 演化 · 绿条：Part B 零样本直接迁移至 Gemini 4 Argon</text>

  <!-- Method 1 -->
  <text x="46" y="342" fill="#e2e8f0" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">1. 初始种子 Harness (142行 Pass@1)</text>
  <rect x="275" y="328" width="32" height="16" rx="4" fill="url(#accentBlue)"/>
  <text x="315" y="341" fill="#93c5fd" font-family="Consolas, monospace" font-size="12" font-weight="700">5.0% (Flash)</text>
  <rect x="275" y="348" width="64" height="16" rx="4" fill="#64748b"/>
  <text x="347" y="361" fill="#cbd5e1" font-family="Consolas, monospace" font-size="12" font-weight="700">10.0% (Argon 零样本)</text>

  <!-- Method 2 -->
  <text x="46" y="416" fill="#fca5a5" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">2. 纯提示词反思 (RULES.md)</text>
  <rect x="275" y="402" width="16" height="16" rx="4" fill="url(#accentRed)"/>
  <text x="299" y="415" fill="#fca5a5" font-family="Consolas, monospace" font-size="12" font-weight="700">2.5% (倒退! 早退翻倍 15%→30%)</text>
  <rect x="275" y="422" width="96" height="16" rx="4" fill="#64748b"/>
  <text x="379" y="435" fill="#cbd5e1" font-family="Consolas, monospace" font-size="12" font-weight="700">15.0% (Argon 零样本)</text>

  <!-- Method 3 -->
  <text x="46" y="492" fill="#fcd34d" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">3. 无约束全量重写 (28轮无压缩)</text>
  <rect x="275" y="478" width="272" height="16" rx="4" fill="url(#accentAmber)"/>
  <text x="415" y="472" fill="#fcd34d" font-family="Consolas, monospace" font-size="12" font-weight="700">42.5% (Flash · 451.6k tok!)</text>
  <rect x="275" y="498" width="192" height="16" rx="4" fill="url(#accentRed)"/>
  <text x="475" y="511" fill="#fca5a5" font-family="Consolas, monospace" font-size="12" font-weight="700">30.0% (Argon 崩塌 -12.5pp)</text>

  <!-- Method 4 -->
  <rect x="36" y="544" width="544" height="92" rx="10" fill="#0d2824" stroke="#10b981"/>
  <text x="48" y="572" fill="#6ee7b7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14" font-weight="800">4. 门控模块化演化 (Modular Gated · 12轮)</text>
  <rect x="275" y="558" width="256" height="18" rx="4" fill="url(#accentBlue)"/>
  <text x="390" y="618" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="800">Flash: 40.0% (46.7k) · Argon: 37.5% #1 (64.8k)</text>
  <rect x="275" y="582" width="240" height="18" rx="4" fill="url(#accentGreen)"/>

  <!-- Right Panel: Token Economics & 4-Patch Audit -->
  <rect x="608" y="246" width="568" height="410" rx="14" fill="#131c31" stroke="#283552"/>
  <text x="630" y="280" fill="#f8fafc" font-family="Segoe UI, PingFang SC, sans-serif" font-size="17" font-weight="800">单题解出成本鸿沟 (Tokens / Solved Task) 与四步门控演化账本</text>
  <text x="630" y="302" fill="#94a3b8" font-family="Segoe UI, PingFang SC, sans-serif" font-size="12">Stage 3 门禁 (G_val + 110k 上限) 精准拦截轮数膨胀，保留高复用确定性代码钩子</text>

  <!-- Cost Bar Comparison -->
  <text x="630" y="338" fill="#fcd34d" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">无约束全量重写 (单题峰值 &gt;2.8M tok)</text>
  <rect x="630" y="346" width="490" height="22" rx="5" fill="url(#accentRed)"/>
  <text x="640" y="362" fill="#ffffff" font-family="Consolas, monospace" font-size="12" font-weight="800">451.6k / 题 · 每解出 1 题消耗 1,062.6k Tokens (9.1× 昂贵)</text>

  <text x="630" y="392" fill="#6ee7b7" font-family="Segoe UI, PingFang SC, sans-serif" font-size="13" font-weight="700">门控模块化演化 (12 轮保持 + 首尾摘要压缩)</text>
  <rect x="630" y="400" width="54" height="22" rx="5" fill="url(#accentGreen)"/>
  <text x="694" y="416" fill="#6ee7b7" font-family="Consolas, monospace" font-size="12" font-weight="800">46.7k / 题 · 每解出 1 题仅 116.8k Tokens!</text>

  <!-- 4 Module Evolution Boxes -->
  <g transform="translate(630,440)">
    <rect width="524" height="44" rx="8" fill="#17253f" stroke="#10b981"/>
    <text x="14" y="19" fill="#34d399" font-family="Consolas, PingFang SC, monospace" font-size="12" font-weight="800">[ACCEPT] 1. context_mgr.py · 上下文与状态压缩</text>
    <text x="14" y="36" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">&gt;2 轮旧观察首尾摘要压缩 + 实时轮次/编辑状态页脚 → Dev/Val 准确率翻 5 倍</text>
  </g>
  <g transform="translate(630,492)">
    <rect width="524" height="44" rx="8" fill="#17253f" stroke="#10b981"/>
    <text x="14" y="19" fill="#34d399" font-family="Consolas, PingFang SC, monospace" font-size="12" font-weight="800">[ACCEPT] 2. action_aci.py · 工具窗口化与空改拦截</text>
    <text x="14" y="36" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">分页文件视图 + Shell 输出截断 + finish 空 diff 硬件守卫 → 彻底消灭盲目早退</text>
  </g>
  <g transform="translate(630,544)">
    <rect width="524" height="44" rx="8" fill="#2a1621" stroke="#ef4444"/>
    <text x="14" y="19" fill="#f87171" font-family="Consolas, PingFang SC, monospace" font-size="12" font-weight="800">[REJECT] 3. control.py · 轮数上限膨胀 (12 → 18 轮)</text>
    <text x="14" y="36" fill="#fecaca" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">Dev 分上涨但 Val 分下跌且突破 110k Token 红线 → 被 Stage 3 G_val 门禁当场拦截!</text>
  </g>
  <g transform="translate(630,596)">
    <rect width="524" height="44" rx="8" fill="#17253f" stroke="#10b981"/>
    <text x="14" y="19" fill="#34d399" font-family="Consolas, PingFang SC, monospace" font-size="12" font-weight="800">[ACCEPT] 4. verify.py · Pre-Stop 编译与测试验证门</text>
    <text x="14" y="36" fill="#cbd5e1" font-family="Segoe UI, PingFang SC, sans-serif" font-size="11.5">强制非空 git diff + Python 编译无错 + 修改后单测通过方可退出 → 盲测达 40.0%</text>
  </g>
</svg>
