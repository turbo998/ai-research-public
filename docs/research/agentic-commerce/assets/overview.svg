<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="980" height="470" rx="16" fill="#0B1120"/>
  <rect x="24" y="20" width="932" height="78" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="52" fill="#F8FAFC" font-size="20" font-weight="700">Agentic Commerce Full-Stack Architecture: Web IQ, ACP/UCP &amp; AP2/x402</text>
  <text x="44" y="78" fill="#94A3B8" font-size="12.5">From Trusted Web Grounding and Anti-Prompt-Injection to Cryptographic Payment Mandates &amp; Spend Circuit Breakers</text>
  <rect x="780" y="34" width="156" height="46" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="858" y="62" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="700">WEB IQ × ACP × AP2</text>
  
  <rect x="24" y="116" width="292" height="270" rx="12" fill="#0F172A" stroke="#0EA5E9" stroke-width="1.8"/>
  <rect x="24" y="116" width="292" height="40" rx="12" fill="#0EA5E9" fill-opacity="0.22"/>
  <text x="40" y="142" fill="#38BDF8" font-size="14" font-weight="700">1. Discovery &amp; Web IQ Grounding</text>
  <text x="40" y="188" fill="#CBD5E1" font-size="12">• Microsoft Web IQ real-time web &amp; product</text><text x="40" y="214" fill="#CBD5E1" font-size="12">  grounding with structured provenance</text><text x="40" y="240" fill="#CBD5E1" font-size="12">• Indirect prompt-injection sanitization</text><text x="40" y="266" fill="#CBD5E1" font-size="12">  on untrusted merchant DOM / reviews</text><text x="40" y="292" fill="#CBD5E1" font-size="12">• Price, SKU &amp; inventory cross-verification</text>
  <rect x="40" y="336" width="260" height="34" rx="6" fill="#1E293B" stroke="#0EA5E9" stroke-width="1"/>
  <text x="170" y="358" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700">Web IQ Anti-Injection Grounding</text>
  <rect x="344" y="116" width="292" height="270" rx="12" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.8"/>
  <rect x="344" y="116" width="292" height="40" rx="12" fill="#8B5CF6" fill-opacity="0.22"/>
  <text x="360" y="142" fill="#C4B5FD" font-size="14" font-weight="700">2. Checkout State Machine (ACP/UCP)</text>
  <text x="360" y="188" fill="#CBD5E1" font-size="12">• OpenAI/Stripe ACP &amp; Google/Shopify UCP</text><text x="360" y="214" fill="#CBD5E1" font-size="12">• Deterministic Cart → Quote → Tax/Shipping</text><text x="360" y="240" fill="#CBD5E1" font-size="12">  → Order confirmation state transitions</text><text x="360" y="266" fill="#CBD5E1" font-size="12">• Idempotency keys prevent double-charging</text><text x="360" y="292" fill="#CBD5E1" font-size="12">  across agent retries &amp; network timeouts</text>
  <rect x="360" y="336" width="260" height="34" rx="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
  <text x="490" y="358" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700">Idempotent ACP / UCP Checkout</text>
  <rect x="664" y="116" width="292" height="270" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
  <rect x="664" y="116" width="292" height="40" rx="12" fill="#10B981" fill-opacity="0.22"/>
  <text x="680" y="142" fill="#6EE7B7" font-size="14" font-weight="700">3. Payment Mandate &amp; Circuit Breaker</text>
  <text x="680" y="188" fill="#CBD5E1" font-size="12">• Google AP2 cryptographic Intent &amp; Cart</text><text x="680" y="214" fill="#CBD5E1" font-size="12">  Mandates signed by user hardware key</text><text x="680" y="240" fill="#CBD5E1" font-size="12">• Coinbase x402 HTTP 402 micropayments</text><text x="680" y="266" fill="#CBD5E1" font-size="12">• Dual-threshold policy: &lt;=$50 auto-execute;</text><text x="680" y="292" fill="#CBD5E1" font-size="12">  &gt;$50 or new payee → FIDO2 HITL approval</text>
  <rect x="680" y="336" width="260" height="34" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="810" y="358" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700">0 Unauthorized Spend · FIDO2 Gate</text>
  <rect x="24" y="402" width="932" height="48" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="44" y="431" fill="#E2E8F0" font-size="12.5" font-weight="600">Security Axiom: Never grant an LLM raw credit-card or wallet keys; enforce cryptographic Cart Mandates (AP2/x402) at the payment gateway.</text>
</svg>
