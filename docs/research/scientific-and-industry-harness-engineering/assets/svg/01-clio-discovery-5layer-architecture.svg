  <rect width="1200" height="720" fill="url(#bgGrad)"/>

  <!-- Header -->
  <text x="40" y="42" fill="#38BDF8" font-size="13" font-weight="700" letter-spacing="1.5">MICROSOFT DISCOVERY &amp; CLIO ARCHITECTURE BLUEPRINT (ARXIV:2508.02789 · ARXIV:2606.02618V1)</text>
  <text x="40" y="72" fill="#F8FAFC" font-size="24" font-weight="800">5-Layer Industry &amp; Scientific Harness Engineering Reference Architecture</text>
  <text x="40" y="96" fill="#94A3B8" font-size="13">Decoupling Epistemic Belief State, Clean-Context Recursive Cognition, Calibrated Deference Tool Governance &amp; Separated Validation</text>

  <!-- KPI Pills Top Right -->
  <rect x="830" y="28" width="170" height="58" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="845" y="48" fill="#94A3B8" font-size="11" font-weight="600">HLE BIO/MED (NO TOOLS)</text>
  <text x="845" y="72" fill="#38BDF8" font-size="20" font-weight="800">22.37% (+161.6%)</text>

  <rect x="1012" y="28" width="150" height="58" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
  <text x="1026" y="48" fill="#94A3B8" font-size="11" font-weight="600">ALE PHYSICAL SCI (5H)</text>
  <text x="1026" y="72" fill="#10B981" font-size="20" font-weight="800">75.2% (#1 Pass@1)</text>

  <!-- LAYER 1: Async Human-AI Shared Session & Task DAG -->
  <rect x="35" y="115" width="1130" height="102" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <rect x="35" y="115" width="8" height="102" rx="4" fill="url(#accentBlue)"/>
  <text x="58" y="138" fill="#38BDF8" font-size="13" font-weight="700">LAYER 1 · ASYNC HUMAN–AI COLLABORATION &amp; SHARED SESSION TASK DAG (DISCOVERY ENGINE)</text>

  <rect x="58" y="148" width="250" height="56" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="72" y="168" fill="#F8FAFC" font-size="13" font-weight="700">1. Objective &amp; Task DAG</text>
  <text x="72" y="186" fill="#CBD5E1" font-size="11">Parent/Child + Depends-On Sequencing</text>
  <text x="72" y="200" fill="#94A3B8" font-size="10">Full / Structured / Parallel Delegation</text>

  <rect x="328" y="148" width="275" height="56" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="342" y="168" fill="#F8FAFC" font-size="13" font-weight="700">2. Calibrated Validation Requirements</text>
  <text x="342" y="186" fill="#CBD5E1" font-size="11">Verifiable Output Contracts (Not Steps)</text>
  <text x="342" y="200" fill="#38BDF8" font-size="10">Inspects .md / .csv / .json / .py Storage Assets</text>

  <rect x="623" y="148" width="265" height="56" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="637" y="168" fill="#F8FAFC" font-size="13" font-weight="700">3. Mid-Stream Expert Interjection</text>
  <text x="637" y="186" fill="#CBD5E1" font-size="11">Edit Belief Nodes &amp; Task Comments</text>
  <text x="637" y="200" fill="#10B981" font-size="10">Time-Travel Replay Without Context Reset</text>

  <rect x="908" y="148" width="240" height="56" rx="6" fill="#1E293B" stroke="#F59E0B"/>
  <text x="922" y="168" fill="#FBBF24" font-size="13" font-weight="700">4. Prompt-Free Escalation Gate</text>
  <text x="922" y="186" fill="#CBD5E1" font-size="11">dU/dt &gt; 0 or Oscillation Trigger</text>
  <text x="922" y="200" fill="#F59E0B" font-size="10">3-Strike Identical Gap Circuit Breaker</text>

  <!-- LAYER 2: CLIO Recursive Cognition & Dual-Speed Thinking -->
  <rect x="35" y="232" width="740" height="168" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <rect x="35" y="232" width="8" height="168" rx="4" fill="url(#accentPurple)"/>
  <text x="58" y="255" fill="#C084FC" font-size="13" font-weight="700">LAYER 2 · CLIO IN-SITU RECURSIVE COGNITION LOOP (ALGORITHM 1 · CLEAN-CONTEXT CHANNELS)</text>

  <rect x="58" y="268" width="210" height="116" rx="6" fill="#1E293B" stroke="#6366F1"/>
  <text x="72" y="290" fill="#F8FAFC" font-size="13" font-weight="700">Thinking Module</text>
  <text x="72" y="310" fill="#38BDF8" font-size="11">• Fast Thinking: Dependency ready</text>
  <text x="72" y="328" fill="#C084FC" font-size="11">• Slow Thinking: Ambiguity / Regret</text>
  <text x="72" y="346" fill="#CBD5E1" font-size="11">• Controls Depth D &amp; Branching b</text>
  <text x="72" y="366" fill="#94A3B8" font-size="10">Dynamic Complete T(s)=0 Registration</text>

  <rect x="290" y="268" width="235" height="116" rx="6" fill="#1E293B" stroke="#A855F7"/>
  <text x="304" y="290" fill="#F8FAFC" font-size="13" font-weight="700">Spawned Clean-Context Channels</text>
  <text x="304" y="310" fill="#CBD5E1" font-size="11">Forks isolated context s_i when:</text>
  <text x="304" y="328" fill="#10B981" font-size="11">1. Orthogonal hypothesis branch (1..4)</text>
  <text x="304" y="346" fill="#10B981" font-size="11">2. High-noise intermediate triage</text>
  <text x="304" y="364" fill="#10B981" font-size="11">3. Distinct specialist persona/toolset</text>

  <rect x="545" y="268" width="212" height="116" rx="6" fill="#1E293B" stroke="#EC4899"/>
  <text x="559" y="290" fill="#F8FAFC" font-size="13" font-weight="700">Uncertainty Monitor c(s)</text>
  <text x="559" y="310" fill="#10B981" font-size="11">• dU/dt &lt; 0: Converging belief</text>
  <text x="559" y="328" fill="#38BDF8" font-size="11">• Spike + Child Channel: Resolved</text>
  <text x="559" y="346" fill="#F43F5E" font-size="11">• dU/dt &gt; 0 + Oscillation: Abort</text>
  <text x="559" y="366" fill="#94A3B8" font-size="10">Prevents semantic explosion</text>

  <!-- LAYER 3: Persistent Online Belief-State Graph (Right Side) -->
  <rect x="795" y="232" width="370" height="168" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <rect x="795" y="232" width="8" height="168" rx="4" fill="url(#accentEmerald)"/>
