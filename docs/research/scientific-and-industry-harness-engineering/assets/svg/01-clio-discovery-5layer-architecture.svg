  <rect x="818" y="268" width="330" height="52" rx="6" fill="#1E293B" stroke="#10B981"/>
  <text x="832" y="288" fill="#F8FAFC" font-size="12" font-weight="700">GraphRAG Community Clustering + DRIFT Search</text>
  <text x="832" y="306" fill="#CBD5E1" font-size="11">Entity/Relation extraction across M sampled paths (+7.90% HLE)</text>

  <rect x="818" y="330" width="330" height="54" rx="6" fill="#1E293B" stroke="#059669"/>
  <text x="832" y="350" fill="#F8FAFC" font-size="12" font-weight="700">Cross-Round Warm-Start &amp; Regret Ledger</text>
  <text x="832" y="368" fill="#CBD5E1" font-size="11">Stores Accepted / Refuted / Open hypotheses (Not raw chat)</text>

  <!-- LAYER 4: Calibrated Deference & Separated Validation -->
  <rect x="35" y="415" width="1130" height="135" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <rect x="35" y="415" width="8" height="135" rx="4" fill="url(#accentAmber)"/>
  <text x="58" y="438" fill="#FBBF24" font-size="13" font-weight="700">LAYER 4 · CALIBRATED DEFERENCE ENGINE &amp; INDEPENDENT VALIDATION PLANE (ARXIV:2606.02618V1)</text>

  <rect x="58" y="450" width="355" height="84" rx="6" fill="#1E293B" stroke="#F59E0B"/>
  <text x="72" y="472" fill="#FBBF24" font-size="13" font-weight="700">Graded Tool Trust State Machine</text>
  <text x="72" y="492" fill="#CBD5E1" font-size="11">R1: Uncritical Acceptance → R2: Detect ~2.7V Anchor Gap</text>
  <text x="72" y="510" fill="#10B981" font-size="11">→ Salvage Rank-Order Utility → R3: Exclude from Hard Gate</text>
  <text x="72" y="525" fill="#94A3B8" font-size="10">Runtime Resilience: 40-60 batch throttled → 6 micro-batches</text>

  <rect x="430" y="450" width="365" height="84" rx="6" fill="#1E293B" stroke="#38BDF8"/>
  <text x="444" y="472" fill="#38BDF8" font-size="13" font-weight="700">Tri-Tier Objective &amp; Mechanistic Hypothesis Engine</text>
  <text x="444" y="492" fill="#CBD5E1" font-size="11">• Tier A (Numerical): ML Predictors + Anchor Calibration</text>
  <text x="444" y="510" fill="#CBD5E1" font-size="11">• Tier B (Loosely Quantifiable): Retrosynthesis + Scaffold Audit</text>
  <text x="444" y="525" fill="#10B981" font-size="11">• Tier C (Heuristic): Tier 1/2/3 Hypotheses + Discriminating Tests</text>

  <rect x="812" y="450" width="336" height="84" rx="6" fill="#1E293B" stroke="#10B981"/>
  <text x="826" y="472" fill="#10B981" font-size="13" font-weight="700">Separated Validator (Zero Self-Grading)</text>
  <text x="826" y="492" fill="#CBD5E1" font-size="11">&quot;The agent that did the work never grades its own output&quot;</text>
  <text x="826" y="510" fill="#CBD5E1" font-size="11">Dedicated Validator (gpt-5.4) checks Result + File Assets</text>
  <text x="826" y="525" fill="#38BDF8" font-size="10">Outcomes: Complete | Incomplete | Needs User Attention | Failed</text>

  <!-- LAYER 5: Base Harness, Multi-Model Pool & Specialist Tools -->
  <rect x="35" y="565" width="1130" height="125" rx="10" fill="#111827" stroke="#334155" stroke-width="1.5"/>
  <rect x="35" y="565" width="8" height="125" rx="4" fill="url(#accentBlue)"/>
  <text x="58" y="588" fill="#38BDF8" font-size="13" font-weight="700">LAYER 5 · BASE HARNESS (GITHUB COPILOT), DYNAMIC MULTI-MODEL ROUTING &amp; CONTAINERIZED HPC TOOLS</text>

  <rect x="58" y="600" width="340" height="74" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="72" y="622" fill="#F8FAFC" font-size="13" font-weight="700">GitHub Copilot Base Harness + Dynamic Models</text>
  <text x="72" y="640" fill="#CBD5E1" font-size="11">Default: GPT-5.6 Sol / GPT-5.2 / GPT-4.1</text>
  <text x="72" y="658" fill="#38BDF8" font-size="11">Fallback on false rejection: Opus 5 / o3 / Phi-4 / Grok-4</text>

  <rect x="418" y="600" width="365" height="74" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="432" y="622" fill="#F8FAFC" font-size="13" font-weight="700">Domain Specialist Agents (Persona-Scoped)</text>
  <text x="432" y="640" fill="#CBD5E1" font-size="11">• SmallMoleculeDesignAndGenerationAgent</text>
  <text x="432" y="658" fill="#CBD5E1" font-size="11">• FitnessFunctionAgent · RetrosynthesisAnalysisAgent</text>

  <rect x="803" y="600" width="345" height="74" rx="6" fill="#1E293B" stroke="#475569"/>
  <text x="817" y="622" fill="#F8FAFC" font-size="13" font-weight="700">FastAPI Tools, Bookshelf KB &amp; Lab-in-the-Loop</text>
  <text x="817" y="640" fill="#CBD5E1" font-size="11">Graphormer (E_red, logS) · RDKit (SAscore) · RetroChimera</text>
  <text x="817" y="658" fill="#10B981" font-size="11">Azure Foundry Deep Research · Wet-Lab CV &amp; UV-Vis SEC</text>
</svg>
