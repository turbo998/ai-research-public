  <text x="40" y="42" fill="#38BDF8" font-size="13" font-weight="700" letter-spacing="1.5">PARADIGM SHIFT · FROM SOFTWARE CODING HARNESS TO INDUSTRY DISCOVERY HARNESS</text>
