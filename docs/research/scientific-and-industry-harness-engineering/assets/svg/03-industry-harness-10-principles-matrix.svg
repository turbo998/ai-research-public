  <text x="635" y="258" fill="#F8FAFC" font-size="12">5. Stopping Rule: Separated Validator + dU/dt Oscillation Escalation</text>
  <text x="635" y="280" fill="#10B981" font-size="11" font-weight="700">ALE Physical Sciences Score (Discovery + CLIO + Multi-Model): 75.2% (+18.3%)</text>

