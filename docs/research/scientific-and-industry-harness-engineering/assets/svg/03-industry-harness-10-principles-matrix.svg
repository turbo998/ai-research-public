  <text x="55" y="170" fill="#CBD5E1" font-size="12">1. Oracle Reality: Deterministic compiler / unit test (100% ground truth)</text>
  <text x="55" y="192" fill="#CBD5E1" font-size="12">2. Time Horizon: Seconds to minutes; interactive chat loop</text>
