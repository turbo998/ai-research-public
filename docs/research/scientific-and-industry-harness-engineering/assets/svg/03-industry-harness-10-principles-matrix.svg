  <text x="55" y="258" fill="#CBD5E1" font-size="12">5. Stopping Rule: Agent self-declares task_complete when tests pass</text>
  <text x="55" y="280" fill="#FBBF24" font-size="11">ALE Physical Sciences Score (Single-Model Coding Harness): 56.9% – 66.6%</text>

