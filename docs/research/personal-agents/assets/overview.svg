<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="980" height="470" rx="16" fill="#0B1120"/>
  <rect x="24" y="20" width="932" height="78" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="52" fill="#F8FAFC" font-size="20" font-weight="700">Personal Agents 5-Product Architecture &amp; Governance Matrix (2026 Cutoff)</text>
  <text x="44" y="78" fill="#94A3B8" font-size="12.5">Comparative Analysis of Meta Muse, xAI Grok Bot, OpenAI dot/dots, Google Gemini Spark &amp; Instinct + 18-Case Protocol</text>
  <rect x="780" y="34" width="156" height="46" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="858" y="62" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="700">5 PRODUCTS · 18 CASES</text>
  
  <rect x="24" y="116" width="292" height="270" rx="12" fill="#0F172A" stroke="#0EA5E9" stroke-width="1.8"/>
  <rect x="24" y="116" width="292" height="40" rx="12" fill="#0EA5E9" fill-opacity="0.22"/>
  <text x="40" y="142" fill="#38BDF8" font-size="14" font-weight="700">1. Consumer VM &amp; Multi-Bot Teammates</text>
  <text x="40" y="188" fill="#CBD5E1" font-size="12">• Meta Muse (Muse Spark): Goals/Ideas +</text><text x="40" y="214" fill="#CBD5E1" font-size="12">  WhatsApp + dedicated Secure VM + Sentinel</text><text x="40" y="240" fill="#CBD5E1" font-size="12">• xAI Grok Bot: multi-named Bots in group</text><text x="40" y="266" fill="#CBD5E1" font-size="12">  chats + shared computer/plugins (role split</text><text x="40" y="292" fill="#CBD5E1" font-size="12">  != security boundary; multi-model managed)</text>
  <rect x="40" y="336" width="260" height="34" rx="6" fill="#1E293B" stroke="#0EA5E9" stroke-width="1"/>
  <text x="170" y="358" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700">Muse (Secure VM) · Grok Bot</text>
  <rect x="344" y="116" width="292" height="270" rx="12" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.8"/>
  <rect x="344" y="116" width="292" height="40" rx="12" fill="#8B5CF6" fill-opacity="0.22"/>
  <text x="360" y="142" fill="#C4B5FD" font-size="14" font-weight="700">2. Knowledge Work &amp; Workspace Native</text>
  <text x="360" y="188" fill="#CBD5E1" font-size="12">• OpenAI dot / dots: ChatGPT memory +</text><text x="360" y="214" fill="#CBD5E1" font-size="12">  plugins + optional local computer access</text><text x="360" y="240" fill="#CBD5E1" font-size="12">• Google Gemini Spark: 24/7 Tasks, Skills &amp;</text><text x="360" y="266" fill="#CBD5E1" font-size="12">  Schedules across Google Workspace (consumer</text><text x="360" y="292" fill="#CBD5E1" font-size="12">  account scope != enterprise Gemini IAM)</text>
  <rect x="360" y="336" width="260" height="34" rx="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
  <text x="490" y="358" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700">OpenAI dot · Gemini Spark</text>
  <rect x="664" y="116" width="292" height="270" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
  <rect x="664" y="116" width="292" height="40" rx="12" fill="#10B981" fill-opacity="0.22"/>
  <text x="680" y="142" fill="#6EE7B7" font-size="14" font-weight="700">3. Telecom-First &amp; Evaluation Protocol</text>
  <text x="680" y="188" fill="#CBD5E1" font-size="12">• Instinct: SMS/voice-first life assistant;</text><text x="680" y="214" fill="#CBD5E1" font-size="12">  broad data license (disconnect != deletion)</text><text x="680" y="240" fill="#CBD5E1" font-size="12">• Unified 18-Case Synthetic Protocol across</text><text x="680" y="266" fill="#CBD5E1" font-size="12">  continuity, delegation, boundary &amp; privacy</text><text x="680" y="292" fill="#CBD5E1" font-size="12">• Model score != product harness reliability</text>
  <rect x="680" y="336" width="260" height="34" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="810" y="358" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700">Instinct · 18-Case Test Protocol</text>
  <rect x="24" y="402" width="932" height="48" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="44" y="431" fill="#E2E8F0" font-size="12.5" font-weight="600">Core Finding: Personal agent safety is determined by VM/credential isolation, connector scope &amp; data retention terms—not raw model benchmarks.</text>
</svg>
