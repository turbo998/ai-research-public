<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 470" width="980" height="470" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
  <rect width="980" height="470" rx="16" fill="#0B1120"/>
  <rect x="24" y="20" width="932" height="78" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <text x="44" y="52" fill="#F8FAFC" font-size="20" font-weight="700">SKY-001 Engineering World Model &amp; 19-Model Coding Agent Benchmark</text>
  <text x="44" y="78" fill="#94A3B8" font-size="12.5">Track A: 19-Model × 11-Task Copilot CLI Benchmark (209 Runs) · Track B: Skyfall AI SKY-001 3D CAD/BIM World Model</text>
  <rect x="780" y="34" width="156" height="46" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="858" y="62" text-anchor="middle" fill="#38BDF8" font-size="12" font-weight="700">98.44x · 19 MODELS</text>
  
  <rect x="24" y="116" width="292" height="270" rx="12" fill="#0F172A" stroke="#0EA5E9" stroke-width="1.8"/>
  <rect x="24" y="116" width="292" height="40" rx="12" fill="#0EA5E9" fill-opacity="0.22"/>
  <text x="40" y="142" fill="#38BDF8" font-size="14" font-weight="700">1. Coding Agent Top Tier (19 Models)</text>
  <text x="40" y="188" fill="#CBD5E1" font-size="12">• #1 Fable 5.1: 99.77 / 100 ($3.22, 1310/1310)</text><text x="40" y="214" fill="#CBD5E1" font-size="12">• #2 Claude Opus 5.5: 99.68 ($2.69, 1310/1310)</text><text x="40" y="240" fill="#CBD5E1" font-size="12">• #3 Claude Opus 5: 99.59 ($2.91, 1310/1310)</text><text x="40" y="266" fill="#CBD5E1" font-size="12">• #4 Claude Haiku 5.5: 99.24 ($0.33, 1308/1310)</text><text x="40" y="292" fill="#CBD5E1" font-size="12">• #10 Gemini 4 Argon: 98.59 ($2.82, 1310/1310)</text>
  <rect x="40" y="336" width="260" height="34" rx="6" fill="#1E293B" stroke="#0EA5E9" stroke-width="1"/>
  <text x="170" y="358" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700">Haiku 5.5 #4 @ $0.33 (-91.6% Cost)</text>
  <rect x="344" y="116" width="292" height="270" rx="12" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.8"/>
  <rect x="344" y="116" width="292" height="40" rx="12" fill="#8B5CF6" fill-opacity="0.22"/>
  <text x="360" y="142" fill="#C4B5FD" font-size="14" font-weight="700">2. SKY-001 2-Stage 3D Architecture</text>
  <text x="360" y="188" fill="#CBD5E1" font-size="12">• Stage 1: Hierarchical Composer (DiT tree)</text><text x="360" y="214" fill="#CBD5E1" font-size="12">• Stage 2: Construction World Model (3D subgoals</text><text x="360" y="240" fill="#CBD5E1" font-size="12">  + Matryoshka latent rollout + Refiner)</text><text x="360" y="266" fill="#CBD5E1" font-size="12">• Jaguar E-Type (103 leaves, D=5): 10,336</text><text x="360" y="292" fill="#CBD5E1" font-size="12">  flat steps → 105 tree steps (98.44x speedup)</text>
  <rect x="360" y="336" width="260" height="34" rx="6" fill="#1E293B" stroke="#8B5CF6" stroke-width="1"/>
  <text x="490" y="358" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700">98.44x Shorter Critical Path</text>
  <rect x="664" y="116" width="292" height="270" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.8"/>
  <rect x="664" y="116" width="292" height="40" rx="12" fill="#10B981" fill-opacity="0.22"/>
  <text x="680" y="142" fill="#6EE7B7" font-size="14" font-weight="700">3. CAD/BIM Benchmark &amp; Boundaries</text>
  <text x="680" y="188" fill="#CBD5E1" font-size="12">• 1,000 CAD parts: SKY-001 79.7% IoU (3.9s,</text><text x="680" y="214" fill="#CBD5E1" font-size="12">  $0.005) vs GPT-6 Astra 79.1% (199s, $0.75)</text><text x="680" y="240" fill="#CBD5E1" font-size="12">• 51.0x faster &amp; 150.0x cheaper on CAD</text><text x="680" y="266" fill="#CBD5E1" font-size="12">• 1,000 BIM plans: SKY-001 43.6% vs Gemini</text><text x="680" y="292" fill="#CBD5E1" font-size="12">  3.8 Flash 42.3% (#2) &amp; GPT-6 Astra 40.6%</text>
  <rect x="680" y="336" width="260" height="34" rx="6" fill="#1E293B" stroke="#10B981" stroke-width="1"/>
  <text x="810" y="358" text-anchor="middle" fill="#34D399" font-size="12" font-weight="700">51x Faster · 150x Cheaper CAD</text>
  <rect x="24" y="402" width="932" height="48" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.2"/>
  <text x="44" y="431" fill="#E2E8F0" font-size="12.5" font-weight="600">Key Finding: Haiku 5.5 ($0.33, 99.24) redefines Coding Agent ROI; SKY-001 proves hierarchical 3D state rollout beats flat LLM codegen by 51x-98x.</text>
</svg>
