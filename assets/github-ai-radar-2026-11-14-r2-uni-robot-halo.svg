  <text x="1027" y="228" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" text-anchor="middle">Real-time C++ Unitree G1 deployment</text>

  <!-- HALO Architecture -->
  <rect x="632" y="258" width="522" height="192" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="646" y="280" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">How `HALO` Transfers Sim-Trained Perceptive Motion to Real Homes:</text>
  <text x="646" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Synthetic `datagen/` Pipeline: Combines procedural Infinigen indoor scenes with Kimodo</text>
  <text x="646" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   motions and Isaac/MuJoCo rendering to train both the motion generator and depth tracker.</text>
  <text x="646" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Hierarchical Closed Loop (`system/`): `halo_orchestrator` maps language + egocentric RGB</text>
  <text x="646" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   into subtasks, co-served on-device via `halo_serve` alongside the motion generator &amp; C++</text>
  <text x="646" y="382" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   low-level tracker (`tracker/deploy_cpp`) over `halo_comm`.</text>
  <text x="646" y="405" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Real-World Whole-Body Skills: Crawling under tables, sitting on sofas &amp; pushing boxes on G1.</text>
  <text x="646" y="426" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Unified `run_sim.py` (MuJoCo sim-to-sim) and `run_real.py` (physical Unitree G1) launchers.</text>

