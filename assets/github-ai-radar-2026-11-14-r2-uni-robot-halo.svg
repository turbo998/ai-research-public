  <text x="240" y="75" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">Open-RUA/uni-robot-agent (4-Tool `clean` Baseline, `code_as_policy` &amp; Hybrid Pi0.5) + apple-aiml-research/ml-halo (arXiv:2611.06908 Unitree G1 Stack)</text>

