  <!-- Uni-Robot-Agent Mechanics -->
  <rect x="46" y="258" width="522" height="192" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="60" y="280" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">4 Core Design Principles for Embodied Agent Harnesses (`MIT`):</text>
  <text x="60" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Overlapped Reasoning &amp; Execution: Overlaps LLM planning with physical robot tool execution</text>
  <text x="60" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   while strictly preserving order for operations that share physical robot resources.</text>
  <text x="60" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Realistic Observation Contract (`--no-depth` &amp; `--no-sam3`): Evaluates agents without</text>
  <text x="60" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   oracle simulator depth or ground-truth task-verifier leaks, using only RGB + calibration.</text>
  <text x="60" y="387" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">$ uni-robot-agent run --integration robodojo --task stack_bowls --tool-profile clean --monitor</text>
  <text x="60" y="409" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Built-In Episode Monitor: Inspect live camera feeds, tool latency &amp; `RunRecord` replays.</text>
  <text x="60" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Separates `agent_finished` (self-reported) from `task_success` (environment-verified).</text>

