  <text x="744" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 让真实拍摄的高斯泼溅活起来：模特不仅有自然呼吸与重心微移，头部还会实时跟随你的鼠标相机转动！</text>
  <text x="744" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 跨穿搭丝滑变形 (Outfit Morphing) + 智能避让商品标签：点击任意单品标签镜头自动推进特写，支持骨骼权重透视</text>
  <text x="744" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 内置无人值守橱窗巡演模式与 P 键纯净录屏模式，为下一代 3D 电商商品详情页提供了直接可用的开源模板</text>
  <text x="744" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 由 PlayCanvas 引擎核心作者构建，展示骨骼蒙皮 3DGS 在商业零售中的降维打击</text>

