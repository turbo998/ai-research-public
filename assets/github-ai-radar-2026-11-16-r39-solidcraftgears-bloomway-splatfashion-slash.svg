  <text x="68" y="766" fill="#38BDF8" font-family="Consolas, monospace" font-size="13.5" font-weight="bold">🎯 ARCHITECTURAL TAKEAWAYS FOR WASM CAD PLUGINS, 3D PREVIS &amp; RIGGED E-COMMERCE 3DGS:</text>
  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• CAD 生成插件必须输出原生可二次编辑的特征时间线 (Sketch/Extrude/Pattern)，并运行在零文件/零网络的 WASM 沙盒内。</text>
  <text x="68" y="814" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 在调昂贵视频模型前先用 Bloomway 3D 灰盒预演锁死走位与运镜，用 XSXB-Slash 导出跨 Unity/Godot/UE 的标准刀光包。</text>
  <text x="68" y="838" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 带骨骼呼吸、视线跟随与锚点特写标签的高斯泼溅 (splat-fashion) 正在重塑高客单价 3D 电商交互体验。</text>
