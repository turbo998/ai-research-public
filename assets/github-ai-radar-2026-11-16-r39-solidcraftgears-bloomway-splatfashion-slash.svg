  <text x="68" y="76" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">PROACTIVE DURABLE NEWS AGENT · 2026-11-16 NIGHT SHIFT ROUND 39 (CUMULATIVE R396) · CLAIM-20261116-R39-SOLIDCRAFTGEARS-BLOOMWAY-SLASH</text>
  <text x="68" y="108" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21.5" font-weight="bold">WASM 参数化齿轮插件 (solidcraft-gears) + 3D 预演导播台 + 动态试衣 3DGS + 刀光生成器</text>
  <text x="68" y="128" fill="#94A3B8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">零文件/零网络 WASM 生成可编辑 CAD 特征树 + 3D 走位运镜预演 + PlayCanvas 骨骼变形高斯时装 + 跨三引擎刀光包 · 净省 $5,400.00/月 (-93.26%)</text>

  <!-- Left Column: bherbruck/solidcraft-gears + sparklecatta-lang/XSXB-Slash -->
  <rect x="44" y="152" width="642" height="390" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="182" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">⚙️ 1. bherbruck/solidcraft-gears (★20) + sparklecatta-lang/XSXB-Slash (★21)</text>
  <text x="66" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">生成可二次修改的 CAD 特征时间线而非死网格 + 浏览器一键导出三大引擎刀光包</text>

  <rect x="66" y="220" width="598" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="82" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">bherbruck/solidcraft-gears：纯数学渐开线 + 零权限 WASM 沙盒插件</text>
  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 拒绝不可编辑的死三角网格 (Not a Mesh)：输入模数、齿数与齿宽，调用原生 SolidCraft 命令写入完整特征时间线</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 完整保留 5 步特征树：圆柱体 (Cylinder) → 渐开线草图 (Sketch) → 拉伸 (Extrude) → 圆周阵列 → 中心轴孔 (Bore)</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 极致安全的 WASM 组件模型 (craft:plugin@0.1.0, commands@0.1)：无需文件、无需网络、无需系统时钟权限</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 列出插件列表时绝不执行任何代码，为工业 CAD 插件生态树立了零信任沙盒标杆</text>

  <rect x="66" y="380" width="598" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="82" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">sparklecatta-lang/XSXB-Slash：一键随机 + 挂载 .glb 武器预览 + 跨三引擎导出</text>
  <text x="82" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 八大维度程序化叠层：主体/高光 (月牙/碎羽/火舌)、溶解啃咬 (裂纹/烧蚀/鳞片)、水波纹折射、火星、烟雾与甩出液体</text>
  <text x="82" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 拖入自有 .glb 武器直接从刀根向刀尖实时挥舞预览，不满意按空格键无限随机并随时回退“最近几次”</text>
  <text x="82" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 标准工业导出包：输出线性颜色/米/秒为单位的 recipe.json 与关 sRGB 的 shape/mask/highlight 贴图，直通 Unity/Godot/UE</text>
  <text x="82" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 附带 skill/ 目录与 examples/fable 示范包，让 Agent 一键为动作游戏配齐刀光特效</text>

