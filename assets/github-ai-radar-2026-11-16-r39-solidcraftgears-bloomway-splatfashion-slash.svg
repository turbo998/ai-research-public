  <text x="744" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• Build a World → Block a Scene → Rehearse the Camera：专为规划场景、角色走位 (Blocking) 与镜头运动轨迹打造</text>
  <text x="744" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 诚实划清边界：仓库提供的是开源 3D 灰盒预演工具 (Blockout Previs)，而非最终高成本 AI 视频生成本身</text>
  <text x="744" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 先在零算力成本的 3D 预演台把机位轴线与节奏调准，再送入视频模型渲染，砍掉 80% 盲目抽卡废片</text>
