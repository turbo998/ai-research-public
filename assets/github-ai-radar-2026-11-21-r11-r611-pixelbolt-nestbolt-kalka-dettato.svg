  <text x="44" y="600" fill="#cbd5e1" font-size="13">• Path A (Commercial Design-to-Code + Paid CAD Nesting Seats + Closed Audio/Sprite APIs): $3,260.00 SaaS + 41.0h ($4,100.00) = $7,360.00/mo</text>
  <text x="44" y="624" fill="#34d399" font-size="13.5" font-weight="700">• Path C (Hybrid Cloud Control + Pixelbolt + Nestbolt + Kalka + Dettato): $65.00 Compute + 2.4h ($240.00) = $305.00/mo ➔ Saves $7,055.00/mo (-95.86%)</text>
