  <text x="62" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Bundling per-installation Node/npm/Ollama eliminates global PATH collisions on Windows 10/11.</text>
  <text x="62" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. Keeping ASR/TTS weights unloaded at launch saves 2–4 GB of GPU VRAM until voice is toggled on.</text>
  <text x="62" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Users can revoke the agent's read/write access even to its own installation directory in Settings.</text>
  <text x="62" y="481" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Adopt CapriCore's Lazy-Unloaded Voice + Per-Install Runtime Isolation for Windows agents.</text>

