  <text x="646" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Modifying embedded firmware images breaks signatures and invalidates security/HMI research.</text>
  <text x="646" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. `IDEmu` keeps graphics (`glhost` + ANGLE), CAN/GPS, and V850 shims outside the system images.</text>
  <text x="646" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Compresses 2-minute cold boots down to ~1 second via VM snapshot restore and HVF acceleration.</text>
  <text x="646" y="481" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Use Out-of-Image QEMU Shims + Snapshot Restore for embedded QNX/Linux HMI testing.</text>

