  <text x="649" y="415" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Fuel-trim scaling verified against disassembled SBEC ROM code (`56030117` 1994 Cherokee 4.0L)</text>
  <text x="649" y="434" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Agent reads fault codes, logs live drives to `pc/logs/` &amp; runs built-in actuator tests</text>

