  <text x="88" y="314" fill="#38BDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Honest Uncertainty (`unknown`) &amp; Anti-Alert-Storm State Machine</text>
  <text x="88" y="333" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Missing RPC fields or failed probes become explicit `unknown`, never a fabricated healthy value</text>
  <text x="88" y="350" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Sustained-failure thresholds, stable recovery gates, deduplication &amp; severity escalation</text>

