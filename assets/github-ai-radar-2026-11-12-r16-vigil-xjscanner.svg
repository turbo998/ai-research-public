  <text x="88" y="257" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Never asks for seed phrases, private keys, or keypair files; zero signing or host-mutation code</text>
  <text x="88" y="274" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Built with Go's standard library only into a single static Linux AMD64/ARM64 executable</text>

