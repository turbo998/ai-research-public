  <text x="44" y="56" fill="#f8fafc" font-size="20.5" font-weight="800">2026-11-21 Day R9 (R609): K8s/OpenShift AI Software Factory, Tianshu Evidence MCP, Reliant Forge &amp; AgentDeals</text>
  <text x="44" y="82" fill="#94a3b8" font-size="13.5" font-weight="500">piomin/ai-software-factory (★90) + lanlan0811/tianshu-mcp (★11) + reliant-labs/forge (★10) + robhunter/agentdeals (★24)</text>
  <text x="44" y="101" fill="#38bdf8" font-size="12.5" font-weight="600">Tekton+vLLM+OpenCode In-Cluster Factory · Runtime/Visual Evidence Rework Loop · Go+React Agent-Lint Framework · 1,400+ Vendor FinOps MCP</text>

  <rect x="24" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="162" fill="#38bdf8" font-size="16" font-weight="800">1. ai-software-factory</text>
  <text x="42" y="184" fill="#94a3b8" font-size="12">★ 90 · 17 forks · K8s / OpenShift / Tekton</text>
  <text x="42" y="214" fill="#f8fafc" font-size="13" font-weight="700">In-Cluster Tekton + vLLM Factory</text>
  <text x="42" y="240" fill="#cbd5e1" font-size="12">• Turns GitHub issues/reviews into PRs</text>
  <text x="42" y="264" fill="#cbd5e1" font-size="12">• Tekton Triggers (HMAC + CEL filter)</text>
  <text x="42" y="288" fill="#cbd5e1" font-size="12">• OWNER/MEMBER only; skips forks/bots</text>
  <text x="42" y="312" fill="#cbd5e1" font-size="12">• Pulls skills/agents as OCI artifacts</text>
  <text x="42" y="336" fill="#cbd5e1" font-size="12">• OpenCode + in-cluster vLLM (Qwen)</text>
  <text x="42" y="360" fill="#cbd5e1" font-size="12">• issue, issue-comment (@ai) &amp; pr agents</text>
  <text x="42" y="384" fill="#cbd5e1" font-size="12">• Code never leaves cluster ($0/token)</text>
  <text x="42" y="408" fill="#38bdf8" font-size="12" font-weight="600">7-Step Tekton PipelineRun</text>

  <rect x="316" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
  <text x="334" y="162" fill="#34d399" font-size="16" font-weight="800">2. lanlan0811/tianshu-mcp</text>
  <text x="334" y="184" fill="#94a3b8" font-size="12">★ 11 · 3 forks · TypeScript · Apache-2.0</text>
  <text x="334" y="214" fill="#f8fafc" font-size="13" font-weight="700">Runtime-Evidence Rework MCP</text>
  <text x="334" y="240" fill="#cbd5e1" font-size="12">• Dispatches external coding agents</text>
  <text x="334" y="264" fill="#cbd5e1" font-size="12">• Objective runtime evidence acceptance</text>
  <text x="334" y="288" fill="#cbd5e1" font-size="12">• Visual acceptance verification gate</text>
  <text x="334" y="312" fill="#cbd5e1" font-size="12">• Automatic rework loop on gate failure</text>
  <text x="334" y="336" fill="#cbd5e1" font-size="12">• Real-time event stream &amp; GUI log viewer</text>
  <text x="334" y="360" fill="#cbd5e1" font-size="12">• Structured HANDOFF.md session continuity</text>
  <text x="334" y="384" fill="#cbd5e1" font-size="12">• 1,538 automated tests passing in CI</text>
  <text x="334" y="408" fill="#34d399" font-size="12" font-weight="600">Dispatch Agents · Verify Evidence</text>

  <rect x="608" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="626" y="162" fill="#a78bfa" font-size="16" font-weight="800">3. reliant-labs/forge</text>
  <text x="626" y="184" fill="#94a3b8" font-size="12">★ 10 · 2 forks · Go + React · Apache-2.0</text>
  <text x="626" y="214" fill="#f8fafc" font-size="13" font-weight="700">Agent-Lint Go+React Framework</text>
  <text x="626" y="240" fill="#cbd5e1" font-size="12">• Go APIs (Connect RPC + Protobuf)</text>
  <text x="626" y="264" fill="#cbd5e1" font-size="12">• Generated ORM, handlers, hooks &amp; tests</text>
  <text x="626" y="288" fill="#cbd5e1" font-size="12">• Architecture linters for agent code</text>
  <text x="626" y="312" fill="#cbd5e1" font-size="12">• Safe SQL migrations checked vs prod</text>
  <text x="626" y="336" fill="#cbd5e1" font-size="12">• Zero-code RPC tracing &amp; release health</text>
  <text x="626" y="360" fill="#cbd5e1" font-size="12">• Fast tests against real PostgreSQL</text>
  <text x="626" y="384" fill="#cbd5e1" font-size="12">• Built-in MCP server (@reliantlabs/forge)</text>
  <text x="626" y="408" fill="#a78bfa" font-size="12" font-weight="600">Deploys to K8s, Compose or Host</text>

  <rect x="900" y="130" width="276" height="390" rx="12" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="918" y="162" fill="#fbbf24" font-size="16" font-weight="800">4. robhunter/agentdeals</text>
