  <text x="918" y="240" fill="#cbd5e1" font-size="12">• 1,400+ infra vendors across 60 categories</text>
  <text x="918" y="264" fill="#cbd5e1" font-size="12">• Dated, sourced 31 free-LLM-API index</text>
  <text x="918" y="288" fill="#cbd5e1" font-size="12">• /api/freshness 90-day verification proof</text>
  <text x="918" y="312" fill="#cbd5e1" font-size="12">• Tracks pricing term diffs &amp; history</text>
  <text x="918" y="336" fill="#cbd5e1" font-size="12">• 4 MCP tools &amp; 6 stack prompt templates</text>
  <text x="918" y="360" fill="#cbd5e1" font-size="12">• Startup credits &amp; free-tier eligibility</text>
  <text x="918" y="384" fill="#cbd5e1" font-size="12">• Local npx stdio or remote HTTP MCP</text>
  <text x="918" y="408" fill="#fbbf24" font-size="12" font-weight="600">FinOps Grounding for Coding Agents</text>

  <rect x="24" y="540" width="1152" height="116" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="572" fill="#f8fafc" font-size="15.5" font-weight="800">Closed-Form Enterprise FinOps TCO Benchmark (45-Engineer Team @ $100/h · synthetic, independently_reproduced=false)</text>
  <text x="44" y="600" fill="#cbd5e1" font-size="13">• Path A (Per-Token External Coding Bot SaaS + Manual QA Rework + Unoptimized Cloud Stack): $3,380.00 SaaS + 41.5h ($4,150.00) = $7,530.00/mo</text>
  <text x="44" y="624" fill="#34d399" font-size="13.5" font-weight="700">• Path C (Hybrid Cloud Control + ai-software-factory + tianshu-mcp + forge + agentdeals): $75.00 Compute + 2.4h ($240.00) = $315.00/mo ➔ Saves $7,215.00/mo (-95.82%)</text>
  <text x="44" y="646" fill="#94a3b8" font-size="11">Audit Constants: Path A $3,380.00 + 41.5h ($4,150.00) = $7,530.00/mo ➔ Path C $75.00 + 2.4h ($240.00) = $315.00/mo (-$7,215.00/mo · -95.82% · base_hardware_capex = not_measured)</text>
