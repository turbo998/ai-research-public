  <text x="70" y="236" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">1. smart_fill_form &amp; inspect_compact (onlyChanged: true)</text>
  <text x="70" y="254" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• 10-field form: 11 turns / 72,614 cum. tok → 1 turn / 811 tok (-98.9%, 82 ms)</text>
  <text x="70" y="270" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Click delta snapshot: 3,582 ARIA tok → 56 tok (-98.4%); 48KiB file upload: -99.8% tok</text>

  <rect x="56" y="284" width="513" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
