  <text x="645" y="322" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Automatically throttles &amp; suspends idle agent tabs (0% CPU across 5 open tabs)</text>
  <text x="645" y="338" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Shared named profile (-p work) lets parallel agents reuse SSO login simultaneously</text>

  <rect x="631" y="352" width="513" height="64" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="645" y="372" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">3. Zero-Transcript Secret Injection (--secret-cmd)</text>
  <text x="645" y="390" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• fill --secret-cmd 'pass show site' (or 1Password/Bitwarden CLI) types secrets directly</text>
  <text x="645" y="406" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Passwords never enter LLM prompts/replies + built-in uBlock lists &amp; MP4 recording</text>

