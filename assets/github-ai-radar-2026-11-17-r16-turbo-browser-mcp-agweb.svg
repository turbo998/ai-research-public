  <text x="70" y="322" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Blocks Submit/Pay/Confirm &amp; CJK equivalents (提交/확인/送信) by default</text>
  <text x="70" y="338" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• submissionKey JSONL ledger blocks duplicate retries; expect.textNew verifies receipts</text>

