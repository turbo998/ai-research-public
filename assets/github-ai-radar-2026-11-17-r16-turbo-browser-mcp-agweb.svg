  <text x="645" y="254" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Dialogs, file pickers &amp; downloads handled in code without popping to front</text>
  <text x="645" y="270" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Real WebKit window passes anti-headless checks while grouping tabs per agent (-w)</text>

