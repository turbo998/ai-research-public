  <text x="62" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Commercial voice-agent wrappers charge $0.10–$0.20/min on top of OpenAI/Gemini API costs.</text>
  <text x="62" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. Most voice bots die when the caller hangs up; DeskVoice continues async post-call fulfillment.</text>
  <text x="62" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. `pnpm demo` tests greeting, tool call, human approval, transfer, and post-call tasks with 0 API keys.</text>
  <text x="62" y="481" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Run DeskVoice (`380 MiB` RAM) on your own VPS to eliminate per-minute voice SaaS fees.</text>

