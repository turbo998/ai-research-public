  <text x="644" y="306" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• `images/bot-base`: Digest-Pinned Linux</text>
  <text x="644" y="326" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• `skills/busy-setup`: Agent Provisioner</text>

  <rect x="898" y="202" width="256" height="145" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="912" y="224" fill="#F472B6" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Sandbox + Persistent Drive</text>
  <text x="912" y="246" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Visible Linux Desktop per Bot</text>
  <text x="912" y="266" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Ephemeral Compute + Persistent Drive</text>
  <text x="912" y="286" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Built-in Browser &amp; Document Tools</text>
  <text x="912" y="306" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Queues, Schedules &amp; Private Blob</text>
  <text x="912" y="326" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Apache 2.0 License · Node 24.15+</text>

  <rect x="630" y="361" width="524" height="142" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="646" y="384" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Decoupling Ephemeral Bot Compute (`Sandbox`) from Durable State (`Drive`)</text>
  <text x="646" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Keeping 15 Linux desktop VMs running 24/7 for idle bots wastes thousands of dollars a month.</text>
  <text x="646" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. `busy` pairs a digest-pinned `bot-base` Sandbox with a persistent Drive and Hub Postgres state.</text>
  <text x="646" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Bots wake on schedule or queue message, work on a visible Linux desktop, and sleep at zero compute.</text>
  <text x="646" y="481" fill="#A5B4FC" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Use `busy`'s Hub + Per-Bot Sandbox/Drive split for multi-bot computer-use teams.</text>

