  <text x="62" y="173" fill="#FB923C" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. DeskLabs-OpenSource/DeskVoice — Self-Hosted AI Voice PBX (MIT)</text>

  <rect x="46" y="202" width="252" height="145" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="60" y="224" fill="#FB923C" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">5-Stage Call Lifecycle</text>
  <text x="60" y="246" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Direct SIP Trunk (Register / IP Auth)</text>
  <text x="60" y="266" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• OpenAI Realtime &amp; Gemini Voice Engines</text>
  <text x="60" y="286" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Mid-Call Tool Execution &amp; Human Gate</text>
  <text x="60" y="306" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Live Warm Transfer to Human Operator</text>
  <text x="60" y="326" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Durable Post-Call Background Workers</text>

  <rect x="314" y="202" width="256" height="145" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="328" y="224" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Verified Footprint &amp; Ops</text>
  <text x="328" y="246" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Idle RAM: ~380 MiB / Disk: ~2.7 GB</text>
  <text x="328" y="266" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• `pnpm demo`: Zero-Key Mock Call Engine</text>
