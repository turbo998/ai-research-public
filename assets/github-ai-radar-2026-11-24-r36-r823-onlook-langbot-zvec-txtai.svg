    <text x="24" y="64" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">1. Visual Code Design (onlook ★27.8k): Designers &amp; engineers visually edit live React/Tailwind components directly in local source files.</text>
    <text x="24" y="92" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">2. Omni-Channel IM Delivery (LangBot ★19.1k): Expose agents across WeCom, Feishu, DingTalk, Slack, Discord &amp; Telegram from one hub.</text>
    <text x="24" y="120" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">3. Semantic &amp; Graph Orchestration (txtai ★13.7k): Combine semantic search, SQL filtering &amp; LLM pipelines in a single Python framework.</text>
    <text x="24" y="148" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">4. In-Process C++ Vector Storage (zvec ★16.2k): Embed ultra-fast C++ vector search directly inside agent processes with zero external DB server.</text>
  </g>

