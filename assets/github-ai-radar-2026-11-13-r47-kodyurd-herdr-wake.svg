  <rect x="632" y="256" width="522" height="194" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="646" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">How `herdr-wake` Prevents Unattended Post-Reboot `--yolo` Disasters:</text>
  <text x="646" y="301" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Boot Service + Shell Handover: Sets `herdr-core` shell to `herdr-wake shell`, resuming</text>
  <text x="646" y="320" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   recorded sessions within 4s of first connection (or at boot) and falling back cleanly to `real_shell`.</text>
  <text x="646" y="342" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Surgical Bypass-Flag Sanitizer (`restore_bypass = false`):</text>
  <text x="646" y="361" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11">   • Claude Code: Drops `--dangerously-skip-permissions`, unsafe `--permission-mode` &amp; `--allowedTools`</text>
  <text x="646" y="380" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11">   • Codex: Drops `--yolo`, `--dangerously-bypass-approvals-and-sandbox` &amp; non-`workspace-write` `-s`</text>
  <text x="646" y="399" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11">   • Pi &amp; OpenCode: Drops `-a` / `--approve` and `--auto` / `--yolo`</text>
  <text x="646" y="423" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Includes `herdr-wake doctor` &amp; 60s hot-reload recovery if binary is ever moved.</text>

