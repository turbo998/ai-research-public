  <text x="60" y="256" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  agent with caller identity attribution &amp; owner-scoped permission bounds</text>
  <text x="60" y="280" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• One-Line Self-Hosted Hub: install-hub.sh --domain auto + signed macOS</text>
  <text x="60" y="300" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  DMG, Windows preview, and Linux CLI uniting all personal &amp; team agents</text>
