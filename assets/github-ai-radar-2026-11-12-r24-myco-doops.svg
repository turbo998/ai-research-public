  <text x="651" y="344" fill="#7DD3FC" font-family="Consolas, monospace" font-size="12">doops-agent -&gt; Reverse WS /v1/agent/connect (cluster/instance)</text>
  <text x="651" y="366" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">-&gt; /v1/rpc &amp; /v1/git/&lt;cluster&gt;/&lt;instance&gt;/&lt;session&gt;.git Sync</text>
  <text x="651" y="388" fill="#A7F3D0" font-family="Consolas, monospace" font-size="12">-&gt; doagent ACP (:9000) + DoSql / DoWeb / K8s Read-Only Inspection</text>
  <text x="651" y="410" fill="#FDE68A" font-family="Consolas, monospace" font-size="12">-&gt; ask --apply Structured Helm Release + SQLite Audit Ledger</text>

