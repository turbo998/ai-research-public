  <text x="76" y="388" fill="#93C5FD" font-family="Consolas, monospace" font-size="12">-&gt; Cross-Teammate Agent Task Handoff (Sender Identity Preserved)</text>
  <text x="76" y="410" fill="#FDE68A" font-family="Consolas, monospace" font-size="12">-&gt; Zero Inbound Ports on Dev Machine + Every Command Recorded</text>

