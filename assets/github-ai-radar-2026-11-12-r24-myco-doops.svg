  <text x="60" y="168" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">1. chenhg5/myco (77★ · MIT · Go Cross-Machine Agent Hub)</text>
  <text x="60" y="192" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Cloud Agent Reaches Local Machine (0 Inbound Ports): claude.ai or VPS</text>
  <text x="60" y="212" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  agents invoke your laptop shell or local Claude Code/Codex with full audit</text>
