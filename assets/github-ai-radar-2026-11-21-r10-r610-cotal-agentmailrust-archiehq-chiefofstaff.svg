  <rect width="1200" height="680" fill="url(#bgR610)" rx="16"/>
  <rect x="24" y="20" width="1152" height="92" rx="12" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="5" rx="2" fill="url(#accentR610)"/>
  <text x="44" y="56" fill="#f8fafc" font-size="20" font-weight="800">[R610 Milestone] 2026-11-21 Day R10: Open NATS Agent Standard, 45-Tool Rust Agent Mail, Archie Flat-PM &amp; Chief of Staff</text>
  <text x="44" y="82" fill="#94a3b8" font-size="13.5" font-weight="500">Cotal-AI/Cotal (★404) + Dicklesworthstone/mcp_agent_mail_rust (★267) + sweatco/archie-hq (★18) + evanl666/chiefofstaff (★77)</text>
  <text x="44" y="101" fill="#fbbf24" font-size="12.5" font-weight="600">NATS+JetStream Pub/Sub Standard · 45-Tool Rust Mail &amp; Advisory File Locks · Flat-PM OS-Sandboxed Slack Staff · Copilot Session Router</text>

  <rect x="24" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="162" fill="#38bdf8" font-size="16" font-weight="800">1. Cotal-AI/Cotal</text>
  <text x="42" y="184" fill="#94a3b8" font-size="12">★ 404 · 50 forks · TypeScript · Apache-2.0</text>
  <text x="42" y="214" fill="#f8fafc" font-size="13" font-weight="700">Open Pub/Sub Agent Standard</text>
  <text x="42" y="240" fill="#cbd5e1" font-size="12">• Open spec for identity &amp; presence</text>
  <text x="42" y="264" fill="#cbd5e1" font-size="12">• Built on NATS + JetStream durability</text>
  <text x="42" y="288" fill="#cbd5e1" font-size="12">• Peer, supervisor &amp; HITL topologies</text>
  <text x="42" y="312" fill="#cbd5e1" font-size="12">• Connects Claude Code, Codex, OpenCode</text>
  <text x="42" y="336" fill="#cbd5e1" font-size="12">• Cross-machine &amp; isolated project spaces</text>
  <text x="42" y="360" fill="#cbd5e1" font-size="12">• Process manager &amp; observation tools</text>
  <text x="42" y="384" fill="#cbd5e1" font-size="12">• Direct agent-to-agent handoffs</text>
  <text x="42" y="408" fill="#38bdf8" font-size="12" font-weight="600">@cotal-ai/core · Apache-2.0</text>

  <rect x="316" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
  <text x="334" y="162" fill="#34d399" font-size="16" font-weight="800">2. mcp_agent_mail_rust</text>
  <text x="334" y="184" fill="#94a3b8" font-size="12">★ 267 · 48 forks · Rust · MIT+Rider</text>
  <text x="334" y="214" fill="#f8fafc" font-size="13" font-weight="700">45-Tool Multi-Agent Mail MCP</text>
  <text x="334" y="240" fill="#cbd5e1" font-size="12">• 45 MCP tools &amp; 25 MCP resources</text>
  <text x="334" y="264" fill="#cbd5e1" font-size="12">• Advisory file locks prevent overwrites</text>
  <text x="334" y="288" fill="#cbd5e1" font-size="12">• Git-backed archive + SQLite indexing</text>
  <text x="334" y="312" fill="#cbd5e1" font-size="12">• Interactive 16-screen TUI &amp; Web UI</text>
  <text x="334" y="336" fill="#cbd5e1" font-size="12">• am robot CLI &amp; am doctor diagnostics</text>
  <text x="334" y="360" fill="#cbd5e1" font-size="12">• Proven on 7-agent 1,000+ msg sprints</text>
  <text x="334" y="384" fill="#cbd5e1" font-size="12">• minisign-verified native binaries</text>
  <text x="334" y="408" fill="#34d399" font-size="12" font-weight="600">Gmail for Coding Agents in Rust</text>

  <rect x="608" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="626" y="162" fill="#a78bfa" font-size="16" font-weight="800">3. sweatco/archie-hq</text>
  <text x="626" y="184" fill="#94a3b8" font-size="12">★ 18 · 2 forks · TypeScript v0.2.0 · AGPL-3.0</text>
  <text x="626" y="214" fill="#f8fafc" font-size="13" font-weight="700">Flat-PM Slack AI Employee</text>
  <text x="626" y="240" fill="#cbd5e1" font-size="12">• Built on official Claude Agent SDK</text>
  <text x="626" y="264" fill="#cbd5e1" font-size="12">• 1 flat PM spawns isolated sub-workers</text>
  <text x="626" y="288" fill="#cbd5e1" font-size="12">• Keeps bulky logs out of PM context</text>
  <text x="626" y="312" fill="#cbd5e1" font-size="12">• Supports deliberately blind reviewers</text>
  <text x="626" y="336" fill="#cbd5e1" font-size="12">• OS-level sandboxing &amp; net allowlists</text>
  <text x="626" y="360" fill="#cbd5e1" font-size="12">• Per-agent MCP tool scoping</text>
  <text x="626" y="384" fill="#cbd5e1" font-size="12">• Drop-in department plugin folders</text>
  <text x="626" y="408" fill="#a78bfa" font-size="12" font-weight="600">Whole Team on One Server via Slack</text>

  <rect x="900" y="130" width="276" height="390" rx="12" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="918" y="162" fill="#fbbf24" font-size="16" font-weight="800">4. evanl666/chiefofstaff</text>
  <text x="918" y="184" fill="#94a3b8" font-size="12">★ 77 · 16 forks · Python · MIT</text>
  <text x="918" y="214" fill="#f8fafc" font-size="13" font-weight="700">GitHub Copilot Session Router</text>
  <text x="918" y="240" fill="#cbd5e1" font-size="12">• 1 Router spawns per-task GHCP sessions</text>
  <text x="918" y="264" fill="#cbd5e1" font-size="12">• Catches Slack 🤖, PRs, docs &amp; Glean</text>
  <text x="918" y="288" fill="#cbd5e1" font-size="12">• Shows observed proof (tests/diffs/CI)</text>
  <text x="918" y="312" fill="#cbd5e1" font-size="12">• Flags any claim lacking backing proof</text>
  <text x="918" y="336" fill="#cbd5e1" font-size="12">• Drafts replies in your personal voice</text>
  <text x="918" y="360" fill="#cbd5e1" font-size="12">• Focus mode &amp; single decision cards</text>
  <text x="918" y="384" fill="#cbd5e1" font-size="12">• Turns fixed worker mistakes into checks</text>
  <text x="918" y="408" fill="#fbbf24" font-size="12" font-weight="600">uvx chiefofstaff@latest --demo</text>

  <rect x="24" y="540" width="1152" height="116" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="44" y="572" fill="#f8fafc" font-size="15.5" font-weight="800">[R610 Milestone] Closed-Form FinOps TCO Benchmark (45-Eng Team @ $100/h · synthetic, independently_reproduced=false)</text>
  <text x="44" y="600" fill="#cbd5e1" font-size="13">• Path A (Commercial Agent Bus SaaS + Multi-Process Context Bloat + File Overwrite Rework): $3,440.00 SaaS + 42.0h ($4,200.00) = $7,640.00/mo</text>
  <text x="44" y="624" fill="#34d399" font-size="13.5" font-weight="700">• Path C (Hybrid Cloud Control + Cotal + mcp_agent_mail_rust + archie-hq + chiefofstaff): $75.00 Compute + 2.5h ($250.00) = $325.00/mo ➔ Saves $7,315.00/mo (-95.75%)</text>
  <text x="44" y="646" fill="#94a3b8" font-size="11">Audit Constants: Path A $3,440.00 + 42h ($4,200.00) = $7,640.00/mo ➔ Path C $75.00 + 2.5h ($250.00) = $325.00/mo (-$7,315.00/mo · -95.75% · base_hardware_capex = not_measured)</text>
