  <text x="744" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 跨视频视觉资产包 (`motlab-assets`)：构建带骨骼的 2D 角色、图标、转场与带 PBR 贴图的 3D GLB/FBX/OBJ 套件</text>
  <text x="744" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 一次生产、全系列共用：所有引用同一 Asset Kit 的视频天然保持品牌配色、字体与角色形象一致</text>
  <text x="744" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 原生支持 Claude Code、Codex、Cursor、Copilot、Gemini CLI 与 Antigravity，自带 `motlab doctor` 体检</text>
