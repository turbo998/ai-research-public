  <rect x="728" y="220" width="606" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="744" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">renderAt(t) 确定性画布 + 页面内 WebCodecs 直出 4K MP4 (提速 2–4×)</text>
  <text x="744" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 为什么传统代码视频渲染慢？因为每帧都要从浏览器导出 PNG 图片再跨进程喂给 FFmpeg</text>
  <text x="744" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 零图像拷出浏览器：每个场景只需实现 `renderAt(t)`，由页面内 **WebCodecs** 直接在 GPU 上编码帧，快 **2–4 倍**！</text>
  <text x="744" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 画面框选批注闭环：在逐帧审片器里直接点选某帧、拉框圈出局部或划定时间段写批注，自动存为 `selection.json`</text>
  <text x="744" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 多版本并排对比不覆盖旧片，支持 720p/1080p/1440p/4K MP4 混音导出</text>

  <rect x="728" y="380" width="606" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
