  <rect x="44" y="152" width="642" height="390" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="182" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">🎬 1. zeative/motion-educator (★23 · 1080p60 Code Film Engine)</text>
  <text x="66" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">先审手绘分镜再渲染 3D 爆炸拆解教学片：改错只重渲 4 秒片段</text>

  <rect x="66" y="220" width="598" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="82" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">为什么绝大多数 AI 科普视频像“带配音的 PPT”？Motion Educator 五大铁律：</text>
  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 分镜先行门禁 (Storyboard First)：先在真实像素坐标上画铅笔分镜并通过校验器，等你点头才开始渲染</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 事实表锁定几何比例 + 3D 实物拆解：写着 5.9× 的柱子严格高 5.9 倍；按参考图构建带爆炸图/剖面的 3D 实物模型</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 单一暂停时钟 + 4 秒局部重渲：任意帧可直接 Seek 绘制，零掉帧零闪烁，独立 Critic 挑刺后仅重渲 4 秒镜头</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 一键切换 1920×1080 横屏课程与 1080×1920 无缝首尾循环竖屏，实测 -14 LUFS</text>

  <rect x="66" y="380" width="598" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
