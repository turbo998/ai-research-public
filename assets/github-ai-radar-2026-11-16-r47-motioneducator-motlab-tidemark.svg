  <text x="68" y="766" fill="#38BDF8" font-family="Consolas, monospace" font-size="13.5" font-weight="bold">🎯 ARCHITECTURAL TAKEAWAYS FOR STORYBOARD-GATED 3D EXPLAINERS &amp; WEBCODECS VIDEO-AS-CODE:</text>
  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 代码视频引擎应在浏览器页面内直接调用 WebCodecs 硬编码，省去跨进程传 PNG，实现 2–4 倍渲染提速 (motlab)。</text>
  <text x="68" y="814" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 审片返修应提供画面拉框与时间段批注并序列化为 `selection.json`，配合暂停时钟只重渲受影响的 4 秒片段。</text>
  <text x="68" y="838" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 技术拆解大片必须执行“铅笔分镜门禁 + 事实表锁定图表高度 + 独立 Critic 复核 + -14 LUFS 响度实测” (Motion Educator)。</text>
