  <text x="82" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 致敬《高级战争》的完整战役：包含海陆空 33 个兵种、29 位指挥官与 27 关战役模式</text>
  <text x="82" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 零构建步开箱即玩：纯 HTML + JavaScript 编写，直接双击 `game/index.html` 即可在浏览器或 DSH 内运行</text>
  <text x="82" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 自动化打包与截图流水线：`scripts/pack.mjs` 打包、`scripts/shots.cjs` 自动抓取商店封面与实机截图</text>
  <text x="82" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 为 DeepSeek Harness (dsh-game-store) 与 Web 端互动沙盘推演提供了标准范本</text>

