  <text x="649" y="314" fill="#38BDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">1-Step MeanFlow 64-D Continuous Audio (Zero Discrete Audio Tokens)</text>
  <text x="649" y="333" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Small MLP head with MeanFlow produces 64-d VibeVoice (24kHz) latents in a single step</text>
  <text x="649" y="350" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Eliminates separate audio transformers and discrete RVQ token sequence inflation</text>

  <rect x="635" y="374" width="491" height="78" rx="8" fill="#0F172A" stroke="#334155"/>
