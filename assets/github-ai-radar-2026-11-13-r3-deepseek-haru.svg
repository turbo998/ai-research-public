  <text x="649" y="415" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Runs on ~12GB GPU (`haru/`), Apple Silicon native macOS app (`haru_mlx/`), or `haru_vllm/`</text>
