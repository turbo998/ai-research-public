  <text x="646" y="384" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Customer-Facing SaaS Architecture: Decoupling Tool Data from Token Billing</text>
  <text x="646" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Public docs, e-commerce catalogs, and portals want AI search without subsidizing anonymous bots.</text>
  <text x="646" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. `AI Connect` routes inference through the visitor's own AI subscription while calling site MCP tools.</text>
  <text x="646" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Drop-in `AiConnect.fetch` adapter lets existing Vercel AI SDK apps switch to visitor-paid mode.</text>
  <text x="646" y="481" fill="#D8B4FE" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Pair `OpenDocKit` site indexing with `@tensorpass/aiconnect` for $0-inference portals.</text>

