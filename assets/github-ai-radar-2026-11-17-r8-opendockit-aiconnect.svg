  <text x="62" y="384" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Enterprise RAG Architecture: Eliminating Copyleft &amp; Upload DoS Risks</text>
  <text x="62" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Commercial SaaS RAG pipelines cannot legally bundle AGPL `PyMuPDF` without licensing fees.</text>
  <text x="62" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. `OpenDocKit` parses 11 formats (incl. native HWP 5.x) with pure MIT/BSD dependencies and 0 GPU.</text>
  <text x="62" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Plugs directly into LangChain, LlamaIndex, Dify, Hermes Agent, Open WebUI, and MCP servers.</text>
  <text x="62" y="481" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Standardize untrusted customer document ingestion on `IsolatedConverter`.</text>

