  <!-- Text.js Mechanics -->
  <rect x="46" y="258" width="522" height="192" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="60" y="280" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">How `Text.js` Turns Chrome/Firefox/Safari DevTools Console into a React Surface:</text>
  <text x="60" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Custom React Reconciler + Yoga Layout: Author standard JSX (`&lt;Box&gt;`, `&lt;Text&gt;`, `useInput`)</text>
  <text x="60" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   with App Router (`@textjs/app`); Yoga computes cell coordinates for every frame.</text>
  <text x="60" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Run-Length Encoded `%c` Spans &amp; Zero-Idle Logging: Merges adjacent identically styled cells</text>
  <text x="60" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   into RLE `%c` spans emitted in a single `console.log`, and stays completely silent when idle.</text>
  <text x="60" y="387" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">$ bunx create-text-app@latest &amp;&amp; cd my-app &amp;&amp; bun install &amp;&amp; bun dev</text>
  <text x="60" y="409" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Full DevEx Ecosystem: Ships `@textjs/opencode` local bridge, FIGlet font renderer,</text>
  <text x="60" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">   `eslint-plugin-textjs`, VS Code live preview, and Chrome DevTools component/frame inspector.</text>

