  <text x="646" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Closed-Loop Source &amp; Browser CLI Inspection: Instead of blind CSS edits, the bundled CLI</text>
