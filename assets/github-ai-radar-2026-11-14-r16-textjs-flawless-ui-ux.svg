  <text x="646" y="280" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">How `flawless-ui-ux` Eliminates "AI Slop" Interfaces Without Upgrading Model Tier:</text>
