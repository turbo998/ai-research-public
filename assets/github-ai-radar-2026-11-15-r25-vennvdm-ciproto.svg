<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" width="1400" height="900">
  <defs>
    <linearGradient id="bgR25" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060A13"/>
      <stop offset="55%" stop-color="#0E172A"/>
      <stop offset="100%" stop-color="#04070D"/>
    </linearGradient>
    <linearGradient id="accentVenn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="accentCi" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="900" fill="url(#bgR25)"/>

  <!-- Header Banner -->
  <rect x="35" y="24" width="1330" height="98" rx="14" fill="#0F172A" stroke="#1E293B" stroke-width="1.5"/>
  <rect x="52" y="40" width="295" height="28" rx="6" fill="#1E3A8A" stroke="#3B82F6" stroke-width="1"/>
  <text x="199" y="59" fill="#BFDBFE" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">2026-11-15 NIGHT R25 · CUMULATIVE R327</text>
  <text x="365" y="60" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="800">Venn-VDM 3.15MB Vector Decision Model + ci-proto 2M+ Context Time-Series Model</text>
  <text x="52" y="96" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Typed Choice/Score/Noul Decisions Over Reusable Embeddings (markrussinovich/venn-vdm) + 2M-Step Multivariate Forecasting (#1 fev-bench)</text>

  <!-- Left Panel: markrussinovich/venn-vdm -->
  <rect x="35" y="138" width="650" height="445" rx="14" fill="#0B1324" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="35" y="138" width="650" height="44" rx="14" fill="url(#accentVenn)"/>
  <text x="58" y="166" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">1. markrussinovich/venn-vdm (★66 · 3.15MB Vector Decision Model)</text>

  <rect x="55" y="198" width="610" height="82" rx="10" fill="#111C33" stroke="#1E293B"/>
  <text x="72" y="222" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Core Thesis: Reuse Existing Embeddings for Typed Decisions Without Reader Re-Passes</text>
  <text x="72" y="245" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Generic decision head is 3.15 MB and runs on CPU without loading the frozen reader (venn-1)</text>
  <text x="72" y="266" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Answers Choice (with &quot;none of these&quot;), Score (80% interval) &amp; Noul (yes/no) via Decisions API</text>

  <!-- 3 Pillars -->
  <rect x="55" y="294" width="194" height="122" rx="10" fill="#101E36" stroke="#3B82F6"/>
  <text x="152" y="318" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">1. 4 Custom Head Types</text>
  <text x="152" y="342" fill="#F8FAFC" font-family="Consolas, monospace" font-size="11" text-anchor="middle">linear | residual Choice</text>
  <text x="152" y="362" fill="#BFDBFE" font-family="Consolas, monospace" font-size="11" text-anchor="middle">regress (80% interval)</text>
  <text x="152" y="382" fill="#94A3B8" font-family="Consolas, monospace" font-size="11" text-anchor="middle">nearest_outcome compiled</text>
  <text x="152" y="402" fill="#60A5FA" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">PUT /families/{name}</text>

  <rect x="263" y="294" width="194" height="122" rx="10" fill="#0A222E" stroke="#06B6D4"/>
  <text x="360" y="318" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">2. Outcome Store -&gt; Head</text>
  <text x="360" y="342" fill="#F8FAFC" font-family="Consolas, monospace" font-size="11" text-anchor="middle">49,000-param Doom head</text>
  <text x="360" y="362" fill="#A5F3FC" font-family="Consolas, monospace" font-size="11" text-anchor="middle">8.4 kills vs 6.2 store</text>
  <text x="360" y="382" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle">Compiles store into head;</text>
  <text x="360" y="402" fill="#22D3EE" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">runs with store switched off</text>

  <rect x="471" y="294" width="194" height="122" rx="10" fill="#171631" stroke="#6366F1"/>
  <text x="568" y="318" fill="#A5B4FC" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700" text-anchor="middle">3. Collection Operations</text>
  <text x="568" y="342" fill="#F8FAFC" font-family="Consolas, monospace" font-size="11" text-anchor="middle">Nearest labeled ref</text>
  <text x="568" y="362" fill="#C7D2FE" font-family="Consolas, monospace" font-size="11" text-anchor="middle">Spot set intruder</text>
  <text x="568" y="382" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" text-anchor="middle">Population drift test &amp;</text>
  <text x="568" y="402" fill="#818CF8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">index-wide question stream</text>

  <!-- Venn Strip -->
  <rect x="55" y="430" width="610" height="136" rx="10" fill="#0F172A" stroke="#334155"/>
  <text x="72" y="454" fill="#60A5FA" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Zero-Code-Change Evolution: Generic 3.15MB Head -&gt; Outcome Store -&gt; Compiled Head</text>
  <text x="72" y="478" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">• Day 1: Ask Choice / Score / Noul over existing vectors (3.15 MB CPU head)</text>
  <text x="72" y="500" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">• Day 2: Record past case outcomes in vector store; pick best historical action</text>
  <text x="72" y="522" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">• Day 3: register_family (group_id CV) compiles store into a 49k-param head</text>
  <text x="72" y="544" fill="#94A3B8" font-family="Consolas, monospace" font-size="12">• Application code never changes: same question schema, typed answer shape</text>

  <!-- Right Panel: continuousintelligence/ci -->
  <rect x="715" y="138" width="650" height="445" rx="14" fill="#0B1324" stroke="#10B981" stroke-width="1.5"/>
  <rect x="715" y="138" width="650" height="44" rx="14" fill="url(#accentCi)"/>
  <text x="738" y="166" fill="#042F2E" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">2. continuousintelligence/ci (★68 · ci-proto 2M+ Context Forecaster)</text>

  <rect x="735" y="198" width="610" height="82" rx="10" fill="#111C33" stroke="#1E293B"/>
  <text x="752" y="222" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Breakthrough: 2,000,000+ Step Context Window (64x Prior TS Foundation Models)</text>
  <text x="752" y="245" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Ranks #1 on fev-bench (mean scaled quantile loss Pareto frontier vs parameter count)</text>
  <text x="752" y="266" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Joint multivariate forecasting + 9 quantiles (0.1..0.9) on CPU or GPU via 4 lines of Python</text>

  <!-- 2 Feature Cards -->
  <rect x="735" y="294" width="298" height="122" rx="10" fill="#091D26" stroke="#10B981"/>
  <text x="752" y="317" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">A. 2M+ Step Multivariate Core</text>
  <text x="752" y="340" fill="#F8FAFC" font-family="Consolas, monospace" font-size="11.5">Input tensor: [variables, time]</text>
  <text x="752" y="360" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11.5">64x longer history than peers</text>
  <text x="752" y="382" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">Joint cross-signal dependencies</text>
  <text x="752" y="402" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">or independent cohort series_ids</text>

  <rect x="1047" y="294" width="298" height="122" rx="10" fill="#1F160B" stroke="#F59E0B"/>
  <text x="1064" y="317" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">B. 9-Quantile Uncertainty Bands</text>
  <text x="1064" y="340" fill="#F8FAFC" font-family="Consolas, monospace" font-size="11.5">Quantiles: 0.1, 0.2 ... 0.9</text>
  <text x="1064" y="360" fill="#FDE68A" font-family="Consolas, monospace" font-size="11.5">Calendar covariates &amp; NaN support</text>
  <text x="1064" y="382" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">Forecasts through missing data</text>
  <text x="1064" y="402" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">Python 3.10-3.14 (CPU &amp; CUDA)</text>

  <rect x="735" y="430" width="610" height="136" rx="10" fill="#0F172A" stroke="#334155"/>
  <text x="752" y="454" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Enterprise Decision Intelligence: 2M-Step Quantile Forecast -&gt; Venn Typed Action</text>
  <text x="752" y="478" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">• Step 1: model = ci.load_model(&quot;ContinuousIntelligence/ci-proto&quot;)</text>
  <text x="752" y="500" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">• Step 2: pred = model.forecast(history, horizon=24)  # 0.1..0.9 quantiles</text>
  <text x="752" y="522" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">• Step 3: Route tickets/alerts via Venn Choice/Score/Noul over stored vectors</text>
  <text x="752" y="544" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Replaces brittle LLM JSON prompts with calibrated probabilities &amp; intervals</text>

  <!-- Bottom Panel: Closed-Form FinOps Ledger -->
  <rect x="35" y="600" width="1330" height="274" rx="14" fill="#090F1D" stroke="#334155" stroke-width="1.5"/>
  <text x="58" y="632" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">Closed-Form FinOps Benchmark (CLAIM-20261115-R25-VENNVDM-CIPROTO · 15M Vector Decisions + 2,400 Forecasts/mo)</text>
  <text x="58" y="654" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">Synthetic Model · Engineer Rate = $100.00/hr · Base Host Compute = not_measured · Zero Fabricated Coordinates</text>

  <!-- Path A Bar -->
  <text x="58" y="692" fill="#FCA5A5" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Path A: LLM Re-Reads + Short-Window TS</text>
  <rect x="395" y="674" width="740" height="26" rx="5" fill="#7F1D1D" stroke="#EF4444"/>
  <text x="1150" y="692" fill="#FECACA" font-family="Consolas, monospace" font-size="13.5" font-weight="700">$6,160.00/mo ($2,060.00 compute + 41.0h / $4,100.00)</text>

  <!-- Path B Bar -->
  <text x="58" y="734" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Path B: Per-Task Sklearn + Univariate ARIMA</text>
  <rect x="395" y="716" width="352" height="26" rx="5" fill="#78350F" stroke="#F59E0B"/>
  <text x="762" y="734" fill="#FEF3C7" font-family="Consolas, monospace" font-size="13.5" font-weight="700">$2,930.00/mo ($980.00 compute + 19.5h / $1,950.00)</text>

  <!-- Path C Bar -->
  <text x="58" y="776" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Path C: Venn-VDM 3.15MB + ci-proto 2M+ TS</text>
  <rect x="395" y="758" width="56" height="26" rx="5" fill="#065F46" stroke="#10B981"/>
  <text x="466" y="776" fill="#A7F3D0" font-family="Consolas, monospace" font-size="13.5" font-weight="700">$470.00/mo ($120.00 compute + 3.5h / $350.00) · -92.37%</text>

  <!-- Bottom KPI Pills -->
  <rect x="58" y="802" width="405" height="52" rx="8" fill="#111C33" stroke="#10B981"/>
  <text x="260" y="824" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Monthly Savings vs Path A: -$5,690.00/mo (-92.37%)</text>
  <text x="260" y="844" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Annualized Savings: $68,280.00/yr · 37.5h/mo Saved (-91.46%)</text>

  <rect x="480" y="802" width="420" height="52" rx="8" fill="#111C33" stroke="#3B82F6"/>
  <text x="690" y="824" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Venn-VDM: 3.15 MB Generic Head · 49K Compiled Head</text>
  <text x="690" y="844" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Choice / Score / Noul Over Existing Embeddings on CPU</text>

  <rect x="918" y="802" width="424" height="52" rx="8" fill="#111C33" stroke="#F59E0B"/>
  <text x="1130" y="824" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">ci-proto: 2M+ History Steps (64x) · #1 on fev-bench</text>
  <text x="1130" y="844" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12" text-anchor="middle">Joint Multivariate Forecast + 0.1..0.9 Quantiles (CPU/GPU)</text>
</svg>
