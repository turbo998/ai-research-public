  <text x="60" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Parallel Act Builders + Director Pass: 5 builder agents authored `shots/act1..5.py` from</text>
  <text x="60" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   `BRIEF.md` &amp; `shotlist.json`, critiqued by a separate director agent (`notes/act*.md`).</text>
  <text x="60" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Hardware-Safe Render Queue (`tools/rb.py` + `gpu_guard.py`): Enforces a strict single-render</text>
  <text x="60" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   mutex so parallel agents never trigger `0x119 VIDEO_SCHEDULER_INTERNAL_ERROR` BSODs.</text>
  <text x="60" y="387" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">$ python tools/rb.py shots/act1_gears.py -- --shot 1A &amp;&amp; python tools/assemble.py</text>
  <text x="60" y="409" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Algorithmic Exposure QC &amp; Beat-Grid Assembly: `exposure_check.py` scores clipped highlights/</text>
  <text x="60" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">   lifted blacks; `edit.py` &amp; `mix.py` cut transitions, halation &amp; SFX to a 120 BPM grid.</text>

