  <text x="1027" y="228" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" text-anchor="middle">+ Browser-grade cross-node text select</text>

  <!-- AntiWebUI Mechanics -->
  <rect x="632" y="258" width="522" height="192" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="646" y="280" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">Solving the 3 Hardest Problems in Non-Browser Native Rust GUIs:</text>
  <text x="646" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Fractional Scaling Done Right: Solves layout in integer physical pixels so 1px borders</text>
  <text x="646" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   never blur at 125%/150%/180% DPI and identical widgets always have identical pixel widths.</text>
  <text x="646" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Cross-Element Text Selection &amp; Inline CJK IME: Drag-select text across multiple `div()`</text>
  <text x="646" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   nodes (double/triple-click + primary selection) with native inline preedit across 4 backends.</text>
  <text x="646" y="387" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">$ cargo run -p anti-webui --example showcase --features dynamic_linking</text>
  <text x="646" y="409" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. 11 Modular Crates: Includes PDF viewer, split Markdown+LaTeX editor, runtime-loaded FFmpeg</text>
  <text x="646" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">   video decoding (`anti-webui-video`), and the `shoji-bar-4` Material 3 Wayland shell.</text>

