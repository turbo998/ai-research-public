  <text x="1128" y="165" fill="#A5B4FC" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="end">★ 132 · TS / Unity</text>

  <text x="632" y="202" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">1. Build &amp; Test Game UI in Browser Without Opening Unity Editor</text>
  <text x="646" y="223" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Stores screens in FairyGUI format (`ui/`) with TypeScript MVC logic</text>
  <text x="646" y="242" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Instant browser preview + headless Node.js unit/interaction tests</text>

  <text x="632" y="274" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">2. Designed for Coding Agents (Claude Code &amp; Codex Plugins)</text>
  <text x="646" y="295" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Ships Agent Plugins 1.0.0 for Claude Code &amp; OpenAI Codex</text>
  <text x="646" y="314" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Agents assemble screens, write MVC logic, run Node tests &amp; screenshot QA</text>

  <text x="632" y="346" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">3. Seamless One-Click Export to Production Unity (`LumioSDK`)</text>
  <text x="646" y="367" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Exports verified browser UI screens &amp; logic directly into Unity projects</text>
  <text x="646" y="386" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Eliminates 30-second Unity domain reloads during iterative UI loops</text>

  <rect x="632" y="408" width="512" height="58" rx="8" fill="#1E293B" stroke="#6366F1" stroke-width="1"/>
  <text x="648" y="431" fill="#C7D2FE" font-family="Consolas, monospace" font-size="12" font-weight="700">SA Verdict: Decouples game UI development from Unity Editor bloat so</text>
  <text x="648" y="451" fill="#CBD5E1" font-family="Consolas, monospace" font-size="12">agents can iterate at web speed (Node + Browser) and export to Unity.</text>

