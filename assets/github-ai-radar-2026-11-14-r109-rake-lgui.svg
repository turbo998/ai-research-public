  <text x="72" y="165" fill="#FED7AA" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700">🦀 1bye/rake · Agentic-Era Rust GPUI Framework</text>
  <text x="552" y="165" fill="#FB923C" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="end">★ 174 · Rust GPUI</text>

  <text x="56" y="202" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">1. One Rust Codebase for Native Desktop &amp; WebGPU Browser (WASM)</text>
  <text x="70" y="223" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• `rake dev` runs native GPUI; `rake dev --target web` compiles to WASM</text>
  <text x="70" y="242" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Comptime `rake::view!` macro with Tailwind-like classes &amp; GPUI Base/Kit</text>

  <text x="56" y="274" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">2. Built-In Agent Introspection &amp; Control Surface</text>
  <text x="70" y="295" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Exposes app commands with JSON schemas, JSON CLI output &amp; element tree</text>
  <text x="70" y="314" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Checkpointed live reloads &amp; Chrome DevTools integration for AI agents</text>

  <text x="56" y="346" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">3. Typed Routes, Multi-Window Guards &amp; Unified Shared Services</text>
  <text x="70" y="367" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Independent tab histories, save/discard/cancel guards &amp; tab-owned async tasks</text>
  <text x="70" y="386" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Bundles HTTP, storage, diagnostics, files, clipboard &amp; update controllers</text>

  <rect x="56" y="408" width="512" height="58" rx="8" fill="#1E293B" stroke="#F97316" stroke-width="1"/>
  <text x="72" y="431" fill="#FED7AA" font-family="Consolas, monospace" font-size="12" font-weight="700">SA Verdict: Makes Zed's ultra-fast GPUI accessible across Desktop +</text>
  <text x="72" y="451" fill="#CBD5E1" font-family="Consolas, monospace" font-size="12">WebGPU browsers with native JSON-schema agent control hooks.</text>

