  <text x="168" y="59" fill="#090D16" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle">2026-11-14 · NIGHT R109 (R292)</text>
  <text x="300" y="60" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="19" font-weight="700">Rake (Rust GPUI Native+WASM Agent Framework) &amp; LGUI (Engine-Free Browser-to-Unity Game UI)</text>
  <text x="52" y="90" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="13">1bye/rake (★ 174 · Rust GPUI · Comptime view! + JSON-Schema Agent Control) + LumioGames/LGUI (★ 132 · FairyGUI + TS MVC + Node Test → Unity)</text>

  <!-- Left Card: 1bye/rake -->
  <rect x="36" y="124" width="552" height="360" rx="14" fill="#111827" stroke="#F97316" stroke-width="1.5"/>
