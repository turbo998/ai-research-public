  <text x="165" y="56" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="800" text-anchor="middle">2026-11-17 · NIGHT ROUND 5 (R429)</text>
  <text x="302" y="57" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="700">Unified MCP Gateway, Cross-Harness Agent Bus &amp; Prompt-Cache FinOps</text>
  <text x="44" y="92" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Andsu-dev/runelay (Self-Hosted MCP Hub) + yocontra/pulsar (7-Harness Agent Bus) + harness-profiler &amp; claude-code-usage-analysis (Cache TTL FinOps)</text>

  <!-- Left Panel: runelay + pulsar -->
  <rect x="28" y="130" width="560" height="390" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="46" y="148" width="524" height="40" rx="8" fill="#082F49"/>
  <text x="62" y="173" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. runelay &amp; pulsar — Multi-Harness MCP Hub &amp; Inter-Agent Bus</text>

  <rect x="46" y="202" width="252" height="145" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="60" y="224" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Andsu-dev/runelay (:4312)</text>
  <text x="60" y="246" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 1 Endpoint (`Bearer rnl_...`) for All IDEs</text>
  <text x="60" y="266" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• ~25 1-Click OAuth MCPs + OpenAPI</text>
  <text x="60" y="286" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• `[[slug]]` Versioned Shared Memory</text>
  <text x="60" y="306" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Per-Agent Revocable Keys &amp; Audit</text>
  <text x="60" y="326" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 1 Container (Bun + SQLite · MIT)</text>

  <rect x="314" y="202" width="256" height="145" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="328" y="224" fill="#A78BFA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">yocontra/pulsar (Agent Bus)</text>
  <text x="328" y="246" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Spans Claude, Codex, Cursor, pi, omp</text>
  <text x="328" y="266" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Auto-Tags `project`, `branch`, `pr`</text>
  <text x="328" y="286" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Push Wake-Up (`claude-socket` / queue)</text>
  <text x="328" y="306" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Blocking `ask`, `reply` &amp; `wait`</text>
  <text x="328" y="326" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Peer-Tagged Safety (No User Spoof)</text>

  <rect x="46" y="361" width="524" height="142" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="62" y="384" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Enterprise Control Plane: Ending Multi-Agent Silos</text>
  <text x="62" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. `runelay` unifies OAuth credentials, `SKILL.md` libraries, and `[[slug]]` memory behind 1 SQLite hub.</text>
  <text x="62" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. `pulsar` lets a Codex billing agent message a Claude auth agent (`pr=1402 role=reviewer`) without polling.</text>
  <text x="62" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Per-agent revocable `rnl_` tokens + peer-message sandboxing prevent privilege escalation.</text>
  <text x="62" y="481" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Pair `runelay` (north-south tool/memory hub) with `pulsar` (east-west agent bus).</text>

  <!-- Right Panel: harness-profiler + claude-code-usage-analysis -->
  <rect x="612" y="130" width="560" height="390" rx="14" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="630" y="148" width="524" height="40" rx="8" fill="#451A03"/>
  <text x="646" y="173" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">2. harness-profiler &amp; claude-code-usage-analysis — Cache FinOps</text>

  <rect x="630" y="202" width="252" height="145" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="644" y="224" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">afurmanov/harness-profiler</text>
  <text x="644" y="246" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Hook-Recorded UML Sequence Trace</text>
  <text x="644" y="266" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Color-Codes Shared vs. Forked Context</text>
  <text x="644" y="286" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Shows Tokens Spent Per Context Bar</text>
  <text x="644" y="306" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Diamonds Mark Inline Skill Loads</text>
  <text x="644" y="326" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Works Locally &amp; on Cloud Sessions</text>

  <rect x="898" y="202" width="256" height="145" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="912" y="224" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">claude-code-usage-analysis</text>
  <text x="912" y="246" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Cache TTL: 5m (API) vs. 1h (Sub)</text>
  <text x="912" y="266" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Resume After Break: ~10x Cost Spike</text>
  <text x="912" y="286" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Mid-Task Tool Toggle: 22x Turn Spike</text>
  <text x="912" y="306" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• `/compact` Before Break: 2.5x vs 10x</text>
  <text x="912" y="326" fill="#F472B6" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• `/clear` + 3-Line Note: ~1x Fresh Cost</text>

  <rect x="630" y="361" width="524" height="142" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="646" y="384" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Enterprise Token FinOps: Governing the 5m / 1h Prompt Cache Cliff</text>
  <text x="646" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Two runs with 294k raw tokens differed 6.5x in billed cost purely due to prompt-cache TTL misses.</text>
  <text x="646" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. Disabling a tool mid-task rewrites the system prefix and triggers a 22x full-history cache rebuild.</text>
  <text x="646" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Offline `cc_usage_study.analyze` audits `~/.claude/projects` timestamps without reading chat text.</text>
  <text x="646" y="481" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Enforce `/compact`-before-break &amp; fresh `claude -p` cron runs across dev teams.</text>

