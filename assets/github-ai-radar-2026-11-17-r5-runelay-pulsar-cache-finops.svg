  <text x="814" y="618" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Path C: runelay + pulsar + Cache-TTL Governance</text>
  <text x="814" y="642" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Cache-Aligned Token Spend: $115.00 / mo</text>
  <text x="814" y="662" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Automated Bus &amp; Audit Ops (3.2h): $320.00 / mo</text>
  <text x="814" y="692" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Total: $435.00 / mo (Save $5,725.00 · -92.94%)</text>
