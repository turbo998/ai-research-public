  <text x="506" y="571" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">100 Multi-Harness Dev Seats (API/Bedrock 5m Cache) · $100/hr Eng Rate · Base IDE Licenses: not_measured</text>

