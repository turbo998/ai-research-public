  <text x="744" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 拒绝“为了花哨而把按钮做圆做大”：六大设计原则强制先定信息架构与用户任务，保持按钮/选中/禁用语义清晰</text>
  <text x="744" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 全形态自适应与全状态交付：覆盖手机、平板、折叠屏、桌面与手表，强制补齐 Loading/Empty/Error/Focus 全状态</text>
  <text x="744" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 严禁捏造不存在的平台组件 API：无障碍（键盘、读屏、对比度、字号缩放、减弱动效）作为发布硬门禁</text>
  <text x="744" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 支持 npx skills add asimawdah/material-expressive-skill 一键安装</text>

