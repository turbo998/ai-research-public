  <text x="744" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 高刀数自适应降密：当切刀档位升高时自动降低碎块渲染密度防掉帧，直出 720×1280 有声 MP4</text>
  <text x="744" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 内置猕猴桃、火龙果与肥皂三大预设，一行 node scripts/render.mjs 即可复现</text>

