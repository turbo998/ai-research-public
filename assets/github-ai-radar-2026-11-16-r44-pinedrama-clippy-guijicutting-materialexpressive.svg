  <rect x="44" y="152" width="642" height="390" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="182" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">🎬 1. PineComputer/pine-drama-studio (★34) + hajdu-patrik/clippy (★37)</text>
  <text x="66" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">角色/场景画一次全剧复用且每步付费需点 Go + 本地 Qwen3-14B 对话式竖屏切片</text>

  <rect x="66" y="220" width="598" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="82" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">PineComputer/pine-drama-studio：基于 Code-OSS 与 Git 的 AI 短剧桌面 IDE</text>
  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 为什么网页版短剧工具管不住长剧？资产散落云端无版本历史，且后台偷偷连跑几十个镜头烧光积分</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 本地 Git 资产唯一真源：剧本采用 Fountain 标准，每个角色/场景/道具独立文件夹由 Git 记录历史，画一次全剧复用</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 显式付费审批门禁 + 开放协议：遵循 RFC 2119 与 JSON Schema 2020-12，每一个付费生成步骤必须等你确认才启动</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 左资产剧集、中分镜画布、右 Agent 对话、底诊断面板，Apple 公证签名即装即用</text>

  <rect x="66" y="380" width="598" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="82" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">hajdu-patrik/clippy：本地 Qwen3-14B + 虚拟摇镜追踪 + 聊天框微调成片</text>
  <text x="82" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 100% 本机零上传切片：串联 faster-whisper large-v3、Ollama Qwen3-14B (Q6_K) 与 FFmpeg NVENC</text>
  <text x="82" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 广播级视听精加工：自动剔除语气词并在词边界下刀、虚拟相机人脸追踪发言人、双遍 -14 LUFS 手机响度母带</text>
  <text x="82" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 聊天式二次精剪：直接对聊天框说 "start clip 2 two seconds earlier and put the opening text on it" 即刻重渲染</text>
  <text x="82" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 默认保持干净原片不强加花哨特效，一切包装按需通过自然语言对话叠加</text>

