  <text x="744" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 程序化三向切割：每一档从完整水果/肥皂开始，先竖切、再横切、最后换方向切成小块（如 10/50/100 刀递进）</text>
