  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 多集 AI 短剧工作台应以本地 Git 仓库按对象分目录管理角色/场景资产，并在每个付费生成步前设显式确认门禁 (Pine Drama)。</text>
