  <text x="68" y="108" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21.5" font-weight="bold">Git 级 AI 短剧桌面工坊 (Pine Drama) + 本地 Qwen3-14B 对话精剪 (Clippy) + M3 Expressive</text>
  <text x="68" y="128" fill="#94A3B8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">Code-OSS 单对象单文件夹 Git 剧集管控 + 本地 -14 LUFS 响度母带与聊天改剪辑 + 三向解压切割与 Material 3 技能 · 净省 $5,500.00/月 (-93.38%)</text>

