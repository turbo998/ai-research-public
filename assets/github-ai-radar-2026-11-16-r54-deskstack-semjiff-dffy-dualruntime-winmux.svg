  <line x1="68" y1="740" x2="1332" y2="740" stroke="#334155"/>
  <text x="68" y="766" fill="#38BDF8" font-family="Consolas, monospace" font-size="13.5" font-weight="bold">🎯 ARCHITECTURAL TAKEAWAYS FOR FILING-TIED FINANCIAL AGENTS, SEMANTIC DIFFS &amp; DUAL-RUNTIME STATE:</text>
  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 金融与投研 Agent 严禁只靠 Web Search 凑数：必须直连结构化 XBRL 财报并配 `/associate` 逐数字核对 (deskstack)。</text>
  <text x="68" y="814" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 代码审查应先用 Tree-sitter (`sem-jiff`) 折叠函数移动/重命名/格式化噪音，大仓终端预览用流式加载的 `dffy`。</text>
  <text x="68" y="838" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 长寿命助手应由应用层持有权威对话状态，在 Claude Code 与 Messages API 间双向接替并自动废弃陈旧 resume 链。</text>
