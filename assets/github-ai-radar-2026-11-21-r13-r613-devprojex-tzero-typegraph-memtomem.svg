  <rect width="1200" height="680" fill="url(#bgR613)" rx="16"/>
  <rect x="24" y="20" width="1152" height="92" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="5" rx="2" fill="url(#accentR613)"/>
  <text x="44" y="56" fill="#f8fafc" font-size="20.5" font-weight="800">2026-11-21 Day R13 (R613): DevProjex -40% Repo MCP, T-Zero AST Compressor, TypeGraph SQLite/PG &amp; MemtoMem</text>
  <text x="44" y="82" fill="#94a3b8" font-size="13.5" font-weight="500">Avazbek22/DevProjex (★41) + toprakahmetaydogmus/TZeroAlgorithm (★45) + nicia-ai/typegraph (★93) + memtomem/memtomem (★26 · 48 forks)</text>
  <text x="44" y="101" fill="#38bdf8" font-size="12.5" font-weight="600">4-in-1 Secret-Masked Repo Context (-40% Tokens) · -85-95% AST Compressor MCP · Zod Bitemporal SQLite/PG Graph · Hook-Free Handoff Memory</text>

  <rect x="24" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="162" fill="#38bdf8" font-size="16" font-weight="800">1. Avazbek22/DevProjex</text>
  <text x="42" y="184" fill="#94a3b8" font-size="12">★ 41 · 8 forks · C# / .NET 10 · Apache-2.0</text>
  <text x="42" y="214" fill="#f8fafc" font-size="13" font-weight="700">4-in-1 Repo Context &amp; RAG MCP</text>
  <text x="42" y="240" fill="#cbd5e1" font-size="12">• Up to 40% fewer tokens vs. Repomix</text>
  <text x="42" y="264" fill="#cbd5e1" font-size="12">• GUI, TUI, CLI &amp; read-only RAG MCP</text>
  <text x="42" y="288" fill="#cbd5e1" font-size="12">• Automatic secret &amp; PII redaction</text>
  <text x="42" y="312" fill="#cbd5e1" font-size="12">• Live Context, Agent Journal &amp; Smart Ignore</text>
  <text x="42" y="336" fill="#cbd5e1" font-size="12">• Exports ASCII, MD, JSON, XML or ZIP</text>
  <text x="42" y="360" fill="#cbd5e1" font-size="12">• Avalonia UI Showcase winner</text>
  <text x="42" y="384" fill="#cbd5e1" font-size="12">• npx devprojex / dnx devprojex / WinGet</text>
  <text x="42" y="408" fill="#38bdf8" font-size="12" font-weight="600">Read-Only · Zero Telemetry</text>

  <rect x="316" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
  <text x="334" y="162" fill="#34d399" font-size="16" font-weight="800">2. TZeroAlgorithm</text>
  <text x="334" y="184" fill="#94a3b8" font-size="12">★ 45 · 1 fork · Python · AGPL-3.0</text>
  <text x="334" y="214" fill="#f8fafc" font-size="13" font-weight="700">Deterministic AST Compressor</text>
  <text x="334" y="240" fill="#cbd5e1" font-size="12">• Cuts prompt tokens by 85-95% (AST)</text>
  <text x="334" y="264" fill="#cbd5e1" font-size="12">• 21 canonical MCP tools (58 runtime)</text>
  <text x="334" y="288" fill="#cbd5e1" font-size="12">• Pre-Flight Reality-Lock verification</text>
  <text x="334" y="312" fill="#cbd5e1" font-size="12">• Real BPE tokenizer benchmarks</text>
  <text x="334" y="336" fill="#cbd5e1" font-size="12">• 100% local Zero-Leak security</text>
  <text x="334" y="360" fill="#cbd5e1" font-size="12">• Published as tzero-mcp (PyPI &amp; npm)</text>
  <text x="334" y="384" fill="#cbd5e1" font-size="12">• Works with Cursor, Claude &amp; Local LLMs</text>
  <text x="334" y="408" fill="#34d399" font-size="12" font-weight="600">Zero-GPUDeterministic AST Engine</text>

  <rect x="608" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="626" y="162" fill="#a78bfa" font-size="16" font-weight="800">3. nicia-ai/typegraph</text>
  <text x="626" y="184" fill="#94a3b8" font-size="12">★ 93 · 3 forks · TypeScript · MIT</text>
  <text x="626" y="214" fill="#f8fafc" font-size="13" font-weight="700">Embedded Bitemporal Graph</text>
  <text x="626" y="240" fill="#cbd5e1" font-size="12">• Runs inside SQLite, Postgres, D1, Turso</text>
  <text x="626" y="264" fill="#cbd5e1" font-size="12">• Zod schemas &amp; compile-time type safety</text>
  <text x="626" y="288" fill="#cbd5e1" font-size="12">• subClassOf / implies / inverseOf ontology</text>
  <text x="626" y="312" fill="#cbd5e1" font-size="12">• Bitemporal valid-time &amp; recorded-time</text>
  <text x="626" y="336" fill="#cbd5e1" font-size="12">• Runtime JSON schema evolution (0 deploy)</text>
  <text x="626" y="360" fill="#cbd5e1" font-size="12">• pgvector, sqlite-vec &amp; libSQL hybrid</text>
  <text x="626" y="384" fill="#cbd5e1" font-size="12">• PageRank, WCC &amp; shortest-path API</text>
  <text x="626" y="408" fill="#a78bfa" font-size="12" font-weight="600">@nicia-ai/typegraph · MIT</text>

  <rect x="900" y="130" width="276" height="390" rx="12" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="918" y="162" fill="#fbbf24" font-size="16" font-weight="800">4. memtomem/memtomem</text>
  <text x="918" y="184" fill="#94a3b8" font-size="12">★ 26 · 48 forks · Python · Apache-2.0</text>
  <text x="918" y="214" fill="#f8fafc" font-size="13" font-weight="700">Hook-Free Handoff Memory MCP</text>
  <text x="918" y="240" fill="#cbd5e1" font-size="12">• Plain .md files in .memtomem/memories</text>
  <text x="918" y="264" fill="#cbd5e1" font-size="12">• Hook-free by default (no background spy)</text>
  <text x="918" y="288" fill="#cbd5e1" font-size="12">• /memtomem:handoff save ➔ resume loop</text>
  <text x="918" y="312" fill="#cbd5e1" font-size="12">• Verifies git_head &amp; clean worktree state</text>
  <text x="918" y="336" fill="#cbd5e1" font-size="12">• /memtomem:update incremental commit review</text>
  <text x="918" y="360" fill="#cbd5e1" font-size="12">• 9 core MCP tools + mm CLI</text>
  <text x="918" y="384" fill="#cbd5e1" font-size="12">• Hybrid keyword + semantic search</text>
  <text x="918" y="408" fill="#fbbf24" font-size="12" font-weight="600">Claude Code ⇄ Codex ⇄ Cursor Handoffs</text>

  <rect x="24" y="540" width="1152" height="116" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="572" fill="#f8fafc" font-size="15.5" font-weight="800">Closed-Form Enterprise FinOps TCO Benchmark (45-Engineer Team @ $100/h · synthetic, independently_reproduced=false)</text>
  <text x="44" y="600" fill="#cbd5e1" font-size="13">• Path A (Uncompressed Repo Token Dumps + Standalone Graph DB Cluster + Lost Cross-CLI Handoffs): $3,300.00 SaaS + 41.0h ($4,100.00) = $7,400.00/mo</text>
  <text x="44" y="624" fill="#34d399" font-size="13.5" font-weight="700">• Path C (Hybrid Cloud Control + DevProjex + T-Zero + TypeGraph + MemtoMem): $65.00 Compute + 2.4h ($240.00) = $305.00/mo ➔ Saves $7,095.00/mo (-95.88%)</text>
  <text x="44" y="646" fill="#94a3b8" font-size="11">Audit Constants: Path A $3,300.00 + 41h ($4,100.00) = $7,400.00/mo ➔ Path C $65.00 + 2.4h ($240.00) = $305.00/mo (-$7,095.00/mo · -95.88% · base_hardware_capex = not_measured)</text>
