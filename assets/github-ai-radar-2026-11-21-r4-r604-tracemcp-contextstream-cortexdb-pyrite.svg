  <text x="44" y="101" fill="#38bdf8" font-size="12.5" font-weight="600">-72.7% PR Review Tokens (91 Frameworks) · Live Capsule Scoped Context · Single-SQLite SPARQL/Cypher Graph · 3-Tier Git Knowledge MCP</text>

  <rect x="24" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="162" fill="#38bdf8" font-size="16" font-weight="800">1. nikolai-vysotskyi/trace-mcp</text>
