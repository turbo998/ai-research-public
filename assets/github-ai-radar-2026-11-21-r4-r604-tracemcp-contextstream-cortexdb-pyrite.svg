  <text x="334" y="384" fill="#cbd5e1" font-size="12">• Rust HTTP gateway &amp; local client</text>
  <text x="334" y="408" fill="#34d399" font-size="12" font-weight="600">Cross-Session Decision Continuity</text>

  <rect x="608" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="626" y="162" fill="#a78bfa" font-size="16" font-weight="800">3. liliang-cn/cortexdb</text>
