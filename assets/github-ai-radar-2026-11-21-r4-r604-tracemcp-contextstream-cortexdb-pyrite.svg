  <text x="334" y="214" fill="#f8fafc" font-size="13" font-weight="700">Traceable Context &amp; Live Capsule</text>
  <text x="334" y="240" fill="#cbd5e1" font-size="12">• Code search + saved team decisions</text>
  <text x="334" y="264" fill="#cbd5e1" font-size="12">• Traceable sources &amp; scoped access</text>
