  <text x="918" y="264" fill="#cbd5e1" font-size="12">• Schema-validated typed entries</text>
  <text x="918" y="288" fill="#cbd5e1" font-size="12">• v0.26 surgical edits preserve comments</text>
  <text x="918" y="312" fill="#cbd5e1" font-size="12">• 3-tier MCP (read / write / admin)</text>
  <text x="918" y="336" fill="#cbd5e1" font-size="12">• Hybrid semantic + structured search</text>
  <text x="918" y="360" fill="#cbd5e1" font-size="12">• 20-extension-point plugin architecture</text>
  <text x="918" y="384" fill="#cbd5e1" font-size="12">• $0 local running cost (SQLite index)</text>
  <text x="918" y="408" fill="#fbbf24" font-size="12" font-weight="600">Git Branch · Diff · Review · Rollback</text>

  <rect x="24" y="540" width="1152" height="116" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="572" fill="#f8fafc" font-size="15.5" font-weight="800">Closed-Form Enterprise FinOps TCO Benchmark (45-Engineer Team @ $100/h · synthetic, independently_reproduced=false)</text>
  <text x="44" y="600" fill="#cbd5e1" font-size="13">• Path A (Unindexed PR Token Burn + Commercial Code Search SaaS + Managed Graph/Wiki Cloud): $3,280.00 SaaS + 41.0h ($4,100.00) = $7,380.00/mo</text>
  <text x="44" y="624" fill="#34d399" font-size="13.5" font-weight="700">• Path C (Hybrid Cloud Control + trace-mcp + ContextStream + CortexDB + Pyrite): $65.00 Compute + 2.4h ($240.00) = $305.00/mo ➔ Saves $7,075.00/mo (-95.87%)</text>
  <text x="44" y="646" fill="#94a3b8" font-size="11">Audit Constants: Path A $3,280.00 + 41h ($4,100.00) = $7,380.00/mo ➔ Path C $65.00 + 2.4h ($240.00) = $305.00/mo (-$7,075.00/mo · -95.87% · base_hardware_capex = not_measured)</text>
