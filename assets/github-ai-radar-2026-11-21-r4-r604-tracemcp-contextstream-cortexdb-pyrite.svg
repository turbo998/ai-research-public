  <text x="44" y="56" fill="#f8fafc" font-size="20.5" font-weight="800">2026-11-21 Day R4 (R604): Framework Code Intelligence MCP, Live Capsule Context, SQLite Ontology Graph &amp; Git Knowledge</text>
