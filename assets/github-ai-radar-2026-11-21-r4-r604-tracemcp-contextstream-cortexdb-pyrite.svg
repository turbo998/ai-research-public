  <text x="626" y="312" fill="#cbd5e1" font-size="12">• cortexdb-grpc multi-machine sharing</text>
  <text x="626" y="336" fill="#cbd5e1" font-size="12">• Live desktop/phone graph recall UI</text>
  <text x="626" y="360" fill="#cbd5e1" font-size="12">• Claude Code, Codex, DSH &amp; Obsidian</text>
  <text x="626" y="384" fill="#cbd5e1" font-size="12">• Go, Rust, Python &amp; Node SDK clients</text>
  <text x="626" y="408" fill="#a78bfa" font-size="12" font-weight="600">Traceable Reasoning &amp; History</text>

  <rect x="900" y="130" width="276" height="390" rx="12" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="918" y="162" fill="#fbbf24" font-size="16" font-weight="800">4. pyrite-wiki/pyrite</text>
