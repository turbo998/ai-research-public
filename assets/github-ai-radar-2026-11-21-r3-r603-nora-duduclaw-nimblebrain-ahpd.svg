<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgR603" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentR603" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgR603)" rx="16"/>
  <rect x="24" y="20" width="1152" height="92" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="5" rx="2" fill="url(#accentR603)"/>
  <text x="44" y="56" fill="#f8fafc" font-size="20.5" font-weight="800">2026-11-21 Day R3 (R603): OpenClaw/Hermes Fleet Control Plane, 11-Channel Judge Employees, MCP Apps &amp; AHP Host</text>
  <text x="44" y="82" fill="#94a3b8" font-size="13.5" font-weight="500">solomon2773/nora (★60) + zhixuli0406/DuDuClaw (★51) + NimbleBrainInc/nimblebrain (★28) + ahpio/ahpd (★20)</text>
  <text x="44" y="101" fill="#38bdf8" font-size="12.5" font-weight="600">Docker/K8s OpenClaw+Hermes Control Plane · 11-App Judge-Reviewed CLI Employees · Interactive MCP ext-apps · AHP 1.0.0 Server</text>

  <rect x="24" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="162" fill="#38bdf8" font-size="16" font-weight="800">1. solomon2773/nora</text>
  <text x="42" y="184" fill="#94a3b8" font-size="12">★ 60 · 16 forks · TypeScript · Apache-2.0</text>
  <text x="42" y="214" fill="#f8fafc" font-size="13" font-weight="700">OpenClaw &amp; Hermes Fleet Control</text>
  <text x="42" y="240" fill="#cbd5e1" font-size="12">• Unified Docker + Kubernetes GA plane</text>
  <text x="42" y="264" fill="#cbd5e1" font-size="12">• 69 built-in provider connections</text>
  <text x="42" y="288" fill="#cbd5e1" font-size="12">• Operator (/app) &amp; Admin (/admin) UI</text>
  <text x="42" y="312" fill="#cbd5e1" font-size="12">• @noraai/cli &amp; @noraai/mcp-server</text>
  <text x="42" y="336" fill="#cbd5e1" font-size="12">• Fleet secrets, logs &amp; live terminal</text>
  <text x="42" y="360" fill="#cbd5e1" font-size="12">• Reusable agent deployment templates</text>
  <text x="42" y="384" fill="#cbd5e1" font-size="12">• Runs OpenClaw &amp; Hermes side-by-side</text>
  <text x="42" y="408" fill="#38bdf8" font-size="12" font-weight="600">REST API + CLI + MCP Fleet Ops</text>

  <rect x="316" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
  <text x="334" y="162" fill="#34d399" font-size="16" font-weight="800">2. zhixuli0406/DuDuClaw</text>
  <text x="334" y="184" fill="#94a3b8" font-size="12">★ 51 · 5 forks · Rust v1.83.0 · Apache-2.0</text>
  <text x="334" y="214" fill="#f8fafc" font-size="13" font-weight="700">11-Channel Judge-Reviewed Staff</text>
  <text x="334" y="240" fill="#cbd5e1" font-size="12">• Single Rust binary (:18889 dashboard)</text>
  <text x="334" y="264" fill="#cbd5e1" font-size="12">• 11 chat apps (LINE/TG/Slack/Discord)</text>
  <text x="334" y="288" fill="#cbd5e1" font-size="12">• 10 CLI backends (Claude/Codex/Grok)</text>
  <text x="334" y="312" fill="#cbd5e1" font-size="12">• Independent Judge reviews each output</text>
  <text x="334" y="336" fill="#cbd5e1" font-size="12">• 4 rotation strategies + LLM failover</text>
  <text x="334" y="360" fill="#cbd5e1" font-size="12">• Context preserved across model swaps</text>
  <text x="334" y="384" fill="#cbd5e1" font-size="12">• Standalone local MCP memory server</text>
  <text x="334" y="408" fill="#34d399" font-size="12" font-weight="600">Every Dollar Logged · 100% Self-Hosted</text>

  <rect x="608" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="626" y="162" fill="#a78bfa" font-size="16" font-weight="800">3. NimbleBrainInc/nimblebrain</text>
  <text x="626" y="184" fill="#94a3b8" font-size="12">★ 28 · 17 forks · TypeScript/Bun · Apache-2.0</text>
  <text x="626" y="214" fill="#f8fafc" font-size="13" font-weight="700">Interactive MCP Apps Platform</text>
  <text x="626" y="240" fill="#cbd5e1" font-size="12">• Full MCP ext-apps interactive sidebar</text>
  <text x="626" y="264" fill="#cbd5e1" font-size="12">• Live bidirectional agent-UI data sync</text>
  <text x="626" y="288" fill="#cbd5e1" font-size="12">• 5-stage skill-scoped Runtime.chat()</text>
  <text x="626" y="312" fill="#cbd5e1" font-size="12">• Per-skill tool filtering (less noise)</text>
  <text x="626" y="336" fill="#cbd5e1" font-size="12">• On-demand &amp; Cron scheduled automations</text>
  <text x="626" y="360" fill="#cbd5e1" font-size="12">• OIDC / WorkOS / dev auth adapters</text>
  <text x="626" y="384" fill="#cbd5e1" font-size="12">• Streamable HTTP MCP server export</text>
  <text x="626" y="408" fill="#a78bfa" font-size="12" font-weight="600">Multi-Arch amd64/arm64 GHCR Images</text>

  <rect x="900" y="130" width="276" height="390" rx="12" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="918" y="162" fill="#fbbf24" font-size="16" font-weight="800">4. ahpio/ahpd</text>
  <text x="918" y="184" fill="#94a3b8" font-size="12">★ 20 · 6 forks · TypeScript · MIT</text>
  <text x="918" y="214" fill="#f8fafc" font-size="13" font-weight="700">Agent Host Protocol 1.0.0 Server</text>
  <text x="918" y="240" fill="#cbd5e1" font-size="12">• Native Claude SDK, Pi SDK &amp; ACP agents</text>
  <text x="918" y="264" fill="#cbd5e1" font-size="12">• Runs Codex, Copilot &amp; Gemini together</text>
  <text x="918" y="288" fill="#cbd5e1" font-size="12">• Real-time shared editing collaboration</text>
  <text x="918" y="312" fill="#cbd5e1" font-size="12">• Sandboxed computers &amp; node-pty terms</text>
  <text x="918" y="336" fill="#cbd5e1" font-size="12">• Built-in users, RBAC &amp; budget controls</text>
  <text x="918" y="360" fill="#cbd5e1" font-size="12">• ahpw Web UI + @softov/ahpc WS client</text>
  <text x="918" y="384" fill="#cbd5e1" font-size="12">• Extensible plugin architecture (@ahpd/sdk)</text>
  <text x="918" y="408" fill="#fbbf24" font-size="12" font-weight="600">Runs on Node 22+, Bun &amp; Deno (MIT)</text>

  <rect x="24" y="540" width="1152" height="116" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="572" fill="#f8fafc" font-size="15.5" font-weight="800">Closed-Form Enterprise FinOps TCO Benchmark (45-Engineer Team @ $100/h · synthetic, independently_reproduced=false)</text>
  <text x="44" y="600" fill="#cbd5e1" font-size="13">• Path A (Commercial Fleet Cloud + Per-Seat Chat Bot SaaS + Hosted MCP App Platform): $3,360.00 SaaS + 42.0h ($4,200.00) = $7,560.00/mo</text>
  <text x="44" y="624" fill="#34d399" font-size="13.5" font-weight="700">• Path C (Hybrid Cloud Control + Nora + DuDuClaw + NimbleBrain + ahpd): $80.00 Compute + 2.5h ($250.00) = $330.00/mo ➔ Saves $7,230.00/mo (-95.63%)</text>
  <text x="44" y="646" fill="#94a3b8" font-size="11">Audit Constants: Path A $3,360.00 + 42h ($4,200.00) = $7,560.00/mo ➔ Path C $80.00 + 2.5h ($250.00) = $330.00/mo (-$7,230.00/mo · -95.63% · base_hardware_capex = not_measured)</text>
</svg>
