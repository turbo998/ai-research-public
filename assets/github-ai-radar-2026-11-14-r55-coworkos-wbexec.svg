  <text x="634" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Bounded Headless CLI Subagent Delegation with Fail-Closed Locks</text>

  <rect x="634" y="212" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="650" y="234" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. owned_paths Whitelist + Isolated wb-exec/&lt;id8&gt; Worktree</text>
  <text x="650" y="253" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Out-of-scope edits flagged in result.violations (empty list = additions-only, never unchecked)</text>
  <text x="650" y="269" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Actual git diff always wins over agent summary; no commit, no push, no auto-merge</text>

  <rect x="634" y="286" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="650" y="308" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. PID-Verified Path Lock (Exit 4) &amp; Corrupt Lock Fail-Closed</text>
  <text x="650" y="327" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Overlapping owned_paths refused (PATHS_LOCKED); disjoint paths run in parallel</text>
  <text x="650" y="343" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Liveness checked by OS PID (not heartbeat age); damaged dispatch.lock refused, never reset</text>

  <rect x="634" y="360" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="650" y="382" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. WB_SUBAGENT=1 Recursion Guard (Exit 3) &amp; 64 MiB Output Cap</text>
  <text x="650" y="401" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Blocks nested subagent spawning; kills logs &gt; 64 MiB as failed so truncation never passes</text>
  <text x="650" y="417" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Default executor: DeepSeek V4.1 Flash (effort max) or --executor codex|claude|aider</text>

