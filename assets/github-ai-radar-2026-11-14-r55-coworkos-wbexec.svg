  <text x="54" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">3-Layer Long-Horizon Cowork Harness Across Code, CAD &amp; Research</text>

  <rect x="54" y="212" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="234" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. Main Agent ➔ Coordinator Runtime ➔ Scoped Subagents</text>
  <text x="70" y="253" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Main Agent plans &amp; evaluates; Coordinator Runtime tracks multi-day Job lifecycles</text>
  <text x="70" y="269" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Resumes cleanly after interruption via coworkos --continue &amp; durable execution logs</text>

  <rect x="54" y="286" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="308" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. Shared Artifacts &amp; Revision-Aware Candidate Changes</text>
  <text x="70" y="327" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Connects CLI, files &amp; MCP with docs, slides, CAD (turbofan) &amp; Blender 3D scenes</text>
  <text x="70" y="343" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Hierarchical workspaces + semantic memory stage candidate changes for human review</text>

