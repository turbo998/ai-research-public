  <!-- Music-Skill Mechanics -->
  <rect x="46" y="258" width="522" height="192" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="60" y="280" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">Why Symbolic Note Composition Beats Black-Box Text-to-Waveform Generators:</text>
  <text x="60" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Surgical Single-Note Re-Rendering: Change 1 note in bar 33 and only that instrument stem</text>
  <text x="60" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   is re-played; `compare` diffs the exact part, bus, reverb tail, and master output.</text>
  <text x="60" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Auditable Multisampled Sound Banks (`3.7 GB`): Uses real licensed multisampled instruments</text>
  <text x="60" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   &amp; built-in synths—zero copyright risk from models trained on scraped recordings.</text>
  <text x="60" y="387" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">$ npx skills add owoevan-dev/music-skill   # or /plugin install music-skill@music-skill</text>
  <text x="60" y="409" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Frame-Exact Video &amp; Game Sync: Aligns swells, ducked beds &amp; loops to exact scene cut times.</text>
  <text x="60" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Verified across 7 uncherrypicked 1-take tracks (`Stormglass Gambit`, `Cairnfire`, etc.).</text>

