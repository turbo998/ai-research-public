  <!-- Klad Architecture -->
  <rect x="632" y="258" width="522" height="192" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="646" y="280" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">How Humans (Pen Pressure/Tilt) &amp; Agents (`klad` CLI) Co-Paint Live:</text>
  <text x="646" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Paint That Stays Data: Impasto oil ridges, smudges, vectors, 50 bundled open fonts &amp; pixel</text>
  <text x="646" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   grids remain addressable JSON objects (`klad set art.klad c4:s12 size=3.5 color=#3355aa`).</text>
  <text x="646" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Pin-and-Steer Co-Creation: Pin a note (`N`) or select a region (`S`) in the GUI; the agent</text>
  <text x="646" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   reads `klad notes` / `klad selection` and repaints only that leaf without rerolling pixels.</text>
  <text x="60" y="387" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11" transform="translate(586,0)">$ klad inbetween art.klad --layers lines,colour --from 0 --to 6 &amp;&amp; klad export art.klad --godot</text>
  <text x="646" y="409" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Git-Friendly Plain Folder Format (`docs/format.md`, MIT) + Timeline Onion Skins &amp; IK Bones.</text>
  <text x="646" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Free for individuals &amp; companies under €500k/yr revenue; 3 agent skills &amp; format spec are MIT.</text>

