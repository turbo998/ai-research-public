  <text x="56" y="202" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">1. Clean-Room Functional Recon (`recon -> architect -> design`)</text>
  <text x="70" y="223" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Extracts screens, user flows, inferred DB schema &amp; `features.csv`</text>
