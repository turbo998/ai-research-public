  <text x="632" y="346" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">3. Unit-Economics CFO, Ops Risk Register &amp; 30-Day Launch</text>
  <text x="646" y="367" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• `/founder-cfo` models contribution margin, daily break-even &amp; 12m cash</text>
  <text x="646" y="386" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Zero pip dependencies (Python 3.8+); runs as plugin or plain `SKILL.md`</text>

