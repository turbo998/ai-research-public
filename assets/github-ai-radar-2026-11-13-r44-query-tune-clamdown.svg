  <text x="646" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">• Dynamic Fan Curve (Only With Lid Closed): Ramps from min RPM at 50 °C to full speed at 75 °C,</text>
