  <text x="60" y="394" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">$ cp -R query-tune/skills/query-tune ~/.claude/skills/  # or ~/.codex/skills/</text>
  <text x="60" y="416" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Reports first without running locking queries or mutating files until explicitly instructed</text>

