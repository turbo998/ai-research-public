  <text x="60" y="328" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">2. Repeated Work: N+1 per-row lookups/writes, duplicate state transitions, over-window reads</text>
  <text x="60" y="349" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Caller &amp; Contract Safety: Preserves tenant boundaries, collation, cursors, visibility &amp; locks</text>
