  <text x="626" y="214" fill="#f8fafc" font-size="13" font-weight="700">80-App Rust Sovereign AI Suite</text>
  <text x="626" y="240" fill="#cbd5e1" font-size="12">• 80 self-hosted apps in 1 desktop (:3000)</text>
