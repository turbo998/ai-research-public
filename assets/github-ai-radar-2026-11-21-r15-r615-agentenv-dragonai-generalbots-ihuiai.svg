  <text x="918" y="408" fill="#fbbf24" font-size="12" font-weight="600">High-Discipline Agentic Engineering</text>

  <rect x="24" y="540" width="1152" height="116" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="44" y="572" fill="#f8fafc" font-size="15.5" font-weight="800">[R615 Milestone] Closed-Form FinOps TCO Benchmark (45-Eng Team @ $100/h · synthetic, independently_reproduced=false)</text>
  <text x="44" y="600" fill="#cbd5e1" font-size="13">• Path A (Commercial AI Middle-Platform + Hosted Eval Environments + 80-App SaaS Sprawl): $3,520.00 SaaS + 42.5h ($4,250.00) = $7,770.00/mo</text>
  <text x="44" y="624" fill="#34d399" font-size="13.5" font-weight="700">• Path C (Hybrid Cloud Control + AgentEnv + DRAGON-AI + GeneralBots + IHUI-AI): $80.00 Compute + 2.5h ($250.00) = $330.00/mo ➔ Saves $7,440.00/mo (-95.75%)</text>
  <text x="44" y="646" fill="#94a3b8" font-size="11">Audit Constants: Path A $3,520.00 + 42.5h ($4,250.00) = $7,770.00/mo ➔ Path C $80.00 + 2.5h ($250.00) = $330.00/mo (-$7,440.00/mo · -95.75% · base_hardware_capex = not_measured)</text>
