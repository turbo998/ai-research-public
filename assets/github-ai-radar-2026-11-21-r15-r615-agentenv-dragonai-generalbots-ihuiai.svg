  <text x="918" y="240" fill="#cbd5e1" font-size="12">• Unifies 176 LLMs (LangGraph+MCP+A2A)</text>
  <text x="918" y="264" fill="#cbd5e1" font-size="12">• Multi-tenant RLS across 340 tables</text>
  <text x="918" y="288" fill="#cbd5e1" font-size="12">• Web/API/CLI/Desktop/Ext/Mobile/Miniapp</text>
  <text x="918" y="312" fill="#cbd5e1" font-size="12">• Ratchet-based CI guardian gates</text>
  <text x="918" y="336" fill="#cbd5e1" font-size="12">• Shared singleton dev:safe (saves 48GB)</text>
