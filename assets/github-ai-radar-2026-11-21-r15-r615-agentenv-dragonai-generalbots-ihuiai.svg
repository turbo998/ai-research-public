  <text x="626" y="288" fill="#cbd5e1" font-size="12">• Built-in Meetings &amp; Advanced RAG</text>
  <text x="626" y="312" fill="#cbd5e1" font-size="12">• Multi-window botui browser desktop</text>
  <text x="626" y="336" fill="#cbd5e1" font-size="12">• 100% offline-capable &amp; data-sovereign</text>
