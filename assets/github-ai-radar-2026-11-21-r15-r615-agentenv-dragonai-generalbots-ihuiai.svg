  <text x="44" y="56" fill="#f8fafc" font-size="20" font-weight="800">[R615 Milestone] 2026-11-21 Day R15: Scale AI AgentEnv, DRAGON-AI 4-Queue Platform, GeneralBots 80 Apps &amp; IHUI-AI</text>
  <text x="44" y="82" fill="#94a3b8" font-size="13.5" font-weight="500">scaleapi/agentenv-framework (★445) + Anton2025-11-06/DRAGON-AI (★210) + generalbots/generalbots (★98) + IHUI-INF-AI/IHUI-AI (★32)</text>
  <text x="44" y="101" fill="#fbbf24" font-size="12.5" font-weight="600">Scale AI Containerized RL/Eval Protocol · 4-Pipeline Enterprise RAG/Graph/Sandbox AI Middle Platform · 80-App Rust Suite · 340-Table RLS OS</text>

  <rect x="24" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
