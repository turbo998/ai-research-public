  <text x="42" y="384" fill="#cbd5e1" font-size="12">• Explorer UI via agent-env up</text>
  <text x="42" y="408" fill="#38bdf8" font-size="12" font-weight="600">Official Scale AI Open Source</text>

  <rect x="316" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
  <text x="334" y="162" fill="#34d399" font-size="16" font-weight="800">2. DRAGON-AI</text>
