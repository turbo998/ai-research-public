  <text x="626" y="408" fill="#a78bfa" font-size="12" font-weight="600">Replaces 10+ SaaS Subscriptions</text>

  <rect x="900" y="130" width="276" height="390" rx="12" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
