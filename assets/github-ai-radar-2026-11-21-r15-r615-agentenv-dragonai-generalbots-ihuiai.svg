  <text x="42" y="240" fill="#cbd5e1" font-size="12">• Open agentenv-framework-protocol</text>
  <text x="42" y="264" fill="#cbd5e1" font-size="12">• Builds versioned container images</text>
  <text x="42" y="288" fill="#cbd5e1" font-size="12">• Deploys behind gateway &amp; grades runs</text>
