  <text x="334" y="214" fill="#f8fafc" font-size="13" font-weight="700">Multi-Tenant Enterprise AI Hub</text>
  <text x="334" y="240" fill="#cbd5e1" font-size="12">• 5-level data RBAC &amp; 7-resource ACLs</text>
  <text x="42" y="264" fill="#cbd5e1" font-size="12"></text>
  <text x="334" y="264" fill="#cbd5e1" font-size="12">• 12 model capabilities × 3 providers</text>
  <text x="334" y="288" fill="#cbd5e1" font-size="12">• 21-node workflow + single submit API</text>
  <text x="334" y="312" fill="#cbd5e1" font-size="12">• Isolated arq_graphflow (Neo4j resume)</text>
  <text x="334" y="336" fill="#cbd5e1" font-size="12">• AgentScope ReAct + NAS /workspace</text>
  <text x="334" y="360" fill="#cbd5e1" font-size="12">• MinerU + ES kNN + LightRAG + RAGAS</text>
  <text x="334" y="384" fill="#cbd5e1" font-size="12">• 4 isolated arq worker pipelines</text>
  <text x="334" y="408" fill="#34d399" font-size="12" font-weight="600">Single resource_guard Evaluation</text>

  <rect x="608" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="626" y="162" fill="#a78bfa" font-size="16" font-weight="800">3. generalbots</text>
