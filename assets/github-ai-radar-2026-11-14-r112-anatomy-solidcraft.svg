  <text x="646" y="223" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Sketch constraints, extrude, fillet, shell, hole patterns &amp; font engraving</text>
  <text x="646" y="242" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Change any parameter (e.g. height 24 → 32 mm) and the solid rebuilds live</text>

  <text x="632" y="274" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">2. Built-In MCP Server for Agentic 3D Solid Modeling</text>
  <text x="646" y="295" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• AI agents sketch, constrain, extrude &amp; query physical mass properties via MCP</text>
  <text x="646" y="314" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Supports physical materials (e.g. PETG mass calculation in Properties)</text>

  <text x="632" y="346" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">3. Runs Everywhere: Windows, macOS, Linux &amp; Zero-Install Browser</text>
  <text x="646" y="367" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Native MSI/DMG/AppImage/Snap builds + instant Web app (`solidcraft.io/app`)</text>
  <text x="646" y="386" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Open-source clean-room alternative to SolidWorks &amp; Fusion 360</text>

