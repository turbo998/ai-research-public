  <text x="56" y="202" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">1. Explains Technical Concepts as Working Physical Machines</text>
  <text x="70" y="223" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Turns cache keys into pin-tumbler locks; GPU contexts into 16-well plotters</text>
  <text x="70" y="242" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Builds dozens of shaded isometric SVG parts driven by one live math model</text>

  <text x="56" y="274" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">2. Camera-Aligned WebGL Shaders &amp; Zoomed-In Joint Self-Audits</text>
  <text x="70" y="295" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Embeds WebGL exhaust plumes, fire &amp; water caustics in exact isometric projection</text>
  <text x="70" y="314" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Agent zooms into every joint to self-audit alignment &amp; painter's order</text>

  <text x="56" y="346" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">3. Zero Dependencies (`npx skills add wheresryan22/anatomy -g`)</text>
  <text x="70" y="367" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Uses only built-in Node.js modules (&gt;=20.10); zero API keys required</text>
  <text x="70" y="386" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Runs in Claude Code, Codex, OpenCode, Antigravity &amp; MiniMax Code</text>

