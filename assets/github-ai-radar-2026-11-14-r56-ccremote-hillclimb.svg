  <text x="650" y="253" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Hashes --lock files (tests/fixtures); any attempt to weaken tests is refused instantly</text>
  <text x="650" y="269" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Parallel --check scoring + mandatory --guard suites (legacy tests, typecheck, lint)</text>

  <rect x="634" y="286" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="650" y="308" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. Multi-Repo Keep-or-Reset Loop &amp; Paired Noise Filtering</text>
  <text x="650" y="327" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Better score + green guards ➔ 1 atomic commit across all --repo trees; else full reset</text>
  <text x="650" y="343" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• --runs 3 --paired --min-gain 3% filters timer noise; hidden --holdout prevents overfitting</text>

  <rect x="634" y="360" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="650" y="382" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Disk-Persisted Trail Surviving Compaction &amp; Real Trial Wins</text>
  <text x="650" y="401" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• .hill-climb/ + last.txt survive context compaction; PLATEAU after 5 flat steps</text>
  <text x="650" y="417" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Proven: 190.5ms ➔ 0.66ms (~290x speedup) &amp; 12 failing spec tests ➔ 0 across 2 repos</text>

