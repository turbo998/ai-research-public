  <rect x="54" y="212" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="234" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. Split Execution Plane (Remote Auth/Model vs. Local Code/Shell)</text>
  <text x="70" y="253" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Server runs claude (&gt;=2.1.248): model, login, subscription, web search &amp; subagents</text>
  <text x="70" y="269" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Local machine runs Read, Write, Edit, Bash/PowerShell, Glob, Grep &amp; local CLAUDE.md</text>

  <rect x="54" y="286" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
