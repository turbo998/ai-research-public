  <text x="60" y="387" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">PS&gt; powershell -ExecutionPolicy Bypass -File scripts\setup_windows.ps1 &amp;&amp; .\Start_OpenAmika.bat</text>
