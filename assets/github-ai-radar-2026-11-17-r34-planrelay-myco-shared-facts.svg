  <text x="70" y="322" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Anchors every review comment to exact SHA-256 snapshot, line number &amp; severity</text>
  <text x="70" y="338" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• CLI `check` verifies that the latest revision is approved before coding starts</text>

