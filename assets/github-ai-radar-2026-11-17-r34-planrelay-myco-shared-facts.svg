  <text x="645" y="254" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Single Go binary connects claude.ai / VPS agents to local Claude Code, Codex &amp; shell</text>
  <text x="645" y="270" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Delegates tasks across teammates' agents without humans acting as a copy-paste bus</text>

  <rect x="631" y="284" width="513" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="645" y="304" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">2. agent-shared-facts (★68): Draft vs. Candidate vs. Published</text>
  <text x="645" y="322" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Separates offline drafts, review candidates &amp; Git-branch published facts with commit SHA</text>
  <text x="645" y="338" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Requires 2nd-device upstream pull verification before issuing a publication receipt</text>

  <rect x="631" y="352" width="513" height="64" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="645" y="372" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">3. Allowlisted Read-Only MCP &amp; Summary-Only Privacy Boundary</text>
  <text x="645" y="390" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Exposes reviewed facts over stdio or authenticated Streamable HTTP read-only MCP</text>
  <text x="645" y="406" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Keeps raw PII/credentials on origin devices; commits only approved summaries &amp; evidence IDs</text>

