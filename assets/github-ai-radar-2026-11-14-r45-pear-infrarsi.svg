  <text x="646" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Out-of-the-box MoE scripts (`Gemma-4-26B-A4B`, `Qwen3.5-35B-A3B`) stall at 6.4%–8.7% MFU on H100/H200.</text>
  <text x="646" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. `InfraRSI` searches parallelism/kernel/launch configs, validates correctness, and banks experience.</text>
