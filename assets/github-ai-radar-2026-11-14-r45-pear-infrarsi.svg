  <text x="62" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Replaces thousands of hours of human teleoperation with pure sim-to-real RL (GRPO + Score Centering).</text>
  <text x="62" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. Offloads multi-turn trajectory KV prefixes to CPU memory via `LMCache` across RL rollout steps.</text>
  <text x="62" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Deploys the 27B controller at real-time control rates on a single RTX 5090 using decode megakernels.</text>
  <text x="62" y="481" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Combine `veRL` async rollouts + `LMCache` CPU KV offload for multi-turn agentic RL.</text>

