  <text x="58" y="144" fill="#67E8F9" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">📊 egoist/tinytraffic (★ 220 | 1 Go Binary + 1 DuckDB File Cookie-Free Analytics)</text>

  <!-- 2 KPI Boxes -->
  <rect x="46" y="168" width="254" height="78" rx="8" fill="#1E293B" stroke="#06B6D4" stroke-width="1.2"/>
