  <text x="135" y="52" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2026-11-14 · DAYTIME R22 (R205)</text>
  <text x="240" y="51" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Single-Binary Go + DuckDB Web Analytics (`tinytraffic`) &amp; Pure Go `MyGo` Native Editor (`ArcMD`)</text>
  <text x="240" y="75" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">egoist/tinytraffic (~1KB Plausible-Compatible Tracker + 1 DuckDB File) + Ciao1019/ArcMD (Zero-cgo Go+MyGo Spaces &amp; 12 Hand-Drawn Strokes)</text>

  <!-- Left Panel: egoist/tinytraffic -->
