  <text x="1027" y="228" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" text-anchor="middle">12 animated hand-drawn annotations</text>

  <!-- ArcMD Mechanics -->
  <rect x="632" y="258" width="522" height="192" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="646" y="280" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">How `ArcMD` Brings Arc Browser's Aesthetic &amp; Hand-Drawn Annotations to Pure Go:</text>
  <text x="646" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Zero-cgo GPU Rendering (`egoist/mygo`): Uses `MyGo` for native windowing, GPU drawing,</text>
  <text x="646" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   glyph shaping, and OS input—shipping native binaries without Electron, WebView, or `cgo`.</text>
  <text x="646" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Folder-Backed Arc Spaces (`Ctrl+1..9`): Each Space maps to a local folder with custom 1–3</text>
  <text x="646" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   color gradients, frosted desktop translucency, noise grain, and global pinned favorites.</text>
  <text x="646" y="387" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">12 Hand-Drawn Annotations: Wave · Circle · Highlighter · Double-Underline · Cross · Arrow</text>
  <text x="646" y="409" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Expressive `.arcmd` Annotations: Select any text to draw 12 animated vector strokes</text>
  <text x="646" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">   (circles, arrows, cross-outs, boxes) persisted directly alongside the document.</text>

