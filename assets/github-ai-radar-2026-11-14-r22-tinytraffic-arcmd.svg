  <text x="796" y="579" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Single-Container Hosting: $90.00 | Labor (3.5h): $332.50</text>
  <text x="796" y="601" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="700">Total TCO: $422.50 / mo (-91.27% | Save $4,417.50/mo)</text>
