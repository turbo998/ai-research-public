  <text x="428" y="579" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• ClickHouse/Postgres RAM VM Spend: $710.00 / mo</text>
  <text x="428" y="598" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Cluster Upgrades &amp; Ops (17.0h × $95): $1,615.00 / mo</text>
