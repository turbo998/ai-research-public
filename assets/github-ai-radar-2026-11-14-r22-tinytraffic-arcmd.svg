  <!-- tinytraffic Mechanics -->
  <rect x="46" y="258" width="522" height="192" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="60" y="280" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">Why `tinytraffic` Replaces Heavy ClickHouse/Postgres Analytics Stacks for Personal/SaaS Sites:</text>
  <text x="60" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Single-File Columnar Storage (`DuckDB`): Embeds DuckDB inside a single Go binary (`ghcr.io/</text>
  <text x="60" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   egoist/tinytraffic:main`), eliminating multi-container ClickHouse + Postgres + Redis overhead.</text>
  <text x="60" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. GDPR-Friendly Midnight Salt Rotation: Identifies visitors via `hash(daily_salt, site, IP, UA)`</text>
  <text x="60" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   where the salt rotates at midnight in the site's timezone and raw IPs are never stored on disk.</text>
  <text x="60" y="387" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">$ docker run -d -p 8080:8080 -v tinytraffic:/data -e TT_PASSWORD=secret ghcr.io/egoist/tinytraffic:main</text>
  <text x="60" y="409" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Drop-In Plausible Compatibility: Tracks SPA routes, outbound clicks, and custom goals</text>
  <text x="60" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">   (`tinytraffic("Signup", { props })`) while preserving history across domain migrations.</text>

