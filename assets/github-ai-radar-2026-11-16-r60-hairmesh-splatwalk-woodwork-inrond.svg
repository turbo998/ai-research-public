  <text x="68" y="612" fill="#94A3B8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">工作负载：每月制作 25 个风格化 3D 角色发型与交互式 3DGS 展厅 + 20 套参数化柜体开料与零重排多语种字体系统（时薪 r = $100.00/hr；WebGPU 功耗：not_measured）</text>

  <!-- Bars -->
  <text x="68" y="646" fill="#F8FAFC" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path A (破坏性手工重拓扑头发 + 商业柜体拆单软件 + 换圆体字修折行错位)</text>
  <rect x="430" y="630" width="579" height="22" rx="5" fill="#EF4444"/>
  <text x="1021" y="646" fill="#FCA5A5" font-family="Consolas, monospace" font-size="13" font-weight="bold">$5,790.00/mo ($1,890.00 license/tool spend + 39.0h × $100 = $3,900.00)</text>

  <text x="68" y="682" fill="#F8FAFC" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path B (改一撮头发重烘整头网格 + 仅支持拉丁字母无斜体的冻结圆体字)</text>
  <rect x="430" y="666" width="269" height="22" rx="5" fill="#F59E0B"/>
  <text x="711" y="682" fill="#FDE68A" font-family="Consolas, monospace" font-size="13" font-weight="bold">$2,690.00/mo ($890.00 spend + 18.0h × $100 = $1,800.00)</text>

  <text x="68" y="718" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path C (HairMesh + splat-walk + solidcraft-woodwork + Inrond)</text>
  <rect x="430" y="702" width="38.5" height="22" rx="5" fill="#10B981"/>
  <text x="480" y="718" fill="#6EE7B7" font-family="Consolas, monospace" font-size="13" font-weight="bold">$385.00/mo ($75.00 spend + 3.1h × $100 = $310.00) → 净省 $5,405.00/月 (-93.35% / 年省 $64,860.00)</text>

  <line x1="68" y1="740" x2="1332" y2="740" stroke="#334155"/>
  <text x="68" y="766" fill="#38BDF8" font-family="Consolas, monospace" font-size="13.5" font-weight="bold">🎯 ARCHITECTURAL TAKEAWAYS FOR LIVE/BAKED HAIR MESHES, 3DGS SHADERS &amp; ZERO-REFLOW VARIABLE FONTS:</text>
  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• Blender 风格化发束应采用“双曲线张墙 + 仅增量重建变更发束”的 Live/Baked 非破坏工作流 (HairMesh v1.1.1)。</text>
  <text x="68" y="814" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• PlayCanvas WebGPU 中的射线波前着色器 (`src/burn.js`) 能让用户在实景照片感与高斯椭球几何轮廓间一键切换。</text>
  <text x="68" y="838" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 主题系统切换字体圆角 (`ROND 0–100`) 必须保持与基准 Inter 完全相同的字宽与 Kerning，实现 0 CLS 布局偏移 (Inrond)。</text>
