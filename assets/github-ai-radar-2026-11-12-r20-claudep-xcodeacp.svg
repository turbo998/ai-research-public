  <rect width="1200" height="680" fill="url(#bg20)" rx="16"/>
  <rect x="24" y="20" width="1152" height="6" fill="url(#accent20)" rx="3"/>

  <text x="40" y="58" fill="#F59E0B" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">2026-11-12 GITHUB AI RADAR · ROUND 20 (CUMULATIVE R119) ARCHITECTURE SELECTION FAQ</text>
  <text x="40" y="90" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800">Resident Claude -p Stream-JSON Pipeline &amp; Xcode 27 Dual-Exec ACP Isolation</text>
  <text x="40" y="116" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Saekisui/claude-p-pipeline (Resident stream-json + Billing Guard) + yusuke-114/claude-xcode-agent (Dual-Exec ACP Settings Isolator)</text>

  <!-- Left Card: Saekisui/claude-p-pipeline -->
  <rect x="40" y="138" width="545" height="310" rx="12" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="60" y="168" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">1. Saekisui/claude-p-pipeline (95★ · Claude Code 2.1.282)</text>
  <text x="60" y="192" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Resident Bidirectional stream-json Process: 1 resident claude -p per window</text>
  <text x="60" y="212" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  with turn gatekeeper, SSE + heartbeat, and ordered DB persistence on tab close</text>
  <text x="60" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• API Billing Guard &amp; Hot Persona Swap: Strips ANTHROPIC_API_KEY automatically</text>
  <text x="60" y="256" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  to prevent pay-as-you-go leakage; uses --system-prompt-snapshot off + --resume</text>
  <text x="60" y="280" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• 26-Chapter Manual + 6-Item Upgrade Smoke Suite: npm run smoke verifies CLI</text>
  <text x="60" y="300" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  flags across Claude Code upgrades on an isolated port using haiku</text>
  <rect x="60" y="320" width="505" height="110" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="76" y="344" fill="#FDE68A" font-family="Consolas, monospace" font-size="12">env -u ANTHROPIC_API_KEY claude -p (Bidirectional stream-json)</text>
  <text x="76" y="366" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">-&gt; Turn Gatekeeper + SSE Heartbeat + --system-prompt-snapshot off</text>
  <text x="76" y="388" fill="#A7F3D0" font-family="Consolas, monospace" font-size="12">-&gt; --resume Reconcile (Truncation / Cold Rebuild / Fork) + MCP ID</text>
  <text x="76" y="410" fill="#93C5FD" font-family="Consolas, monospace" font-size="12">-&gt; npm run smoke (6-check upgrade harness on 127.0.0.1:3456)</text>

  <!-- Right Card: yusuke-114/claude-xcode-agent -->
  <rect x="615" y="138" width="545" height="310" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="635" y="168" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">2. yusuke-114/claude-xcode-agent (73★ · MIT · Xcode 27 ACP)</text>
  <text x="635" y="192" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Solves Two Xcode 27 GUI ACP Pain Points: GUI launch lacks shell env for API</text>
  <text x="635" y="212" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  keys/gateways, and claude-agent-acp hardcodes --setting-sources user,project,local</text>
  <text x="635" y="236" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Dual-Role exec Trampoline (claude-acp.sh): Runs ① as agent (loads config.json,</text>
  <text x="635" y="256" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  sets CLAUDE_CODE_EXECUTABLE to self) and ② as claude (rewrites setting-sources)</text>
  <text x="635" y="280" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• Zero Wrapper Process &amp; Pure ACP stdout: Both roles use exec; swaps setting</text>
  <text x="635" y="300" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">  sources to project,local so ~/.claude/settings.json never pollutes Xcode</text>
  <rect x="635" y="320" width="505" height="110" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="651" y="344" fill="#7DD3FC" font-family="Consolas, monospace" font-size="12">Xcode 27 GUI -&gt; claude-acp.sh ① (load config.json, exec ACP adapter)</text>
  <text x="651" y="366" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">-&gt; ACP adapter spawns CLAUDE_CODE_EXECUTABLE -&gt; claude-acp.sh ②</text>
  <text x="651" y="388" fill="#6EE7B7" font-family="Consolas, monospace" font-size="12">-&gt; Rewrite --setting-sources project,local + inject MCP servers</text>
  <text x="651" y="410" fill="#FDE68A" font-family="Consolas, monospace" font-size="12">-&gt; exec real claude (0 wrapper PIDs, pure ACP stdout)</text>

  <!-- Bottom Card: FinOps Closed-Form Model -->
  <rect x="40" y="468" width="1120" height="182" rx="12" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
