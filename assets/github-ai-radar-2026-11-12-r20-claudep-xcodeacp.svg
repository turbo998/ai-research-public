  <text x="60" y="530" fill="#F87171" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Path A (API Key Leak + Global Settings Crash):</text>
  <text x="395" y="530" fill="#F8FAFC" font-family="Consolas, monospace" font-size="14">$2,040.00 API leak + $4,180.00 labor (44.0h) = $6,220.00/mo</text>
  <rect x="860" y="516" width="270" height="16" rx="4" fill="#EF4444"/>

  <text x="60" y="564" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Path B (Cold Spawn -p + Manual JSON Edits):</text>
  <text x="395" y="564" fill="#F8FAFC" font-family="Consolas, monospace" font-size="14">$960.00 API/cache + $2,090.00 labor (22.0h)  = $3,050.00/mo</text>
  <rect x="860" y="550" width="132" height="16" rx="4" fill="#F59E0B"/>

  <text x="60" y="598" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Path C (claude-p-pipeline + claude-xcode-agent):</text>
  <text x="395" y="598" fill="#F8FAFC" font-family="Consolas, monospace" font-size="14">$210.00 API/cache + $380.00 labor (4.0h)     = $590.00/mo</text>
  <rect x="860" y="584" width="26" height="16" rx="4" fill="#10B981"/>

  <text x="60" y="632" fill="#A7F3D0" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">Net Verified Savings (Path C vs Path A): $5,630.00 / month (-90.51% TCO · $67,560.00/yr · 40.0h/mo saved [-90.91%])</text>
