  <!-- Header -->
  <text x="56" y="64" fill="#FDBA74" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">ROUND 13 DEEP DIVE · ELVAROFFICIAL/TEARDOWN v1.0.0 · INTERACTIVE 3D MACHINE SIMULATOR SKILL</text>
  <text x="56" y="96" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800">Teardown 3D Machine Simulator Skill vs. Freehand Three.js &amp; Blender Pre-Render</text>
  <text x="56" y="122" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">Archived Search API Snapshot (b63e1547...): 2,633 Total Stars (~293★/day lifecycle avg, measured; stars_today: not_measured) · MIT License · Three.js 0.186.1 + Playwright</text>

  <!-- Left Column: 5-Module Architecture & Dual-Target Pipeline -->
  <rect x="56" y="142" width="540" height="334" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="76" y="172" fill="#FDBA74" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700">1. First-Principles 5-Module Contract (Zero Drift &amp; Zero Collisions)</text>

  <rect x="76" y="188" width="500" height="82" rx="8" fill="#0F172A" stroke="#F97316" stroke-width="1.2"/>
  <text x="92" y="210" fill="#FED7AA" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Stage 1: kin.js Pure-Math Kinematics (Zero Three.js Imports)</text>
  <text x="92" y="230" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Real physical units (e.g., Cessna 32 teeth × 4mm module = 128mm pitch dia, 201mm stroke)</text>
  <text x="92" y="248" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Single scalar input drives every mesh pose &amp; HUD gauge — zero keyframe/chart drift</text>

  <rect x="76" y="280" width="500" height="88" rx="8" fill="#0F172A" stroke="#F59E0B" stroke-width="1.2"/>
  <text x="92" y="302" fill="#FDE68A" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Stage 2: Pure render(t) Dual-Target Build (live.js + film.js + score.py)</text>
  <text x="92" y="322" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• sims/build.mjs: ~800 KB (&lt;1 MB) offline HTML, kit/warm.js shader precompile, TIERS iGPU</text>
  <text x="92" y="340" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">• sims/capture.mjs + run_sfx.py: 1080p 60fps MP4 + 48kHz -14 LUFS audio on timeline.json</text>

  <rect x="76" y="378" width="500" height="82" rx="8" fill="#0F172A" stroke="#10B981" stroke-width="1.2"/>
  <text x="92" y="400" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="700">Stage 3: Contact-Sheet Visual Review Gate (--stills beats + sheet.mjs)</text>
  <text x="92" y="420" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Renders 4-column contact sheet 0.3s after every timeline beat (t=) for agent vision check</text>
  <text x="92" y="438" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12">• Eliminates GTAO cutaway ghosts (gtao.normalMaterial) &amp; Windows ANGLE smoothstep bugs</text>

  <!-- Right Column: Closed-Form FinOps & SA Hours Model -->
  <rect x="616" y="142" width="528" height="334" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1"/>
