  <text x="76" y="602" fill="#93C5FD" font-family="monospace" font-size="12.5">CLI: node sims/build.mjs v8-live &amp;&amp; node sims/capture.mjs v8-film --size 1600x900 --dpr 1.2 --stills beats --cols 4 --out beats.png</text>
