  <text x="636" y="192" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">synthetic, independently_reproduced=false · $3/1M in, $15/1M out · External 3D/Unity seats: not_measured</text>

  <!-- Bar 1: Path A -->
  <text x="636" y="222" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Path A: Freehand LLM Three.js (10 rounds/sim = 120 rounds/mo)</text>
  <rect x="636" y="230" width="440" height="24" rx="5" fill="#EF4444"/>
  <text x="646" y="247" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">$37.80/mo API ($16.20 in + $21.60 out) · 72.0h/mo SA Debugging</text>

  <!-- Bar 2: Path B -->
  <text x="636" y="280" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Path B: LLM Spec + Manual Blender/Unity Rigging (4 rounds/sim = 48/mo)</text>
  <rect x="636" y="288" width="92" height="24" rx="5" fill="#F59E0B"/>
  <text x="738" y="305" fill="#FDE68A" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">$7.92/mo API ($3.60 in + $4.32 out) · 96.0h/mo Manual 3D</text>

  <!-- Bar 3: Path C -->
  <text x="636" y="338" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Path C: elvarofficial/teardown v1.0.0 (2 rounds/sim = 24 rounds/mo)</text>
  <rect x="636" y="346" width="34" height="24" rx="5" fill="#10B981"/>
  <text x="680" y="363" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">$2.88/mo API ($1.44 in + $1.44 out) · 12.0h/mo SA Review (-92.38% API)</text>

  <!-- Formula Verification Box -->
  <rect x="636" y="386" width="488" height="74" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="652" y="408" fill="#FDBA74" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">Closed-Form Component Audit (Output Counted Strictly Once):</text>
  <text x="652" y="427" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Path A: 120×($0.1350+$0.1800) = $37.80/mo | Path C: 24×($0.0600+$0.0600) = $2.88/mo</text>
  <text x="652" y="445" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">• Net Savings (Path C vs A): -$34.92/mo (-$419.04/yr, -92.38% API) &amp; -60.0h/mo (-83.33% SA hrs)</text>

  <!-- Bottom Selection Guide Banner -->
  <rect x="56" y="494" width="1088" height="134" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1"/>
  <text x="76" y="522" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">3. AI Solution Architect Decision Matrix &amp; 30-Minute Quickstart</text>
  <text x="76" y="546" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">✅ Good Fit (Use teardown v1.0.0):</text>
  <text x="315" y="546" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13">Hardware/mechanism cutaways (engines, linkages, pumps, valves) needing &lt;1MB offline HTML + 1080p 60fps scored MP4.</text>
  <text x="76" y="572" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">⛔ Not For (Use stack-diagram / Blender):</text>
