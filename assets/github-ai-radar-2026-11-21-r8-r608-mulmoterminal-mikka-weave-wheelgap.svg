<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgR608" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentR608" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgR608)" rx="16"/>
  <rect x="24" y="20" width="1152" height="92" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="5" rx="2" fill="url(#accentR608)"/>
  <text x="44" y="56" fill="#f8fafc" font-size="20.5" font-weight="800">2026-11-21 Day R8 (R608): 7-CLI Triage Terminal Grid, Cloud/SSH Coordinator, 0-Dep SQLite Work DB &amp; Wheelgap</text>
  <text x="44" y="82" fill="#94a3b8" font-size="13.5" font-weight="500">receptron/mulmoterminal (★275) + aspectly-labs/Mikka (★88) + grunion-ai/weave (★19) + wheelgap/wheelgap (★10 · 57 forks)</text>
  <text x="44" y="101" fill="#38bdf8" font-size="12.5" font-weight="600">Blue/Green/Amber PTY Triage Grid · Cloud+SSH Agent Coordinator MCP · 0-Dep SQLite Tables+Docs+MCP · ARM/Alpine/3.14t Wheel Preflight</text>

  <rect x="24" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="162" fill="#38bdf8" font-size="16" font-weight="800">1. mulmoterminal</text>
  <text x="42" y="184" fill="#94a3b8" font-size="12">★ 275 · 32 forks · TypeScript · MIT</text>
  <text x="42" y="214" fill="#f8fafc" font-size="13" font-weight="700">7-CLI Browser PTY Triage Grid</text>
  <text x="42" y="240" fill="#cbd5e1" font-size="12">• Claude, Codex, Copilot, Cursor, Grok</text>
  <text x="42" y="264" fill="#cbd5e1" font-size="12">• Blue (working), Green (done), Amber (wait)</text>
  <text x="42" y="288" fill="#cbd5e1" font-size="12">• 1-line roster: asked vs. answered</text>
  <text x="42" y="312" fill="#cbd5e1" font-size="12">• Real PTY cells + tmux reload survival</text>
  <text x="42" y="336" fill="#cbd5e1" font-size="12">• Co-located dev server in same worktree</text>
  <text x="42" y="360" fill="#cbd5e1" font-size="12">• Phone push notifications on turn end</text>
  <text x="42" y="384" fill="#cbd5e1" font-size="12">• Cells can talk to each other directly</text>
  <text x="42" y="408" fill="#38bdf8" font-size="12" font-weight="600">Triage Agents Instead of Hunting</text>

  <rect x="316" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
  <text x="334" y="162" fill="#34d399" font-size="16" font-weight="800">2. aspectly-labs/Mikka</text>
  <text x="334" y="184" fill="#94a3b8" font-size="12">★ 88 · 13 forks · TypeScript · AGPL-3.0</text>
  <text x="334" y="214" fill="#f8fafc" font-size="13" font-weight="700">Cloud &amp; SSH Agent Coordinator</text>
  <text x="334" y="240" fill="#cbd5e1" font-size="12">• Isolated cloud VMs per coding task</text>
  <text x="334" y="264" fill="#cbd5e1" font-size="12">• Connects Mac, Linux &amp; SSH runners</text>
  <text x="334" y="288" fill="#cbd5e1" font-size="12">• Coordinator bot clarifies &amp; dispatches</text>
  <text x="334" y="312" fill="#cbd5e1" font-size="12">• HTTP MCP server for Claude Code</text>
  <text x="334" y="336" fill="#cbd5e1" font-size="12">• Self-hosts with Docker + PG/Neon</text>
  <text x="334" y="360" fill="#cbd5e1" font-size="12">• Built-in LiteLLM model alias routing</text>
  <text x="334" y="384" fill="#cbd5e1" font-size="12">• Web, macOS &amp; iOS operator clients</text>
  <text x="334" y="408" fill="#34d399" font-size="12" font-weight="600">Move Heavy Agent Jobs Off Laptop</text>

  <rect x="608" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="626" y="162" fill="#a78bfa" font-size="16" font-weight="800">3. grunion-ai/weave</text>
  <text x="626" y="184" fill="#94a3b8" font-size="12">★ 19 · 3 forks · JavaScript · MIT</text>
  <text x="626" y="214" fill="#f8fafc" font-size="13" font-weight="700">0-Dep SQLite Portable Work OS</text>
  <text x="626" y="240" fill="#cbd5e1" font-size="12">• Tables + relations + rollups + docs</text>
  <text x="626" y="264" fill="#cbd5e1" font-size="12">• Stored in one portable SQLite file</text>
  <text x="626" y="288" fill="#cbd5e1" font-size="12">• 0 runtime dependencies, 0 build step</text>
  <text x="626" y="312" fill="#cbd5e1" font-size="12">• Native MCP, REST &amp; CLI on same DB</text>
  <text x="626" y="336" fill="#cbd5e1" font-size="12">• weave build spec.json --dry-run</text>
  <text x="626" y="360" fill="#cbd5e1" font-size="12">• Turn-budgeted agent plans in AGENTS.md</text>
  <text x="626" y="384" fill="#cbd5e1" font-size="12">• Single Node &gt;=22.16 process</text>
  <text x="626" y="408" fill="#a78bfa" font-size="12" font-weight="600">Portable Notion/Airtable for Agents</text>

  <rect x="900" y="130" width="276" height="390" rx="12" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="918" y="162" fill="#fbbf24" font-size="16" font-weight="800">4. wheelgap/wheelgap</text>
  <text x="918" y="184" fill="#94a3b8" font-size="12">★ 10 · 57 forks · Python 3.11+ · MIT</text>
  <text x="918" y="214" fill="#f8fafc" font-size="13" font-weight="700">Pre-Docker Wheel Gap Scanner</text>
  <text x="918" y="240" fill="#cbd5e1" font-size="12">• Scans uv, poetry, pdm, pip &amp; pixi locks</text>
  <text x="918" y="264" fill="#cbd5e1" font-size="12">• Checks ARM, Alpine, Win-ARM &amp; 3.14t</text>
  <text x="918" y="288" fill="#cbd5e1" font-size="12">• Flags source-compile &amp; missing wheels</text>
  <text x="918" y="312" fill="#cbd5e1" font-size="12">• Suggests exact version that fixes it</text>
  <text x="918" y="336" fill="#cbd5e1" font-size="12">• Nightly top-5,000 PyPI wheel tracker</text>
  <text x="918" y="360" fill="#cbd5e1" font-size="12">• Claude plugin, MCP server &amp; GH Action</text>
  <text x="918" y="384" fill="#cbd5e1" font-size="12">• Runs in &lt;30s via uvx wheelgap</text>
  <text x="918" y="408" fill="#fbbf24" font-size="12" font-weight="600">Stop 20-Min Docker Compile Failures</text>

  <rect x="24" y="540" width="1152" height="116" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="572" fill="#f8fafc" font-size="15.5" font-weight="800">Closed-Form Enterprise FinOps TCO Benchmark (45-Engineer Team @ $100/h · synthetic, independently_reproduced=false)</text>
  <text x="44" y="600" fill="#cbd5e1" font-size="13">• Path A (Stalled Agent Window Hunting + Commercial Work-OS SaaS + Failed Multi-Arch Docker CI): $3,140.00 SaaS + 40.0h ($4,000.00) = $7,140.00/mo</text>
  <text x="44" y="624" fill="#34d399" font-size="13.5" font-weight="700">• Path C (Hybrid Cloud Control + MulmoTerminal + Mikka + Weave + Wheelgap): $65.00 Compute + 2.4h ($240.00) = $305.00/mo ➔ Saves $6,835.00/mo (-95.73%)</text>
  <text x="44" y="646" fill="#94a3b8" font-size="11">Audit Constants: Path A $3,140.00 + 40h ($4,000.00) = $7,140.00/mo ➔ Path C $65.00 + 2.4h ($240.00) = $305.00/mo (-$6,835.00/mo · -95.73% · base_hardware_capex = not_measured)</text>
</svg>
