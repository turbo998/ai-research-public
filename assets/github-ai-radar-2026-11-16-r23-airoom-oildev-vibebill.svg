  <!-- Left Column: petritavd/airoom -->
  <rect x="44" y="152" width="642" height="390" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="182" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">🏢 1. petritavd/airoom (Claude Code Control Room · Apache-2.0 · ★37)</text>
  <text x="66" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">告别 5 个终端切来切去漏看审批！每个项目一间房、每个会话一张工位桌</text>

  <rect x="66" y="220" width="598" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="82" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">四色工位显示器 + 10 分钟未决自动 Deny + 127.0.0.1 零遥测</text>
  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 直读本机 ~/.claude/projects：绿屏=工作中、黄屏=等你回复、红屏=被 Hook/权限卡住、暗屏=空闲</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 逐条工具调用审批门：展示精确命令与 Allow/Deny 按钮，超过 10 分钟未决自动拒绝 (Auto-Deny)</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 内置多身份浏览器窗格：支持以管理员/普通用户/未登录多 Profile 同屏验收；访问外网必先弹窗请示</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 三问招募并行小队 (Lead + Crew 各自独立 git worktree)，退出应用时安全驻车不杀进程</text>

  <rect x="66" y="380" width="598" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="82" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">oil-oil/oil-dev-skills (★30)：六技能编码 Agent 工程纪律与越界拦截</text>
  <text x="82" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 五步正交闭环 + 根因排障：oil-explore (只读追调用链) → oil-plan → oil-dispatch → oil-code-review → oil-govern</text>
  <text x="82" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 编码中途禁跑全量慢测试：编码期只允许秒级编译/类型检查/Lint，全量测试统一留到 Merge Gate</text>
  <text x="82" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 审查前脚本硬核验：自动比对 git diff 与已批准计划，高亮标记越界修改 (如误碰 vendor/ 或高危目录)</text>
  <text x="82" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ oil-govern 自动裁剪臃肿 AGENTS.md 并生成跨 Worktree 分支状态治理看板</text>

