  <text x="744" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 严守隐私底线：绝不打开 .env 文件，只读取环境变量名 (如 OPENAI_API_KEY)，绝不读取任何密钥值</text>
  <text x="744" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 只写 .vibe-bill/ 目录绝不改业务代码：产出详细 report.md 与完全隐藏文件名/变量名的可分享 receipt.png</text>
  <text x="744" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 诚实标注数据来源：拉取 OpenRouter 公开标价，未知第三方服务联网查价一次并显式标注为 (unverified)</text>
