  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 把分散在 5 个终端里的 Agent 聚合成单屏工位状态灯 (airoom)，未决审批 10 分钟自动 Fail-Closed 拒绝。</text>
