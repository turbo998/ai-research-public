  <text x="68" y="108" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21.5" font-weight="bold">Claude Code 指挥室 (airoom) + 六步越界审查技能 (oil-dev-skills) + 账单小票审计 (vibe-bill)</text>
