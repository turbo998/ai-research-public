  <text x="744" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• AI 调用黑洞：① 每次按键/重渲染都调 LLM；② 每轮重发完整历史；③ 简单任务硬上昂贵旗舰模型；④ 零缓存重复请求</text>
  <text x="744" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 架构与安全漏洞：⑤ 公开 AI 接口未加限流 (任何人都能刷爆你账单)；⑥ 高频死轮询；⑦ 上传图片切过多尺寸</text>
