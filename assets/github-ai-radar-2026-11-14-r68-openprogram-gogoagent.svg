  <text x="70" y="253" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Agents are ordinary Python classes; control flow, checks &amp; retries are native Python</text>
  <text x="70" y="269" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Agents write new methods into their own class that become tools on the next turn</text>

