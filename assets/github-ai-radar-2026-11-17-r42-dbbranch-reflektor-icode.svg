  <text x="60" y="678" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">$80.00/mo ZFS pool storage + 2.8 hrs/mo ($266.00) visual Reflektor report &amp; Mira queue sign-off (92.43% hours saved)</text>

  <rect x="60" y="692" width="1080" height="24" rx="6" fill="#1E293B"/>
  <text x="600" y="708" text-anchor="middle" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">SA Takeaway: Give every agent/PR an instant ZFS DB branch via db-branch MCP, review visually with Reflektor, and orchestrate via iCode ADE.</text>
