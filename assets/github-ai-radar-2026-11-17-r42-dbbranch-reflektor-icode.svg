  <text x="60" y="620" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">$950.00/mo CI runner &amp; storage spend + 17.0 hrs/mo ($1,615.00) maintaining seed scripts &amp; manual diff reviews</text>

