  <rect x="631" y="216" width="513" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="645" y="236" fill="#A5B4FC" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">1. bashovski/reflektor (★65, MIT): Visual Branch Review Report</text>
  <text x="645" y="254" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Renders UI-to-DB request flows, contract/type diffs, schema migrations &amp; UI screenshots</text>
  <text x="645" y="270" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Runs project tests, linters &amp; typecheckers in background and streams results live</text>

  <rect x="631" y="284" width="513" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="645" y="304" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">2. Local Review Daemon Handing Comments Back to Agent</text>
  <text x="645" y="322" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Stores review refs under .git/refs/reflektor &amp; serves live inbox on 127.0.0.1</text>
  <text x="645" y="338" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Inline browser comments feed directly back into Claude Code / Codex ($reflektor resume)</text>

  <rect x="631" y="352" width="513" height="64" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="645" y="372" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">3. icode-workbench (★64, AGPL-3.0): Parallel Worktree ADE + Mira</text>
  <text x="645" y="390" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Runs Claude Code, Codex &amp; OpenCode in isolated Git worktrees on Linux/Win/macOS</text>
  <text x="645" y="406" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Mira cross-project assistant flags blocked tasks; terminals survive app restarts</text>

