  <text x="70" y="390" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Test MySQL 8.0→8.4 upgrades via branch upgrade --check-only with auto-rollback</text>
  <text x="70" y="406" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Scales across Raft VM clusters with ProxySQL routing &amp; web console branch graphs</text>

