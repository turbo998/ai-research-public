  <text x="60" y="562" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">$2,370.00/mo cloud DB branch/staging fees + 37.0 hrs/mo ($3,515.00) fixing broken staging DBs &amp; reviewing 2k-line diffs</text>

  <!-- Path B -->
  <text x="60" y="602" fill="#FCD34D" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Path B: Local Docker DB Seeds + Manual PR Comment Copy-Paste</text>
  <rect x="470" y="586" width="231" height="22" rx="4" fill="#F59E0B" opacity="0.85"/>
