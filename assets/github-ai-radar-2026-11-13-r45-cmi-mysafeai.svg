  <text x="646" y="278" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">How MySafeAI Prevents Accidental Direct-IP Leaks &amp; Account Flags:</text>
  <text x="646" y="301" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Pre-Launch &amp; Live Route Gate (`mysafeai run -- codex`): Checks egress IP via 2 independent</text>
  <text x="646" y="320" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   sources before launch and suspends the app + child processes immediately on route change.</text>
  <text x="646" y="342" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">2. Granular Per-App Rules: Supports Auto, VPN-Only, Service-Route check, or System Proxy/PAC</text>
  <text x="646" y="361" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   with allowlists for specific IPs, CIDR subnets, countries, and trusted LANs.</text>
  <text x="646" y="383" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">3. IPv4/IPv6/DNS Leak Diagnostics + Selective Browser Gate: Blocks unverified requests to</text>
  <text x="646" y="402" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   ChatGPT, Claude, Cursor, Gemini &amp; up to 50 custom domains without breaking other tabs.</text>
  <text x="646" y="426" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">• v0.4.0 reuses Windows process/thread snapshots &amp; isolates slow DNS/PAC checks per app.</text>

