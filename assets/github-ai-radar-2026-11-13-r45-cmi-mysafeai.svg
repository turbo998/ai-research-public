  <!-- CMI Mechanics -->
  <rect x="46" y="256" width="522" height="194" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="60" y="278" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">Why CMI Beats Destructive Context Clearing (`content cleared`):</text>
  <text x="60" y="301" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Reversible Sticky-Note Folding: Replaces stale file reads/test logs with a compact note; if the</text>
  <text x="60" y="320" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   agent needs one again, it unfolds the exact byte-for-byte original in 1 step (0 re-execution).</text>
  <text x="60" y="342" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Prompt-Cache Break-Even Pricing: Rewriting a warm cache costs money. CMI waits 30 requests</text>
  <text x="60" y="361" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   and computes whether downstream savings repay the cache rewrite before folding.</text>
  <text x="60" y="385" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">$ cmi-proxy install-service   # or: hermes plugins install cmi</text>
  <text x="60" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Cross-AI Project Memory (Hermes Agent): Decisions made in Claude carry over to ChatGPT/GPT.</text>
  <text x="60" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">• Verified across 26 real work sessions + 35 replayed Claude Code sessions + 6 live 195-req runs.</text>

