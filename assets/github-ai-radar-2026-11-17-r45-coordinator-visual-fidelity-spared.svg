  <text x="40" y="58" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">2026-11-17 NIGHT ROUND 45 (CUMULATIVE R469) · HERDR FLEET COORDINATOR, 1PX DOM UI VERDICT &amp; WASM+SQLITE MICRO-APP HOST</text>
  <text x="40" y="90" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="800">Coordinator Fleet Manager, visual-fidelity &amp; spared Cut Platform TCO by 94.10%</text>
  <text x="40" y="116" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">Comparing Unmanaged Agent Sprawl &amp; Subjective UI QA vs. petekp/coordinator (★46, MIT) + linggan121/visual-fidelity (★46, MIT) &amp; spared (★45)</text>

  <!-- Left Card: petekp/coordinator -->
  <rect x="40" y="138" width="545" height="295" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
