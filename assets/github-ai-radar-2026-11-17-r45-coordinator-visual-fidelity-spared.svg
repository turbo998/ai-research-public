  <text x="645" y="254" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Any 1px element-box drift fails; attributes diff pixels to exact DOM nodes</text>
  <text x="645" y="270" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Verdicts: READY, READY WITH SUBSTITUTIONS, READY WITH DECLARED FLOOR, UNVERIFIED</text>

  <rect x="631" y="284" width="513" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="645" y="304" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">2. michaelmagan/spared (★45, Apache-2.0): Wasm + SQLite Sandbox</text>
  <text x="645" y="322" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Each Rust app &amp; its SQLite DB run inside an isolated wasm32-wasip2 sandbox</text>
  <text x="645" y="338" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Warm p50: 148 µs vs workerd 388 µs (2.6x faster); p99: 5.45 vs 16.53 ms (3.0x)</text>

  <rect x="631" y="352" width="513" height="64" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="645" y="372" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">3. 0.9ms Idle Wake &amp; 4.8x Less Unreclaimable Memory</text>
  <text x="645" y="390" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• At 200 apps: 108 MiB unreclaimable RAM vs workerd 516 MiB (anonymized_reported)</text>
  <text x="645" y="406" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Single binary hosts hundreds of agent-generated Rust+SQLite micro-apps</text>

