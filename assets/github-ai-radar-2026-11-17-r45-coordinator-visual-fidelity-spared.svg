  <text x="60" y="678" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">$80.00/mo 4-vCPU spared VM &amp; probes + 2.8 hrs/mo ($266.00) batched ≤5 decisions &amp; READY sign-off (92.43% hours saved)</text>

