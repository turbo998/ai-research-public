  <text x="181" y="170" text-anchor="middle" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">FLEET MANAGER · COORDINATOR (★46)</text>
  <text x="320" y="170" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Python · Claude + Herdr · MIT</text>

  <text x="56" y="202" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700">3-Delegate Worktree Cap + fleet_watch.py + 5-Question Batches</text>

  <rect x="56" y="216" width="513" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="70" y="236" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">1. Durable Markdown Backlog &amp; Scoped Delegate Briefs</text>
  <text x="70" y="254" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• /coordinator &lt;domain&gt; maintains a restart-persistent Markdown backlog</text>
  <text x="70" y="270" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Spawns up to 3 parallel delegates in isolated Git worktrees &amp; Herdr tabs</text>

  <rect x="56" y="284" width="513" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="70" y="304" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">2. Event-Driven fleet_watch.py &amp; Batched Human Decisions</text>
  <text x="70" y="322" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Wakes coordinator on REPORT.md completion, PR merge, CI failure, or review</text>
  <text x="70" y="338" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Batches high-stakes questions (≤5 at a time) with options &amp; recommendations</text>

  <rect x="56" y="352" width="513" height="64" rx="8" fill="#0F172A" stroke="#334155"/>
