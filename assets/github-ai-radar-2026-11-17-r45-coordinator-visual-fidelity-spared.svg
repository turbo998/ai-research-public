  <text x="70" y="390" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Ends idle delegates after 24h and resumes the exact session when activity arrives</text>
  <text x="70" y="406" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• fleet-sweep removes finished worktrees/tabs while refusing destructive data loss</text>

