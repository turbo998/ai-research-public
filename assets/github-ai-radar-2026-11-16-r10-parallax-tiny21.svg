  <!-- Header -->
  <rect x="44" y="42" width="1312" height="94" rx="14" fill="#111C35" stroke="#2D426B" stroke-width="1.2"/>
  <text x="68" y="76" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">PROACTIVE DURABLE NEWS AGENT · 2026-11-16 NIGHT SHIFT ROUND 10 (CUMULATIVE R367 MILESTONE) · CLAIM-20261116-R10-PARALLAX-TINY21</text>
  <text x="68" y="108" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21.5" font-weight="bold">60% 上下文自动交接多会话编码层 (AI4XE/Parallax) + 380KB 软盘级 DOS Transformer (Tiny-2.1)</text>
  <text x="68" y="128" fill="#94A3B8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">Wish→Choose→Hand off 三步脱手交付与 60% 阈值无感换脑 · Turbo C 2.0 367K 参数 8-bit 逐行缩放实模式推理 · 净省 $5,215.00/月 (-92.79%)</text>

  <!-- Left Column: AI4XE/Parallax -->
  <rect x="44" y="152" width="642" height="390" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="182" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">🧭 1. AI4XE/Parallax (MIT · Claude Code / DeepSeek Harness / Copilot · ★106)</text>
  <text x="66" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">为什么长任务跑过 60% 上下文窗口后 Coding Agent 会突然变蠢？</text>

  <rect x="66" y="220" width="598" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="82" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">Wish → Choose → Hand off 三步脱手编排 + Solo/Team 双轨</text>
  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 1. Wish：用户随意多条输入口述目标，说 "that's all" 即可结束需求收集</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 2. Choose：Agent 先自主调研代码库，再每次只问 1 个单选问题与人类对齐决策</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 3. Hand off：自动走完 Plan → 独立审查 → 新会话执行 → 独立审计 → Scoped Commit 闭环</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 支持 Solo (当前会话直跑) 与 Team (人类常驻总控 Orchestrator + 独立执行子会话) 双模式</text>

  <rect x="66" y="380" width="598" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="82" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">两道上下文保鲜闸门：开局净室切换 + 60% 水位自动热交接</text>
  <text x="82" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 方案获批即换新脑：规划与讨论产生的废话绝不带入编码执行期，强制在全新干净会话启动实施</text>
  <text x="82" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• ~60% 容量自动接力：Team 模式下当上下文消耗达到 ~60% 时自动打包交接至新会话，彻底规避 Context Rot</text>
  <text x="82" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 跨三大主力宿主：原生适配 Claude Code、DeepSeek Harness 与 VS Code GitHub Copilot 扩展</text>
  <text x="82" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 触发词 wish / Parallax / qstart · 独立审查员与执行员上下文物理隔离防止自我放水</text>

  <!-- Right Column: WollyMonjac/Tiny-2.1 -->
  <rect x="706" y="152" width="650" height="390" rx="14" fill="url(#cardGrad)" stroke="#34D399" stroke-width="1.5"/>
  <text x="728" y="182" fill="#34D399" font-family="Consolas, monospace" font-size="14" font-weight="bold">💾 2. WollyMonjac/Tiny-2.1 (Turbo C 2.0 · 380KB Weights · MS-DOS · ★110)</text>
  <text x="728" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">塞进一张 1.44MB 软盘、在 486DX 纯 DOS 640KB 内存里跑通的 Transformer！</text>

  <rect x="728" y="220" width="606" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="744" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">367,000 参数 · 4 层 96 维 · 380 KB 8-Bit 逐行缩放权重</text>
  <text x="744" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 极限受限硬件推理：纯 Turbo C 2.0 (`TCC -ml TINY.C` Large 内存模型) 编写，零现代 OS 或 GPU 依赖</text>
  <text x="744" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 仅需 ~540 KB 常规内存 (Conventional Memory)：在 486DX / 早期奔腾实模式 DOS 下直接加载 TINY.BIN</text>
  <text x="744" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 字符级 (Letter-by-Letter) 问答架构：免除几万词表 Embedding 内存开销，按行 8-bit 量化压至 380 KB</text>
  <text x="744" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 围绕 3,500 条多种问法事实训练 · 配有全屏霓虹神经元激活监视器与 PC 蜂鸣器机械语音</text>

  <rect x="728" y="380" width="606" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="744" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">对工业嵌入式 MCU / 离线工控机端侧推理的三大第一性原理启示</text>
  <text x="744" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 1. 窄词表/字符级 Tokenization 是突破 &lt;1MB SRAM 瓶颈的关键（彻底砍掉庞大的词表投影矩阵）</text>
  <text x="744" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 2. Per-Row 8-Bit 对称量化在无 SIMD 的 16/32 位老旧 C 编译器下即可用纯整数累加极速实现</text>
  <text x="744" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 3. 诚实标注知识边界：README 坦诚指出在 3,500 条训练事实之外模型会“自信地胡编乱造”</text>
  <text x="744" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 整套源码仅单个 TINY.C 文件，是学习 Transformer 底层前向传播 C 语言手写实现的绝佳活教材</text>

