  <text x="68" y="682" fill="#F8FAFC" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path B (手工 /clear 复制粘贴交接 + 重型交叉编译)</text>
  <rect x="430" y="666" width="263" height="22" rx="5" fill="#F59E0B"/>
  <text x="705" y="682" fill="#FDE68A" font-family="Consolas, monospace" font-size="13" font-weight="bold">$2,630.00/mo ($880.00 compute + 17.5h × $100 = $1,750.00)</text>

  <text x="68" y="718" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path C (Parallax 60% 自动换脑 + Tiny-2.1 纯 C 范式)</text>
  <rect x="430" y="702" width="41" height="22" rx="5" fill="#10B981"/>
  <text x="483" y="718" fill="#6EE7B7" font-family="Consolas, monospace" font-size="13" font-weight="bold">$405.00/mo ($85.00 compute + 3.2h × $100 = $320.00) → 净省 $5,215.00/月 (-92.79% / 年省 $62,580.00)</text>

  <line x1="68" y1="740" x2="1332" y2="740" stroke="#334155"/>
  <text x="68" y="766" fill="#38BDF8" font-family="Consolas, monospace" font-size="13.5" font-weight="bold">🎯 ARCHITECTURAL TAKEAWAYS FOR LONG-HORIZON AGENTS &amp; TINYML:</text>
  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 永远不要等上下文满了再压缩：Parallax 在 ~60% 水位主动触发跨会话交接，并在计划获批瞬间开启净室执行会话。</text>
  <text x="68" y="814" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 一问一答式需求澄清 (One Question at a Time)：先自主搜代码再逐个单选题对齐，彻底消除一次性抛 10 个问题吓跑用户的反模式。</text>
  <text x="68" y="838" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 540KB 内存跑 Transformer 的极简美学：Tiny-2.1 证明纯 C89 + 逐行 INT8 + 字符级词表足以在任意古董工控机或 MCU 上落地推理。</text>
