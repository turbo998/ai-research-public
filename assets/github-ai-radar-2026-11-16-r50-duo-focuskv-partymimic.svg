  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 实时全双工视听交互需将 Intent 决策流与 Realization 生成流用分块因果掩码对齐在同一时间轴，并用 vLLM-Omni 流式加速 (Duo)。</text>
