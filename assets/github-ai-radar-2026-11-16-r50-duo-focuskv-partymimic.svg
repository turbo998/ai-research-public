  <text x="744" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 在线拟合 MLP 世界模型：直接穿过 32 步想象状态反向传播解析梯度，并用超视距 Critic 兜底长程回报</text>
  <text x="744" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 1× RTX 4090 (24GB) 26 分钟极速收敛：单个策略通吃 41 小时混合动作库（LAFAN1 + BONES-SEED 10k + 功夫）</text>
  <text x="744" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 在宇树 G1 留出操作集上实现 20.5 mm 最低追踪误差，零样本泛化至五大未见测试集</text>

  <rect x="728" y="380" width="606" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="744" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">双编码器 + 双控制模态 + 跨机型支持 (Unitree G1 &amp; RoboParty RP1)</text>
  <text x="744" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 两种参考编码器：默认轻量 MLP 编码器，或 `--ref_enc xattn` 交叉注意力编码器</text>
  <text x="744" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 两种输入模态：全身关节角参考，或 `--interface sparse5` 仅输入骨盆 + 5 个关键点（直接适配 VR 头显/单目动捕）</text>
  <text x="744" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 100% 复现开源配方：完整公开公共数据集多样性筛选脚本、RP1 重定向管线与预训练 Checkpoints</text>
  <text x="744" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 在行走、灵巧操作、舞蹈、地面动作与极限武术五大盲测集上全面零样本泛化</text>

