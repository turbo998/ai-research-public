  <text x="68" y="108" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21.5" font-weight="bold">蚂蚁全双工交互世界模型 (Duo) + 推理注意力头 KV 压缩 (Focus-KV) + 26 分钟全身模仿</text>
  <text x="68" y="128" fill="#94A3B8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">Intent+Realization 双模全双工流式推理 + 倾斜配额给稀疏推理头保住 MATH-500 + 单卡 4090 26m 训出 20.5mm 精度 G1 策略 · 净省 $6,030.00/月 (-93.63%)</text>

  <!-- Left Column: inclusionAI/Duo + Maverick720/Focus-KV -->
  <rect x="44" y="152" width="642" height="390" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="182" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">🌐 1. inclusionAI/Duo (★76) + Maverick720/Focus-KV (★72)</text>
  <text x="66" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">边听边看边插话的互惠世界模型 + 把 KV Cache 预算重点分给“关键推理头”</text>

  <rect x="66" y="220" width="598" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="82" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">inclusionAI/Duo (arXiv:2611.15131)：Intent 与 Realization 统一时间线全双工</text>
  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 为什么传统多模态只能“你说一句我答一句”？缺乏在持续视听流中自主决定何时插话/倾听的自回归大脑</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 三大核心设计：自回归持续参与决策 (`Intent`) + 跨模块分块因果掩码统一时间线 + 双重 Rollout 蒸馏消除分布偏移</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 开箱即用实时流式分支：同步开源 `vLLM-Omni` 与 `SGLang-Omni` 加速分支及 4 款基座/蒸馏/量化权重</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 赋予数字人与具身机器人真正自然的实时打断与视听共生交互能力</text>

  <rect x="66" y="380" width="598" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
  <text x="82" y="404" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">Maverick720/Focus-KV：模型的数学推理能力高度集中在极少数 Attention 头！</text>
  <text x="82" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 关键发现：在 Qwen3-8B / 14B 上因果消融发现，禁用极少数推理关键头会让 MATH-500 准确率暴跌且废话词元暴增</text>
  <text x="82" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 静态非均匀预算分配：离线在推理探针集上测出各头重要性，在固定总预算 (如 4096) 下给推理头倾斜更多容量</text>
  <text x="82" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 保底与封顶双重护栏：设统一保底比例 ρ 与上限倍数 κ，既喂饱推理头又保住普通头的基础语法功能</text>
  <text x="82" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 解码期零动态重算开销，直接提升长链思维推理在受限显存下的准确率</text>

