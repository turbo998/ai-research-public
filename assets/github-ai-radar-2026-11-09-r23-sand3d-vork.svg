    <text x="30" y="144" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">• Eliminates LLM vertex-index &amp; coordinate hallucinations</text>

    <rect x="18" y="172" width="329" height="96" rx="8" fill="#0F172A" stroke="#9333EA" stroke-width="1"/>
    <text x="30" y="192" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="12" font-weight="700">2x to 6x Token Compression &amp; 3.6K Full API Spec</text>
    <text x="30" y="212" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• 4.0x fewer tokens than raw Blender Python (bpy)</text>
    <text x="30" y="230" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• 2.3x fewer than CadQuery; 6.0x fewer than FeatureScript</text>
    <text x="30" y="248" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">• Entire API fits in ~3,600 tokens (llms.txt) in one prompt</text>

    <rect x="18" y="280" width="329" height="94" rx="8" fill="#0F172A" stroke="#9333EA" stroke-width="1"/>
    <text x="30" y="300" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Bit-for-Bit Deterministic Mesh &amp; LTS Matrix</text>
    <text x="30" y="320" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Same Python program builds identical mesh bit-for-bit</text>
    <text x="30" y="338" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Pins Python 3.11 (bpy 4.5 LTS) &amp; Python 3.13 (bpy 5.2 LTS)</text>
    <text x="30" y="356" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">• Apache-2.0 open source w/ Hugging Face datasets</text>
