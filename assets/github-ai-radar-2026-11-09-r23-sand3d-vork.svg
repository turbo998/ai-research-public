    <text x="30" y="144" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">• Two-stage profiles: --profile std/draft → std/final</text>

    <rect x="18" y="172" width="329" height="96" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
    <text x="30" y="192" fill="#7DD3FC" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Patched wgpu on Vulkan &amp; Metal (Cargo.toml)</text>
    <text x="30" y="212" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Vendor wgpu returns Device::poll loss as error (no panic)</text>
    <text x="30" y="230" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Preserves invariant positions in Metal passthrough shaders</text>
    <text x="30" y="248" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">• Bounds OpenEXR DWA chunk sizes before memory allocation</text>

    <rect x="18" y="280" width="329" height="94" rx="8" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
