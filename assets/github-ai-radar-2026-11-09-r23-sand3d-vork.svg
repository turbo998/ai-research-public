    <rect x="0" y="0" width="365" height="390" rx="12" fill="url(#sdGrad)" stroke="#A855F7" stroke-width="1.5"/>
    <text x="20" y="32" fill="#C084FC" font-family="system-ui, sans-serif" font-size="15" font-weight="800">1. Sandflow-ai/sand3d (1,603★ · 267★/d)</text>
