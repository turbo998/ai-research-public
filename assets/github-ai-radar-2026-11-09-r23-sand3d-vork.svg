    <text x="30" y="88" fill="#D8B4FE" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Named Topological Addressing (Zero Index Math)</text>
    <text x="30" y="108" fill="#E2E8F0" font-family="system-ui, sans-serif" font-size="11">• Primitives: profiles, solids, edits, frames, joints, assemblies</text>
