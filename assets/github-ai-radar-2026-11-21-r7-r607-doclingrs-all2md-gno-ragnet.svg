<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bgR607" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentR607" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgR607)" rx="16"/>
  <rect x="24" y="20" width="1152" height="92" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="5" rx="2" fill="url(#accentR607)"/>
  <text x="44" y="56" fill="#f8fafc" font-size="20.5" font-weight="800">2026-11-21 Day R7 (R607): Official Rust Docling, 40+ Format Bidirectional all2md MCP, GNO Hybrid KB &amp; Rag.NET 10</text>
  <text x="44" y="82" fill="#94a3b8" font-size="13.5" font-weight="500">docling-project/docling.rs (★142) + thomas-villani/all2md (★34) + gmickel/gno (★117) + MarcelRoozekrans/Rag.NET (★21)</text>
  <text x="44" y="101" fill="#38bdf8" font-size="12.5" font-weight="600">4.3x Faster PDF &amp; 0.94 Table Recall (0 PyTorch) · 40+ Format Bidirectional Markdown MCP · 6-Surface Hybrid KB · 74-Pkg .NET 10 RAG</text>

  <rect x="24" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="162" fill="#38bdf8" font-size="16" font-weight="800">1. docling-project/docling.rs</text>
  <text x="42" y="184" fill="#94a3b8" font-size="12">★ 142 · 41 forks · Rust · MIT</text>
  <text x="42" y="214" fill="#f8fafc" font-size="13" font-weight="700">Official Rust Port of Docling</text>
  <text x="42" y="240" fill="#cbd5e1" font-size="12">• Single static binary (0 Python/PyTorch)</text>
  <text x="42" y="264" fill="#cbd5e1" font-size="12">• PDF 4.3x faster at &lt;50% RAM usage</text>
  <text x="42" y="288" fill="#cbd5e1" font-size="12">• Office &amp; HTML 20-60x faster</text>
  <text x="42" y="312" fill="#cbd5e1" font-size="12">• 0.94 table cell recall (vs 0.31)</text>
  <text x="42" y="336" fill="#cbd5e1" font-size="12">• Byte-for-byte parity with IBM Docling</text>
  <text x="42" y="360" fill="#cbd5e1" font-size="12">• Drop-in MarkItDown &amp; Marker shims</text>
  <text x="42" y="384" fill="#cbd5e1" font-size="12">• Crates.io, PyPI (docling-rs) &amp; npm</text>
  <text x="42" y="408" fill="#38bdf8" font-size="12" font-weight="600">Layout Analysis + Table + OCR</text>

  <rect x="316" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
  <text x="334" y="162" fill="#34d399" font-size="16" font-weight="800">2. thomas-villani/all2md</text>
  <text x="334" y="184" fill="#94a3b8" font-size="12">★ 34 · 5 forks · Python · MIT</text>
  <text x="334" y="214" fill="#f8fafc" font-size="13" font-weight="700">Bidirectional 40+ Format MCP</text>
  <text x="334" y="240" fill="#cbd5e1" font-size="12">• PDF, DOCX, PPTX, HTML, EPUB, Email</text>
  <text x="334" y="264" fill="#cbd5e1" font-size="12">• 40+ formats to Markdown AND back</text>
  <text x="334" y="288" fill="#cbd5e1" font-size="12">• rcat terminal reader &amp; all2md CLI</text>
  <text x="334" y="312" fill="#cbd5e1" font-size="12">• Built-in all2md-mcp server for agents</text>
  <text x="334" y="336" fill="#cbd5e1" font-size="12">• Search &amp; chunk pipelines for RAG</text>
  <text x="334" y="360" fill="#cbd5e1" font-size="12">• GitHub Action document quality gate</text>
  <text x="334" y="384" fill="#cbd5e1" font-size="12">• Zero-install uvx execution support</text>
  <text x="334" y="408" fill="#34d399" font-size="12" font-weight="600">Round-Trip Markdown Conversion</text>

  <rect x="608" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="626" y="162" fill="#a78bfa" font-size="16" font-weight="800">3. gmickel/gno</text>
  <text x="626" y="184" fill="#94a3b8" font-size="12">★ 117 · 13 forks · TypeScript · MIT</text>
  <text x="626" y="214" fill="#f8fafc" font-size="13" font-weight="700">6-Interface Local Knowledge Engine</text>
  <text x="626" y="240" fill="#cbd5e1" font-size="12">• Indexes notes, code, PDFs, Office, mail</text>
  <text x="626" y="264" fill="#cbd5e1" font-size="12">• BM25 + Vector + Reranked Hybrid search</text>
  <text x="626" y="288" fill="#cbd5e1" font-size="12">• Typed metadata filters (confidence/status)</text>
  <text x="626" y="312" fill="#cbd5e1" font-size="12">• 6 synced surfaces: CLI/Web/REST/SDK/MCP</text>
  <text x="626" y="336" fill="#cbd5e1" font-size="12">• gno agents install/verify across 10 IDEs</text>
  <text x="626" y="360" fill="#cbd5e1" font-size="12">• Browsable graph + Markdown editor</text>
  <text x="626" y="384" fill="#cbd5e1" font-size="12">• Passage-level cited LLM answers</text>
  <text x="626" y="408" fill="#a78bfa" font-size="12" font-weight="600">No GPU · No Account · Zero Telemetry</text>

  <rect x="900" y="130" width="276" height="390" rx="12" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="918" y="162" fill="#fbbf24" font-size="16" font-weight="800">4. MarcelRoozekrans/Rag.NET</text>
  <text x="918" y="184" fill="#94a3b8" font-size="12">★ 21 · 3 forks · C# / .NET 10 · MIT</text>
  <text x="918" y="214" fill="#f8fafc" font-size="13" font-weight="700">.NET 10 Modular RAG (74 Pkgs)</text>
  <text x="918" y="240" fill="#cbd5e1" font-size="12">• Built on Microsoft.Extensions.AI</text>
  <text x="918" y="264" fill="#cbd5e1" font-size="12">• 74 modular NuGet packages</text>
  <text x="918" y="288" fill="#cbd5e1" font-size="12">• 7 vector stores (Azure AI Search/pgvector)</text>
  <text x="918" y="312" fill="#cbd5e1" font-size="12">• 18 connectors (M365, Jira, Confluence)</text>
  <text x="918" y="336" fill="#cbd5e1" font-size="12">• GraphRAG + RAPTOR tree retrieval</text>
  <text x="918" y="360" fill="#cbd5e1" font-size="12">• Lost-in-the-Middle context reordering</text>
  <text x="918" y="384" fill="#cbd5e1" font-size="12">• Token-aware chunking &amp; streaming chat</text>
  <text x="918" y="408" fill="#fbbf24" font-size="12" font-weight="600">Enterprise C# / .NET 10 Native</text>

  <rect x="24" y="540" width="1152" height="116" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="572" fill="#f8fafc" font-size="15.5" font-weight="800">Closed-Form Enterprise FinOps TCO Benchmark (45-Engineer Team @ $100/h · synthetic, independently_reproduced=false)</text>
  <text x="44" y="600" fill="#cbd5e1" font-size="13">• Path A (Per-Page Cloud OCR API + Heavy PyTorch Parsing Fleet + Custom .NET RAG Glue): $3,320.00 SaaS + 41.5h ($4,150.00) = $7,470.00/mo</text>
  <text x="44" y="624" fill="#34d399" font-size="13.5" font-weight="700">• Path C (Hybrid Cloud Control + docling.rs + all2md + GNO + Rag.NET): $70.00 Compute + 2.4h ($240.00) = $310.00/mo ➔ Saves $7,160.00/mo (-95.85%)</text>
  <text x="44" y="646" fill="#94a3b8" font-size="11">Audit Constants: Path A $3,320.00 + 41.5h ($4,150.00) = $7,470.00/mo ➔ Path C $70.00 + 2.4h ($240.00) = $310.00/mo (-$7,160.00/mo · -95.85% · base_hardware_capex = not_measured)</text>
</svg>
