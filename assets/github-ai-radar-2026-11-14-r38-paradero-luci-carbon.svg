  <!-- Header -->
  <rect x="28" y="22" width="1144" height="92" rx="14" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <rect x="44" y="38" width="232" height="26" rx="6" fill="url(#accentCyan221)"/>
  <text x="160" y="56" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2026-11-14 · DAYTIME R38 (R221)</text>
  <text x="292" y="57" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Paradero Honest Civic Telemetry &amp; luci-theme-carbon 9,200-OUI OpenWrt Dashboard</text>
  <text x="44" y="92" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">croma-labs/paradero (★ 108 · Split SITP Codes · 1-Block Privacy · WCAG 2.2 AA/AAA) + mrjoechen/luci-theme-carbon (★ 103 · DHCP+WiFi+ARP MAC Merge · 9.2k OUI)</text>

  <!-- Left Panel: Paradero -->
  <rect x="28" y="130" width="560" height="390" rx="14" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
  <rect x="46" y="148" width="524" height="40" rx="8" fill="#064E3B"/>
  <text x="62" y="173" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. croma-labs/paradero — Digital Public Good Transit Telemetry</text>

  <rect x="46" y="202" width="252" height="145" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="60" y="224" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Feed Normalization &amp; Honesty</text>
  <text x="60" y="246" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Splits Paired SITP Codes (`HK635` ➔ `K635`)</text>
  <text x="60" y="266" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Explicit Live GPS vs Schedule Badge</text>
  <text x="60" y="286" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Never Draws Stale Buses as Live</text>
  <text x="60" y="306" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Multi-Route Stop Map + Route Filter</text>
  <text x="60" y="326" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• MIT Licensed Digital Public Good</text>

  <rect x="314" y="202" width="256" height="145" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="328" y="224" fill="#A78BFA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Privacy &amp; WCAG 2.2 AA/AAA</text>
  <text x="328" y="246" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 1-Block Outbound Location Rounding</text>
  <text x="328" y="266" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 0 Accounts, 0 Ads, 0 Background Sync</text>
  <text x="328" y="286" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• WCAG 2.2 AA + High-Contrast AAA</text>
  <text x="328" y="306" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Dynamic Font Reflow (Zero Truncation)</text>
  <text x="328" y="326" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Full Sentence VoiceOver / TalkBack</text>

  <rect x="46" y="361" width="524" height="142" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="62" y="384" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Three Real-Time Telemetry Design Laws from 150+ Rider Reports</text>
  <text x="62" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Normalize upstream schema quirks (paired route codes) at ingestion so search matches human labels.</text>
  <text x="62" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. Never interpolate stale telemetry as "live"—explicitly flag feed brownouts vs. schedule fallback.</text>
  <text x="62" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Quantize client coordinates to 1 block on-device to achieve zero-PII proximity queries.</text>
  <text x="62" y="481" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Enforce Telemetry Honesty + 1-Block Coordinate Quantization in all geo/fleet apps.</text>

  <!-- Right Panel: luci-theme-carbon -->
  <rect x="612" y="130" width="560" height="390" rx="14" fill="#0F172A" stroke="#3B82F6" stroke-width="1.5"/>
  <rect x="630" y="148" width="524" height="40" rx="8" fill="#1E3A8A"/>
  <text x="646" y="173" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">2. mrjoechen/luci-theme-carbon — MAC-Merged OpenWrt Control Plane</text>

  <rect x="630" y="202" width="252" height="145" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="644" y="224" fill="#60A5FA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Tri-Source MAC Device Merge</text>
  <text x="644" y="246" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Merges DHCPv4/v6 + Wi-Fi + IPv4 ARP</text>
  <text x="644" y="266" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Works with Local DHCP Server Disabled</text>
  <text x="644" y="286" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• ~9,200 IEEE OUI Prefixes (35 Brands)</text>
  <text x="644" y="306" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Separates Gateway / Lease / Neighbor</text>
  <text x="644" y="326" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Avoids False "Static IP" Assumption</text>

  <rect x="898" y="202" width="256" height="145" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="912" y="224" fill="#F472B6" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Polling Suspension &amp; Security</text>
  <text x="912" y="246" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Collapsed Widgets Stop Polling</text>
  <text x="912" y="266" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Simple (7 Pages) vs Pro Navigation</text>
  <text x="912" y="286" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Rejects SVGs with Embedded Scripts</text>
  <text x="912" y="306" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• APK Signature + Size + SHA-256 OTA</text>
  <text x="912" y="326" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 13 Built-In Languages + Arch-Neutral</text>

  <rect x="630" y="361" width="524" height="142" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="646" y="384" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Solving AP-Mode Blindness &amp; Embedded Web UI Polling Overhead</text>
  <text x="646" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Standard OpenWrt dashboards go blind when running as a dumb AP (DHCP disabled); Carbon merges ARP+Wi-Fi.</text>
  <text x="646" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. Collapsing legacy status tables halts their background RPC timers, saving weak MIPS/ARM router CPU.</text>
  <text x="646" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Blocks stored-XSS via custom SVG logo upload sanitization and verifies SHA-256 + APK signatures on update.</text>
  <text x="646" y="481" fill="#93C5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Deploy `luci-theme-carbon` across edge OpenWrt routers &amp; APs for unified OUI visibility.</text>

