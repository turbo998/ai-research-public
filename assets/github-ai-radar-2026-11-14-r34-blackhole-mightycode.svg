  <text x="644" y="306" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Full Streaming &amp; Tool-Call Translation</text>
  <text x="644" y="326" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Zero Anthropic Account / Zero API Key</text>

  <rect x="898" y="202" width="256" height="145" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="912" y="224" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">EoCC Compaction &amp; `guard.py`</text>
  <text x="912" y="246" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Built-in EoCC Context Compaction</text>
  <text x="912" y="266" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Prevents 9B Context Window Collapse</text>
  <text x="912" y="286" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• `guard.py` Pre-Execution Tool Inspector</text>
  <text x="912" y="306" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Blocks Credential &amp; Exfiltration Calls</text>
  <text x="912" y="326" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Intercepts Persistence &amp; Destructive Cmds</text>

  <rect x="630" y="361" width="524" height="142" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="646" y="384" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Why Uncensored Local Models REQUIRE `guard.py` + EoCC Compaction</text>
  <text x="646" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Small 9B/4-bit local models degrade rapidly once Claude Code's tool output exceeds 16K–32K tokens.</text>
  <text x="646" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. `anthropic_proxy.py` performs EoCC compaction in-flight and inspects every tool call via `guard.py`.</text>
  <text x="646" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. `guard.py` deterministically blocks curl exfiltration, `~/.ssh` reads, cron persistence, and `rm -rf`.</text>
  <text x="646" y="481" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Pair `blackhole` container isolation with `mightyCode`'s `guard.py` + EoCC proxy for airgapped dev.</text>

