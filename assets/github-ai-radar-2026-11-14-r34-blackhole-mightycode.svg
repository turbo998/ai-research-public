  <text x="62" y="173" fill="#F472B6" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. tommy0103/blackhole — Ephemeral Fail-Close Container for Claude Code</text>

  <rect x="46" y="202" width="252" height="145" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="60" y="224" fill="#F472B6" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Filesystem &amp; Fingerprint Isolation</text>
  <text x="60" y="246" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Zero Host Install (`~/.local/bin/claude`)</text>
  <text x="60" y="266" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Mounts Only `$PWD` at `/workspace`</text>
  <text x="60" y="286" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Blocks `$HOME`, `~/.ssh` &amp; Docker Socket</text>
  <text x="60" y="306" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Masks Hostname (`--hostname blackhole`)</text>
  <text x="60" y="326" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Strict Env Allowlist (`TERM`/`COLORTERM`)</text>

  <rect x="314" y="202" width="256" height="145" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="328" y="224" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Fail-Close Egress &amp; UX Continuity</text>
  <text x="328" y="246" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• `net-watch` Proxy Drop Kill-Switch</text>
  <text x="328" y="266" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• `net ipv6 off` + Guest `iptables` Airgap</text>
  <text x="328" y="286" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Persistent Volume (`blackhole-claude-home`)</text>
  <text x="328" y="306" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Read-Only `$TMPDIR` Clipboard Passthrough</text>
  <text x="328" y="326" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Magenta `⬤ BLACKHOLE` Status Badge</text>

  <rect x="46" y="361" width="524" height="142" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="62" y="384" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Why Running `claude` Directly on Host macOS/Linux Risks Credentials &amp; Telemetry</text>
  <text x="62" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Host-installed agents can read `~/.ssh`, `~/.aws`, sibling repos, and leak macOS hardware UUIDs.</text>
  <text x="62" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. If a host TUN/VPN proxy drops mid-session, standard containers silently fall back to direct egress IP.</text>
  <text x="62" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Blackhole's `net-watch` + heartbeat guard immediately severs VM egress when the proxy tunnel drops.</text>
  <text x="62" y="481" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Wrap host `claude` invocations in Blackhole `$PWD` containers with persistent profile volumes.</text>

