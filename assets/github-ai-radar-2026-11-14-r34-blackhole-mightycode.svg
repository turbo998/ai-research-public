  <text x="292" y="57" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Blackhole Fail-Close Claude Code Sandbox &amp; mightyCode Local 4-Bit MLX Proxy</text>
  <text x="44" y="92" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">tommy0103/blackhole (★ 108 · $PWD-Only Colima/Docker VM + net-watch Kill-Switch) + shi3z/mightyCode (★ 105 · 4.7GB MLX 4-Bit + EoCC + guard.py)</text>

  <!-- Left Panel: tommy0103/blackhole -->
