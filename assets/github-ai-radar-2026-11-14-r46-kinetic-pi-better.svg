  <text x="646" y="173" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">2. nicobailon/pi-better — Repo-Grounded 4-Question "Depth" Prompt Rewriter</text>

  <rect x="630" y="202" width="252" height="145" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="644" y="224" fill="#A78BFA" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Felix Rieseberg Depth Protocol</text>
  <text x="644" y="246" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Q1: What Top Pro Does Unasked</text>
  <text x="644" y="266" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Q2: Rawest Material (`file:line`, logs)</text>
  <text x="644" y="286" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Q3: Exact Methods &amp; Tools in Repo</text>
  <text x="644" y="306" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Q4: External Non-LLM Verification Check</text>
  <text x="644" y="326" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Deeper Task, Not a Bloated Bigger Task</text>

  <rect x="898" y="202" width="256" height="145" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="912" y="224" fill="#F472B6" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Read-Only Helper &amp; Subagents</text>
  <text x="912" y="246" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Background Read-Only Repo Scout</text>
  <text x="912" y="266" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Cites Exact Lines (`index.ts:171, 215`)</text>
  <text x="912" y="286" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Writes Result into Input Box for Review</text>
  <text x="912" y="306" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Never Mutates Files During `/better`</text>
  <text x="912" y="326" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Grounds `pi-subagents` Task Handoffs</text>

  <rect x="630" y="361" width="524" height="142" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="646" y="384" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Why Un-Grounded Prompt Enhancers Fail (And Why Read-First `/better` Works)</text>
  <text x="646" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Blind prompt rewriters just inflate adjectives from chat summaries and let the LLM grade itself.</text>
  <text x="646" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. `pi-better` reads actual files, stderr paths, and tests first (~44s), citing exact `file:line` targets.</text>
  <text x="646" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Stages the grounded prompt in your input box (or subagent brief) with an external test criterion.</text>
  <text x="646" y="481" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Pre-ground vague human prompts &amp; subagent delegations with `/better` read-only scouting.</text>

