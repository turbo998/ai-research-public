  <text x="160" y="56" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle">2026-11-14 · DAYTIME R46 (R229)</text>
  <text x="292" y="57" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="700">Kinetic Exact Multi-GPU Rust GGUF Engine &amp; pi-better Repo-Grounded Depth Rewriter</text>
  <text x="44" y="92" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13">Veloresearch/kinetic (★ 89 · 1-Binary NVIDIA/AMD/Intel GGUF · 2.5x Cold Edit · Exact Output) + nicobailon/pi-better (★ 86 · Read-Only Repo-Grounded /better Prompt)</text>

  <!-- Left Panel: Veloresearch/kinetic -->
  <rect x="28" y="130" width="560" height="390" rx="14" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5"/>
  <rect x="46" y="148" width="524" height="40" rx="8" fill="#451A03"/>
  <text x="62" y="173" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">1. Veloresearch/kinetic — Exact Multi-Vendor GPU Rust GGUF Engine</text>

  <rect x="46" y="202" width="252" height="145" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="60" y="224" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1-Binary Multi-Vendor GPU</text>
  <text x="60" y="246" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Pure Rust · Apache-2.0 Open Source</text>
  <text x="60" y="266" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Reads Standard `llama.cpp` GGUF Files</text>
  <text x="60" y="286" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• CPU + NVIDIA, AMD &amp; Intel GPUs in 1 Exe</text>
  <text x="60" y="306" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Zero-Drift Invariant: Exact Same Output</text>
  <text x="60" y="326" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• OpenAI-Compatible Local HTTP Server</text>

  <rect x="314" y="202" width="256" height="145" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="328" y="224" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Honest Cold vs Warm Metrics</text>
  <text x="328" y="246" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• First-Run Cold Edit: Up to 2.5x vs llama.cpp</text>
  <text x="328" y="266" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• First-Run Generation: Up to 1.4x Faster</text>
  <text x="328" y="286" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Discloses Warm-Cache Edit Reuse Explicitly</text>
  <text x="328" y="306" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Logs Unsloth UD Quant CPU Fallback (#1)</text>
  <text x="328" y="326" fill="#F472B6" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Tracks Thinking + Tool-Call Parsing Edge</text>

  <rect x="46" y="361" width="524" height="142" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="62" y="384" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Why Exactness Verification &amp; Cold-Cache Separation Matter in Local Engines</text>
  <text x="62" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Approximate kernel optimizations often silently degrade coding agent tool-call accuracy.</text>
  <text x="62" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. `Kinetic` enforces bit/token-level output exactness while unifying NVIDIA/AMD/Intel in one binary.</text>
  <text x="62" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Separates cold first-run speedups (`2.5x` edit / `1.4x` gen) from warm prompt-cache reuse.</text>
  <text x="62" y="481" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Use `Kinetic` for single-binary cross-vendor GGUF deployment; avoid UD quants on GPU until Beta 2.</text>

  <!-- Right Panel: nicobailon/pi-better -->
  <rect x="612" y="130" width="560" height="390" rx="14" fill="#0F172A" stroke="#8B5CF6" stroke-width="1.5"/>
