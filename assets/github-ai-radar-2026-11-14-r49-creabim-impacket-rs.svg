  <text x="646" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Python Impacket breaks on modern OpenSSL 3.x disables (RC4/MD4) and pays 200ms startup per host.</text>
  <text x="646" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. `impacket-rs` ships self-contained constant-time crypto and boots in &lt;2ms for 10,000-host AD audits.</text>
  <text x="646" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Compile-time NDR layout checks achieve 5.85M wire roundtrips/sec with zero heap allocation.</text>
  <text x="646" y="481" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Replace Python Impacket virtualenvs in SecOps automation with static `impacket-rs`.</text>

