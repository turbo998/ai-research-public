  <text x="62" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Legacy BIM suites (Revit/Archicad) have rigid UIs and cost $2,500+/yr, while Blender lacks 2D BIM sheets.</text>
  <text x="62" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. `CreaBIM` combines `G/R/S` vertex/edge/face editing with live-synced plans, sections, quantities, and IFC4.</text>
  <text x="62" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Explicitly documents current prototype gaps (`KNOWN_GAPS.md`) before production permit use.</text>
  <text x="62" y="481" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Use `CreaBIM` for offline IFC4/BIM prototyping and Blender-ergonomic architectural massing.</text>

