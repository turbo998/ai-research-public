  <text x="62" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. OEM control suites install 1–2 GB of background services, telemetry daemons, and ad popups.</text>
  <text x="62" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. Single-brand tools (`G-Helper`, `LegionToolkit`) only work on 1 OEM; `Fanatic` abstracts all 8 OEMs.</text>
  <text x="62" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Enforces monotonic fan-curve safety invariants before writing to EC registers.</text>
