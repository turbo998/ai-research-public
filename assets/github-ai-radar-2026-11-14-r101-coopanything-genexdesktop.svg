  <text x="646" y="295" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Mixes Claude Opus, GPT models &amp; local LLMs across specialized agent roles</text>
  <text x="646" y="314" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Reuses existing Claude Code or ChatGPT subscriptions without extra API keys</text>

  <text x="632" y="346" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">3. Integrated Local Blender Plugin &amp; 3D/Audio Tools Router</text>
  <text x="646" y="367" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Generates 3D meshes locally via Blender plugin or routes to Meshy &amp; Tripo</text>
