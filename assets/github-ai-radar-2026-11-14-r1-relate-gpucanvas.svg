  <text x="60" y="280" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">Why `relate` Is the Ideal Graph Store for Local &amp; Edge AI Agents:</text>
  <text x="60" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. In-Process Zero-IPC Execution: Runs in-process via PyO3 (`pip install relate-db`), native</text>
  <text x="60" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   Node bindings (`@relate/relate`), or browser WASM (`@relate/relate-wasm`) with Cypher 25.</text>
  <text x="60" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Auto-Installed Agent Skill Bundle: `relate skill install` injects CLI, Cypher, vector &amp;</text>
  <text x="60" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   spatial references into Claude Code, Cursor, Codex, Gemini CLI, Copilot &amp; Windsurf.</text>
  <text x="60" y="387" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">$ relate skill install &amp;&amp; relate --json ./friends "MATCH (p:Person) RETURN p.name"</text>
  <text x="60" y="409" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Fail-Closed SSHSIG Supply-Chain Security: Verifies `SHA256SUMS` via pinned `ssh-keygen` key</text>
  <text x="60" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">   (`ADR-0115`), static Windows CRT (`ADR-0587`), and honest scope (`docs/limitations.md`).</text>

