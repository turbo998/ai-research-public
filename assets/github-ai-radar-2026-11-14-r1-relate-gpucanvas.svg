  <!-- GpuCanvas Mechanics -->
  <rect x="632" y="258" width="522" height="192" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="646" y="280" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">How `gpucanvas` Keeps 5,000 DOM Nodes Interactive at 60 FPS:</text>
  <text x="646" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. WebGPU + HTML-in-Canvas GPU Atlas: Snapshots live React/DOM nodes into a GPU texture atlas</text>
  <text x="646" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   and draws all 5,000 screens in a single instanced pass while preserving real DOM clicks/inputs.</text>
  <text x="646" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. First-Class Agent View &amp; Pixel Diffs: `agentView` exports visible nodes as a compact JSON</text>
  <text x="646" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   tree with IDs, region snapshots, version filmstrips, pixel diffs, arrows &amp; comment pins.</text>
  <text x="646" y="387" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">import { GpuCanvas, CanvasNode } from 'gpucanvas/react'; // + bindEditor(canvas)</text>
  <text x="646" y="409" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. WGSL Live Shaders &amp; Graceful Fallback: Runs glass, shockwave, frost &amp; wipe transitions on</text>
  <text x="646" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">   live components; automatically falls back to CSS transforms (1,000 desktop / 250 mobile nodes).</text>

