  <text x="62" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Nearly 50% of default file-reading turns read only 1 file; each extra turn adds 10–20s of LLM thinking.</text>
  <text x="62" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. `rg`, `find`, and shell chains (`&&`, `;`) miss the desktop allowlist and block 2–3s on cloud review.</text>
  <text x="62" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. The 800-line `read_file` limit only truncates ~2% of reads—turn count &amp; output length are the real killers!</text>
  <text x="62" y="481" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Embed `agy-fast-io`'s 4 I/O batching &amp; allowlist rules into every team `AGENTS.md` / `CLAUDE.md`.</text>

