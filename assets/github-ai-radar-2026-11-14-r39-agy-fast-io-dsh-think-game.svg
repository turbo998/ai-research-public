  <text x="646" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. When DeepSeek/Claude/o3 thinks for 30–90s, developers alt-tab to social feeds and lose 10+ mins.</text>
  <text x="646" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. `dsh-think-game` keeps eyes in the chat viewport during thinking and auto-pauses when output starts.</text>
  <text x="646" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Ships with a deterministic debug harness recording the full `send ➔ think ➔ play ➔ auto-pause` flow.</text>
  <text x="646" y="481" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Pair `agy-fast-io` latency reduction with `dsh-think-game` auto-pausing micro-interactions.</text>

