  <!-- ai-texture-forge Mechanics -->
  <rect x="632" y="258" width="522" height="192" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="646" y="280" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">How `ai-texture-forge` Eliminates External Texture Hunting &amp; Manual UV Seam Stitching:</text>
  <text x="646" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Direct Shader-Node Wiring in Viewport (`3D Viewport → N`): Generates tileable PBR materials</text>
  <text x="646" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   and automatically connects Color, Roughness, and Normal maps to Blender's shader graph.</text>
  <text x="646" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Depth-Aware Scene Projection (`Depth strength = 0.6`): Paints entire blockout environments</text>
  <text x="646" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   in a single depth-to-image pass, with inpaint/outpaint seam repair and 4× AI upscaling.</text>
  <text x="646" y="387" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">Prompt ("weathered copper, seamless") → Local GPU / Cloud Diffusion → Auto PBR Nodes</text>
  <text x="646" y="409" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Compositor Render-Pass Restyling &amp; Recallable History: Blends Cycles renders (`0.5` mix)</text>
  <text x="646" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">   with diffusion restyling and persists every generation in an exportable history store.</text>

