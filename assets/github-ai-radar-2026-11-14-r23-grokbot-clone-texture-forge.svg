  <text x="60" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. 4-in-1 Orgo VM Multiplexing: Up to 4 distinct Bots share a single Orgo Linux VM with</text>
  <text x="60" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   independent desktops, live browser/shell streaming, human takeover, and idle sleep/wake.</text>
  <text x="60" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Read-vs-Write Composio Gate: Connects SaaS tools via Composio—read actions execute</text>
  <text x="60" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   automatically while write actions pause for explicit user approval (with a remember option).</text>
  <text x="60" y="387" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">$ npm ci &amp;&amp; npm run dev -w server &amp;&amp; npm run dev -w web   # Node 22.22+ · SQLite</text>
  <text x="60" y="409" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Voice + Proactive Routines: Combines `grok-4.7` text/voice calls, `@mention` group</text>
  <text x="60" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">   delegation, context compaction, and event-triggered schedules in a local SQLite database.</text>

