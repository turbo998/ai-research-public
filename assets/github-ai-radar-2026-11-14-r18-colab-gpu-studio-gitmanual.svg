  <rect x="46" y="258" width="522" height="192" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="60" y="280" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">How `colab-gpu-studio` Stops Google Colab Compute Units (`CU`) from Burning Idle:</text>
  <text x="60" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. VPS Control Plane + Ephemeral GPU Data Plane: Mobile React UI, FastAPI queue, and SQLite</text>
  <text x="60" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   WAL (`30s` lock timeout) run on a cheap VPS/Termux using zero GPU until "Generate" is tapped.</text>
  <text x="60" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Verified Lease Lifecycle (`v0.3.1`): Provisions Colab GPU (smoke-tested on NVIDIA L4),</text>
  <text x="60" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   logs actual `nvidia-smi` SKU, pulls ComfyUI image/H3 video outputs, and releases runtime.</text>
  <text x="60" y="387" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">Tap Generate → Allocate Colab L4 → Run ComfyUI/H3 → Pull Artifact → Destroy Runtime</text>
  <text x="60" y="409" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Hardened Lease State Machine: Distinguishes `NO_RUNTIMES` capacity shortages from errors</text>
  <text x="60" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">   and immediately transitions pre-runtime failures to `released` without stuck leases.</text>

