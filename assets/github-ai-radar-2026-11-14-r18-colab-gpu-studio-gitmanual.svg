  <!-- gitmanual Mechanics -->
  <rect x="632" y="258" width="522" height="192" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="646" y="280" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">How `gitmanual` Turns Any GitHub URL into a Safe, Re-Runnable Setup Guide:</text>
  <text x="646" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Zero-Clone Manifest Inspection: Makes 3 GitHub API calls + fetches only manifests, Docker,</text>
  <text x="646" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   CI, and `.env` files across 14 stacks—never cloning or executing untrusted code.</text>
  <text x="646" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Safe Idempotent Setup Scripts: Generates `/owner/repo/setup/{mac.sh,linux.sh,windows.ps1}`</text>
  <text x="646" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   that stop on first error, skip installed tools, and never auto-run commands needing user secrets.</text>
  <text x="646" y="387" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">$ claude mcp add --transport http gitmanual https://gitmanual.com/mcp</text>
  <text x="646" y="409" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Agent-Native MCP &amp; REST API: Exposes `get_setup_manual` and `get_setup_script` with zero</text>
  <text x="646" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">   login required, plus `/api/v1/manual?repo=owner/repo`, `/llms.txt`, and Chrome side-panel agent.</text>

