  <text x="72" y="165" fill="#BFDBFE" font-family="Segoe UI, Inter, sans-serif" font-size="15" font-weight="700">📉 microsoft/TokenEconomizer · Black-Box Cost Control</text>
  <text x="552" y="165" fill="#93C5FD" font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="end">★ 6,112 · Apache-2.0</text>

  <text x="56" y="202" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">1. Three Experience-Driven Waste-Elimination Mechanisms</text>
  <text x="70" y="223" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Micro-Skills (`k=3` sessions): remembers repo commands (`python -m pytest`)</text>
  <text x="70" y="242" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Tool Pruning (`p=10, m=2, s=5`) &amp; Loop Guard (`c=0.7, r=1` redirect)</text>

  <text x="56" y="274" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">2. Proven Across 30/30 SWE-Bench Repo × Model Cells</text>
  <text x="70" y="295" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Cuts mean cost by `18.4%–30.9%` while improving Pass@1 in 4 of 5 pairs</text>
  <text x="70" y="314" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• `-26.1%` cost / `+1.6` Pass@1 on Codex + GPT-5.6 Sol; `-30.9%` on Opus 4.8</text>

  <text x="56" y="346" fill="#E2E8F0" font-family="Segoe UI, Inter, sans-serif" font-size="13.5" font-weight="600">3. Drop-In Plugin for Claude Code, Codex, Copilot CLI &amp; Pi</text>
  <text x="70" y="367" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Works without modifying agent internals; experimental OpenCode/Cursor/Hermes</text>
  <text x="70" y="386" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="12.5">• Auto-drops contradicted micro-skills &amp; restores pruned tools in 1 command</text>

  <rect x="56" y="408" width="512" height="58" rx="8" fill="#1E293B" stroke="#3B82F6" stroke-width="1"/>
