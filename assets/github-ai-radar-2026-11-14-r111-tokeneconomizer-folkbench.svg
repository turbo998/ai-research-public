  <text x="168" y="59" fill="#090D16" font-family="Segoe UI, Inter, sans-serif" font-size="13" font-weight="800" text-anchor="middle">2026-11-14 · NIGHT R111 (R294)</text>
  <text x="300" y="60" fill="#F8FAFC" font-family="Segoe UI, Inter, sans-serif" font-size="19" font-weight="700">microsoft/TokenEconomizer (-30.9% Agent Cost Control) &amp; Folkbench (API Relay Arena &amp; Switch)</text>
  <text x="52" y="90" fill="#94A3B8" font-family="Segoe UI, Inter, sans-serif" font-size="13">microsoft/TokenEconomizer (★ 6,112 · Apache-2.0 · arXiv:2610.22732) + Folkbench/folkbench (★ 3,766 · Rust · Model Fingerprint Arena &amp; CLI Switch)</text>

  <!-- Left Card: microsoft/TokenEconomizer -->
  <rect x="36" y="124" width="552" height="360" rx="14" fill="#111827" stroke="#3B82F6" stroke-width="1.5"/>
