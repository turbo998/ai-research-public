  <text x="62" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Ordered modular `src/` files compile into a single `file://`-portable HTML artifact for LLM/human edits.</text>
  <text x="62" y="481" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Use `src/` ordered modules + `build.py` single-HTML compilation for zero-CDN 3D deliverables.</text>

