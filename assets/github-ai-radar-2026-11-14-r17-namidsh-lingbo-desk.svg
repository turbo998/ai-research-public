  <text x="60" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   agent loop itself are plugins (`class Xxx extends Service` + `static inject`) on one `Context` tree.</text>
  <text x="60" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Line-for-Line Behavioral Parity: Verified across 14 compatibility scenarios (`tests/compat.ts`)</text>
