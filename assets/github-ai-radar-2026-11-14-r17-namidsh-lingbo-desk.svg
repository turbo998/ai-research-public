  <text x="60" y="387" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">$ npm install &amp;&amp; API_KEY=sk-xxx npm start   # Zero build step on Node 22.18+</text>
  <text x="60" y="409" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Offline Mock or Live DeepSeek: Runs out of the box without an API key via `mock` plugin,</text>
  <text x="60" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">   paired with 7 deep-dive architecture chapters (`docs/01..07.md`).</text>

