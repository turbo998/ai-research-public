  <text x="60" y="341" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   swaps cold experts between SSD and RAM asynchronously.</text>
  <text x="60" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Cross-App Synthesis &amp; `team.md`: Searches Files, Mail, Calendar, Slack &amp; Docs locally;</text>
