  <text x="60" y="405" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Proactive Long-Term Memory: Remembers details across weeks and drafts ready-to-approve plans.</text>
  <text x="60" y="426" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">• 100% local data &amp; memory ownership on consumer Macs and PCs.</text>

