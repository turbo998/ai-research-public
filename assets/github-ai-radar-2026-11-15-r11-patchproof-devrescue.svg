  <text x="68" y="772" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">1. AI 生成的 Go 核心服务补丁合入前接入 PatchProof：用差分 Fuzz 捕获 CAS 可重放反例，并产出 Ed25519 签名的 SARIF/JSON 证据包。</text>
