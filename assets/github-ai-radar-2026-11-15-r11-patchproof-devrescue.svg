  <text x="68" y="208" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15" font-weight="bold">反例优先 (Counterexample-First) 的 Go 代码补丁离线可验证签名系统</text>
  <text x="68" y="236" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">• 六大验证引擎：analyze / impact / compile / regression / differential fuzz / native fuzz</text>
  <text x="68" y="262" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">• CAS 可重放反例：差分与 Fuzz 违例绑定内容寻址 (CAS) 输入与观测结果，一键精确复现</text>
  <text x="68" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">• Ed25519 + Merkle 离线验签报告：生成 JSON/Markdown/SARIF 报告，无需控制面即可离线核验</text>
  <text x="68" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">• 零沙盒凭证 Brokered IO + 世代围栏 (Generation Fencing) + 租户级 Hermetic 动作缓存</text>
