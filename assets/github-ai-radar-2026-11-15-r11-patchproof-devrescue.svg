  <text x="750" y="356" fill="#34D399" font-family="Consolas, monospace" font-size="12.5" font-weight="bold">DevRescue Privacy-Preserving Triage Pipeline:</text>
  <text x="750" y="382" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">1. Local Ingest: node bin/devrescue.js analyze build.log --json|--markdown</text>
  <text x="750" y="408" fill="#E2E8F0" font-family="Consolas, monospace" font-size="12">2. Redact &amp; Group: Signature matching + secret redaction + file:line pin</text>
  <text x="750" y="434" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">3. Environment Doctor: node bin/devrescue.js doctor . (.env ignore check)</text>
  <text x="750" y="460" fill="#F8FAFC" font-family="Consolas, monospace" font-size="12">4. Explicit Sync Only: Raw logs never leave host; reviewed report optional</text>

