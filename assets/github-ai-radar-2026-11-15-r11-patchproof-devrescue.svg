  <text x="732" y="236" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">• 确定性签名聚类与证据脱敏：从万行构建/运行/CI 日志中精准剥离故障签名与 file:line</text>
  <text x="732" y="262" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">• 零自动执行安全红线：仅生成待人工审阅的修复步骤与 .env 忽略建议，绝不越权执行 Shell</text>
  <text x="732" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">• 原始日志 100% 留本地：支持双日志对比 (Compare)，仅在人工确认后同步脱敏派生报告至 Azure</text>
  <text x="732" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">• 三态部署：零依赖 node bin/devrescue.js CLI + GitHub Action + GitHub Pages 静态工作台</text>
