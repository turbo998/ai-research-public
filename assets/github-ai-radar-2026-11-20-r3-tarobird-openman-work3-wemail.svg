  <text x="60" y="592" fill="#e2e8f0" font-family="ui-monospace, Consolas, monospace" font-size="12.5">• Path A (散装终端切换 + 高价云 Agent 席位 + 9 步手工 Worktree + 云 AI 邮箱): $3,060.00 (SaaS/Seats) + $4,000.00 (40.0h × $100) = $7,060.00 / mo</text>
  <text x="60" y="618" fill="#e2e8f0" font-family="ui-monospace, Consolas, monospace" font-size="12.5">• Path B (通用远程桌面 VNC + 自写 Shell 脚本 + 传统死板邮箱过滤规则):         $1,190.00 (VMs/API)    + $1,550.00 (15.5h × $100) = $2,740.00 / mo</text>
