  <rect x="430" y="630" width="572" height="22" rx="5" fill="#EF4444"/>
  <text x="1014" y="646" fill="#FCA5A5" font-family="Consolas, monospace" font-size="13" font-weight="bold">$5,720.00/mo ($1,870.00 quota/SaaS waste + 38.5h × $100 = $3,850.00)</text>

  <text x="68" y="682" fill="#F8FAFC" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path B (盲猜缓存过期时间 + 日历与活动记录脱节手动对齐)</text>
  <rect x="430" y="666" width="263" height="22" rx="5" fill="#F59E0B"/>
  <text x="705" y="682" fill="#FDE68A" font-family="Consolas, monospace" font-size="13" font-weight="bold">$2,630.00/mo ($880.00 waste + 17.5h × $100 = $1,750.00)</text>

  <text x="68" y="718" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path C (agy-capsule 3m/4m Guard + Focus App + Peeky)</text>
  <rect x="430" y="702" width="37" height="22" rx="5" fill="#10B981"/>
  <text x="479" y="718" fill="#6EE7B7" font-family="Consolas, monospace" font-size="13" font-weight="bold">$370.00/mo ($70.00 spend + 3.0h × $100 = $300.00) → 净省 $5,350.00/月 (-93.53% / 年省 $64,200.00)</text>

  <line x1="68" y1="740" x2="1332" y2="740" stroke="#334155"/>
  <text x="68" y="766" fill="#38BDF8" font-family="Consolas, monospace" font-size="13.5" font-weight="bold">🎯 ARCHITECTURAL TAKEAWAYS FOR MILESTONE R405 (PROMPT-CACHE TTL ALERTS &amp; AGENT-AWARE TIME CALENDARS):</text>
  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 长上下文编程最昂贵的隐形损耗是超过 4 分钟未发消息导致 KV Cache 失效重算，输入框旁必须配 3m/4m 变色倒计时 (agy-capsule)。</text>
  <text x="68" y="814" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 现代开发者工时日历必须原生解析本机 Claude Code 与 Codex 会话记录，支持拖拽真实活动条一键生成计费工时 (Focus)。</text>
  <text x="68" y="838" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• Windows 顶部通知、剪贴板与跨窗文件暂存可用 ~3MB 纯 Rust 灵动岛胶囊 (Peeky) 替代重型桌面美化套件。</text>
