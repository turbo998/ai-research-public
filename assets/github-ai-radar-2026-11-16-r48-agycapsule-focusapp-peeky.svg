  <text x="68" y="612" fill="#94A3B8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">工作负载：30 名工程师管理 256k/512k 长会话缓存 TTL、核对 Claude Code/Codex 计费工时与桌面文件中转（时薪 r = $100.00/hr；上游订阅费：not_measured）</text>

