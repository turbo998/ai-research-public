  <text x="60" y="592" fill="#e2e8f0" font-family="ui-monospace, Consolas, monospace" font-size="12.5">• Path A (盲目 grep 全仓消耗 + 商业 Reducto 按页计费 + 手工测 MCP 越权 + 多端重复配凭证): $2,680.00 (SaaS/API)  + $4,050.00 (40.5h × $100) = $6,730.00 / mo</text>
  <text x="60" y="618" fill="#e2e8f0" font-family="ui-monospace, Consolas, monospace" font-size="12.5">• Path B (商业代码索引 SaaS + 通用云 OCR + 手写网关脚本):                               $1,110.00 (SaaS)      + $1,500.00 (15.0h × $100) = $2,610.00 / mo</text>
  <text x="60" y="644" fill="#34d399" font-family="ui-monospace, Consolas, monospace" font-size="12.5" font-weight="700">• Path C (wingbox + ReadAnyDoc + mcp-attest + runelay):                                   $75.00 (API)       +   $260.00 ( 2.6h × $100) =   $335.00 / mo</text>
  <text x="60" y="668" fill="#38bdf8" font-family="ui-monospace, Consolas, monospace" font-size="12.5" font-weight="700">➔ Net Savings vs. Path A: $6,395.00 / mo (-95.02%) | Annual Savings: $76,740.00 / yr | Track B stars_today: not_measured</text>
