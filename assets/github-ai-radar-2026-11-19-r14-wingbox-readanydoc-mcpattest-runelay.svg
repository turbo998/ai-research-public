  <!-- 4 Pillar Boxes -->
  <rect x="40" y="112" width="545" height="190" rx="12" fill="#13223d" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="60" y="142" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15.5" font-weight="700">1. aileron-tech/wingbox (★23 · MIT · 9-Lang Code Graph MCP)</text>
  <text x="60" y="170" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 纯本地静态解析构建 9 语言代码图谱与改码前爆炸半径 (Blast Radius)</text>
  <text x="60" y="196" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 实测最高提速 5×、省 8.8× Token、每千次问答省 $484 且零漏改文件</text>
  <text x="60" y="222" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 原生支持 Claude Code / Codex / Gemini CLI / Cursor / GitHub Copilot</text>
  <text x="60" y="248" fill="#34d399" font-family="ui-monospace, Consolas, monospace" font-size="12">SA 选型：替代盲目全文 grep 的零外发本地代码架构导航仪</text>

  <rect x="615" y="112" width="545" height="190" rx="12" fill="#13223d" stroke="#10b981" stroke-width="1.5"/>
  <text x="635" y="142" fill="#10b981" font-family="system-ui, sans-serif" font-size="15.5" font-weight="700">2. arpitpatel25/ReadAnyDoc (★11 · Apache-2.0 · Reducto-Compatible)</text>
  <text x="635" y="170" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 开源 Reducto 兼容平替：用自有模型账号逐页视觉解析 PDF/扫描件/表单</text>
  <text x="635" y="196" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 输出带强类型区块、结构化表格与【每个字段值精确坐标引文】的数据</text>
  <text x="635" y="222" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 同时提供 Python 库、MCP Server 与 Reducto 兼容 HTTP API</text>
  <text x="635" y="248" fill="#34d399" font-family="ui-monospace, Consolas, monospace" font-size="12">SA 选型：金融/医疗复杂报表逐值可溯源抽取的自建底座</text>

  <rect x="40" y="322" width="545" height="190" rx="12" fill="#13223d" stroke="#a855f7" stroke-width="1.5"/>
  <text x="60" y="352" fill="#a855f7" font-family="system-ui, sans-serif" font-size="15.5" font-weight="700">3. Balanov/mcp-attest (★8 · MIT · 24-Rule MCP Auth Harness)</text>
  <text x="60" y="380" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 零依赖 MCP 授权合规测试台：证明“你的 MCP 确实拒绝了该拒绝的调用”</text>
  <text x="60" y="406" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 一条命令遍历所有身份角色、发起真实调用、核验 24 条规则与 OAuth 边界</text>
  <text x="60" y="432" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 直接输出可供安全审计员核验的合规证据包并支持嵌入 CI 门禁</text>
  <text x="60" y="458" fill="#34d399" font-family="ui-monospace, Consolas, monospace" font-size="12">SA 选型：企业内部 MCP Server 上线前强制越权回归测试</text>

  <rect x="615" y="322" width="545" height="190" rx="12" fill="#13223d" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="635" y="352" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="15.5" font-weight="700">4. Andsu-dev/runelay (★21 · MIT · Bun + SQLite MCP Gateway)</text>
  <text x="635" y="380" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 自托管统一 MCP 网关：一次连接 Linear / GitHub / Notion 等业务系统</text>
  <text x="635" y="406" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 让 Claude Code、Codex、Cursor、Antigravity 共享同一 MCP 端点与记忆</text>
  <text x="635" y="432" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 基于 Docker + Bun + SQLite 极简部署，终结多客户端重复配 OAuth 凭证</text>
  <text x="635" y="458" fill="#34d399" font-family="ui-monospace, Consolas, monospace" font-size="12">SA 选型：多编码工具共享企业 SaaS 连接器与技能的中心枢纽</text>

