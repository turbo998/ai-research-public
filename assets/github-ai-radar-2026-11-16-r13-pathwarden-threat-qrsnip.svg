  <text x="68" y="838" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 办公桌面严禁拿私人手机盲扫未知二维码：用 qr-snip 在浏览器本地离线解码并前置拦截 Punycode 仿冒域名与 javascript: 注入。</text>
