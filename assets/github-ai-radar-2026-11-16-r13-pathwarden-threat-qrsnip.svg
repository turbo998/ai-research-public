  <text x="68" y="108" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="21" font-weight="bold">230万对象 AD/Entra 最小割集引擎 (Pathwarden) + 7源威胁情报台 (Threat-Broadcast-Plus) + 离线二维码防钓 (qr-snip)</text>
