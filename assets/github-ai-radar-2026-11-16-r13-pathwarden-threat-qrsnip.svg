  <text x="744" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 淘汰失效爬虫、直连 7 大活源：阿里云 AVD + 斗象 + 微步 + 长亭 + NVD 2.0 JSON + Tenable + CISA KEV</text>
  <text x="744" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• Python 3.12 标准库瘦身：砍掉 6 个废弃第三方库，改用原生 sqlite3 并自动按源裁剪 + VACUUM 防 50MB 膨胀</text>
  <text x="744" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• Kimi K3 模型研判 + 严格 CSP：每 8 小时 GitHub Actions 更新，生成 `script-src 'self'` 零内联脚本静态看板</text>
  <text x="744" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 支持飞书/钉钉/企微 HMAC-SHA256 签名机器人、Server酱、Bark、Telegram 与 SMTP SSL 推送</text>

  <rect x="728" y="380" width="606" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
