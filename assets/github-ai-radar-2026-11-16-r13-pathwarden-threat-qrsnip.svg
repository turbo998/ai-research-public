  <!-- Left Column: marbas207/Pathwarden -->
  <rect x="44" y="152" width="642" height="390" rx="14" fill="url(#cardGrad)" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="66" y="182" fill="#38BDF8" font-family="Consolas, monospace" font-size="14" font-weight="bold">🛡️ 1. marbas207/Pathwarden (Apache-2.0 · Rust · 2.3M Objects in 6.2GB RAM · ★35)</text>
  <text x="66" y="206" fill="#F8FAFC" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15.5" font-weight="bold">把 AD + AD CS + Entra ID 合进一张图，并用“最小割集”一刀斩断全部提权路径</text>

  <rect x="66" y="220" width="598" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="82" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">生产实测 230 万对象峰值仅占 6.2 GB 内存 + 最小权限采集器</text>
  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 生产免域管安全采集：仅用 Kerberos + 签名 SMB，配合最小权限 GPO 无需本地管理员即可读取本地管理员组</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 全域混合身份合图：统一建模 AD 组/委派/GPO/信任、AD CS (ESC1~ESC11 &amp; ESC13) 与 Entra ID 混合链路</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 图最小割集修复规划 (Minimum Cut)：自动算出“改动最少配置即可斩断所有通往 Tier Zero 路径”的最小变更集</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 兼容导入 SharpHound / RustHound-CE / AzureHound / OpenGraph / PingCastle 存量采集包</text>

  <rect x="66" y="380" width="598" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
