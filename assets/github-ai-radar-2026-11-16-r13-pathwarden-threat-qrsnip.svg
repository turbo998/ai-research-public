  <text x="82" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 双向工单生命周期：自动在 Jira / ServiceNow 开单、修复后自动关单、一旦攻击路径死灰复燃立即自动重开！</text>
  <text x="82" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 零门槛内置靶场：单二进制内置 SCALE.LOCAL 合成企业环境，运行 pathwarden demo 即可秒出完整报告</text>
  <text x="82" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 每条规则均附带分步 PowerShell 修复脚本、验证命令与一键回滚方案</text>

