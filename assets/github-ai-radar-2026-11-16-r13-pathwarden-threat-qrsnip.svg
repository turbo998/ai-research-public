  <line x1="68" y1="740" x2="1332" y2="740" stroke="#334155"/>
  <text x="68" y="766" fill="#38BDF8" font-family="Consolas, monospace" font-size="13.5" font-weight="bold">🎯 ARCHITECTURAL TAKEAWAYS FOR ENTERPRISE SECOPS &amp; IDENTITY DEFENSE:</text>
  <text x="68" y="790" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">• 身份安全的核心不是画几万条线，而是求图最小割集 (Min-Cut)：Pathwarden 直接给出“改最少几条 ACL 就能切断全部 Tier Zero 路径”。</text>
