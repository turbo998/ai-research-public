  <text x="744" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 100% 本地 jsQR 解码：支持 Alt+Shift+Q 屏幕框选或右键网页图片直接解码（自动适配高分屏 DPI 与缩放）</text>
  <text x="744" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 内置 Quishing 钓鱼拦截：硬性阻断 javascript:/data: 危险协议，高亮预警明文 http://、Punycode 仿冒域名与短链</text>
  <text x="744" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 绝不自动打开链接：所有解码结果必须经人类检视告警横幅后手动点击，跨 Chrome/Edge/Firefox 140+ 原生兼容</text>
  <text x="744" y="492" fill="#38BDF8" font-family="Consolas, monospace" font-size="12">✓ 办公桌面排查二维码钓鱼邮件/工单截图的极轻量零隐私泄露安全插件</text>

