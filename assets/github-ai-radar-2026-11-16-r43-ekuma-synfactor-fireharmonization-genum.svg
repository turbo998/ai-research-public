  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 为什么 Go 跑 Agent 沙盒脚本难两全？v8go 强依赖 CGO 难交叉编译，而纯 Go 的 goja 只到 ES2015 且偏慢</text>
