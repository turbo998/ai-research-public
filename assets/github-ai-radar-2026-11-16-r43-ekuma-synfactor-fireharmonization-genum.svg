  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 双字长 Value 与 WTF-8 字符串：64 位内数值/BigInt 永不分配内存；V8 基准比 goja 快 3.94×，QuickJS 快 3.35×</text>
