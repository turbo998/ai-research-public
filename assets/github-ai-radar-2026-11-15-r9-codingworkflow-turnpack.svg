  <text x="68" y="696" fill="#34D399" font-family="Consolas, monospace" font-size="13" font-weight="bold">Path C (三段式独立审查工作流 + Turnpack pack/ship/batch MCP)</text>
  <rect x="440" y="680" width="47.5" height="22" rx="5" fill="#10B981"/>
  <text x="500" y="696" fill="#6EE7B7" font-family="Consolas, monospace" font-size="13" font-weight="bold">$475.00/mo ($125.00 tokens + 3.5h × $100 = $350.00) → 净省 $5,285.00/月 (-91.75% / 年省 $63,420.00)</text>

  <line x1="68" y1="720" x2="1332" y2="720" stroke="#334155"/>
  <text x="68" y="748" fill="#38BDF8" font-family="Consolas, monospace" font-size="13" font-weight="bold">🎯 ARCHITECT ROLLOUT DIRECTIVE:</text>
  <text x="68" y="772" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">1. 团队统一植入 my-ai-coding-workflow 的三段式审查协议与 Ponytail 极简技能，强制在新上下文对方案做对抗式挑刺后再动代码。</text>
  <text x="68" y="796" fill="#E2E8F0" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.5">2. 为 Claude Code / Codex / Cursor 挂载零依赖 Turnpack MCP：用 pack 一轮聚齐上下文，用 ship 保证未过单测的多文件修改自动逐字节回滚。</text>
