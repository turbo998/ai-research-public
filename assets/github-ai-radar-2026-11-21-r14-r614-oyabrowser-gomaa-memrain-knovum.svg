  <rect width="1200" height="680" fill="url(#bgR614)" rx="16"/>
  <rect x="24" y="20" width="1152" height="92" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <rect x="24" y="20" width="1152" height="5" rx="2" fill="url(#accentR614)"/>
  <text x="44" y="56" fill="#f8fafc" font-size="20.5" font-weight="800">2026-11-21 Day R14 (R614): Oya HIPAA Browser Replay, Gomaa v4.0 Memory OS, Memrain Spend-Capped Store &amp; Knovum</text>
  <text x="44" y="82" fill="#94a3b8" font-size="13.5" font-weight="500">OyadotAI/oya-browser (★350 · 274 forks) + M4F-S/gomaa (★34) + timurgaleev/memrain (★12) + madebyzan/knovum (★62)</text>
  <text x="44" y="101" fill="#38bdf8" font-size="12.5" font-weight="600">HIPAA Audited Browser &amp; 0-LLM Playbook Replay · 4-Quadrant HippoRAG 2 Memory OS · Per-Person Spend-Capped AWS Memory · Local Research Canvas</text>

  <rect x="24" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="162" fill="#38bdf8" font-size="16" font-weight="800">1. OyadotAI/oya-browser</text>
  <text x="42" y="184" fill="#94a3b8" font-size="12">★ 350 · 274 forks · Rust · MIT SDK</text>
  <text x="42" y="214" fill="#f8fafc" font-size="13" font-weight="700">HIPAA Audited Agent Browser</text>
  <text x="42" y="240" fill="#cbd5e1" font-size="12">• Tamper-evident action audit trail</text>
  <text x="42" y="264" fill="#cbd5e1" font-size="12">• ask() once ➔ toPlaybook() ➔ 0-LLM play()</text>
  <text x="42" y="288" fill="#cbd5e1" font-size="12">• Exports clean Playwright modules</text>
  <text x="42" y="312" fill="#cbd5e1" font-size="12">• Step-level self-repair on UI changes</text>
  <text x="42" y="336" fill="#cbd5e1" font-size="12">• Live human watch &amp; instant takeover</text>
  <text x="42" y="360" fill="#cbd5e1" font-size="12">• 9/10 sites replayed deterministically</text>
  <text x="42" y="384" fill="#cbd5e1" font-size="12">• @oya-ai/browser (TS) &amp; oya-browser (Py)</text>
  <text x="42" y="408" fill="#38bdf8" font-size="12" font-weight="600">Desktop &amp; Cloud Agentic Browsers</text>

  <rect x="316" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
  <text x="334" y="162" fill="#34d399" font-size="16" font-weight="800">2. M4F-S/gomaa (v4.0 Neo)</text>
  <text x="334" y="184" fill="#94a3b8" font-size="12">★ 34 · 1 fork · Python · Apache-2.0</text>
  <text x="334" y="214" fill="#f8fafc" font-size="13" font-weight="700">4-Quadrant Cognitive Memory OS</text>
  <text x="334" y="240" fill="#cbd5e1" font-size="12">• Episodic, Semantic, Procedural &amp; Working</text>
  <text x="334" y="264" fill="#cbd5e1" font-size="12">• Obsidian Vaults + pgvector/SQLite WAL</text>
  <text x="334" y="288" fill="#cbd5e1" font-size="12">• HippoRAG 2 PPR (K=20, alpha=0.15)</text>
  <text x="334" y="312" fill="#cbd5e1" font-size="12">• ACT-R base activation + Ebbinghaus decay</text>
  <text x="334" y="336" fill="#cbd5e1" font-size="12">• 3-phase gomaa sleep (SWS + REM)</text>
  <text x="334" y="360" fill="#cbd5e1" font-size="12">• Bayesian Laplace procedural playbooks</text>
  <text x="334" y="384" fill="#cbd5e1" font-size="12">• Hermes, OpenClaw, Claude &amp; Cursor MCP</text>
  <text x="334" y="408" fill="#34d399" font-size="12" font-weight="600">Multi-Hop Associative Recall</text>

  <rect x="608" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="626" y="162" fill="#a78bfa" font-size="16" font-weight="800">3. timurgaleev/memrain</text>
  <text x="626" y="184" fill="#94a3b8" font-size="12">★ 12 · TypeScript · AWS Self-Host · MIT</text>
  <text x="626" y="214" fill="#f8fafc" font-size="13" font-weight="700">Spend-Capped Team Memory Store</text>
  <text x="626" y="240" fill="#cbd5e1" font-size="12">• Runs in your own AWS (~$52/mo infra)</text>
  <text x="626" y="264" fill="#cbd5e1" font-size="12">• Paid workers stay OFF until daily cap set</text>
  <text x="626" y="288" fill="#cbd5e1" font-size="12">• Per-person keys &amp; instant revocation</text>
  <text x="626" y="312" fill="#cbd5e1" font-size="12">• Source page pointer on every result</text>
  <text x="626" y="336" fill="#cbd5e1" font-size="12">• TS, Python &amp; Go call-graph intelligence</text>
  <text x="626" y="360" fill="#cbd5e1" font-size="12">• Redacts keys/passwords before storage</text>
  <text x="626" y="384" fill="#cbd5e1" font-size="12">• Marks corrected facts as superseded</text>
  <text x="626" y="408" fill="#a78bfa" font-size="12" font-weight="600">Shared Team + Private Drawer Scopes</text>

  <rect x="900" y="130" width="276" height="390" rx="12" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="918" y="162" fill="#fbbf24" font-size="16" font-weight="800">4. madebyzan/knovum</text>
  <text x="918" y="184" fill="#94a3b8" font-size="12">★ 62 · 8 forks · Rust Desktop · MIT</text>
  <text x="918" y="214" fill="#f8fafc" font-size="13" font-weight="700">Local-First Infinite Research Canvas</text>
  <text x="918" y="240" fill="#cbd5e1" font-size="12">• Notes, webpages, videos, PDFs, Office, code</text>
  <text x="918" y="264" fill="#cbd5e1" font-size="12">• Visual canvas linking claims to evidence</text>
  <text x="918" y="288" fill="#cbd5e1" font-size="12">• Answers cite passage, page or timestamp</text>
  <text x="918" y="312" fill="#cbd5e1" font-size="12">• Local search, transcription &amp; OCR</text>
  <text x="918" y="336" fill="#cbd5e1" font-size="12">• Zero Knovum account or cloud lock-in</text>
  <text x="918" y="360" fill="#cbd5e1" font-size="12">• Sends only task-scoped context to LLMs</text>
  <text x="918" y="384" fill="#cbd5e1" font-size="12">• macOS 14+ (ARM/Intel) &amp; Windows 10+</text>
  <text x="918" y="408" fill="#fbbf24" font-size="12" font-weight="600">Keep Knowledge Trail on Your Device</text>

  <rect x="24" y="540" width="1152" height="116" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="572" fill="#f8fafc" font-size="15.5" font-weight="800">Closed-Form Enterprise FinOps TCO Benchmark (45-Person Team @ $100/h · synthetic, independently_reproduced=false)</text>
  <text x="44" y="600" fill="#cbd5e1" font-size="13">• Path A (Every-Run LLM Browser CUA + Uncapped Cloud Memory SaaS + Commercial Research Seats): $3,480.00 SaaS + 42.0h ($4,200.00) = $7,680.00/mo</text>
  <text x="44" y="624" fill="#34d399" font-size="13.5" font-weight="700">• Path C (Hybrid Cloud Control + oya-browser + gomaa + memrain + knovum): $80.00 Compute + 2.5h ($250.00) = $330.00/mo ➔ Saves $7,350.00/mo (-95.70%)</text>
  <text x="44" y="646" fill="#94a3b8" font-size="11">Audit Constants: Path A $3,480.00 + 42h ($4,200.00) = $7,680.00/mo ➔ Path C $80.00 + 2.5h ($250.00) = $330.00/mo (-$7,350.00/mo · -95.70% · base_hardware_capex = not_measured)</text>
