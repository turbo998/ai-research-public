  <text x="918" y="240" fill="#cbd5e1" font-size="12">• Single Rust binary (cliffvm + 1 SQLite)</text>
  <text x="918" y="264" fill="#cbd5e1" font-size="12">• -51% tokens by injecting graph memories</text>
  <text x="918" y="288" fill="#cbd5e1" font-size="12">• 4 tools: entity_query/read/write, run_cliff</text>
  <text x="918" y="312" fill="#cbd5e1" font-size="12">• Model maintains its own turn banner</text>
  <text x="918" y="336" fill="#cbd5e1" font-size="12">• Powered by c1f reactive graph language</text>
  <text x="918" y="360" fill="#cbd5e1" font-size="12">• Native HACS Home Assistant integration</text>
  <text x="918" y="384" fill="#cbd5e1" font-size="12">• OpenAI-compatible proxy + browser UI</text>
  <text x="918" y="408" fill="#fbbf24" font-size="12" font-weight="600">No Full-History Chat Replay Needed</text>

  <rect x="24" y="540" width="1152" height="116" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="44" y="572" fill="#f8fafc" font-size="15.5" font-weight="800">Closed-Form Enterprise FinOps TCO Benchmark (45-Engineer Team @ $100/h · synthetic, independently_reproduced=false)</text>
  <text x="44" y="600" fill="#cbd5e1" font-size="13">• Path A (Full-History Token Replay + Per-Seat Multi-Model SaaS + Unbounded Claim Audits): $3,340.00 SaaS + 41.0h ($4,100.00) = $7,440.00/mo</text>
  <text x="44" y="624" fill="#34d399" font-size="13.5" font-weight="700">• Path C (Hybrid Cloud Control + Bike4Mind + OpenCraft + Agentfootprint + Babyseat): $70.00 Compute + 2.4h ($240.00) = $310.00/mo ➔ Saves $7,130.00/mo (-95.83%)</text>
  <text x="44" y="646" fill="#94a3b8" font-size="11">Audit Constants: Path A $3,340.00 + 41h ($4,100.00) = $7,440.00/mo ➔ Path C $70.00 + 2.4h ($240.00) = $310.00/mo (-$7,130.00/mo · -95.83% · base_hardware_capex = not_measured)</text>
