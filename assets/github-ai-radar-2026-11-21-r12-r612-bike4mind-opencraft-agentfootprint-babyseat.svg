  <text x="44" y="56" fill="#f8fafc" font-size="20.5" font-weight="800">2026-11-21 Day R12 (R612): Bike4Mind Workbench, OpenCraft Host Sharing, Agentfootprint Checks &amp; Babyseat -51% Proxy</text>
  <text x="44" y="82" fill="#94a3b8" font-size="13.5" font-weight="500">Bike4Mind/bike4mind (★97) + opencraft-app/opencraft (★260) + footprintjs/agentfootprint (★22) + chedim/babyseat (★23)</text>
  <text x="44" y="101" fill="#38bdf8" font-size="12.5" font-weight="600">Quest Master Multi-Model Workbench · Credential-Safe Host Sharing (MIT-0) · Execution-Record Answer Checks · -51% Token cliffvm Graph</text>

  <rect x="24" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="162" fill="#38bdf8" font-size="16" font-weight="800">1. Bike4Mind/bike4mind</text>
  <text x="42" y="184" fill="#94a3b8" font-size="12">★ 97 · 16 forks · TypeScript · BUSL-1.1</text>
  <text x="42" y="214" fill="#f8fafc" font-size="13" font-weight="700">Open-Core AI Knowledge Platform</text>
  <text x="42" y="240" fill="#cbd5e1" font-size="12">• Notebooks + RAG Knowledge Engine</text>
  <text x="42" y="264" fill="#cbd5e1" font-size="12">• Quest Master parallel multi-step planner</text>
  <text x="42" y="288" fill="#cbd5e1" font-size="12">• Swaps OpenAI/Claude/Gemini/xAI/Ollama</text>
  <text x="42" y="312" fill="#cbd5e1" font-size="12">• GPT-Image-2, Nano Banana &amp; FLUX</text>
  <text x="42" y="336" fill="#cbd5e1" font-size="12">• Reusable &amp; shareable Agent Artifacts</text>
  <text x="42" y="360" fill="#cbd5e1" font-size="12">• 1-cmd compose.selfhost.yaml Docker stack</text>
  <text x="42" y="384" fill="#cbd5e1" font-size="12">• Auto-converts to Apache-2.0 (2yr clock)</text>
  <text x="42" y="408" fill="#38bdf8" font-size="12" font-weight="600">Published as @bike4mind/* Packages</text>

  <rect x="316" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
  <text x="334" y="162" fill="#34d399" font-size="16" font-weight="800">2. opencraft-app/opencraft</text>
  <text x="334" y="184" fill="#94a3b8" font-size="12">★ 260 · 1 fork · TypeScript · MIT-0</text>
  <text x="334" y="214" fill="#f8fafc" font-size="13" font-weight="700">Anyone Agents Anywhere Workbench</text>
  <text x="334" y="240" fill="#cbd5e1" font-size="12">• Web, Electron desktop &amp; Expo mobile</text>
  <text x="334" y="264" fill="#cbd5e1" font-size="12">• Pluggable local &amp; remote execution Hosts</text>
  <text x="334" y="288" fill="#cbd5e1" font-size="12">• Share agent capabilities without raw keys</text>
  <text x="334" y="312" fill="#cbd5e1" font-size="12">• Connects local Codex, Cursor &amp; ACP/MCP</text>
  <text x="334" y="336" fill="#cbd5e1" font-size="12">• Authenticated actor messages &amp; receipts</text>
  <text x="334" y="360" fill="#cbd5e1" font-size="12">• Managed web updates &amp; session resume</text>
  <text x="334" y="384" fill="#cbd5e1" font-size="12">• Zero-attribution MIT-0 public license</text>
  <text x="334" y="408" fill="#34d399" font-size="12" font-weight="600">Host Holds Credentials Safely</text>

  <rect x="608" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="626" y="162" fill="#a78bfa" font-size="16" font-weight="800">3. agentfootprint</text>
  <text x="626" y="184" fill="#94a3b8" font-size="12">★ 22 · 4 forks · TypeScript · MIT</text>
  <text x="626" y="214" fill="#f8fafc" font-size="13" font-weight="700">Hold Agent Claims to the Record</text>
  <text x="626" y="240" fill="#cbd5e1" font-size="12">• Built on FootprintJS provenance graph</text>
  <text x="626" y="264" fill="#cbd5e1" font-size="12">• Records context, tool calls &amp; decisions</text>
  <text x="626" y="288" fill="#cbd5e1" font-size="12">• Compares LLM claims vs. what actually ran</text>
  <text x="626" y="312" fill="#cbd5e1" font-size="12">• Enforces scope-bounded answer checks</text>
  <text x="626" y="336" fill="#cbd5e1" font-size="12">• Separates empty query vs. failed query</text>
  <text x="626" y="360" fill="#cbd5e1" font-size="12">• 87% test coverage &amp; tree-shakeable ESM</text>
  <text x="626" y="384" fill="#cbd5e1" font-size="12">• Runs offline quickstart with 0 API keys</text>
  <text x="626" y="408" fill="#a78bfa" font-size="12" font-weight="600">Stops Unbounded Hallucinations</text>

  <rect x="900" y="130" width="276" height="390" rx="12" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="918" y="162" fill="#fbbf24" font-size="16" font-weight="800">4. chedim/babyseat</text>
  <text x="918" y="184" fill="#94a3b8" font-size="12">★ 23 · Rust v0.7.63 (cliffvm) · MIT</text>
