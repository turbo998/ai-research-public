  <text x="240" y="51" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Self-Hosted Multi-Server MCP Control Plane (`ServerOS`) &amp; 4-State React Dynamic Island (`islandcn`)</text>
