  <text x="1027" y="228" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="10.5" text-anchor="middle">`npx shadcn@latest add .../island-core.json`</text>

  <!-- islandcn Mechanics -->
  <rect x="632" y="258" width="522" height="192" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="646" y="280" fill="#7DD3FC" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">Why `islandcn` Excels at Multi-Activity Live Telemetry in React &amp; AI Web Apps:</text>
  <text x="646" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. True Multi-Activity Stack &amp; "The Split": Unlike single-banner toasts, `island-core` manages</text>
  <text x="646" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   concurrent ongoing activities (e.g., file upload + voice recording) using the detached split pill.</text>
  <text x="646" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Imperative Hook API (`useIsland`): Any component calls `island.start({ id, compact, expanded })`,</text>
  <text x="646" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   `.update()`, and `.end()` with frame-fitted springs, long-press expansion, and reduced motion.</text>
  <text x="646" y="387" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">$ npx shadcn@latest add https://islandcn.dev/r/island-core.json</text>
  <text x="646" y="409" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. 9 Ready-to-Copy Presets &amp; Agent Skill: Ships single-file presets (upload, timer, call, ETA,</text>
  <text x="646" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">   recording, nearby transfer, battery) plus `islandcn-skill` for coding agents.</text>

