  <!-- ServerOS Mechanics -->
  <rect x="46" y="258" width="522" height="192" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="60" y="280" fill="#FDE68A" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="700">How `ServerOS` Unifies Multi-Vendor Linux VPS Fleets for Humans and AI Agents:</text>
  <text x="60" y="303" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">1. Outbound `serverosd` Architecture: Each Linux machine runs the open-source `serverosd`</text>
  <text x="60" y="322" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">   daemon connecting out to your self-hosted panel on port `8443`—servers stay on your account.</text>
  <text x="60" y="344" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">2. Staging Clones &amp; Promote Workflows: Clones any Git/template service into a test environment,</text>
  <text x="60" y="363" fill="#6EE7B7" font-family="Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="700">   runs automated `deploy → check → promote` workflows, and aggregates logs/uptime/backups.</text>
  <text x="60" y="387" fill="#A7F3D0" font-family="Consolas, monospace" font-size="11">$ curl -fsSL .../docker/self-hosted/install.sh | sudo bash -s -- --domain=panel.example.com</text>
  <text x="60" y="409" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Native MCP Server + REST API: Exposes fleet operations, status pages, and 2FA RBAC</text>
  <text x="60" y="428" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11">   audit logs directly to coding agents and ops assistants without raw SSH key sprawl.</text>

