  <text x="646" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Keeps API keys strictly on the server (never baked into the APK) with one-time `setup-token` bootstrap.</text>
  <text x="646" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. Rust `Axum` enforces identity, memory provenance, and write-confirmation gates outside the LLM loop.</text>
  <text x="646" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Pins client to your self-hosted instance—never silently reroutes data if your server goes offline.</text>
  <text x="646" y="481" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Use `tomorrow-ai`'s Rust-Governance + TS-Agent split for self-hosted mobile/desktop agents.</text>

