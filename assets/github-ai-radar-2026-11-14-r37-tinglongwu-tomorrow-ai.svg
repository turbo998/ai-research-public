  <text x="62" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Cloud meeting translators stream confidential audio to third-party servers at $0.04–$0.10/minute.</text>
  <text x="62" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. `tinglongWu` downloads ASR/MT/TTS models once and executes Listen/Speak/Two-Way 100% locally.</text>
  <text x="62" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Zero retained audio files on disk by default satisfies strict legal/NDA call compliance.</text>
  <text x="62" y="481" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Deploy `tinglongWu` for NDA-bound multilingual meetings across zh/en/ja/ko/ru.</text>

