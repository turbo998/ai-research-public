  <text x="62" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. `tamserve` batches multi-camera frames through 1 shared model with constant 0.28 GB stream state.</text>
  <text x="62" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Replaces 4x A100 cloud clusters with a single 24 GB RTX 4090 / L4 serving up to 64 RTSP feeds.</text>
  <text x="62" y="481" fill="#2DD4BF" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Standardize multi-camera SAM 2.1 / EdgeTAM video pipelines on `tamserve`.</text>

