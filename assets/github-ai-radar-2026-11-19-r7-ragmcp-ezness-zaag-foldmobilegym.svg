  <text x="60" y="170" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Dense + BM25 + RRF Fusion + Rerank 两段式可插拔混合检索框架</text>
  <text x="60" y="196" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 暴露 query_knowledge_hub / list_collections / get_document_summary</text>
  <text x="60" y="222" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• Streamlit 6 页面白盒链路追踪 + Ragas Golden Test Set 回归评估</text>
  <text x="60" y="248" fill="#34d399" font-family="ui-monospace, Consolas, monospace" font-size="12">SA 选型：拒绝“凭感觉调参”的企业级可观测多模态 RAG 样板</text>

  <rect x="615" y="112" width="545" height="190" rx="12" fill="#13223d" stroke="#10b981" stroke-width="1.5"/>
  <text x="635" y="142" fill="#10b981" font-family="system-ui, sans-serif" font-size="15.5" font-weight="700">2. Easyblue11/ezness (★17 · MIT · Windows 10/11 Workbench)</text>
  <text x="635" y="170" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 数据 100% 留存本机目录的 Windows 桌面 AI 工作台（内置「工作总监」）</text>
  <text x="635" y="196" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 支持绑定本地目录或固定主机指纹的加密 SSH 远端服务器工作空间</text>
  <text x="635" y="222" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 每次请求按天/按功能/按模型精确记账输入输出与缓存费用并导出 CSV</text>
  <text x="635" y="248" fill="#34d399" font-family="ui-monospace, Consolas, monospace" font-size="12">SA 选型：Windows 工程师本地+远端 SSH 闭环督办与成本核算台</text>

  <rect x="40" y="322" width="545" height="190" rx="12" fill="#13223d" stroke="#a855f7" stroke-width="1.5"/>
  <text x="60" y="352" fill="#a855f7" font-family="system-ui, sans-serif" font-size="15.5" font-weight="700">3. IsmailHatim/zaag (★17 · MIT · Rust/Wasm Zellij + Python)</text>
