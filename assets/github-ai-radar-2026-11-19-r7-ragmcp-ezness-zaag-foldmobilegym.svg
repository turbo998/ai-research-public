  <text x="60" y="406" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 一项目一会话、一 Agent 一窗格（Claude Code / Codex / Hermes）</text>
  <text x="60" y="432" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 状态钩子实时上报 working / blocked / done，支持跨 SSH 远程控制</text>
  <text x="60" y="458" fill="#34d399" font-family="ui-monospace, Consolas, monospace" font-size="12">SA 选型：终端重度用户零内存膨胀的多智能体分屏指挥台</text>

  <rect x="615" y="322" width="545" height="190" rx="12" fill="#13223d" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="635" y="352" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="15.5" font-weight="700">4. NaiboWang/FoldMobileGym (★19 · Apache-2.0 · TypeScript)</text>
  <text x="635" y="380" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 免真机浏览器端折叠屏手机交互仿真平台（折叠/展开双态切换）</text>
  <text x="635" y="406" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 内置 30 款模拟应用，支持双分屏、三分屏与可缩放悬浮窗多任务布局</text>
  <text x="635" y="432" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="13">• 配套 50 个任务模板与 120 个评测实例，支持截图 Agent 轨迹回放与判定</text>
  <text x="635" y="458" fill="#34d399" font-family="ui-monospace, Consolas, monospace" font-size="12">SA 选型：移动端跨应用分屏 GUI Agent 零硬件成本回归测试</text>

