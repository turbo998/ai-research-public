  <text x="752" y="522" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Step 3: Verify numerical parity against reference.py over LLC-exceeding inputs</text>
  <text x="752" y="544" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Eliminates cold-start tail latency &amp; silent FP8/BF16 quantization drift</text>

