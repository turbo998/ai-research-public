  <text x="72" y="245" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">• CUDA normal_ launches 2,048 threads/SM; element i is written by thread (i mod 2048×SMs)</text>
  <text x="72" y="266" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• Untrained rare-token embedding rows receive 0 gradients and preserve init weights intact!</text>

