  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 现代近似推断层 (L08–L10)：MCMC (Metropolis-Hastings/HMC)、变分推断 (VI/ELBO) 与分层贝叶斯模型</text>
