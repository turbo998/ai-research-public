  <text x="60" y="544" fill="#FCA5A5" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Path A: Dropped SSH Tunnels + Xcode Global Leaks &amp; Blind Quotas</text>
  <rect x="470" y="528" width="530" height="22" rx="4" fill="#EF4444" opacity="0.85"/>
