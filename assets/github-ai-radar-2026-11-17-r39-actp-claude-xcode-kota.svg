  <text x="60" y="562" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">$2,280.00/mo dropped-session/quota-overage waste + 38.0 hrs/mo ($3,610.00) fixing SSH drops, Xcode env &amp; zombie agents</text>

  <!-- Path B -->
  <text x="60" y="602" fill="#FCD34D" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Path B: Custom SSH Port Forwards + Manual Billing Page Checks</text>
  <rect x="470" y="586" width="232" height="22" rx="4" fill="#F59E0B" opacity="0.85"/>
  <text x="714" y="602" fill="#FCD34D" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">$2,582.50/mo (-56.15%)</text>
  <text x="60" y="620" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">$920.00/mo rerun tokens + 17.5 hrs/mo ($1,662.50) manual tunnel maintenance &amp; multi-provider balance checks</text>

  <!-- Path C -->
  <text x="60" y="660" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Path C: ACTP (Apache-2.0) + claude-xcode-agent + Kota (MIT)</text>
  <rect x="470" y="644" width="31" height="22" rx="4" fill="#10B981"/>
  <text x="513" y="660" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800">$341.00/mo (-94.21% · Saves $5,549.00/mo / $66,588.00/yr)</text>
  <text x="60" y="678" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">$75.00/mo tunnel/gateway ops + 2.8 hrs/mo ($266.00) token scoping &amp; threshold tuning (92.63% hours saved)</text>

  <rect x="60" y="692" width="1080" height="24" rx="6" fill="#1E293B"/>
  <text x="600" y="708" text-anchor="middle" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">SA Takeaway: Bridge remote ACP agents over HTTPS/WS via ACTP, isolate Xcode 27 gateways via claude-acp.sh, and monitor 11 quotas via Kota.</text>
