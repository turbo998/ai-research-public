    <text x="24" y="64" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Path A (Commercial AI Coworker Seats + Siloed Cloud Memory + Proprietary IDE Add-Ons): $4,840.00/mo + 45.5h ($4,550.00) = $9,390.00/mo</text>
    <text x="24" y="92" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="14">• Path B (Microsoft Copilot Studio + Azure AI Foundry SDK + Dev Box): $1,880.00/mo PaaS + 10.5h ($1,050.00) = $2,930.00/mo</text>
    <text x="24" y="120" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700">• Path C (EverOS + harness-sdk + thinkrail + suparagent): $65.00/mo Compute + 2.4h ($240.00) = $305.00/mo (Saves $9,085.00/mo · -96.75%)</text>
    <text x="24" y="148" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">Provenance: GitHub REST API (2026-11-24) · LF SHA-256: bc6180e1... / 9318369c... · track_b_stars_today=not_measured · base_hardware_capex=not_measured</text>
  </g>
