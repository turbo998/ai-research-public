  <text x="56" y="130" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="14">Closed-Form FinOps TCO: Path A ($4,840.00 + 45.5h [$4,550.00] = $9,390.00/mo) ➔ Path C ($65.00 + 2.4h [$240.00] = $305.00/mo) · Net Savings $9,085.00/mo (-96.75%) · base_hardware_capex=not_measured</text>

