    <text x="20" y="86" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13">★ 13,994 · 983 forks · Python · Apache-2.0</text>
    <text x="20" y="114" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12.5">• One portable memory layer for every AI agent:</text>
