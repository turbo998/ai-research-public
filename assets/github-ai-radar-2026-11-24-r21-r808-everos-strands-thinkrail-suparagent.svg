  <!-- Architecture Pipeline -->
  <g transform="translate(56, 408)">
    <rect width="1288" height="170" rx="14" fill="#0B1528" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="32" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">END-TO-END APACHE-2.0 PORTABLE MEMORY, HARNESS SDK, AGENTIC IDE &amp; AI COWORKER STACK (L1 ➔ L4)</text>
    <text x="24" y="64" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">1. Portable Markdown Memory (EverOS ★13.9k): Maintain one user-owned, Git-auditable Markdown memory layer shared across all agents &amp; IDEs.</text>
    <text x="24" y="92" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">2. Polyglot Harness SDK (strands-agents/harness-sdk ★9.2k): Author model-driven Python &amp; TypeScript agents portable across any cloud provider.</text>
    <text x="24" y="120" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">3. Self-Improving Agentic IDE (JetBrains/thinkrail ★8.4k): Compound team coding velocity as the IDE learns repo idioms from every session.</text>
    <text x="24" y="148" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="13.5">4. Isolated AI Coworkers (suparagent ★7.1k): Assign recurring routines to named coworkers with dedicated virtual computers &amp; approval gates.</text>
  </g>

  <!-- Closed-Form FinOps TCO Comparison -->
