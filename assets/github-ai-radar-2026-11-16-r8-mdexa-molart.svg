  <rect x="66" y="220" width="598" height="148" rx="10" fill="#0B1325" stroke="#2563EB" stroke-width="1"/>
  <text x="82" y="244" fill="#60A5FA" font-family="Consolas, monospace" font-size="13" font-weight="bold">逐字快照 SHA-256 证据链 + 双轴正交合规模型</text>
  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 根除“代码协议当数据协议”误区：严格分离 repo_license、license_status 与 hosting 状态</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 四大高危风险标签 (risk_flags)：透视执业医师真题派生、网页抓取、真实患者病历与模型合成文本</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 显式暴露冲突 (conflict)：当托管页标 MIT 而上游考试机构保留所有权利时，同时引用双方原文</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ evidence-index/ 锁死每次抓取 URL/时间戳/SHA-256 · validate-cards.mjs 强制校验 JSON Schema</text>

