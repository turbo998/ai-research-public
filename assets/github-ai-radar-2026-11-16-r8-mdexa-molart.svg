  <text x="744" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 彻底告别 AI 生图伪造结构：直接加载真实 PDB/mmCIF (如 1TIM, 3CHY, 1UBQ, 4HHB)，原子坐标 0 偏移</text>
  <text x="744" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 21 种代码化着色与几何风格：涵盖 Klimt、Van Gogh、Hokusai、水墨 (sumi-e)、Jane Richardson 手绘、Glass 与 ASCII</text>
  <text x="744" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 科学模式 vs 艺术模式：Science 模式严守标准二级结构丝带几何；Art 模式显式标注并允许风格化重塑</text>
  <text x="744" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 支持按多肽链 (Per-Chain) 独立指定不同画风与模式，突出展示配体结合口袋或二聚体界面</text>

  <rect x="728" y="380" width="606" height="144" rx="10" fill="#0B1325" stroke="#10B981" stroke-width="1"/>
