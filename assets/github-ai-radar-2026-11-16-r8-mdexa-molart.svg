  <text x="744" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 未发表结构零泄露：本地拖入的未公开新药靶点 PDB/mmCIF 100% 留在浏览器内存，绝不上传外网</text>
