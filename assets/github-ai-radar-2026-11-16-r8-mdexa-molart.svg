  <text x="82" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 中英双语与中医/西医全覆盖：同步发布 schema.org Dataset、MLCommons Croissant 与 llms.txt</text>
