  <text x="744" y="470" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 21 风格全景画廊一键生成：node cli/molart.mjs gallery 1TIM.cif --size 2048 --output-dir outputs/</text>
