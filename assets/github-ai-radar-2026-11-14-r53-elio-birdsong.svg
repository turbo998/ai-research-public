  <text x="62" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Traditional terminals buffer gigabytes of stdout when a remote command floods, freezing `Ctrl+C`.</text>
  <text x="62" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. `Elio` pulls socket bytes only as fast as the GPU screen frame renders, keeping input instant.</text>
  <text x="62" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Replaces $10–$20/seat/mo Termius subscriptions with a 1-Docker-command E2EE ciphertext sync server.</text>
  <text x="62" y="481" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Standardize 5-OS SSH/Mosh fleet access on `Elio` (`libghostty-vt`) + self-hosted E2EE sync.</text>

