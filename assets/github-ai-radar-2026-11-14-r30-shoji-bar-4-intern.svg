  <rect x="46" y="361" width="524" height="142" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="62" y="384" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Unified Wayland Layer-Shell vs. Fragmented Dotfile Sprawl</text>
  <text x="62" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Consolidates bar, dock, notifications, launcher, wallpaper, and quick settings into 1 Rust binary.</text>
  <text x="62" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. `AntiWebUI` Skia + Taffy + Parley pipeline sleeps at 0.0% CPU when no spring transitions are active.</text>
  <text x="62" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Eliminates CSS/GTK theme drift across `waybar`, `rofi`, `swaync`, and `swww` via unified M3 tokens.</text>
  <text x="62" y="481" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Adopt shoji-bar-4 / AntiWebUI layer-shell pattern for low-overhead Linux VDI &amp; edge desktops.</text>

