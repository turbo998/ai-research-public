  <text x="912" y="246" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• `tnum`: Zero-Jitter Live Token/Latency Counters</text>
  <text x="912" y="266" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• `zero` + `ss02`: Slashed 0 &amp; `Il1` Clarity</text>
  <text x="912" y="286" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• `ss01` + `cv01-cv11`: Technical Glyph Set</text>
  <text x="912" y="306" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• `frac` / `sups` / `subs`: Math &amp; Footnotes</text>
  <text x="912" y="326" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Crisp `11px–14px` Micro-Labels via `opsz: 14`</text>

  <rect x="630" y="361" width="524" height="142" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="646" y="384" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Why Rounded UI Fonts Usually Fail in Technical Dashboards (And How Intern Fixes It)</text>
  <text x="646" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Geometric rounded fonts (`Nunito`, `Quicksand`) lack `opsz` and `tnum`, causing blurry 12px tables.</text>
  <text x="646" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. `Intern` preserves Rasmus Andersson's `Inter` metrics, x-height, and `tnum` grid with warm terminals.</text>
  <text x="646" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Drop-in metric compatibility with `Inter`: zero layout shift (`CLS = 0.00`) when swapping font-family.</text>
  <text x="646" y="481" fill="#C4B5FD" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Use `Intern[opsz,wght].woff2` with `font-variant-numeric: tabular-nums` in AI telemetry UIs.</text>

