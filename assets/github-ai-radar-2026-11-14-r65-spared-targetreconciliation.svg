  <text x="156" y="164" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">michaelmagan/spared (★44)</text>
  <text x="271" y="164" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Rust · Apache-2.0 · wasm32-wasip2</text>

  <text x="54" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Self-Hosted Rust Web App Host Running SQLite Inside Each Wasm Sandbox</text>

  <rect x="54" y="212" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="234" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. 2.6x Faster Warm p50 (148 µs vs 388 µs) &amp; 3.0x Lower p99</text>
  <text x="70" y="253" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Benchmarked vs Cloudflare workerd on 4-vCPU VM: p99 @ 16 conn is 5.45ms vs 16.53ms</text>
  <text x="70" y="269" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 0.9 ms idle wake; 4.8x less unreclaimable RAM at 200 apps (108 MiB vs 516 MiB)</text>

  <rect x="54" y="286" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="308" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. In-Sandbox SQLite Isolation (wasm32-wasip2 + wasi-sdk 25)</text>
  <text x="70" y="327" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Unlike workerd/Spin/celld (SQLite in host), spared runs SQLite inside each app's Wasm</text>
  <text x="70" y="343" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Pre-compiles SQLite to Wasm once; subsequent Rust app builds take seconds</text>

  <rect x="54" y="360" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="382" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Built-In AGENTS.md for Zero-Touch Agent App Deployment</text>
  <text x="70" y="401" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Claude Code / Codex runs spared new ➔ spared test ➔ spared deploy in 1 binary</text>
  <text x="70" y="417" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Ideal for hosting hundreds of isolated AI-generated micro-apps on one Linux VM</text>

