  <text x="634" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Policy-Governed K8s Reliability Reconciler &amp; Atomic Digest Rollback</text>

  <rect x="634" y="212" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="650" y="234" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. ReliabilityTarget CRD + Uncached K8s Observation &amp; GitOps Fences</text>
  <text x="650" y="253" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Generation-aware Ready/Reconciled conditions, leader election &amp; scoped RBAC</text>
  <text x="650" y="269" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Enforces opt-in &amp; GitOps ownership fences so rollbacks never fight ArgoCD/Flux</text>

  <rect x="634" y="286" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="650" y="308" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. Digest-Pinned Rollback with UID / resourceVersion Preconditions</text>
  <text x="650" y="327" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Dry-run by default + explicit operator approval + per-target concurrent admission</text>
  <text x="650" y="343" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Atomic UID/resourceVersion/image preconditions + post-rollback readiness check</text>

  <rect x="634" y="360" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="650" y="382" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. PostgreSQL Immutable Audit Timeline &amp; Read-Only Next.js Console</text>
  <text x="650" y="401" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Zero in-memory fallback; records who approved, what evidence justified &amp; outcome</text>
  <text x="650" y="417" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Read-only Next.js/Tailwind console with explicit loading/error/empty/stale states</text>

