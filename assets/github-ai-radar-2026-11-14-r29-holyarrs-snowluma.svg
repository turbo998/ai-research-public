  <text x="62" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. Eliminates 15 cross-container REST/API-key bindings and volume-mount path mismatch failures.</text>
  <text x="62" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Runs smoothly on 512 MB–1 GB ARM64 SBCs (Raspberry Pi / Orange Pi) where 6-app *arr OOM-kills.</text>
  <text x="62" y="481" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Replace 6-container *arr sprawl on edge/NAS nodes with HolyArrs single `:8484` container.</text>

