  <text x="646" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. Headless `npx snowluma -q` prints terminal QR codes and `npx snowluma --status` returns JSON health.</text>
  <text x="646" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Built-in MCP tools (`get_login_info`, `get_friend_list`, `get_group_list`, `send_private_msg`, `send_group_msg`).</text>
