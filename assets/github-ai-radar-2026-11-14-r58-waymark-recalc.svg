  <text x="54" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Zero-DB Git-Friendly Work Tracker with Fingerprint Projections</text>

  <rect x="54" y="212" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="234" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. Markdown Files as SSOT (work/&lt;cat&gt;/wm-&lt;id&gt;.md)</text>
  <text x="70" y="253" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• 1 Markdown file + YAML frontmatter per item; git clone is the entire install</text>
  <text x="70" y="269" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Hierarchies, dependencies &amp; custom fields reviewed, diffed &amp; reverted like code</text>

  <rect x="54" y="286" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="308" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. Content-Fingerprint Projection &amp; INCOMPLETE_PROJECTION Guard</text>
  <text x="70" y="327" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Incremental in-memory projection skips unchanged bytes; stamps source &amp; freshness</text>
  <text x="70" y="343" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Partial views fail closed with INCOMPLETE_PROJECTION instead of serving stale state</text>

  <rect x="54" y="360" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="382" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Built-In waymark-mcp (stdio) &amp; Loopback Read-Only Web View</text>
  <text x="70" y="401" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Claude Code, Cursor &amp; MCP clients read/write the exact same work items as humans</text>
  <text x="70" y="417" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Prebuilt Rust binaries for Linux/macOS/Windows verified via .sha256 checksums</text>

