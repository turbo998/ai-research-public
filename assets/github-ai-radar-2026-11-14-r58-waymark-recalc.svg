  <text x="650" y="253" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Place a terminal test cell next to a Claude Code / Codex / pi agent cell</text>
  <text x="650" y="269" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Test cell re-runs automatically on code change &amp; stops session exit until row is green</text>

  <rect x="634" y="286" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="650" y="308" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. Passage-Cited Document Matrix &amp; Checked-Cell Write Lock</text>
  <text x="650" y="327" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Files down rows × questions across columns (e.g., 12 contracts × 6 questions = 72 cells)</text>
  <text x="650" y="343" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Every answer highlights exact source quote; human-checked cells lock against overwrite</text>

  <rect x="634" y="360" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="650" y="382" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Needs You Attention Queue, Driver Agent &amp; Plain-Folder Storage</text>
  <text x="650" y="401" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Aggregates blockers/questions across row agents into 1 Needs You inbox + Excel export</text>
  <text x="650" y="417" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 100% local folder storage with zero cloud account or telemetry; supports local LLMs</text>

