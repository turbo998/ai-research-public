  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 三大生成模态全开源：无条件生成 (FFS/Sky/Taichi/UCF101)、类别条件生成 (c2v) 与 RealEstate10K 相机运镜控制</text>
