  <text x="82" y="266" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 先检视内容再出菜单：拖入带表格的 Word 才会出现“3. 导出里面的表格 (CSV)”；拖入图片则给 webp/jpg/PDF</text>
  <text x="82" y="288" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 极简双模指令：回复单个数字立即确定性执行；或说自然语言（如“转成 heic 质量 60”）经复述确认后执行</text>
  <text x="82" y="310" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 100% 离线内置引擎：覆盖 30+ 图片格式/HEIC、PDF 拆图提字、Word/Excel/PPT 转 MD/CSV、ZIP 与音视频</text>
  <text x="82" y="332" fill="#34D399" font-family="Consolas, monospace" font-size="12">✓ 支持“盯着这个文件夹”后台自动监听转换至 converted/ · 青绿色文件胶囊一键定位</text>

