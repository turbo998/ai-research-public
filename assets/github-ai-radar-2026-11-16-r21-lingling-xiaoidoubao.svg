  <text x="82" y="426" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 不会的事直接说不会，绝不假装成功或把机密合同上传到不知名的在线 PDF/图片转换网站</text>
  <text x="82" y="448" fill="#CBD5E1" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12.3">• 专为高频非程序员办公桌面打磨：把复杂命令行参数隐藏在“拖放 + 敲 1 个数字”的 2 秒交互后</text>
