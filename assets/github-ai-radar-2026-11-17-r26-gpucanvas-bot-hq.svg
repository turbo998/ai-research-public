  <text x="763" y="170" text-anchor="middle" fill="#A5B4FC" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">AGENT HQ &amp; BOARD · BOT-HQ (★327) &amp; FOLIO</text>
