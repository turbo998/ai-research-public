  <text x="40" y="58" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">2026-11-17 NIGHT ROUND 26 (CUMULATIVE R450 MILESTONE) · 5,000-SCREEN WEBGPU AGENT CANVAS &amp; MULTI-SCREEN AGENT HQ</text>
  <text x="40" y="90" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="800">gpucanvas (5,000 Live Screens, 3ms JSON) &amp; Bot-HQ/Whiteboard Cut Ops TCO by 93.78%</text>
  <text x="40" y="116" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">Comparing CSS-DOM Canvases &amp; Per-Agent VMs vs. berkantay/gpucanvas (★510, MIT) + nickvasilescu/bot-hq (★327, MIT) &amp; hermes-whiteboard (★92, MIT)</text>

  <!-- Left Card: berkantay/gpucanvas -->
  <rect x="40" y="138" width="545" height="295" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="56" y="154" width="245" height="24" rx="12" fill="#0C4A6E"/>
  <text x="178" y="170" text-anchor="middle" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">WEBGPU CANVAS · GPUCANVAS (★510)</text>
  <text x="315" y="170" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12">TypeScript · WebGPU · MIT</text>

  <text x="56" y="202" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700">5,000 Live React Screens in 1 Draw Call + 3ms Agent View</text>

  <rect x="56" y="216" width="513" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="70" y="236" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">1. HTML-in-Canvas Texture Atlas + content-visibility Parking</text>
  <text x="70" y="254" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Packs 2048px pages via drawElementImageToTexture &amp; parks unchanged DOM</text>
  <text x="70" y="270" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Renders 5,000 live React screens in 1 instanced GPU pass with full click/type events</text>

  <rect x="56" y="284" width="513" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="70" y="304" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">2. createAgentView (3.5 KB / 3 ms) &amp; 40 ms GPU Snapshots</text>
  <text x="70" y="322" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• view.describe() strips wrapper divs to ~35 entries (3.5 KB JSON) in 3 ms</text>
  <text x="70" y="338" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• canvas.snapshot() &amp; diffImages() run in ~40 ms on GPU with zero headless browser</text>

  <rect x="56" y="352" width="513" height="64" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="70" y="372" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">3. 30-Agent Spatial Marks, WGSL Shaders &amp; Fiber Drill-Down</text>
  <text x="70" y="390" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• marks.connect(), pin(), note() &amp; cursor() let 30+ agents annotate live screens</text>
  <text x="70" y="406" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• bindEditor drills down to React fibers + WGSL shaders (glass, shockwave, dissolve)</text>

