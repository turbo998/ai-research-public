  <text x="631" y="202" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700">1 Screen Per Bot on 1 Host + Route-Executing Agent Board</text>

  <rect x="631" y="216" width="513" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="645" y="236" fill="#A5B4FC" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">1. Isolated Virtual Desktop per Bot on 1 Shared Computer</text>
  <text x="645" y="254" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Each Hermes bot gets its own live screen on one Orgo computer + mouse/keyboard takeover</text>
  <text x="645" y="270" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Reuses existing Claude/ChatGPT/Grok subscriptions + Composio apps &amp; xAI voice</text>

  <rect x="631" y="284" width="513" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="645" y="304" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">2. Folded Step Telemetry &amp; Bot-to-Bot Messaging (bot-hq)</text>
  <text x="645" y="322" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Live step tracking folds into "Worked for 2m 10s · 7 steps" chips upon completion</text>
  <text x="645" y="338" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Preserves your primary Hermes agent's channels, skills, cron jobs &amp; persistent memory</text>

  <rect x="631" y="352" width="513" height="64" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="645" y="372" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">3. Stop-by-Stop Route Execution (hermes-whiteboard ★92)</text>
  <text x="645" y="390" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Converts 1 sentence into a Route/Columns/Map board; fans out up to 3 agents per stop</text>
  <text x="645" y="406" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Hands each stop's output to the next stop and writes a consolidated final brief</text>

