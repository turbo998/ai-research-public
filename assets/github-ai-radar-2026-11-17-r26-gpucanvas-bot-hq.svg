  <text x="515" y="660" fill="#6EE7B7" font-family="system-ui, -apple-system, sans-serif" font-size="13.5" font-weight="800">$370.00/mo (-93.78% · Saves $5,580.00/mo / $66,960.00/yr)</text>
  <text x="60" y="678" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">$85.00/mo shared multi-screen host &amp; 3.5KB agentView JSON + 3.0 hrs/mo ($285.00) live takeover &amp; route review (92.11% hours saved)</text>

  <rect x="60" y="692" width="1080" height="24" rx="6" fill="#1E293B"/>
  <text x="600" y="708" text-anchor="middle" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="600">SA Takeaway: Render 5,000 live React screens on WebGPU (3ms agentView JSON) and give every Hermes agent its own screen on one host.</text>
