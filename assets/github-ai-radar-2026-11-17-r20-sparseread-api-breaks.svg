  <text x="60" y="506" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5">CLAIM-20261117-R20-SPARSEREAD-APIBREAKS · Eliminating Full-Document Context Bloat, Silent Cache Misses &amp; Fake-Streaming Outages</text>

