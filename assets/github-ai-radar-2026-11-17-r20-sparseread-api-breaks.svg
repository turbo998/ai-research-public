  <text x="315" y="170" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12">Python · arXiv 2608.22237 · MIT</text>

  <text x="56" y="202" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700">Training-Free EvidencePack Layer Across 6 Agent Hosts</text>

  <rect x="56" y="216" width="513" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="70" y="236" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">1. 30/30 Cells Lower Tokens &amp; Time (Up to -92.9% Tokens)</text>
  <text x="70" y="254" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Evaluated across 125 tasks × 5 scenarios × 6 models (Opus 5, Qwen3.6, DeepSeek-V4)</text>
  <text x="70" y="270" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Median savings: OpenCode -71.8% tok / -64.9% time; NanoBot -69.0% tok / -64.4% time</text>

  <rect x="56" y="284" width="513" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="70" y="304" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">2. Read Gate + Stateful 3-Tool Protocol (sro_preview/read/raw)</text>
  <text x="70" y="322" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Read Gate keeps small files on native tools &amp; routes large PDFs/logs/XLSX to SparseRead</text>
  <text x="70" y="338" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Returns EvidencePack with source anchors, unresolved items &amp; explicit sro_raw fallback</text>

  <rect x="56" y="352" width="513" height="64" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="70" y="372" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">3. Drop-In Adapters for Claude Code, Codex, OpenCode &amp; NanoBot</text>
  <text x="70" y="390" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Verified on Claude Code 2.1.325, Codex CLI 0.169.0, OpenCode 2.3.0 &amp; NanoBot 0.4.1</text>
  <text x="70" y="406" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Starts in non-disruptive advisory mode with 48h auto-mode upgrade prompt</text>

