  <text x="60" y="620" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">$960.00/mo token/gateway spend + 17.0 hrs/mo ($1,615.00) fixing truncated evidence misses &amp; CC↔API handoff amnesia</text>

