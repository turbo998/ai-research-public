  <text x="40" y="58" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">2026-11-17 NIGHT ROUND 20 (CUMULATIVE R444) · EVIDENCE-PACK SPARSE READING LAYER &amp; LLM API GATEWAY PITFALL PROBES</text>
  <text x="40" y="90" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="800">SparseRead (-92.9% Max Tokens) &amp; API Pitfall Probes Cut Long-Doc Agent TCO by 93.62%</text>
  <text x="40" y="116" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">Comparing Full-File Native Reads &amp; Unverified Relays vs. Liuzedooong/SparseReading (★91, MIT) + Cheiineeey/api-where-it-breaks (★55)</text>

