  <text x="631" y="202" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700">Fake-Stream / Tool-Loop / Cache Probes + CC↔API Handoff</text>

  <rect x="631" y="216" width="513" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="645" y="236" fill="#A5B4FC" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">1. Three 1-Call Diagnostic Probes (api / stream / tool-check)</text>
  <text x="645" y="254" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• stream-check.mjs detects buffered "fake SSE streaming" &amp; dual-usage discrepancies</text>
  <text x="645" y="270" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• tool-check.mjs verifies tool_use blocks match stop_reason &amp; catches HTTP 200 errors</text>

  <rect x="631" y="284" width="513" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="645" y="304" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">2. Prompt Cache Miss Diagnosis &amp; Evidence-Tagged Pitfalls</text>
  <text x="645" y="322" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Exposes relays that accept cache_control headers but silently return 0 cache hits</text>
  <text x="645" y="338" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Every finding explicitly tagged [Measured], [Inferred] or [Unverified]; 22 fixture tests</text>

  <rect x="631" y="352" width="513" height="64" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="645" y="372" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">3. Claude Code ↔ Direct API Catch-Up Watermark Pattern</text>
  <text x="645" y="390" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• dual-provider-skeleton synchronizes delta turns when switching between CC &amp; API</text>
  <text x="645" y="406" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Note: PolyForm Noncommercial 1.0.0 / CC BY-NC 4.0 (use as clean-room spec in prod)</text>

