  <text x="60" y="678" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">$90.00/mo SparseRead EvidencePack tokens (-71.8% median) + 3.0 hrs/mo ($285.00) gateway CI check (91.89% hours saved)</text>

