  <text x="44" y="56" fill="#f8fafc" font-size="20" font-weight="800">[R605 Milestone] 2026-11-21 Day R5: Specialist Parallel Workspace, Cross-Agent Evidence ADE, Discord Crew &amp; Blind Review</text>
  <text x="44" y="82" fill="#94a3b8" font-size="13.5" font-weight="500">intent-hq/intent (★459) + mikeparcewski/wicked-studio (★173 · 160 forks) + zuiho-kai/bothouse (★254) + yanauto/broco (★63)</text>
  <text x="44" y="101" fill="#fbbf24" font-size="12.5" font-weight="600">Specialist Spec-to-Parallel-Build · Cross-Agent Evidence Verification ADE · Discord Team-Lead Shared Memory · 5h Quota &amp; Blind Diff Review</text>

  <rect x="24" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="42" y="162" fill="#38bdf8" font-size="16" font-weight="800">1. intent-hq/intent</text>
  <text x="42" y="184" fill="#94a3b8" font-size="12">★ 459 · 40 forks · JavaScript · Apache-2.0</text>
  <text x="42" y="214" fill="#f8fafc" font-size="13" font-weight="700">Specialist Parallel Workspace</text>
  <text x="42" y="240" fill="#cbd5e1" font-size="12">• Specialists write living specs &amp; mocks</text>
  <text x="42" y="264" fill="#cbd5e1" font-size="12">• Parallel Claude Code, Codex &amp; Cursor</text>
  <text x="42" y="288" fill="#cbd5e1" font-size="12">• Bring your own agent subscriptions</text>
  <text x="42" y="312" fill="#cbd5e1" font-size="12">• Hybrid Mac/Windows/Linux + E2B VMs</text>
  <text x="42" y="336" fill="#cbd5e1" font-size="12">• Shared team discussion &amp; phone pings</text>
  <text x="42" y="360" fill="#cbd5e1" font-size="12">• Custom user-authored Specialists</text>
  <text x="42" y="384" fill="#cbd5e1" font-size="12">• Local-first, zero product telemetry</text>
  <text x="42" y="408" fill="#38bdf8" font-size="12" font-weight="600">Spec First ➔ 20+ Agents in Parallel</text>

  <rect x="316" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#34d399" stroke-width="1.5"/>
  <text x="334" y="162" fill="#34d399" font-size="16" font-weight="800">2. wicked-studio</text>
  <text x="334" y="184" fill="#94a3b8" font-size="12">★ 173 · 160 forks · TypeScript · MIT</text>
  <text x="334" y="214" fill="#f8fafc" font-size="13" font-weight="700">Evidence-Checked Agentic ADE</text>
  <text x="334" y="240" fill="#cbd5e1" font-size="12">• Independent agent checks every job</text>
  <text x="334" y="264" fill="#cbd5e1" font-size="12">• Explicit reduced-assurance labeling</text>
  <text x="334" y="288" fill="#cbd5e1" font-size="12">• Hardened container sandboxes (crew)</text>
  <text x="334" y="312" fill="#cbd5e1" font-size="12">• Brokered credentials &amp; leak-block gate</text>
  <text x="334" y="336" fill="#cbd5e1" font-size="12">• whisper.cpp voice steering on screen</text>
  <text x="334" y="360" fill="#cbd5e1" font-size="12">• Scoped Apps dashboards &amp; Jira/GH sync</text>
  <text x="334" y="384" fill="#cbd5e1" font-size="12">• Rules &amp; memory kept strictly apart</text>
  <text x="334" y="408" fill="#34d399" font-size="12" font-weight="600">Evidence Receipts on Every Gate</text>

  <rect x="608" y="130" width="272" height="390" rx="12" fill="#111827" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="626" y="162" fill="#a78bfa" font-size="16" font-weight="800">3. zuiho-kai/bothouse</text>
  <text x="626" y="184" fill="#94a3b8" font-size="12">★ 254 · 29 forks · Go · Apache-2.0</text>
  <text x="626" y="214" fill="#f8fafc" font-size="13" font-weight="700">Discord Team-Lead &amp; Shared Memory</text>
  <text x="626" y="240" fill="#cbd5e1" font-size="12">• Claude Code + Codex + Gemini + DSH</text>
  <text x="626" y="264" fill="#cbd5e1" font-size="12">• Team-lead AI splits &amp; assigns work</text>
  <text x="626" y="288" fill="#cbd5e1" font-size="12">• One shared memory across all agents</text>
  <text x="626" y="312" fill="#cbd5e1" font-size="12">• Borrow teammates' local agents via @</text>
  <text x="626" y="336" fill="#cbd5e1" font-size="12">• Discord task forum thread isolation</text>
  <text x="626" y="360" fill="#cbd5e1" font-size="12">• Direct from desktop, phone or browser</text>
  <text x="626" y="384" fill="#cbd5e1" font-size="12">• macOS, Windows &amp; Linux native Go</text>
  <text x="626" y="408" fill="#a78bfa" font-size="12" font-weight="600">Zero Extra Subscription Required</text>

  <rect x="900" y="130" width="276" height="390" rx="12" fill="#111827" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="918" y="162" fill="#fbbf24" font-size="16" font-weight="800">4. yanauto/broco</text>
  <text x="918" y="184" fill="#94a3b8" font-size="12">★ 63 · 7 forks · JavaScript · Apache-2.0</text>
  <text x="918" y="214" fill="#f8fafc" font-size="13" font-weight="700">6-Harness Quota &amp; Blind Review</text>
  <text x="918" y="240" fill="#cbd5e1" font-size="12">• Unifies Claude/Codex/Cursor/Pi/OpenCode</text>
  <text x="918" y="264" fill="#cbd5e1" font-size="12">• Delegate without leaving active CLI</text>
  <text x="918" y="288" fill="#cbd5e1" font-size="12">• Routes around 5-hour quota limits</text>
  <text x="918" y="312" fill="#cbd5e1" font-size="12">• Automated parallel git worktrees</text>
  <text x="918" y="336" fill="#cbd5e1" font-size="12">• Cross-family blind cold-diff review</text>
  <text x="918" y="360" fill="#cbd5e1" font-size="12">• Bundled private Node 24 LTS runtime</text>
  <text x="918" y="384" fill="#cbd5e1" font-size="12">• Auto China mirror fallback built in</text>
  <text x="918" y="408" fill="#fbbf24" font-size="12" font-weight="600">Formerly opus-manager · Apache-2.0</text>

  <rect x="24" y="540" width="1152" height="116" rx="12" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="44" y="572" fill="#f8fafc" font-size="15.5" font-weight="800">[R605 Milestone] Closed-Form FinOps TCO Benchmark (45-Eng Team @ $100/h · synthetic, independently_reproduced=false)</text>
  <text x="44" y="600" fill="#cbd5e1" font-size="13">• Path A (Commercial Cloud Multi-Agent ADE Seats + Per-Seat Review SaaS + Quota Overages): $3,420.00 SaaS + 42.5h ($4,250.00) = $7,670.00/mo</text>
  <text x="44" y="624" fill="#34d399" font-size="13.5" font-weight="700">• Path C (Hybrid Cloud Control + Intent + wicked-studio + bothouse + broco): $75.00 Compute + 2.5h ($250.00) = $325.00/mo ➔ Saves $7,345.00/mo (-95.76%)</text>
  <text x="44" y="646" fill="#94a3b8" font-size="11">Audit Constants: Path A $3,420.00 + 42.5h ($4,250.00) = $7,670.00/mo ➔ Path C $75.00 + 2.5h ($250.00) = $325.00/mo (-$7,345.00/mo · -95.76% · base_hardware_capex = not_measured)</text>
