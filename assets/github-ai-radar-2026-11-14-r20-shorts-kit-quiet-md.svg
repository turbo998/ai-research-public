  <text x="646" y="409" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">3. Zero Cloud Lock-In &amp; 1-Click Migration: Imports existing vaults from Obsidian, Logseq,</text>
