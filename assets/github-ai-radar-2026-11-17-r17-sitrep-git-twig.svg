  <text x="40" y="58" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="1.2">2026-11-17 NIGHT ROUND 17 (CUMULATIVE R441) · CROSS-MACHINE AGENT UNBLOCKING CONSOLE &amp; VERIFIED COW WORKTREES</text>
  <text x="40" y="90" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="800">SITREP Fleet Console &amp; git-twig (Up to 155.8x Less Disk) Cut Fleet Ops TCO by 93.64%</text>
  <text x="40" y="116" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="13.5">Comparing Multi-Terminal SSH Hunting &amp; Full-Copy Worktrees vs. IluvatarLabs/sitrep (★93, MIT) + leostera/git-twig (★240, MIT)</text>

  <!-- Left Card: IluvatarLabs/sitrep -->
  <rect x="40" y="138" width="545" height="295" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5"/>
