  <text x="178" y="170" text-anchor="middle" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="700">FLEET CONSOLE · SITREP (★93)</text>
  <text x="315" y="170" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="12">TypeScript · Node 24 · MIT</text>

  <text x="56" y="202" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700">Every Claude Code &amp; Codex Session Across Machines in 1 View</text>

  <rect x="56" y="216" width="513" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="70" y="236" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">1. Cross-Host Card / List / Graph Fleet Telemetry (:7487)</text>
  <text x="70" y="254" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Tracks sessions across laptops, workstations &amp; Linux servers in real time</text>
  <text x="70" y="270" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Displays plan, current step, model/effort, context fill %, git state &amp; USD spend</text>

  <rect x="56" y="284" width="513" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="70" y="304" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">2. Longest-Wait-First Unblocking Queue (First Answer Wins)</text>
  <text x="70" y="322" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Surfaces blocked permissions, questions &amp; plans at the top by wait duration</text>
  <text x="70" y="338" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Answer from web dashboard or terminal seamlessly without window hunting</text>

  <rect x="56" y="352" width="513" height="64" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="70" y="372" fill="#FBBF24" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">3. Zero-Transcript, Non-Intrusive Security Model + Chaos Sim</text>
  <text x="70" y="390" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Never controls terminals, never starts/stops sessions &amp; stores zero transcripts</text>
  <text x="70" y="406" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Built-in chaos fleet simulator (--sessions 8 --codex 0.4 --machines 3 --chaos)</text>

