  <text x="631" y="202" fill="#F8FAFC" font-family="system-ui, -apple-system, sans-serif" font-size="16.5" font-weight="700">Verified Copy-on-Write Worktrees (Up to 97%+ Less Disk)</text>

  <rect x="631" y="216" width="513" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="645" y="236" fill="#A5B4FC" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">1. Native APFS clonefile &amp; Linux Btrfs / XFS FICLONE Reflinks</text>
  <text x="645" y="254" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Private CoW file clones verified against target commit SHA (never hardlinked)</text>
  <text x="645" y="270" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Supports OverlayFS over reflink XFS/Btrfs, OpenZFS 2.2.2 &amp; automatic Git fallback</text>

  <rect x="631" y="284" width="513" height="60" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="645" y="304" fill="#38BDF8" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">2. Sealed Allocation Benchmarks (41.9x to 155.8x Less Space)</text>
  <text x="645" y="322" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• Linux kernel: 40.56s / 1.8 GiB → 31.32s / 44.7 MiB (1.29x faster, 41.9x less space)</text>
  <text x="645" y="338" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• Pulumi docs: 1.2 GiB → 7.9 MiB (155.8x less); OpenClaw: 919 MiB → 31.1 MiB (29.5x less)</text>

  <rect x="631" y="352" width="513" height="64" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="645" y="372" fill="#34D399" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700">3. Bundled Agent Skill (git twig skill) &amp; EOL Policy Safety</text>
  <text x="645" y="390" fill="#CBD5E1" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">• v0.4.0 handles text=auto eol=lf policies &amp; delegates only exceptional files to Git</text>
  <text x="645" y="406" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11">• TWIG_TRACE=1 reports verified-clone vs. Git-written counts without hooks</text>

  <!-- Bottom Card: FinOps Closed-Form TCO Verification -->
