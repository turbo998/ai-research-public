  <text x="60" y="678" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="11.5">$70.00/mo 41.9x–155.8x CoW storage &amp; LAN host + 2.8 hrs/mo ($266.00) centralized approval queue (92.22% hours saved)</text>

