  <text x="62" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Letting coding agents test IaC/Lambda changes against live AWS dev accounts risks runaway bills.</text>
  <text x="62" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. `emulator-ui` turns local `aws-emulator` into an inspectable 436-service visual workbench.</text>
  <text x="62" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Eliminates per-seat LocalStack Pro licensing fees for standard AWS API emulation &amp; inspection.</text>
  <text x="62" y="481" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Pair `aws-emulator` (`--telemetry off`) + `emulator-ui` for local agent IaC testing.</text>

