  <text x="646" y="407" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">1. Opening 6 JetBrains/VS Code windows to review parallel agents eats 12+ GB RAM and locks `.git`.</text>
  <text x="646" y="429" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">2. `DiffCode` watches all repos in 30–50 MB RAM without taking `index.lock` while agents commit.</text>
  <text x="646" y="451" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">3. Engineers untick unwanted agent lines, fix lines in place, and commit only verified hunks.</text>
  <text x="646" y="481" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">SA Verdict: Run `DiffCode` beside CLI coding agents as a lock-free multi-repo commit gate.</text>

