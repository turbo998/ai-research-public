  <text x="649" y="415" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Simultaneous plan, 3D &amp; sheet views with Git-like branches/versions for humans and AI agents</text>
  <text x="649" y="434" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Runs in memory for instant dev demos with no database or Docker required</text>

