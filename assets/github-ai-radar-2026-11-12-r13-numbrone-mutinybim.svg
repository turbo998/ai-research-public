  <text x="649" y="350" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Exposes stdio/HTTP MCP tools + built-in coordination lint, calculations, PDF sheets &amp; IFC 4.3 export</text>

