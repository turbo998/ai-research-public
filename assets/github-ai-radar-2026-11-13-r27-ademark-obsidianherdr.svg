  <rect x="635" y="216" width="491" height="66" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="649" y="238" fill="#A78BFA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">22 Coding Agents Running Persistently Inside Obsidian</text>
  <text x="649" y="257" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Claude Code, Codex, Hermes, Antigravity, Gemini, OpenCode, Copilot CLI, Devin...</text>
  <text x="649" y="274" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Backed by `Herdr` so closing a tab or reloading Obsidian never kills the session</text>

  <rect x="635" y="292" width="491" height="72" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="649" y="314" fill="#10B981" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Link-Preserving Vault Bridge (CLI + MCP) &amp; 1-Click Undo</text>
  <text x="649" y="333" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Agents edit notes through Obsidian's native API so wikilinks stay 100% intact</text>
  <text x="649" y="350" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Every agent edit is logged in an audit trail and can be rolled back in one click</text>

  <rect x="635" y="374" width="491" height="78" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="649" y="396" fill="#38BDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">Mission Control Sidebar &amp; Optional `See / Act / Check` CUA</text>
  <text x="649" y="415" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Shows working / blocked / done status &amp; unblocks waiting agents in one click</text>
  <text x="649" y="434" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Optional Full-permission UI control (`See` window, `Act` shortcuts, `Check` text)</text>

