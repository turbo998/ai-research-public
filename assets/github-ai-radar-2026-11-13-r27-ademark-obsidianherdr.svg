  <text x="88" y="257" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">5-idle-thread RAM spans `134 MB` (`super.engineering`) to `2,334 MB` (`Emdash`)</text>
  <text x="88" y="274" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Bare CLI uses `1,013 MB` across 5 threads; `super.engineering` wins 4/12 tests</text>

  <rect x="74" y="292" width="491" height="72" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="88" y="314" fill="#38BDF8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">3.47× Hidden Token Overhead on a Simple `"hi"` Greeting</text>
  <text x="88" y="333" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Sending `"hi"` consumes `22.2K` tokens (`Paseo`) up to `77.0K` tokens (`Emdash`)</text>
  <text x="88" y="350" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Bare CLI sends `38.2K` tokens; exposes hidden wrapper prompt bloat before you buy</text>

