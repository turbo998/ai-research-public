  <text x="88" y="415" fill="#CBD5E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">`Synara` (`5.2 min`) &amp; `super.engineering` (`7.1 min`) pass 100% of hidden tests</text>
  <text x="88" y="434" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Exposes ADEs (`bb`, `Cloudroom`) where 1 lead + 4 workers left `main` unchanged</text>

