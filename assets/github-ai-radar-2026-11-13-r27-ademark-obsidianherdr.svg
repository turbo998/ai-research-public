  <text x="74" y="178" fill="#F472B6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="800">1. zqkra/ademark (19★ · TypeScript · Apache-2.0 · ademark.dev)</text>
  <text x="74" y="202" fill="#E2E8F0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="600">Open Benchmark of 15 Agentic Development Environments vs Bare CLI</text>

  <rect x="74" y="216" width="491" height="66" rx="8" fill="#0F172A" stroke="#334155"/>
