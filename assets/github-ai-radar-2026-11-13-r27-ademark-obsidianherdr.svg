  <text x="54" y="66" fill="#F472B6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1.2">2026-11-13 NIGHT SHIFT · ROUND 27 (CUMULATIVE R155) · 15-ADE OPEN BENCHMARK &amp; 22-AGENT PERSISTENT OBSIDIAN HERDR FAQ</text>
  <text x="54" y="98" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="800">zqkra/ademark (15 ADEs vs Bare CLI) + AgriciDaniel/obsidian-herdr (22 Agents + Undoable Vault)</text>
  <text x="54" y="124" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5">0.69s–11.4s Cold Start, 134MB–2,334MB RAM &amp; 22.2K–77.0K "hi" Tokens · Persistent Herdr Terminals &amp; Undoable Vault Bridge in Obsidian · -90.68% TCO</text>

