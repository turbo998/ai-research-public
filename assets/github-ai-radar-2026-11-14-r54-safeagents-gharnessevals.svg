  <rect x="634" y="212" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="650" y="234" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. Cost per Solved Task Varies 2x More Than Pass Rate</text>
  <text x="650" y="253" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Opus 5.5 Coding: Pi $0.62 (81.4%) &amp; Claude Code $0.63 (88.5%) vs Hermes/OpenClaw $0.88</text>
  <text x="650" y="269" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• GPT-6.1 Sol Coding: Pi $0.23 (80.4%) vs Codex $0.31 ($0.34 shown, 83.7%) vs OpenClaw $0.50</text>

  <rect x="634" y="286" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="650" y="308" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. Cache-Write Diagnostics &amp; Metering Proxy Corrections</text>
  <text x="650" y="327" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Multi-User Opus: OpenClaw ($0.40/$0.44) costs ~2x QM ($0.18/$0.19) &amp; Claude Code ($0.21/$0.22)</text>
  <text x="650" y="343" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• 81% of OpenClaw's extra Opus spend comes from cache writes (re-sending bloated prompts/tools)</text>

  <rect x="634" y="360" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="650" y="382" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Rule Placement vs. Unmentioned Skill Blindness (30/30 vs 0/30)</text>
  <text x="650" y="401" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• System prompt / startup file rule followed 30/30 turns; unmentioned skill opened 0/30 times</text>
  <text x="650" y="417" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Naming "Use the brain-first skill." restores 30/30; gstack steps followed in 0/46 Opus sessions</text>

