  <text x="58" y="81" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="800">huggingface/safeagents (3-Stage Pre-Harness Proxy) + garrytan/g-harness-evals (Cost-per-Solved-Task)</text>
