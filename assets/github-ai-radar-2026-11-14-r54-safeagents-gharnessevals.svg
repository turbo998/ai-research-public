  <!-- Left Panel: huggingface/safeagents -->
  <rect x="36" y="128" width="548" height="314" rx="14" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
  <rect x="54" y="146" width="215" height="26" rx="6" fill="#0284C7"/>
  <text x="161" y="164" text-anchor="middle" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700">huggingface/safeagents (★151)</text>
  <text x="281" y="164" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="600">Apache-2.0 · 13 Coding Harnesses Supported</text>

  <text x="54" y="196" fill="#E2E8F0" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Pre-Harness Stream Proxy: Swaps Blocked Tool Calls for Text Notice</text>

  <rect x="54" y="212" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="234" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">1. Request-Only Checks + Zero-Latency Streaming</text>
  <text x="70" y="253" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Blocks undeclared tools or any URL/bare IP absent from user prompt (model turns don't count)</text>
  <text x="70" y="269" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Text streams immediately; tool calls held until args complete, then released or replaced</text>

  <rect x="54" y="286" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="308" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">2. atif-scan Deterministic Detectors (10–20 ms on M-Series Mac)</text>
  <text x="70" y="327" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Converts chat to ATIF trace; scans /proc/1/environ, curl --noproxy, K8s SA tokens, nsenter</text>
  <text x="70" y="343" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Findings &gt;= --block-severity (default high) blocked instantly; custom --plugin MODULE:FACTORY</text>

  <rect x="54" y="360" width="512" height="64" rx="10" fill="#1E293B" stroke="#334155"/>
  <text x="70" y="382" fill="#FBBF24" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">3. Reasoning-Blind Decision Judge &amp; 13-Harness Base-URL Drop-In</text>
  <text x="70" y="401" fill="#CBD5E1" font-family="Segoe UI, Arial, sans-serif" font-size="12">• Judge sees ONLY user text + tool call + findings (NEVER agent reasoning/results that argue)</text>
  <text x="70" y="417" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="11.5">• Works via ANTHROPIC_BASE_URL / OPENAI_BASE_URL for Claude Code, Codex, Pi, Hermes, DSH</text>

  <!-- Right Panel: garrytan/g-harness-evals -->
